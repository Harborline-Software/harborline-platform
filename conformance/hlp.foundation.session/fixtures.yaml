    {"id": "inactive-tenant-rejected", "operation": "session.resolve", "input": {"tenantStatus": "Suspended"}, "expected": null},
    {"id": "sentinel-tenant-rejected", "operation": "session.resolve", "input": {"resolvedTenant": "__system__"}, "expected": null},
    {"id": "empty-session-rejected", "operation": "session.resolve", "input": {"sessionId": ""}, "expected": null},
    {"id": "external-identity-reason", "operation": "record.reason-values", "expectedContains": "ExternalIdentity"}
