    {"id": "duplicate-session-rejected", "operation": "store.create", "expectedError": "duplicate-session-id"},
    {"id": "store-touch", "operation": "store.touch", "expected": "lastSeen-advanced"},
    {"id": "store-revoke-idempotent", "operation": "store.remove-twice", "expected": [true, false]},
