    {"id": "form-view.rules-normalization", "input": {"rules": {"visible": true, "required": true, "readOnly": true, "presentationSeverity": "warn", "presentationStyleToken": "attention"}}, "expected": {"readOnly": true, "presentation": {"severity": "warn", "styleToken": "attention"}, "rulesPreserved": true}},
    {"id": "form-view.nested-items", "input": {"kinds": ["field", "group", "collection", "content", "action"], "depth": 4}, "expected": {"lossless": true, "arbitraryDepth": true, "closedKinds": true}},
    {"id": "form-view.layout", "input": {"kind": "grid", "columns": 3, "gap": 4, "collapseBelow": "md", "density": "compact", "align": "stretch", "placement": {"amount": {"colSpan": 2, "width": "2/3", "align": "end"}}}, "expected": {"lossless": true, "logicalIntents": true}},
    {"id": "form-view.collection-table", "input": {"cardinality": {"min": 1, "max": 10}, "table": {"columns": {"amount": {"width": "1/3", "align": "end"}}, "totals": ["amount"]}}, "expected": {"lossless": true}},
