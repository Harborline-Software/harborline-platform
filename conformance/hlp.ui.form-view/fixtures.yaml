    {"id": "form-view.minimal", "input": {"formId": "inspection", "version": "1.0.0", "sections": []}, "expected": {"titleAbsent": true, "descriptionAbsent": true, "sections": 0}},
    {"id": "form-view.readable-value", "input": {"isSensitive": false, "isReadable": true, "value": "A-104"}, "expected": {"value": "A-104", "editable": true}},
    {"id": "form-view.redaction", "input": {"isSensitive": true, "isReadable": false, "value": null}, "expected": {"cleartextPresent": false, "editable": false}},
