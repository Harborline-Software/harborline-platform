        "brandCount": 1,
        "switcherTriggerCount": 1
      }
    },
    {
      "id": "app-shell.id-required",
      "input": {
        "shellId": null
      },
      "expected": {
        "errors": [
          "app-shell-id-required"
        ]
      }
    },
    {
      "id": "app-shell.body-required",
      "input": {
        "body": null
