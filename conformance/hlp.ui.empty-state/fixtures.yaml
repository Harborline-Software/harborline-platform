    {"id": "empty-state.no-action", "input": {}, "expected": {"buttonVisible": false, "callbacks": 0}},
    {"id": "empty-state.action-any-variant", "input": {"variants": ["informational", "positive", "actionable"], "label": "Act"}, "expected": {"callbacksPerVariant": 1}},
