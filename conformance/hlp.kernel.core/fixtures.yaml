schemaVersion: 1
moduleId: hlp.kernel.core
cases:
  - id: compiled-floor-before-catalogue
    contract: Definition Package, Record Type, and Field resolve from stable compiled identities before the first catalogue read.
  - id: compiled-floor-replacement-refusal
    contract: A package cannot replace any compiled floor identity and refuses with kernel.compiled-shape-replacement.
  - id: one-command-atomic-set
    contract: One command stages its record and audit under one operation identity, then commits all or rolls back all.
  - id: multi-command-refusal
    contract: Two commands refuse before mutation with kernel.multi-command-batch and observed count 2.
  - id: authoritative-clock
    contract: Captured timestamps cannot alter stamping or expiry; an explicit different instant requires kernel.backdate-capability-required.
  - id: recovery-without-the-package
    contract: Recovery commits with the Configuration Management package missing, deactivated or corrupt, reading the kernel profile and no catalogue.
  - id: recovery-fails-closed-on-effective-generation
    contract: A missing pointer, missing content or digest mismatch refuses every write with kernel.effective-generation-missing or kernel.effective-generation-corrupt naming the state.
  - id: recovery-terminal-states
    contract: A crashed prepared generation is abandoned, a bound effective pointer is confirmed without moving, and an unpublished evidence intent is published; an unbound pointer refuses with kernel.effective-pointer-unbound.
  - id: recovery-reason-and-authority
    contract: Recovery refuses without the configuration-recovery capability, a reason or an authority snapshot, and commits both with the record in one audited set.
