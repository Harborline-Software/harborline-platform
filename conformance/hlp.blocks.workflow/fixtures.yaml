{
  "schemaVersion": 1,
  "moduleId": "hlp.blocks.workflow",
  "interfaceRevision": 17,
  "durableCases": [
    {"id": "lifecycle-facts-start-atomic", "expect": "start fact and pinned coordinates co-commit with instance; pre-frame fault leaves neither; restart keeps both", "test": "WorkflowLifecycleFactsTests.Start_commits_pinned_fact_with_instance_and_survives_reopen"},
    {"id": "lifecycle-facts-start-rollback", "expect": "pre-frame bound failure leaves no instance or fact; retry commits one creation frame", "test": "WorkflowLifecycleFactsTests.Start_failure_before_frame_leaves_neither_instance_nor_fact_and_retry_is_atomic"},
    {"id": "lifecycle-facts-advance-atomic", "expect": "staging throw writes no frame; committed completion and fault map after restart", "test": "WorkflowLifecycleFactsTests.Staging_failure_leaves_no_advance_fact_and_committed_outcome_survives_reopen"},
    {"id": "lifecycle-facts-engine-mapper", "expect": "real start and each advance map from history alone; final task and workflow ids differ; no standalone frames", "test": "WorkflowLifecycleFactsTests.Engine_start_and_each_advance_map_from_reopened_history_alone"},
    {"id": "lifecycle-facts-legacy", "expect": "v1 instances effects replay rows and history survive; absent starts stay missing; new writes use v2", "test": "WorkflowLifecycleFactsTests.Legacy_history_stays_missing_while_new_frames_use_version_two"},
    {"id": "lifecycle-facts-unreadable-version", "expect": "unknown frame versions fail closed without truncation", "test": "WorkflowLifecycleFactsTests.Unreadable_frame_version_is_refused_without_truncation"},
    {"id": "lifecycle-events-history-order", "expect": "EventsAsync returns committed per-run history in sequence order after reopening", "test": "WorkflowLifecycleJournalReadbackTests.Lifecycle_history_is_ordered_and_survives_reopening_the_journal"},
    {"id": "lifecycle-projection", "expect": "committed workflow and task facts map to their CNCF lifecycle types and payloads", "test": "WorkflowLifecycleProjectionTests.Projects_workflow_and_task_history_with_the_CNCF_type_and_payload"},
    {"id": "operator-migration", "expect": "authorized explicit map atomically re-pins and records principal versions and map; state survives recovery"},
    {"id": "operator-migration-refusal", "expect": "missing source map or target refuses without changes and names the source step"},
    {"id": "operator-migration-recurring-identity", "expect": "an already-completed occurrence retains its replay row after identity migration and the next occurrence generates once"},
    {"id": "operator-migration-dispatch-fence", "expect": "conditional replay and advance refuse a migrated snapshot"},
    {"id": "atomic-advance-crash-rolls-back", "expect": "staging-throw-appends-nothing; resume posts exactly once"},
    {"id": "advance-survives-process-restart", "probe": "write-crash", "expect": "effect committed exactly once after kill without dispose"},
    {"id": "park-survives-restart", "probe": "write-crash", "expect": "Parked at approve, iteration read back verbatim, resume advances once"},
    {"id": "incomplete-final-frame-truncated", "probe": "write-partial-crash", "expect": "torn tail removed, committed rows intact"},
    {"id": "corrupt-complete-frame-fails-closed", "expect": "InvalidDataException at open"},
    {"id": "events-append-only-monotonic-seq", "expect": "per-instance Seq 1..n, history immutable"},
    {"id": "exclusive-process-lock", "expect": "second open throws IOException"},
    {"id": "single-node-disclaimer", "expect": "no distributed-lease or multi-node claim"}
  ],
  "dispatchCases": [
    {"id": "lifecycle-cancelled-terminal", "status": "Cancelled", "expected": "Terminal", "test": "DurableWorkflowEngineSeamTests.Inactive_run_refuses_dispatch_without_changing_state_or_history"},
    {"id": "lifecycle-terminated-terminal", "status": "Terminated", "expected": "Terminal", "test": "DurableWorkflowEngineSeamTests.Inactive_run_refuses_dispatch_without_changing_state_or_history"},
    {"id": "lifecycle-suspended-discarded", "status": "Suspended", "expected": "Discarded", "test": "DurableWorkflowEngineSeamTests.Inactive_run_refuses_dispatch_without_changing_state_or_history"},
    {"id": "migrated-wait", "expect": "preserved state resumes at mapped step; stale source neither runs nor replays"},
    {"id": "interpreter-decision-failure", "expectedStatus": "Failed", "reason": "not-retryable", "step": "actual-failing-state", "effect": null, "retry": false},
    {"id": "autonomous-event-parks-cp", "trigger": "Event", "step": "Draft", "expected": "Parked", "expectedStep": "PendingApproval"},
    {"id": "human-approve-advances-with-effect", "trigger": "HumanAction", "step": "PendingApproval", "decision": "approve", "expected": "Advanced", "expectedStep": "Posted", "expectedStatus": "Completed", "effectsStaged": 1},
    {"id": "redelivered-trigger-replays", "trigger": "HumanAction", "step": "PendingApproval", "decision": "approve", "expected": "ReplayedNoOp|Terminal", "effectsStaged": 0},
    {"id": "loop-back-park-bumps-iteration", "expect": "iteration+1-and-cap-escalates-to-Failed"},
    {"id": "unknown-instance", "expected": "UnknownInstance"}
  ],
  "admissionCases": [
