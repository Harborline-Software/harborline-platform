    {"id": "guarded-control.quality.pseudo", "expected": {"minimumExpansionRatio": 1.3, "noClipping": true}},
    {"id": "guarded-control.quality.duration", "expected": {"localeNumber": true, "pluralUnit": true, "wholeMessage": true, "hardcodedSuffix": false}},
