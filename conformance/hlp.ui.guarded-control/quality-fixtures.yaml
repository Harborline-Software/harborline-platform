    {"id": "guarded-control.quality.tokens", "expected": {"source": "public-css-custom-properties", "states": ["covered", "armed", "committing", "disabled", "focus"]}},
    {"id": "guarded-control.quality.contrast", "expected": {"wcagLevel": "AA", "minimumTextRatio": 4.5, "minimumNonTextRatio": 3}},
    {"id": "guarded-control.quality.reduced-motion", "expected": {"preference": "reduce", "maximumTransitionDurationMilliseconds": 1, "timingSemanticsUnchanged": true}},
