    {"id": "guarded-control.quality.focus", "expected": {"focusMovesOnArm": true, "returnsAfterRecovery": true, "returnsAfterCommitSettlement": true, "visibleIndicators": true}},
    {"id": "guarded-control.quality.dismissal", "expected": {"escape": true, "timeout": true, "navigation": true, "documentHidden": true, "windowBlurAfterGrace": true, "idempotent": true}},
    {"id": "guarded-control.quality.denial", "expected": {"disabledNative": true, "callerReasonAssociated": true, "interactionStateNotAuthorization": true}},
    {"id": "guarded-control.quality.color", "expected": {"armedNotColorOnly": true, "committingNotColorOnly": true, "rejectionAnnounced": true}},
    {"id": "guarded-control.quality.forced-colors", "expected": {"boundaryVisible": true, "focusVisible": true, "statesDistinguishable": true}},
    {"id": "guarded-control.quality.reflow", "expected": {"viewportWidthCssPixels": 320, "rootFontPercent": 200, "noHorizontalPageScroll": true, "wholeMessagesWrap": true}}
