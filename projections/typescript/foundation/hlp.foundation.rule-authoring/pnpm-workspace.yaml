# pnpm 11 reads its settings here, not from .npmrc. The rule engine is an optional peer
# (the consumer fixture installs the packed tarball); do not auto-install it from a registry.
autoInstallPeers: false
# pnpm audit overrides (ADR-0086 clause 5), transitive via eslint > minimatch; each names its advisory.
overrides:
  "vite@>=8.2.0 <8.2.4": "8.2.4" # GHSA-587h-7wmj-h5pm, transitive via vitest
  "brace-expansion@>=4.0.0 <5.0.12": ">=5.0.12" # GHSA-6j4f-fj2g-mc7p, GHSA-qhr7-859c-m2p7, GHSA-q2hr-2g5m-vwhr
  "source-map-js@>=1.0.0 <1.2.2": ">=1.2.2" # GHSA-68fv-2mgg-jv7q
  "qs@>=6.11.1 <6.15.2": ">=6.15.2" # GHSA-q8mj-m7cp-5q26
  "minimatch@>=10.0.0 <11.0.1": "11.0.1" # GHSA-g3hv-75wg-m249, major jump approved by the owner 2026-11-05
# StrykerJS core still needs the static-mutant activation fix (stryker-js#6144, PR #6145).
patchedDependencies:
  '@stryker-mutator/core@10.1.1': patches/@stryker-mutator__core@10.1.1.patch
