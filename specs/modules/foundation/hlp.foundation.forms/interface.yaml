  "capabilities": {
    "definitions": ["atomically create first revision", "register immutable revision", "atomically register and publish one admitted Draft revision", "load exact revision", "load highest published revision", "list full history by tenant", "list one current published revision per id", "publish", "deprecate", "withdraw", "restore system pack projection", "validate lineage, overlay, and authoring metadata", "admit a submit gate naming exactly one of role, standing or an Access-registered capability", "admit an optional record_type_id target and, at publication, resolve its creation gate through the host IFormRecordTypePolicyReader seam", "preserve exact field type, validations, and options"],
