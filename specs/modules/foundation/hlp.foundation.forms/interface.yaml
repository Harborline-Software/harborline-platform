  },
  "invariants": [
    "Every definition and reusable unit is isolated by exact TenantId and immutable by (tenant,id,version).",
    "Lifecycle transitions are explicit and fail closed; ordinary withdrawn revisions cannot be republished.",
    "Lineage cannot cross tenants or reference an absent revision.",
    "Concurrent create operations for one tenant and definition id admit exactly one first revision.",
    "Register-and-publish makes the admitted immutable revision visible as Published atomically or leaves no revision visible; request cancellation before the commit persists nothing, an identical ambiguous retry returns the committed revision, and different content at the same identity conflicts.",
    "Current-definition listing emits at most one highest Published revision per id; historical Published revisions never duplicate list rows.",
    "Harborline App authoring metadata is copied into each immutable revision so exact types, constraints, and option values survive save, load, history, and restore.",
    "Reuse-by-reference is bounded and CP-locked; a stored definition never receives an expanded copy.",
    "Draft tenant, PartyId, and actor are derived atomically from one authenticated actor scope and are never body supplied.",
    "Resume and abandon require both form id and case id; a mismatched route form cannot observe or delete the draft.",
    "Unresolved actors, tenants, parties, reusable units, and invalid trees fail before mutation.",
    "Pre-auth captures are ephemeral, defensively copied, and must promote or purge.",
    "A declared submit gate names exactly one of role, standing or capability, and its capability arm resolves only through Access's capability register; with no register every capability arm is refused, so a form never owns a capability of its own. The gate is the shared hlp.contracts.authorization SubmitGate (T-755).",
    "Revision 6 (T-485, decision D3): a definition may declare a record_type_id target, captured once for its immutable (tenant,id,version) revision. A declared target is nonblank (form.record_type.required at /record_type_id). Publication resolves the target's creation gate through the host IFormRecordTypePolicyReader and never defaults one (K6: the host's version-specific reader owns every default): no reader, a failing reader or a value outside form_only/role/engine refuses with form.record_type.policy_unavailable, and a type the tenant does not have with form.record_type.unknown, both at /record_type_id, read before the store lock. A form_only target without a submit gate refuses with form.submit_gate.required at /submit_gate, an engine target refuses with form.record_type.not_form_creatable at /record_type_id, and a role target adds no gate of its own. Once a Published, Deprecated or Withdrawn revision of the same tenant and id captures a target, a revision that changes or removes it refuses at publication with form.record_type.changed at /record_type_id (ADR 0099 decision 7; withdrawal is not a migration decision, lead ruling R2-2); adding a target where no such revision has one is allowed (K9 migration). Lead ruling R3-1: the rule is intended to count only revisions that were actually published (Published, Deprecated, or Withdrawn after publication); revision state keeps no durable was-published marker, so a never-published Withdrawn Draft also captures its target today, which fails closed (an authoring trap, never a bypass) until W6 adds the marker and narrows capture. Drafts save without the lookup, pack restore re-runs every check, and a definition without a target is unchanged and needs no reader. No standing-gate prohibition applies (K1)."
  ],
