  "callerInterface": {
    "name": "RunKindRegistry / RunLifecycle / DueRunDispatcher / IRunStore / EffectReceiptLedger / IEffectReceiptStore / IExecutionReceiptStore",
    "operations": [
      "RunKindRegistry.Register(kind, owningEngine, handler = null) -> registers a kind and optional async handler receiving the claimed run, timer step id (null for retries), and cancellation token; existing callers remain valid",
      "RunLifecycle.StartAsync(StartRun) -> a pending run under a fresh RunId of the request's kind; an unregistered kind, a retry profile outside the capability's allowed set, and a caused_by naming no run the tenant holds all refuse",
      "RunLifecycle.BeginAttemptAsync / SucceedAsync / FailAttemptAsync / CancelAsync -> the next status under the closed transition table; an illegal move refuses execution.transition_illegal, and an awaiting-retry run begun before it is due refuses execution.retry_not_due",
      "RunLifecycle.FailAttemptAsync -> awaiting-retry with the profile's capped doubling delay while the failure is retryable and attempts remain; otherwise dead-lettered with reason retries-exhausted or not-retryable",
      "RunLifecycle.DeadLetteredAsync(tenant) -> every dead-lettered run of every kind, read without touching any engine's store",
      "RetryProfileName.Parse(name) -> a substrate-defined profile name; anything else, including a raw attempt count or backoff parameter, refuses execution.retry_profile_unknown",
      "CapabilityRetryPolicy(default, allowed).Resolve(selected) -> the substrate profile, refusing execution.retry_profile_not_allowed outside the allowed set",
      "IRunStore.CreateAsync / GetAsync / UpdateAsync(expectedVersion) / ListByStatusAsync -> tenant-scoped storage with optimistic concurrency; InMemoryRunStore is the reference implementation",
      "EffectReceiptLedger.RecordAsync(receipt) -> validates and creates the tenant's sole receipt for its logical effect; effect identities are opaque and compensation links are shape-only at record time, so the original may be recorded before the compensation",
      "EffectReceiptLedger.GetAsync(tenant, effectId) / IEffectReceiptStore.CreateAsync / GetAsync -> tenant-scoped effect receipt storage; the store port is unchanged and InMemoryEffectReceiptStore is the reference implementation",
      "EffectReceipt.CompensationEffectId -> the separate effect compensating this receipt's effect; required and non-self for compensated/compensation-failed, optional for succeeded/failed, and null on ambiguous until reconciled",
      "EffectReceipt.CompensatesEffectId -> optional backlink attesting to the one original effect this compensation was executed for; the workflow engine supplies it from declared compensating-step execution context; a present id is valid and non-self, and may coexist with the receipt's own forward CompensationEffectId",
      "EffectReceiptLedger.CheckCompensationAsync(tenant, originalEffectId) -> a read-only pair check; compensated and compensation-failed originals require a target with the requested tenant and forward identity whose CompensatesEffectId equals the original effect id; missing/inconsistent receipt evidence refuses execution.effect_receipt_invalid naming the known effects, while malformed effect identities retain execution.effect_identity_invalid; a missing original is refused by its own id, and other original statuses impose no compensation check",
      "DueRunDispatcher(registry, store, clock, dispatcherId, lease = five minutes).DispatchAsync(tenant) -> one serialized tenant pass; before its first pass for a tenant clears only its stable node id timer claims; returns due run ids missing handlers without claiming them; retry claims use BeginAttemptAsync, timer claims write owner and expiry through UpdateAsync; handler errors propagate",
      "RunRecord.Waits -> parallel pending RunWait entries with unique immutable step ids per run (duplicate ids on CreateAsync or UpdateAsync refuse execution.wait_duplicate), closed RunWaitReason (human-task, timer, dependency), UTC BeganUtc and timer-only fixed UTC WakeUpUtc; Hold()/Release() preserve registration data; IsHeld excludes dispatch; timer claims expose ClaimDispatcherId and ClaimExpiresUtc",
      "ExecutionReceipt(tenant, runId, status, accessDecisionId) -> the execution receipt kind (DES-0056 execution-runtime-ck-3): kind-qualified run identity, a status of the closed run vocabulary and the applicable Access decision's opaque stable identity, null when none applies; a missing run identity, an undefined status or a present-but-blank decision identity refuses execution.execution_receipt_invalid, and a default or system sentinel tenant is an argument error",
      "ExecutionTraceStep(ordinal, phase, status) -> one execution trace step (execution-runtime-ck-4): a 1-based ordinal, the engine's phase and its status recorded verbatim; an ordinal below 1 or a blank phase or status refuses execution.trace_step_invalid",
      "IExecutionReceiptStore.PutReceiptAsync / GetReceiptAsync(tenant, runId) -> tenant-scoped receipt storage keyed by the kind-qualified run identity, one current receipt per run; a put replaces the tenant's earlier receipt for that run, refusing execution.access_decision_changed when the replacement adds, removes or changes the Access decision link and execution.transition_illegal when its status is neither the stored status nor a legal move from it under the run transition table; a read returns the receipt or null",
      "IExecutionReceiptStore.AppendTraceStepAsync(tenant, runId, traceStep) / GetTraceAsync(tenant, runId) -> tenant-scoped append-only trace; an exact repeat of a step already stored at its ordinal is a no-op, otherwise an append whose ordinal is not exactly one past the last stored step (1 for the first) refuses execution.trace_step_out_of_order and stores nothing; every read and append refuses a default or system sentinel tenant as an argument error; a read returns the steps in ordinal order or empty; InMemoryExecutionReceiptStore is the reference implementation"
    ],
    "context": "Each engine registers its run kind and keeps its engine state in its own store (owner ruling 2026-09-29). The substrate also holds one non-secret effect receipt per logical effect. T-1028's owner-approved backlink is producer-attested linkage, not proof of external compensation correctness. T-488 must later stamp the backlink and call the pair checker after both receipts are durable, including recovery after a crash between recording and checking; recovery/audit may repeat it. That engine integration is not claimed. Revision 4 (T-528/execution-receipt-and-trace) adds the execution receipt and trace kinds and the tenant-scoped port a durable adapter implements; the durable adapter and restart proof (T-528/durable-run-store), the authorized observe read (T-528/observe-read) and engine emitting (exchange-run-adoption, workflow-run-adoption) remain later slices."
  },
  "invariants": [
    "A RunId carries its RunKind, so runs of two kinds never share an identity even when their opaque values coincide; caused_by correlates runs and never merges them.",
    "The run status vocabulary is closed: pending, running, awaiting-retry, succeeded, dead-lettered, cancelled; succeeded, dead-lettered and cancelled are terminal.",
    "Every status change goes through the one transition table; there is no setter for status outside RunLifecycle.",
    "Retry profiles are defined once by the substrate (immediate-or-fail, external-api-standard, durable-delivery, manual-reconciliation); RetryProfile has no public constructor, so no engine or author can declare attempt counts or backoff.",
    "Exhausting a profile, or a failure the engine classifies as not retryable, dead-letters the run; there is no other failed terminal status.",
    "Every read and write is tenant-scoped; a caused_by must name a run the same tenant holds.",
    "One logical effect has one tenant-scoped receipt; effect statuses are exactly succeeded, failed, ambiguous, compensated and compensation-failed. Ambiguous evidence requires reconciliation and refuses a forward compensation link.",
    "The original's forward CompensationEffectId and the target's reverse CompensatesEffectId are distinct associations. A compensation attests to one original and may itself have a separate compensation. The checker validates only the requested pair; it infers no target-status or same-workflow rule and does not traverse chains.",
    "Recording validates compensation-link shape without requiring either linked receipt to exist. Checking is separate and changes neither receipt.",
    "Ordinary and legacy receipts may omit CompensatesEffectId and remain recordable/readable. A legacy target without that backlink fails association verification; no inferred backfill or additional storage registry exists.",
    "Only due awaiting-retry runs and running runs with due, unheld timers without a live claim are dispatched. Retry claims start an attempt without a lease. Timer resolution belongs to the engine and must use the delivered run version; repeated resolved steps are no-ops. Stable dispatcher ids are unique among live nodes. No lease renewal or attempt timeout is built here.",
    "An execution receipt carries only the run identity, status and the applicable Access decision's stable identity; it links that decision and never carries or recomputes Access's authorization evidence. An absent decision is null and stays null; a present one is never blank. After the first write the run identity (the key) and the decision link are fixed, and the status only stays or moves along the run transition table, so a stale writer cannot move a terminal run back (DES-0056 execution-runtime-ck-2, ck-3; M11 ruling on PR 484).",
    "An execution trace records the run's progress, distinct from Access's four-stage authorization trace; its ordinals start at 1, are consecutive per tenant and run, and are read back in recorded order. A replayed exact repeat of a stored step is a no-op; a different step at a taken ordinal is refused (execution-runtime-ck-4; M11 ruling on PR 484).",
    "Execution receipts and traces are tenant-scoped (a default or system sentinel tenant is refused, per the identities contract) and keyed by the kind-qualified run identity: another tenant reads nothing, and two kinds sharing an opaque value never share a receipt or a trace (execution-runtime-eng-1, cc-1)."
  ],
