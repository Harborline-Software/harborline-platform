  "purpose": "Own the execution runtime substrate (DES-0056, T-528): run-kind registration, run identity and lifecycle, named retry profiles, dead-letter, tenant-scoped run and effect receipt storage, T-1028's independently checked compensation association, and the tenant-scoped execution receipt and trace port (revision 4).",
