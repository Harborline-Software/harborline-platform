  "selectedDesign": {
    "choice": "One packable foundation assembly owns run-kind registration, the kind-qualified run identity, the closed status vocabulary and transition table, the substrate retry profiles and the dead-letter path behind a tenant-scoped store port; engines adopt it in later slices and keep their own state in their own stores.",
    "rejected": [
      "Make the workflow instance itself the run (merging identities) - ruled out by the owner on 2026-09-29: each engine registers a run kind and keeps its own state; identities never merge.",
      "Let each engine or author declare attempt counts, error predicates or backoff - ruled out by ADR 0098 amendment point 19 and DES-0056 execution-runtime-ck-8: an author selects a named profile the capability allows.",
      "Place the substrate in the blocks tier - Scheduling (foundation) must register plan-run, and the tier fence forbids foundation referencing blocks."
    ],
    "reason": "Mirrors the substrate-first slices of the field runtime and recurrence expansion: the substrate lands with its own tests before any engine adopts it."
  },
