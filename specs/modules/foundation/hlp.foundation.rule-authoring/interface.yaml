{
  "schemaVersion": 1,
  "moduleId": "hlp.foundation.rule-authoring",
  "interfaceRevision": 2,
  "status": "frozen",
  "purpose": "Typed Rules source, strict canonical codecs and located intent diagnostics, with draft lowering, advisory lint, seeds and preview over the shared rule engine.",
  "dependencies": [
    {
      "moduleId": "hlp.foundation.rule-runtime",
      "minimumRevision": 1
    }
  ],
  "tiers": {
    "typescript": {
      "package": "@harborline-software/rule-authoring",
      "role": "editor-facing typed source, intent diagnostics and preview; publication is committed only by the .NET shared store",
      "peer": "@harborline-software/rule-engine"
    },
    "dotnet": {
      "package": "Harborline.Foundation.RuleAuthoring",
      "assembly": "Harborline.Foundation.RuleAuthoring",
      "role": "typed source and full compiler admission consumed by blocks.builder-definitions"
    }
  },
  "callerInterface": {
    "name": "RuleDefinitionCodec / RuleIntentValidator / SkinLowering / RuleLint / RuleSeeds / RuleKeySuggestion",
    "operations": [
      "CompileDraft(draft, ruleId) -> RuleDefinition (throws the engine's rule.skin.* rejection)",
      "EvaluatePreview(draft, ruleId, sample, traceFilter?) -> {value, outcome, firedRowId, trace}",
      "NoMatchResolved(tableDraft) -> bool; LintTable(tableDraft) -> rules.lint.* findings",
      "BlankTableDraft() / BlankFormulaDraft() / BlankDraftFor(skin)",
      "ValidateJson(source, Author|Publish|Persisted) -> typed source or coded RFC 6901 diagnostics",
      "SerializeCanonical(source) -> canonical source JSON; SerializeBody / ParseBody split shared identity metadata",
      "RuleKeySuggestion.Suggest / suggestRuleKey -> advisory key without allocation"
    ],
    "context": "Foundation owns source and intent only, with no dependency on blocks. Hosts compose RuleDefinitionCatalog with IVersionedDefinitionStore and IDefinitionLifecycleStore in blocks.builder-definitions. A successful TS Publish-phase diagnostic result is not a committed publication."
  },
  "invariants": [
    "The bridge owns no evaluator semantics: every compile rejection and every evaluation flows through the shipped rule engine's skin compilers and form rule graph, in both tiers.",
    "A decision table with an unresolved no-match posture cannot publish: a blank Otherwise default is blocked by the fence with the compiler's stable rule.skin.no_match_unresolved code before any compile or catalog access, and a missing catch-all is rejected by the compiler itself.",
    "The preview's fired-row attribution is derived from an engine-compiled probe skin (outputs replaced by row ids), never a surface re-implementation of hit-policy ordering.",
    "Author-typed strings coerce with ECMAScript Number semantics identically in both tiers, so a draft lowers to the byte-identical skin JSON either side.",
    "Lint is advisory with stable rules.lint.* codes and never prose; the load-bearing rejection remains the skin compiler.",
    "Author, Publish and Persisted use full lowering and compiler admission including cycles and static bounds, with stable code and authored pointer. Unknown and duplicate members refuse without normalization.",
    "VersionPolicy is a caller selector, never an authored source member. The shared store owns semantic-version admission; source preserves the label.",
    "Provider-neutral metadata excludes policy-owned retention and legal-hold authority. Canonical round-trip preserves admitted source.",
    "TS preview and intent validation do not persist or allocate versions."
  ],
  "errors": [
    "rule.skin.no_match_unresolved",
    "rule.skin.decision_table_no_inputs",
    "rule.skin.decision_table_empty",
    "rule.skin.decision_table_bad_row",
    "rule.skin.decision_table_bad_cell",
    "rule.skin.decision_table_invalid_hit_policy",
    "rule.skin.formula_empty",
    "rule.skin.formula_undeclared_ref",
    "rules.lint.no_match_unresolved",
    "rules.lint.non_terminal_catch_all",
    "rules.lint.empty_output",
    "rules.lint.gap",
    "rules.lint.overlap",
    "rules.definition.invalid_document",
    "rules.definition.unknown_member",
    "rules.definition.duplicate_member",
    "rule.compile.*"
  ],
  "publicSeams": [
    "typed source and intent diagnostics",
    "trace authority filter",
    "advisory key suggestion"
  ],
  "conformance": {
    "sharedCorpus": "conformance/hlp.foundation.rule-authoring/definition-intent-cases.json",
    "phases": [
      "Author",
      "Publish",
      "Persisted"
    ],
    "packageFixture": "calculations-capability-vertical (verify-package-fixtures)"
  },
  "selectedDesign": {
    "choice": "Foundation supplies typed source and diagnostics; blocks composes Rules with the single shared versioned-definition store.",
    "rejected": [
      "Rules-local dictionary or browser localStorage persistence",
      "A foundation dependency on blocks",
      "Automatic Rules patch allocation beside caller-supplied generic labels"
    ],
    "reason": "One authority for revision fences, exact replay, immutable published history and semantic-version heads."
  },
  "behaviorEvidence": {
    "sourceCapture": "migration://preprocessing/calculations/generated/calculations-rules-source.json",
    "boundaryDecision": "migration://preprocessing/calculations/calculations-behavior-map.md"
  },
  "package": {
    "npm": "@harborline-software/rule-authoring",
    "nuget": "Harborline.Foundation.RuleAuthoring",
    "assembly": "Harborline.Foundation.RuleAuthoring",
    "distribution": "internal-only"
  }
}
