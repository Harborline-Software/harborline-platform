{
  "schemaVersion": 1,
  "moduleId": "hlp.foundation.scheduling",
  "interfaceRevision": 9,
  "status": "frozen",
  "purpose": "Bounded RRULE date expansion through Ical.Net and the shared NodaTime wall-clock resolver. Due generation belongs to hlp.blocks.scheduling (ADR-0117/0123).",
  "dependencies": [
    "hlp.contracts.identities"
  ],
  "callerInterface": {
    "name": "IRruleExpansionService / WallClockResolver",
    "operations": [
      "ExpandOccurrences(rrule, start, end?, lookaheadDays, leadDays, today, timezone) -> ascending DateOnly occurrences, never exceeding 1000 and never partial; selector matches honor INTERVAL from DTSTART; RruleExpansionCapExceededException when the 1000-occurrence candidate limit is reached before the requested range is fully evaluated, carrying recurrence id, anchor, requested range, candidate limit, candidates examined, last evaluated occurrence and the COUNT/UNTIL bound; FormatException on a missing FREQ, a part given twice, COUNT with UNTIL, or an out-of-bound or malformed value of an admitted part (named); ArgumentException on blank input; NotSupportedException on a component or FREQ outside the bounded subset, BYMONTHDAY under WEEKLY, or a numeric BYDAY under DAILY or WEEKLY",
      "ExpandZonedOccurrences(rrule, start, startTime, timezone, end?, lookaheadDays, leadDays, today) -> the local dates of a timed series anchored at start+startTime in an IANA zone; a DATE-TIME UNTIL is a UTC instant bounding the series inclusively (RFC 5545 s3.3.10), a DATE UNTIL bounds by local date; the same subset, cap and exceptions as ExpandOccurrences, plus ArgumentException on a zone that is not an IANA id (ADR-0122 decision 3). A default interface member refuses with NotSupportedException for implementations written before it.",
      "WallClockResolver.ToUtcInstant(date, time, timezone) -> the UTC instant of a local wall-clock time per RFC 5545 s3.3.5 and Errata 4271: an ambiguous time is its first occurrence, a gap time is read at the offset before the gap; ArgumentException on a zone that is not an IANA id. The one resolver the calendar block, the availability runtime and Scheduling share (ADR-0123 decision 4).",
      "WallClockResolver.ToLocalDateTime(kernelInstant, timezone) -> series-local DateTime (Unspecified), using the same NodaTime tzdb provider as ToUtcInstant; ArgumentException for an unknown zone.",
      "InMemoryRruleExpansionService.ValidateRule(rrule) -> author-time bounded-subset validation, without inventing a series date or expanding occurrences.",
      "IAvailabilityRuntime.Read(TenantId, AvailabilityRequest) -> AvailabilityAnswer. The shared availability contract and its unchanged ParticipantRef, TimeInterval, EventPadding, capacity, request, answer and refusal types live in Harborline.Foundation.Scheduling.Models and .Services. Calendar implements the runtime; Scheduling consumes it. No supply composition moves into foundation (T-491/module-admission, ADR-0080, ADR-0123).",
      "VisitZonedOccurrences(rrule, start, startTime, timezone, end, requestedRangeStart, visit, candidateLimit=50000, budget?=null) -> one chronological walk including dates before the lower bound. RruleExpansionBudget carries prior rule/override work and its own limit when supplied; it must identify this same rule, anchor and range. Otherwise a new budget is created and charges rule characters before subset parsing. Each period and matching date consumes the same allowance. The caller filters and caps final results; callbacks are provisional until the walk completes. Earlier implementations refuse with NotSupportedException. RruleExpansionBudgetExceededException.Code is scheduling.occurrence.expansion_budget_exceeded; its eight fields retain their names, with Bound null only if rule-input work exhausted the allowance before bound classification."
    ],
    "context": "Producer bounds are explicit inputs; due and overdue use Scheduling and its kernel clock. Breaking pre-release move: no foundation forwarding shim."
  },
  "invariants": [
    "The supported RRULE subset is closed: an unsupported component is refused rather than silently discarded, and a missing FREQ or blank rule fails closed rather than expanding empty.",
    "Expansion runs on Ical.Net behind the bounded subset (ADR-0122): an invalid date such as 31 February is skipped and not counted, a numeric BYDAY under YEARLY without BYMONTH is an offset within the year (RFC 5545 Errata 1913), and the subset validator refuses what the engine would accept (a part given twice, COUNT with UNTIL, a numeric BYDAY under DAILY or WEEKLY). A differential corpus recorded from python-dateutil and libical holds the engine to their answers.",
    "WEEKLY rules with BYDAY and MONTHLY rules with BYDAY or BYMONTHDAY admit matches only in RFC weeks or calendar months whose elapsed count from DTSTART is a multiple of INTERVAL.",
    "Every admitted selector applies under every FREQ it is admitted with (RFC 5545 s3.3.10): BYDAY and BYMONTHDAY limit DAILY, intersect under MONTHLY, and expand YEARLY day by day; an out-of-bound or malformed value of an admitted part is refused naming the part, never dropped.",
    "ExpandOccurrences and ExpandZonedOccurrences return at most 1000 dates; VisitZonedOccurrences has no result cap and delegates final filtering and the result cap to its caller.",
    "Occurrences are returned only when every occurrence relevant to the requested range has been evaluated: a walk that reaches the 1000-occurrence candidate limit with range left to cover refuses with a dedicated domain type rather than returning an unmarked partial, and a rule bounded by COUNT or UNTIL that ends before the limit succeeds normally (DES-0057 s10 ruling 3).",
    "COUNT and UNTIL are mutually exclusive; BYMONTHDAY is capped at 28.",
    "Only the opt-in VisitZonedOccurrences path has a work budget. RruleExpansionBudget charges one unit per UTF-16 rule character before parsing or rebuilding selectors, one per supplied override before resolution, one per recurrence period including empty periods, and one per matched date before filtering. A supplied budget carries the same counter and limit across due-query preprocessing and the producer. Otherwise the visitor creates its candidateLimit allowance (default 50000). The list-returning methods apply no work budget, preserving Calendar and Booking call sites; T-1202 owns their future bound.",
    "A zoned UTC UNTIL is converted to a local date using offset ticks with representable-range checks: a local date above DateOnly.MaxValue cannot tighten a representable horizon, and a local date below DateOnly.MinValue ends the walk. The UTC instant check still decides inclusive membership. Duplicate BYDAY, BYMONTHDAY and BYMONTH selectors are normalized to sets once before per-period engine evaluation."
  ],
  "errors": [
    "FormatException (missing FREQ; a part given twice; COUNT with UNTIL; out-of-bound or malformed value of an admitted part)",
    "ArgumentException (blank rule; inverted window; a time zone that is not an IANA id)",
    "NotSupportedException (RRULE component or FREQ outside the bounded subset; BYMONTHDAY under WEEKLY; numeric BYDAY under DAILY or WEEKLY; ExpandZonedOccurrences on an implementation without it)",
    "RruleExpansionCapExceededException (candidate limit reached before the requested range was fully evaluated)",
    "RruleExpansionBudgetExceededException (scheduling.occurrence.expansion_budget_exceeded; work budget exceeded; no complete result)"
  ],
  "publicSeams": [
    "RRULE date producer",
    "shared IANA wall-clock resolver",
    "shared availability contract (IAvailabilityRuntime)"
  ],
  "conformance": {
    "nativeTests": {
