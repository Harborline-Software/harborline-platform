    "context": "Cross-tier consistency is binding: the expander mirrors the ui-react SchedulerRecurrence expandRecurrence subset exactly so the same RRULE expands identically on both tiers. Callers inject today/asOf — the engine never reads ambient time. The seam exists by user ruling 2026-08-16 (migration ticket 086): the event-anchored relative-chain generator is post-gate substrate that plugs in behind IDueOccurrenceSource with no breaking change."
  },
  "invariants": [
    "The supported RRULE subset is closed (unsupported components are ignored in v1, documented for the Ical.Net follow-on); a missing FREQ or blank rule fails closed, never expands empty.",
