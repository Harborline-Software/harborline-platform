    },
    "nativeTestNote": "RRULE subset, RFC and differential corpus tests plus literal bidirectional timezone and DST cases; due seam tests moved to Scheduling. Revision 9 adds literal override-sharing input accounting, unbudgeted list compatibility beyond 50000 units, both out-of-range UNTIL offset directions, selector normalization and budget identity checks (Terra pre-pass; control PR 1378)."
  },
  "selectedDesign": {
    "choice": "Ical.Net (MIT) expands behind IRruleExpansionService, with the bounded subset kept as a validator in front and NodaTime (Apache-2.0) as the zone engine (ADR-0122, the owner's ruling of 2026-11-07 on R-0146 call 5). Superseded: verbatim port of the pinned foundation-scheduling engine with one additive seam above the pinned query.",
    "rejected": [
      "Reintroducing due generators into the recurrence substrate (ADR-0117).",
      "A foundation-to-block forwarding shim for the moved due API (reverses the tier dependency)."
    ],
    "reason": "Three maintained engines give RFC 5545's answers where the hand-written walker did not (month ends, leap days, yearly ordinals, zoned UNTIL, ambiguous local times); the subset stays the contract either way (R-0146 call 5). Earlier reason: Pin-parity for the 25 pinned rows plus the user-ruled open seam, at zero breaking-change cost."
  },
