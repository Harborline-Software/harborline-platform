{
  "schemaVersion": 1,
  "moduleId": "hlp.foundation.documents",
  "interfaceRevision": 3,
  "status": "frozen",
  "purpose": "Own the Documents composition's TemplateDefinition (content kind 7): its envelope, canonical JSON, pack content and structural admission over an exactly pinned Layout page surface with intent issue (DES-0021, ADR 0092, ADR 0094).",
  "dependencies": [
    "hlp.foundation.rule-runtime",
    "hlp.foundation.definitions"
  ],
  "callerInterface": {
    "name": "TemplateDefinitionJson / TemplateDefinitionAdmission / TemplatePack / DocumentsExpressionEnvironment",
    "operations": [
      "TemplateDefinitionJson.SerializeCanonical / Deserialize -> canonical snake_case, ordinal-sorted, newline-terminated UTF-8 JSON; unknown members refuse",
      "TemplateDefinitionAdmission.Validate(template, surfaces) -> every refusal at once: envelope (an envelope contract that is missing or outside the host window (definition.contract.missing or definition.contract.out_of_window at /envelope/contract, T-572), against TemplateSurfaces.ContractWindow at author, publish, install and the persisted read), document type, and the exact surface pin, which must resolve a page surface with default intent issue whose repeating regions declare columns; Layout's own validator is consumed through TemplateSurfaces, so schema-owned numeric ranges refuse at publish",
      "TemplateDefinitionAdmission.ValidatePersisted(template, surfaces) -> the persisted read: an invalid stored value is diagnosed by name (stage render.runtime) and never clamped",
      "TemplateDefinitionAdmission.AdmitCatalogueBody(tenant, id, version, body, publishing, surfaces) -> the shared catalogue's admission for DefinitionKind.Templates; a publishing body must state the catalogue's tenant, key and version",
      "TemplatePack.Export(template, surfaces) -> content kind 7 entry of canonical authored bytes and SHA-256 digest after publish admission; server-derived members are never exported",
      "TemplatePack.TryParse(content, tenant, provenance) -> a template stamped with the installing tenant and provenance, or a named miss; never an exception; owner, tenant, pack_key and provenance in authored content refuse by name",
      "TemplatePack.InstallAsync(entries, target) -> one outcome per entry (Published, AlreadyPresent, Refused); a refused entry never blocks its siblings; a stored key and version with a different body refuses with pinned_tuple_conflict and is never replaced",
      "DocumentsExpressionEnvironment.Declaration / Admitted -> documents-ck-25 stated in Rules' shared BorrowerEnvironmentDeclaration and admitted by Rules; EvaluateGuard(evaluator, blockId, expression, snapshot, phase) presents the admission for the phase before the shared engine reads a value",
      "DocumentRuntime.RenderForIssuanceAsync(reference, layoutPageFlow, context) -> renders a published template at an exact version through the path PreviewAsync uses and returns the template key and version, the semantic document and its DocumentContentHash; a missing version refuses documents.template.version_required; it stores nothing, and an inline draft cannot reach it",
      "DocumentContentHash.Of(document) -> sha256: and 64 lowercase hex digits over a specified encoding, so another implementation reproduces it and a stored hash never migrates: each field is its UTF-8 byte length in decimal, a colon, its UTF-8 bytes and a comma (an unpaired surrogate encodes as U+FFFD), a null field is ~, and the fields are document type, locale, currency, brand name, logo reference, then each block's id, page variant and content in order",
      "DocumentOutputWriters(bindings).Resolve(format) -> the named, parameterised binding for a format, case-insensitively; an unregistered format refuses documents.writer.format_unknown and two bindings for one format refuse documents.writer.format_duplicate",
      "DocumentRuntime.PreviewAsync(input, layoutPageFlow, context, authoringUiLocale) -> parses published and inline template bodies through TemplateDefinitionJson, re-admits the pinned surface at render, resolves only the authored document locale policy, and emits a non-minting RenderedDocument; Layout supplies page flow through DocumentPageFlow so foundation never references blocks",
      "IDocumentOutputWriter.WriteAsync(renderedDocument) -> a host-selected, library-neutral bytes-out adapter consumes semantic output without changing its order"
    ],
    "context": "Templates are portable pack content stored in the shared builder-definitions catalogue; this package owns their typed shape, canonical JSON and admission, never a store and never a Layout type. The host binds the catalogue and Layout's validator."
  },
  "invariants": [
    "Content kind 7 is the api's PackContentKind.TemplateDefinition and PackContentKindRegistry's value (T-738; 6 is TerminologyOverride); this package allocates no content kind or pillar number.",
    "A template pins its Layout surface by exact identity and version and never copies it.",
    "Tenant and provenance are server-derived: exported content never carries them and installation stamps them.",
    "A published key and version never changes body; a reinstall with a different body refuses by name.",
    "A document guard evaluates only under the admitted documents-ck-25 environment: field reads only, render and sign-off phases, no ambient default.",
    "Publication refuses a Template -> pinned surface -> Template walk that returns to the version being published; detach lineage is not an edge.",
    "A merge run formats in the document locale resolved from the template's locale policy, never the UI locale: currency with the render context's code and its ISO 4217 minor units (a missing or non-alpha-3 code refuses documents.merge.currency_invalid), date as the short date, integer and decimal grouped, decimal at the value's own scale. A null value prints the authored fallback, or nothing. Only canonical forms parse: a number exactly as an invariant decimal prints it (optional minus, no leading zeros, no negative zero, at most what a decimal holds); yyyy-MM-dd, or yyyy-MM-ddTHH:mm:ss with one to seven optional fraction digits and Z or a +HH:mm offset. A malformed value, an integer with a fraction, or an amount finer than the currency's minor unit refuses documents.merge.value_malformed rather than printing raw or rounding, and a date outside the culture's calendar refuses documents.merge.date_outside_calendar. A locale tag must be BCP 47 language[-script][-region][-variant] with no extension, or it refuses documents.template.locale_invalid at render and, for a fixed tag, at /locale on admission. Only predefined cultures are used, so a well-formed tag with no predefined culture formats as en-US; which tags are predefined follows the host's ICU data. The document reports the resolved culture's name and the upper-case currency code, so case spellings of a tag or code hash equally; an alias such as zh-TW for zh-Hant-TW keeps its own name. Printed text follows the host's ICU data, so an issued record stores its hash and never recomputes it to compare.",
    "A template logo reference must be digest-pinned, sha256: and 64 lowercase hex digits (DES-0054 ruling 9). Any other form refuses documents.style.logo_not_pinned at /style/logo_asset_ref at every admission stage, publish, install and the persisted read before preview and issuance, so a URL or path is never resolved (CWE-918, CWE-79). The form is checked here; resolving and sanitizing the asset's bytes is not yet built.",
    "Preview and issuance render through one method, so a preview cannot differ from the document it previews; only issuance returns a content hash, and only a published reference with an exact version reaches it. A published body whose identity or version differs from the reference refuses documents.template.reference_mismatch, and a block page variant other than first, left or right refuses documents.flow.page_variant_invalid."
  ],
  "errors": [
    "documents.template.envelope_invalid",
    "documents.template.document_type_required",
    "documents.template.body_invalid",
    "documents.template.surface_unresolved",
    "documents.template.surface_pin_mismatch",
    "documents.template.surface_medium_unsupported",
    "documents.template.surface_intent_unsupported",
    "documents.template.repeating_region_columns_required",
    "documents.template.authority_field_forbidden",
    "documents.template.envelope_mismatch",
    "documents.template.catalogue_mismatch",
    "documents.template.pinned_tuple_conflict",
    "documents.template.composition_cycle", "documents.merge.value_malformed", "documents.merge.format_unsupported", "documents.merge.currency_invalid", "documents.template.version_required", "documents.template.reference_mismatch", "documents.flow.page_variant_invalid", "documents.style.logo_not_pinned", "documents.template.locale_invalid", "documents.template.locale_unresolved", "documents.template.published_not_found", "documents.merge.date_outside_calendar", "documents.writer.format_unknown", "documents.writer.format_duplicate"
  ],
  "publicSeams": [
    "template intent admission and canonical JSON",
    "content kind 7 pack entry and per-entry install",
    "TemplateSurfaces: exact surface pin resolution, Layout admission and the required application-contract window supplied by the host",
    "TemplateInstallTarget: stored-tuple lookup and publication over the shared catalogue supplied by the host",
    "DocumentRuntime: published or inline template resolution, semantic preview and Layout page-flow boundary",
    "DocumentRuntime.RenderForIssuanceAsync: the render an issuing host mints from, on the preview path",
    "DocumentMergeRun and DocumentLiteralRun: runs a host resolves from Layout text runs; the five canonical formats",
    "DocumentContentHash: the semantic hash an issued record stores",
    "DocumentOutputWriters and DocumentOutputWriterBinding: one named, parameterised writer per format, chosen by host registration",
    "IDocumentOutputWriter: host-selected library-neutral output writer"
  ],
  "conformance": {
    "nativeTests": {
      "dotnet": 74
    },
    "nativeTestNote": "Covers content kind 7 round trip with identical pin and digest, envelope members, document type, page/issue surface pin, Layout schema ranges at publish and at the persisted read, authority fields, column-less regions, named misses with sibling install, Forms-pattern versioning in the shared catalogue and the pinned-tuple body conflict. Adds the documents-ck-25 declaration against the released borrower fixture and guard admission, and parity tests for the retired documents-ck-8 and documents-ck-9. Adds the owner ruling Q8 cycle refusal: direct and longer cycles, a different version, and a detached copy. Revision 2 adds published/inline shared-parser semantic previews, document-locale selection isolated from the UI locale, Layout page-flow boundary and writer-adapter equivalence. Revision 3 adds merge-run formatting and canonical-form refusals, the issuance render, the specified content hash, writer selection and the logo and locale-tag refusals."
  },
  "selectedDesign": {
    "choice": "One packable foundation assembly owns the template definition and its admission; the Layout surface is reached only through a host-supplied pin resolver and validator, because foundation assemblies may not reference the blocks tier where Layout lives.",
    "rejected": [
      "Copy the Layout surface into the template (a second placement grammar).",
      "Reference Harborline.Blocks.BuilderDefinitions from foundation (tier fence)."
    ],
    "reason": "Documents keeps its own artefact and composes Layout's surface contract without absorbing it (ADR 0092 ruling 4, layout-ck-32)."
  },
  "package": {
    "nuget": "Harborline.Foundation.Documents",
    "assembly": "Harborline.Foundation.Documents",
    "distribution": "internal-only"
  }
}
