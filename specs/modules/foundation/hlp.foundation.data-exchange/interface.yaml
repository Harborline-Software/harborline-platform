{
  "schemaVersion": 1,
  "moduleId": "hlp.foundation.data-exchange",
  "interfaceRevision": 1,
  "status": "frozen",
  "purpose": "Own the inbound-only Data Exchange definition, constrained CSVW mapping profile, immutable tenant run evidence, distinct replay identities, bounded canonical Records command orchestration, target Access gate, effect ledger, and conservative checkpoint promotion required by ADR 0098.",
  "dependencies": [],
  "callerInterface": {
    "name": "IDataExchangeDefinitionStore / TabularMappingAdmission / DataExchangeInterpreter / DataExchangeRuntime / DataExchangeCommitter",
    "operations": [
      "TabularMappingAdmission.Validate -> accept hl:tabular-mapping/v1 with immutable schema identity and supported CSVW terms; refuse unknown profile/schema/major/hl extension or non-canonical target",
      "IDataExchangeDefinitionStore -> immutable draft/publish/restore history and published definition pack export; credentials, cursors and retention overrides refuse",
      "DataExchangeInterpreter.CreateDryRunAsync -> resolve a read-only source capability, discover and validate source shape, stream rows, apply CSVW null/default/type semantics and registered transforms, bind canonical payloads, persist payloads behind protected references, and continue with a closed rejection for an invalid row",
      "DataExchangeRuntime.CreateDryRunAsync -> persist a new immutable tenant review artifact with proposal fingerprints, normalized evidence, candidate checkpoint, protected snapshot reference and policy-owned lifecycle",
      "DataExchangeCommitter.CommitAsync -> stale-input refusal, commit permission, per-effect target Access, stable batch/effect identity, fresh attempt identity, bounded canonical command dispatch, authoritative effect outcomes, eligible unresolved replay and contiguous acknowledgement-safe checkpoint promotion",
      "DataExchangePermissions -> closed author, dry-run, commit and read-run-results capability vocabulary; target Access remains independent"
    ],
    "context": "Definitions are portable pack content. Run artifacts, effect outcomes and checkpoints are operational tenant state outside packs. Hosts provide durable adapters for run evidence, target authorization/command dispatch, effect outcomes and checkpoint state."
  },
  "invariants": [
    "Data Exchange is inbound-only; no export or global undo surface exists.",
    "CSVW terms keep CSVW semantics; application execution behavior uses only the closed hl: extension vocabulary.",
    "Mappings terminate at versioned canonical Records contracts and refuse connector-private or persistence targets.",
    "Dry-run and commit artifacts are separate immutable identities; reevaluation creates a new DryRunId and replay creates a new CommitRunId while preserving BatchIdentity.",
    "AttemptId never participates in batch or effect idempotency derivation.",
    "Proposal-affecting drift refuses before authority or target dispatch and never mutates the reviewed dry run.",
    "Commit authority is necessary and never sufficient: each effect independently passes target Access and target command handling.",
    "Replay preserves non-retryable resolved effects and dispatches only eligible Failed or Halted effects.",
    "Durable checkpoint state advances only through the maximal contiguous source-defined acknowledgement-safe prefix.",
    "Ordinary evidence contains normalized metadata and protected payload references, never embedded raw source or full proposed payloads.",
    "Retention class and RetainUntil are run lifecycle inputs; definitions cannot choose or weaken them.",
    "The terminal outcome vocabulary is Applied, Skipped, Conflicted, Rejected, Failed and Halted; CompletedWithRefusals is distinct from clean completion."
  ],
  "errors": [
    "mapping.profile_unknown",
    "mapping.schema_mismatch",
    "mapping.major_unsupported",
    "mapping.target_not_canonical",
    "mapping.extension_unknown",
    "definition.credential_forbidden",
