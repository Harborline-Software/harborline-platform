    "definition.format_required",
    "definition.published_head_not_found",
    "definition.source_capability_unregistered",
    "definition.source_parameter_undeclared",
    "definition.secret_reference_invalid",
    "mapping.source_column_unknown",
    "mapping.required_missing",
    "mapping.datatype_invalid",
    "mapping.datatype_unsupported",
    "mapping.target_forbidden",
    "source.unregistered",
    "transform.unregistered",
    "run.not_found",
    "run.stale",
    "commit.forbidden",
    "commit.window_exceeded",
    "commit.command_payload_exceeded",
    "target.access_refused",
    "commit.outcome_policy_unknown",
    "run.outcome_unknown",
    "run.terminal_unknown",
    "run.terminal_inconsistent",
    "run.census_incomplete",
    "commit.rollback_refused",
    "target.contract_unregistered",
    "run.ledger_mismatch",
    "commit.payload_missing",
    "commit.effect_in_progress",
    "checkpoint.conflict"
  ],
  "publicSeams": [
    "definition intent admission (author, publish, install) and canonical JSON",
    "content kind 12 pack entry for the platform package",
    "IDataExchangeDefinitionResolver published-head port",
    "mapping-profile terminal admission",
    "read-only acquisition and discovered-shape port",
    "registered transform and canonical-target capability registry",
    "protected canonical effect payload port",
    "immutable run-evidence and atomic commit/finalization port",
    "exchange commit authority port",
    "target Access gate",
    "acquisition-checkpoint port",
    "injected clock",
    "IProposalEvaluationPort.EvaluateAsync -> current DryRunRequest from trusted semantic dependency/effect evaluation",
    "ISourceOutcomePolicyPort.ResolveAsync -> named AcknowledgementPolicy with SafeOutcomes and RetryableOutcomes, or null for unknown policy",
    "ExchangeRunClosure.Validate -> approved effect conservation, exact census and closed terminal status",
    "IRunLifecyclePolicyPort.DeriveAsync(tenantId, retentionClass, requestedAt) -> RunRetention(RetainUntil, LegalHold)",
    "DataExchangeRuntime.CanDisposeDryRunAsync / CanDisposeCommitRunAsync -> current policy eligibility; disposition adapters must recheck holds atomically",
    "CommitOptions(AllOrNothingRollback, MultiCommandAtomicCommit) -> either true refuses before evaluation or dispatch",
    "ICanonicalForwardCorrectionPort.CorrectAndRecordAsync(CanonicalForwardCorrectionCommand) -> domain-owned correction outcome; source policy CorrectConflicts selects this path",
    "ICanonicalTargetRegistryPort.ResolveAsync(TargetContract) -> CanonicalRecordsContract(Contract, Version) or null; execution refuses unresolved, mismatched or unversioned contracts before effects",
    "ICanonicalTargetCommandPort.ExecuteAndRecordAsync(CanonicalRecordsCommand) -> EffectTerminalOutcome; atomic target effect plus outcome; target-owned authorization, validation, idempotency, audit and transaction",
    "ICanonicalTargetCommandPort.GetOutcomeAsync(EffectIdempotencyIdentity) -> durable EffectLedgerEntry; no caller-owned RecordAsync or separate outcome store",
    "CanonicalRecordsCommand.Authorization -> TargetAuthorizationContext(TenantId, ActorId, ContextReference), also carried by CanonicalForwardCorrectionCommand.OriginalCommand"
  ],
  "conformance": {
    "nativeTests": {
      "dotnet": 91
    },
    "nativeTestNote": "Includes shared-catalogue immutable heads, restore-as-new-draft, canonical JSON round trip, content kind 12 platform-package export with digest, boundary refusals with valid counterparts, semantic dependency identity and supersession, closed census/status/policy refusal, lifecycle-derived retention and legal holds, rollback refusal and domain correction, execution registry admission, authorization-context propagation, lost-response replay, read-only acquisition, CSVW mapping/coercion, protected payload handling, bounded concurrent dispatch, stale promotion refusal, and recoverable checkpoint finalization."
  },
  "selectedDesign": {
    "choice": "One packable foundation assembly owns the projection-neutral definition and execution protocol while durable persistence, connector acquisition, target Access, canonical Records commands and UI projections remain behind narrow host adapters.",
    "rejected": [
      "Require full CSVW for ordinary authoring.",
      "Expose a proprietary CSVW-like shape or connector-private target DTO.",
      "Treat the batch as a database transaction or promise global undo.",
      "Store cursors, raw payloads or retention duration in portable definitions."
    ],
    "reason": "The package centralizes the determinism, review, replay, least-privilege and checkpoint rules every inbound connector would otherwise reimplement and drift."
  },
  "package": {
    "nuget": "Harborline.Foundation.DataExchange",
    "assembly": "Harborline.Foundation.DataExchange",
    "distribution": "internal-only"
  },
  "identityContract": {
    "batchVersion": "hl-batch-v2",
    "inputs": [
      "TenantId",
      "DefinitionId",
      "DefinitionVersion",
      "MappingId",
      "MappingVersion",
      "MappingDigest",
      "ConnectorId",
      "ConnectorVersion",
      "SourceFingerprint",
      "InputBoundary",
      "TargetContract (includes version)",
      "DependencyFingerprint",
      "MappingProfile",
      "TransformVersionsFingerprint",
      "LookupVersionsFingerprint",
      "MatchingInputsFingerprint",
      "SelectedBoundary"
    ],
    "effectInputs": [
      "BatchIdentity",
      "TargetContract",
      "SourceRecordIdentity",
      "SourceRecordVersion",
      "EffectDiscriminator"
    ],
    "excluded": [
      "AttemptId"
    ],
    "supersession": "DryRunRequest/DryRunArtifact.SupersedesDryRunId; stale exception returns SupersedingDryRunId"
  }
}
