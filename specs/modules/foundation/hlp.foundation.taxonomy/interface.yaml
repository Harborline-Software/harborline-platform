  "purpose": "Own the portable Taxonomy definition (content kind 8, DES-0024; the api's PackContentKind.TaxonomyDefinition, T-738), its canonical projection-neutral JSON and phase-aware structural admission, and the pure in-memory TaxonomyInterpreter over caller-supplied pinned definitions.",
  "dependencies": [],
  "callerInterface": {
    "name": "TaxonomyDefinitionAdmission / TaxonomyDefinitionJson / TaxonomyDefinitionPackExporter / TaxonomyInterpreter",
    "operations": [
      "TaxonomyInterpreter.CaptureCodingAnswers(string tenant, IReadOnlyList<TaxonomyCodingBinding> bindings, IReadOnlyList<TaxonomySubsumptionQuery> queries, DefinitionContractWindow window) -> string: produce canonical newline-terminated finite pinned answers using the existing Subsumes, after single-buffer canonical SHA256/clone/coordinates, Install admission and GetAncestors validation of every selected node",
      "TaxonomyCodingBinding(string System, TaxonomyDefinitionCoordinates Coordinates, string DefinitionSha256); TaxonomySubsumptionQuery(string System, string AncestorCode, string DescendantCode); TaxonomyCodingCaptureException.Code",
      "TaxonomyDefinitionAdmission.Validate / AdmitJson(body, phase, window, catalogue, previous) -> the complete structural refusal list at the Author, Publish and Install boundaries against the required host DefinitionContractWindow; an envelope contract that is missing or outside the host window (definition.contract.missing or definition.contract.out_of_window at /envelope/contract, T-572), unpinned/malformed version, unsupported schema version, missing or mismatched envelope, Authoritative governance authored tenant-side, an Authoritative definition owned by anyone but the Harborline actor, a definition published with no nodes, duplicate node codes, an unknown parent code, a parent-edge cycle or a chain past the depth bound, a missing deprecation reason at tombstone, a successor naming an unknown or tombstoned node, and — against a supplied previous version — a tombstoned node reactivated or its display history rewritten, all refuse",
      "TaxonomyDefinitionAdmission.Require -> the definition, or throws TaxonomyAdmissionException carrying the same refusal list",
      "TaxonomyDefinitionJson.SerializeCanonical / Deserialize -> canonical snake_case, ordinal-sorted, newline-terminated UTF-8 JSON for every definition member, including the three-part TaxonomyDefinitionId as one dotted string",
      "TaxonomyDefinitionPackExporter.Export(definition, window, previous, vendor) -> content kind 8 entry of canonical bytes after Publish-phase admission",
      "new TaxonomyInterpreter(definitions) -> index caller-supplied TaxonomyDefinition values by exact (Tenant, DefinitionId, Version); duplicate coordinates throw ArgumentException and null inputs retain the existing argument guards",
      "TaxonomyInterpreter.ResolveDefinition(coordinates) -> TaxonomyDefinitionResolution: ResolvedTaxonomyDefinition(Definition) or TaxonomyDefinitionNotFound(Coordinates); an absent pinned definition is a typed result, not an exception",
      "TaxonomyInterpreter.ResolveClassification(definition, reference) -> ResolvedTaxonomyClassification(Reference, Node), or null for an unknown, null or empty code; a reference that does not pin the supplied definition throws ArgumentException",
      "TaxonomyInterpreter.ResolveClassifications(definition, references) -> an ordered IReadOnlyList<ResolvedTaxonomyClassification?> preserving null input entries and unknown-code misses",
      "TaxonomyInterpreter.GetAncestors(definition, code) -> IReadOnlyList<TaxonomyNode> from nearest parent to root; an unknown starting code returns an empty list; malformed parent graphs retain the traversal exceptions",
      "TaxonomyInterpreter.GetDescendants(definition, code) -> IReadOnlyList<TaxonomyNode> in pre-order with siblings in their original TaxonomyDefinition.Nodes order; an unknown starting code returns an empty list",
      "TaxonomyInterpreter.Subsumes(definition, ancestorCode, descendantCode) -> true when both nodes exist and are equal or the first is an ancestor of the second; an unknown node returns false",
      "TaxonomyInterpreter.ResolveSuccession(definition, code) -> TaxonomySuccessionResult: ResolvedTaxonomySuccession(Node) with HopCount, or TaxonomySuccessionRefusal(Code, Reason) with nullable LastHopCode; the original request Code is retained on refusal",
      "TaxonomyInterpreter.ExpandWholeScheme(definition) -> IReadOnlyList<string> of all node codes in original definition order, including tombstoned nodes",
      "TaxonomyInterpreter.ExpandCollection(definition, collectionName) -> TaxonomyCollectionExpansionResult: ResolvedTaxonomyCollectionExpansion(Codes) in the collection's declared order, or TaxonomyCollectionExpansionNotFound(CollectionName); an absent collection is not a silently empty expansion",
      "TaxonomyInterpreter.ExpandOverlay(overlayCoordinates, vendorVersion) -> TaxonomyOverlayExpansionResult against the explicitly requested vendor version; success returns vendor codes followed by overlay codes, while missing definitions, ambiguous vendor registrations, copied vendor nodes and unknown designation codes are distinct typed results",
      "TaxonomyInterpreter.ResolveOverlayDesignations(overlay, vendor) -> IReadOnlyList<ResolvedTaxonomyOverlayDesignation> with each effective Display and Description taken from the overlay when supplied, otherwise from the vendor; an unknown vendor node throws TaxonomyOverlayException",
      "TaxonomyInterpreter.Diff(previous, current) -> TaxonomyDefinitionChangeSet with AddedNodes, ChangedNodes and newly TombstonedNodes; tenant and definition id must match, while versions may differ"
