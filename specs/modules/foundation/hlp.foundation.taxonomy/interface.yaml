    "context": "The definition is portable pack content: a concept scheme (TaxonomyDefinition) owning its own node set (TaxonomyNode), never a separate primitive and never a store. This package owns the typed shape, canonical JSON, structural admission and the shipped dependency-free TaxonomyInterpreter for pinned lookup, classification resolution, traversal, succession, whole-scheme/collection/overlay expansion, overlay designations and definition diffing. The interpreter indexes definitions supplied by its caller; it does not fetch versions or provide a host catalogue adapter, kernel-core tenancy/authorization gate, pack transport or authoring UI."
  },
  "invariants": [
    "Capture is explicit host work outside Rules evaluation; tenant comes from admitted authority and expected pins from independently admitted definitions. Hashes bind source bytes without authenticating a hostile answer producer.",
    "Capture resolves exact tenant/id/version coordinates with no normalization, latest lookup or cross-tenant fallback. Each selected definition is serialized canonically once; its hash and owned deserialized clone derive from that same buffer. Missing definition, pin mismatch or unresolved alias refuses the entire capture.",
    "Capture validates all selected paths using existing Install admission and GetAncestors before answering any finite query with Subsumes; corrupt parent graphs cannot hide behind an unknown-code false. Existing admission/traversal exceptions remain refusals; this adds no overlay or succession traversal.",
    "Captured answer JSON is [harborline-taxonomy-coding-answers/1,tenant,bindings,answers], with binding [system,dottedDefinitionId,exactVersion,lowercaseSha256] and answer [system,ancestorCode,descendantCode,boolean]. Tuples have strict types/arity, nonempty strings, unique aliases/answer keys and ordinal tuple order. Definition ids have three nonempty segments; versions have three unsigned Int32 numeric segments. No trim, fold, wildcard or normalization.",
    "Capture rejects empty bindings or queries, bounds total selected source nodes and requests to5000 before traversal, and uses bounded output writing:262144 UTF-8 bytes,64 nesting levels,5000 JSON values. One trailing newline follows compact JSON. It never constructs an all-pairs closure.",
    "The captured payload is ephemeral derived data, never a stored edge or replacement authority. Named Collections, authored/bound/carried caller journeys and broader T493/L591/overlay/succession acceptance remain separate obligations.",

    "A TaxonomyNode's ParentCode names at most one parent; the shape has no field through which a second parent could be expressed.",
    "There is no delete operation; a concept is inactivated (Status = Tombstoned) and its code is never reused by the producer's own admission, checked against a supplied previous version.",
    "A parent-edge walk is bounded at 64 hops and refuses a cycle or an excess chain at admission time, rather than looping; this is a structural check, not the interpreter's ancestor/descendant traversal.",
    "An Authoritative definition is owned by the literal Harborline actor id and is never authorable at the Author phase.",
    "A definition publishes only with a non-empty node set; an empty scheme refuses at Publish and Install.",
    "Structural admission requires a successor code to name an existing, Active node in the same definition. The separate interpreter follows succession defensively on the supplied node graph; its raw-chain behavior does not relax admission.",
    "Canonical JSON is snake_case, ordinal-key-sorted and newline-terminated; re-serializing a deserialized definition is byte-identical.",
    "TaxonomyDefinitionCoordinates(Tenant, DefinitionId, Version) pins a definition. TaxonomyClassificationReference(Tenant, DefinitionId, Version, Code) exposes DefinitionCoordinates with those same pinned coordinates. Node-code lookup and named-collection matching are ordinal; no new trimming or case normalization is implied.",
    "TaxonomyDefinitionResolution has exactly the shipped ResolvedTaxonomyDefinition(Definition) and TaxonomyDefinitionNotFound(Coordinates) variants. ResolvedTaxonomyClassification(Reference, Node) exposes IsActive from Node.Status; resolving a tombstoned classification does not silently replace its identity with its successor.",
    "TaxonomyCollectionExpansionResult has the shipped ResolvedTaxonomyCollectionExpansion(Codes) and TaxonomyCollectionExpansionNotFound(CollectionName) variants. Declared Codes retain their order; a malformed null NodeCodes collection throws taxonomy.definition_malformed.",
    "TaxonomyOverlayExpansionResult has the shipped ResolvedTaxonomyOverlayExpansion(Codes), TaxonomyOverlayExpansionNotFound(Coordinates), TaxonomyOverlayExpansionAmbiguousVendor(VendorDefinitionId, VendorVersion, Tenants), TaxonomyOverlayExpansionCopiesVendorNode(Code), and TaxonomyOverlayExpansionUnknownDesignation(VendorNodeCode) variants.",
    "Overlay vendor selection matches the requested vendor DefinitionId and vendorVersion across the interpreter's supplied registrations, independently of their tenant coordinate. Zero matches return a not-found result with an empty Tenant coordinate; multiple matches return their Tenants in the ambiguity result. There is no automatic latest-version lookup or history fetch.",
    "ResolvedTaxonomyOverlayDesignation(VendorNodeCode, Display, Description) carries the effective overlay-or-vendor values without rewriting the vendor definition. Overlay expansion appends the overlay's own codes after the selected vendor's codes and refuses an overlay-owned copy of a vendor code.",
    "TaxonomySuccessionResult has the shipped ResolvedTaxonomySuccession(Node) and TaxonomySuccessionRefusal(Code, Reason) variants. ResolvedTaxonomySuccession.HopCount is the number of successor edges followed; an already-active node has zero hops.",
    "TaxonomySuccessionRefusal.Reason is classification_unknown, successor_cycle, successor_missing, successor_depth_exceeded or successor_unknown. Code remains the original requested code. LastHopCode is null when the start was not resolved; missing, unknown-successor and depth refusals name the last resolved current node; a cycle names the source of the closing edge, not the repeated destination.",
    "Succession retains the existing guard order: cycle, active result, missing successor, depth bound, then successor lookup. At 64 followed edges an active terminal succeeds; a further edge refuses with successor_depth_exceeded. An already visited current node is classified as successor_cycle before the depth check; a new tombstoned current node reached at depth 64 with a non-null successor refuses with successor_depth_exceeded before following that successor, even if the edge would close a cycle. These defensive cases do not admit tombstoned successors into an authored definition.",
    "TaxonomyTraversalException.Code identifies the existing malformed-graph conditions taxonomy.definition_malformed, taxonomy.parent_unknown, taxonomy.parent_cycle and taxonomy.traversal_depth_exceeded. TaxonomyOverlayException.Code identifies taxonomy.overlay_reference_missing or taxonomy.overlay_designation_vendor_node_unknown. Existing argument exceptions remain argument guards, not additional taxonomy error identifiers.",
    "TaxonomyNodeChangeFields is the existing flags enum None=0, Display=1, Description=2, Status=4, ParentCode=8 and SuccessorCode=16. TaxonomyNodeChange(Code, Previous, Current, Fields) records the tracked differences; TaxonomyDefinitionChangeSet(AddedNodes, ChangedNodes, TombstonedNodes) preserves the current definition's iteration order and adds no deleted-node result.",
    "HopCount and nullable LastHopCode are existing nonpositional CLR properties with their existing defaults. This interface documents the shipped return shapes; it does not introduce a new constructor/deconstruction signature, serialized wire protocol or persisted-schema compatibility promise."
  ],
