{
  "schemaVersion": 1,
  "moduleId": "hlp.foundation.forms-engine",
  "interfaceRevision": 18,
  "status": "frozen",
  "purpose": "Own the complete tenant-scoped Dynamic Forms authoring admission, render, validate, calculate, protect, submit, audit, projection-outbox, and recovery behavior behind narrow caller interfaces and production-safe ports.",
  "dependencies": [
    {"moduleId": "hlp.contracts.forms", "minimumRevision": 7},
    {"moduleId": "hlp.contracts.identities", "minimumRevision": 1},
    {"moduleId": "hlp.contracts.fields", "minimumRevision": 1},
    {"moduleId": "hlp.foundation.actor", "minimumRevision": 6},
    {"moduleId": "hlp.foundation.forms", "minimumRevision": 7},
    {"moduleId": "hlp.foundation.rule-runtime", "minimumRevision": 2},
    {"moduleId": "hlp.foundation.tenancy", "minimumRevision": 1},
    {"moduleId": "hlp.kernel.core", "minimumRevision": 8},
    {"moduleId": "hlp.kernel.schema-validation", "minimumRevision": 1}
  ],
  "callerInterface": {
    "name": "IFormEngine",
    "operations": [
      "RenderAsync(formId, optionalInstanceId, cancellationToken) -> FormView",
      "ValidateAsync(formId, candidate, cancellationToken) -> ValidationResult",
      "SubmitAsync(request, cancellationToken) -> FormSubmitReceipt",
      "RecoverProjectionsAsync(maximumDeliveries, cancellationToken) -> FormProjectionRecoveryResult",
      "FormAcceptedCommandCancellation.CancelAsync(FormAcceptedCommandCancelScope(tenant, actor), commandId, cancellationToken) -> FormAcceptedCommandCancelResult (revision 16; constructed with an optional IFormAcceptedCommandEffects)"
    ],
    "context": "Every operation resolves tenant, Party, actor, current host-derived roles, and verified capability for the requested action from one per-request context provider. No caller may body-supply tenant, Party, actor, or roles."
  },
  "authoringInterface": {
    "name": "IFormDefinitionAuthoringPublisher",
    "operations": [
      "RegisterAndPublishAsync(draftDefinition, cancellationToken) -> publishedDefinition",
      "RegisterAndPublishWithImpactAsync(draftDefinition, FormPublicationAssessmentContext(basis, schemas, surfaces), cancellationToken) -> FormDefinitionPublicationResult(publishedDefinition, FormPublicationAssessment) (revision 18; a default interface member, so an existing implementation stays source-compatible and answers the assessment Unavailable)"
    ],
    "context": "The authoring host routes save-and-publish through one fail-closed boundary that compiles every Tier-2 rule and page guard, validates classification/lifecycle/access/residency/connector policy, admits configured shared field bindings under the authenticated caller and matching active tenant, and then commits registration plus publication through one atomic definition-store operation. Publication authorization remains host-owned. The revision-18 impact entry runs the same boundary and the same atomic operation and computes its compute-only ADR 0099 decision 7 assessment after admission and before the commit; the assessment never refuses, alters or follows up the publication."
  },
  "ownedPorts": {
    "submitGate": "IFormSubmitGateAccess.DecideAsync answers the form's own gate for one FormSubmitIntent (tenant, submitter, form id and version, schema reference, record_type_id target, operation id, decision instant, the evaluated Gate, and the request's CaseReference) with the host decider's own AuthorizationDecisionEvidence. AccessProviderFormSubmitGateAccess decides through AccessProvider.CheckWithEvidenceAsync on the FormSubmitGateAuthority request (provisional act forms:submit-gate on record kind form, id {formId}@{version}). The bool SatisfiesAsync member remains; the default DecideAsync answers from it with no evidence.",
    "recordTypePolicy": "IFormRecordTypePolicyReader (hlp.foundation.forms) resolves a targeted form's creation gate at submit. Forms never defaults a policy (K6): with no reader, a failing reader or an unknown type, a targeted submit is denied.",
    "recordCreation": "IFormRecordCreationDeclarations (hlp.foundation.forms; revision 15, K9): the host producers' declaration of the Record Type a form's submissions create, passed to FormEngine as recordCreations or, when that is null, implemented by the IFormProjectionSink itself (RecordCreationDeclarations.Select; InMemoryFormDefinitionStore applies the same rule to its recordCreationProducer). Under DI (N1), AddHarborlineFormsEngine registers the port as the registered sink, with the sink's lifetime, when the host registered no explicit port and the sink's implementation type or instance implements it, so a DI-built definition store and the engine read one declaration; a factory-registered sink cannot be inspected and needs an explicit port.",
    "fieldBindings": "Optionally resolve the host's admitted field-kind and constraint bindings for the exact tenant and SchemaRef. A configured binding source requires both shared runtime ports and refuses missing, mismatched or incomplete bindings rather than using an unbound fallback.",
    "requestContext": "Resolve one current authenticated tenant/Party/actor/roles scope and verify the operation capability; preserve the pinned Forms macaroon wire/HMAC chain, require one action-bound Harborline identifier plus exactly one matching action caveat so an actionless legacy token cannot gain authority through holder attenuation, reject malformed, expired, unknown, duplicate, empty, or missing capability material with one opaque denial, and discard bearer roles before current-role authorization.",
    "fieldSecurity": "Resolve inherited form/section/container/field governance over the reuse-expanded definition; refuse unknown policy, impossible residency, ineligible jurisdiction, and missing subject scope. Apply tenant-bound versioned AES-256-GCM protection-at-rest, decrypt permission, and redaction. Return typed per-field dispositions; only the engine constructs readable JSON, and inconsistent adapter output fails closed.",
    "submissionTransaction": "Atomically commit one immutable submission, one mutation audit envelope, and one projection outbox envelope; bind idempotency to tenant, form, key, and canonical accepted-candidate fingerprint. The built-in production adapter uses a versioned append-only file journal with authenticated headers and checksummed payload frames, preflights unique identities, flushes each complete frame to durable storage before updating indexes, truncates only an authenticated incomplete final frame, and fails startup on corruption or unknown versions.",
    "readAudit": "Append typed per-field policy-read and decrypt evidence. Each decrypt grant is audited before that field's cleartext is released; a grant-audit failure withholds only that field, while denial-audit failure remains fail-closed.",
    "acceptedCommands": "Revision 16 (plan W6/W7, ADR-0110 accepted 2026-10-12): IFormAcceptedCommandStore is the accepted-command lifecycle of a submission store (LeasePendingAsync(maximum, FormProjectionLeaseKinds), LeasePendingProjectionAsync, GetAcceptedCommandAsync, ClaimAcceptedCommandAsync, CancelAcceptedCommandAsync, RefuseAcceptedCommandAsync, RecordBindingFailureAsync, QuarantineAcceptedCommandAsync, AbandonQuarantinedCommandAsync), the one durable fence execution and cancellation contend on; both built-in stores implement it. IFormProjectionSink.DeliverAcceptedAsync(FormAcceptedCommandDelivery(workerId, envelope, claimed command)) executes one claimed command as the configured worker (default: NotSupportedException, so a sink not built for accepted commands leaves them pending and never replays them as the submitter); FormProjectionDeliveryResult.TerminalRefusal reports a terminal refusal. FormEngineOptions.AcceptedCommandWorkerId is the worker identity (host configuration; null executes no accepted command).",
    "publishedSurfaces": "Revision 18 (T-688): IFormPublishedSurfaceSource.ReadAsync(FormPublicationBasis, cancellationToken) -> FormPublishedSurfaceRead, either Complete(tenant, FormPublishedSurface rows: tenant, surface definition id, exact opaque VersionId, semantic Version, observed body Digest and the ordinal unique BlockIds pinned to the predecessor) or Unavailable(reason). The port is read-only: an implementation must not publish, restore or rebind a surface, and a complete read is an observed exact-tenant census, not a cross-store atomic snapshot. The IServiceProvider extension FormPublicationContext(basis) composes a FormPublicationAssessmentContext from the registered ISchemaRegistry and IFormPublishedSurfaceSource; AddHarborlineFormsEngine registers no surface source and no new mandatory port, and Forms ships no implementation (hlp.blocks.layout-runtime revision 10 supplies the opt-in Layout census).",
    "projectionDelivery": "Lease one self-contained durable outbox envelope with tenant, Party, actor, form/version, instance, case reference, accepted protected values, and the engine submit instant. Suppress concurrent in-process delivery, release leases on cancellation/failure, and require sink idempotency for crash-boundary retries. Return typed reason/field/target skips; pending and failed rows remain recoverable after a new engine/adapter instance starts."
  },
  "capabilities": {
    "render": ["load current published definition", "resolve bounded reusable references", "enforce section and field read roles", "project nested items and layout", "decide page visibility through Rules guards", "evaluate calculations and presentation rules", "withhold ciphertext", "decrypt only with current capability and successful audit"],
    "validate": ["candidate byte ceiling", "schema lookup and stable errors", "rule evaluation", "hidden/read-only pruning", "calculated accepted values", "authorization failures", "provider and rule timeouts fail closed"],
    "submit": ["check the form's own submit gate on the published head before resolving anything else", "section and field write authorization", "protect classified and undeclared values", "canonical request fingerprint", "idempotent receipt", "atomic submission/audit/outbox", "one submit instant", "accepted/pruned projection values", "case reference", "explicit projection status"],
    "recovery": ["lease pending outbox rows", "idempotent delivery", "complete or retry", "restart recovery", "duplicate-attempt suppression"]
  },
  "invariants": [
    "Revision 14 (decision D3, W5): for a form with a record_type_id target, submit is denied unless the gate port returns evidence that the host decider produced for exactly the asked intent (act, submitter, tenant, form revision and instant), with an echoed intent equal to it and a verdict equal to the evidence's; the evidence is then bound to the staged commit (operation id, instance, tenant, submitter, form revision, accepted-payload fingerprint) inside the kernel transaction, and the reuse-resolved definition must keep the head's revision, schema reference, target and gate. A form_only or engine target with no gate, an engine target with any gate, or an unresolvable policy (no reader, failing reader, unknown type) denies before any port, reuse or persistence. The intent also names the evaluated gate and the request's case reference; the binding check covers schema reference, record type target and case reference on the submission and projection rows, which now persist the schema reference and target (journal format 2; format 1 frames load with them absent; a format-1-only reader refuses format 2). On an idempotent replay the authorization is attached only when the stored write (returned by the store as FormSubmissionCommitResult.Stored) has the same tenant, submitter, form id and version, schema reference, target, case reference and payload fingerprint; otherwise the replay refuses with form.engine.idempotency-conflict and discloses nothing, and a store that returns no stored write is denied. Every replay, with or without an authorization, also requires the stored write's tenant and submitter to equal the current caller's, or refuses with form.engine.idempotency-conflict and discloses no receipt (D4: a caller-triggered retry needs current authorization before receipt disclosure; R2-7). The receipt carries the bound FormSubmitAuthorization when evidence was returned (never stored); a gate denial bound to the intent carries the decider's evidence on FormEngineDeniedException, and evidence for any other request is withheld. A form without a target keeps the verdict-only path and its single in-scope clock read when ungated.",
    "Revision 15 (K9, approved 2026-10-10): before the submit gate, the producers' declaration is resolved for the published head's form id, from recordCreations or else the projection sink when it implements the port (RecordCreationDeclarations.Select, the definition store's rule too). A failing, malformed or ambiguous declaration denies, and so does a head whose target is not exactly the declared type, including a head with no target: K9 permits a legacy mapping only where a compatibility contract permits it, and Platform defines none (it has no legacy Records-creating form), so a targetless declared head is refused until migrated, before any policy read or gate decision, whatever its gate or the type's policy. Binding a mapped type into an accepted command is a W8 dependency. A head targeting its declared type follows the revision-14 target rules, and a role type adds no gate (D1). Forms declared to create nothing keep their behaviour. Nothing is persisted on any denial.",
    "Revision 16 (plan W6, ADR-0110 decision 1; readings accepted 2026-10-12, isolated in FormAcceptedCommandReadings): a submit whose published head targets a Record Type whose creation gate is form_only (open item 11 reading) is a durably accepted Records command. The submission store must implement IFormAcceptedCommandStore, or the submit refuses form.engine.provider-unavailable before the gate is asked. Its submit gate is decided inside the acceptance transaction, after the store scope opens and before it commits (decision 1 revocation-ordering reading, FormAcceptedCommandReadings.DecideAcceptanceInsideTransaction), with reuse resolved after the decision, so a revocation committed first on the store's scope refuses the acceptance and one committed afterwards does not cancel it (decision 3); every other submit keeps its gate before the transaction (ADR-0100 decision 3 untouched for ordinary work). Under this reading the host decider runs while the store scope is held: it must not open its own KernelTransactionBoundary execution (the boundary refuses the nesting and the submit is denied, failing closed) and should be fast. The one atomic commit carries the submission, the audit with the gate's own evidence as FormMutationAuditEnvelope.AuthoritySnapshot (staged as KernelAuditEvidence.AuthoritySnapshot, shared AuthoritySnapshotEncoding grammar), and the delivery row with FormProjectionEnvelope.AcceptedCommand: command id = outbox id, operation id = the committed instance id (open item 3 reading, server-derived), record type = the target, payload fingerprint and acceptance instant = the submission's, acceptance snapshot = the audit's, state Pending; the store refuses any disagreement before anything is stored. Journal format 3 carries the command and its claim, cancel and refuse frames; frames without a command stay format 2, a format-2 reader refuses a journal holding a command, and a command-bearing commit labelled with an older format is refused on replay. The receipt never carries the snapshot. A role target's submit is not an accepted command (D1).",
    "Revision 16 (plan W7, ADR-0110 decisions 2 and 4): an accepted command is never delivered through DeliverAsync or as the submitter. It executes only as FormEngineOptions.AcceptedCommandWorkerId, at submit when configured and otherwise through RecoverProjectionsAsync (the job-scoped context authorizes running recovery; the configured worker is the executor). One path: a worker equal to the submitter never executes (pending, form.engine.accepted-command.worker-is-submitter); every stored binding is validated again (command id = outbox id, operation id = instance, target, instant, schema reference; the stored submission's submitter, Party, form revision, schema, target, payload fingerprint, instant and exact protected values; the form revision's own target and schema; an acceptance snapshot that is the submitter's allowed decision in the row's tenant decided at or before acceptance), and a mismatch settles a pending command Refused (records.command.binding_mismatch or records.command.not_accepted) before any claim or effect, never retried, while a claimed command (whose interrupted run may have committed its effect) is neither refused nor executed and stays pending with that code; then the durable claim (open item 1 reading: the fence is a claim before any effect); a cancelled, completed or refused command is not executed; then DeliverAcceptedAsync. A TerminalRefusal settles it Refused; a thrown failure leaves it claimed and pending, and recovery executes it again, idempotently on the original operation, so a delegate or second worker never inserts twice. CompleteProjectionAsync completes an accepted row only after its claim. Receipts report FormProjectionStatus.Refused or Cancelled for a settled command, including a submit whose command a cancel settled first; FormProjectionRecoveryResult.Settled counts commands a run settled without completing. Recovery with no configured worker does not lease accepted commands, so they never starve ordinary projections.",
    "Revision 16 (the owner's cancellation rule, ADR-0110 decision 5): FormAcceptedCommandCancellation decides records.command.cancel (FormAcceptedCommandAuthority.CancelAct, kind accepted-command, id the command id, the scope's tenant; area:verb mapping open item 4, administrator grant open item 5) through AccessProvider before anything is read; a denial returns the gate's reason and evidence and changes nothing. The cancel then contends on the store fence: a pending command becomes Cancelled durably with the cancel decision's authority snapshot, leaves the pending pool and its receipt reports Cancelled (records.command.cancelled); a retry is idempotent (Replayed); a claimed, completed or refused command is records.command.cancel_too_late; another tenant's or an unknown command is records.command.not_found; an infrastructure failure throws form.engine.provider-unavailable and leaves the command pending and the cancel retryable, and execution may win the fence meanwhile (open item 10 reading). Every Platform consumer (submit-time execution and recovery, one path) honours cancelled at the claim; enabling cancellation for a tenant is a host decision (held). Codes other than cancel_too_late are provisional (open item 7).",
    "Revision 16 also: (M1) a cancellation and a refusal are each audited through the existing audit contract: IFormAcceptedCommandStore.CancelAcceptedCommandAsync(tenant, commandId, KernelAuditEvidence) and RefuseAcceptedCommandAsync(commandId, expectedState, code, KernelAuditEvidence) validate the evidence (no originator; a cancel carries the cancel decision's snapshot) and store it as one more FormMutationAuditEnvelope of the submission in the same atomic transition (one journal frame), payload op accepted-command-cancelled or accepted-command-refused with command id, operation id, type, code and after_claim, never a value; an idempotent retry adds no audit; a refusal applies only in the expected state (L2). (M2) A pending command with a broken binding is refused at once; a claimed one is never executed and is quarantined, never refused, at FormEngineOptions.AcceptedCommandBindingRetryLimit (default 3) binding failures (R2-M1 and R2-L1; revision 17 corrects this sentence), audited with after_claim true. Both built-in stores lease least recently enqueued first (R2-L4; revision 17 corrects this sentence), so failing rows never starve later ones; IFormAcceptedCommandStore.LeasePendingAsync(maximum, FormProjectionLeaseKinds) selects kinds. A sink claims and executes accepted commands only when IFormProjectionSink.ExecutesAcceptedCommands is true (default false), so a sink that cannot execute one never claims it and it stays cancellable. Recovery never delivers a targeted row without a command (a role target, or a pre-revision-16 row): that would act as the submitter outside the submitter's request (review I-1, fail closed). (M3) FormAcceptedCommandEvidence.IsAcceptance binds the acceptance snapshot to the command's own decision: kind Gate, act forms:submit-gate, target form/{formId}@{version}, the submitter and tenant at the top level and in the act stage, verdict allowed, and at: exactly equal to FormAcceptedRecordCommand.AcceptanceDecidedAt (at or before acceptance); it is applied at acceptance (a decider spelling the act or target otherwise is denied) and before execution; the command also names AcceptanceAuditId. (M4) IFormAcceptedRecordBodies (constructor recordBodies, else a sink that implements it) maps the accepted values to the Records body and returns its records-write-intent/1 digest; it is required for a form_only acceptance (else form.engine.provider-unavailable before the gate) and bound as BodyDigestEncoding and BodyDigest. (M5) Inside the submit transaction a call back into a built-in store from the same flow throws FormEngineStoreReentrancyException (form.engine.store-reentrant), surfaced as is when it comes from the acceptance decider; a decision inside the acceptance past FormEngineOptions.AcceptanceDecisionTimeout (default 5 s) is abandoned with form.engine.resource-bound and the scope released. The decider contract (no writes, no own transaction, current grants on the acceptance connection, bounded) is a W10 acceptance criterion.",
    "Revision 16 also: (R2-M1, DES-0029 section 9, owner ruling 123) a claimed command is never made terminal while an earlier run may have committed its Records effect. FormAcceptedCommandState.Quarantined is audited and non-terminal: IFormAcceptedCommandStore.QuarantineAcceptedCommandAsync(commandId, code, KernelAuditEvidence) moves only a Claimed command, commits the audit (op accepted-command-quarantined, after_claim true) in the same transition (journal frame type 7, format 3), keeps the row in the pending pool and the receipt pending, and the row is never leased again. A claimed command is quarantined when its stored binding stays broken for FormEngineOptions.AcceptedCommandBindingRetryLimit binding failures, or when the Records execution refuses it after a resumed claim; a Records refusal on the run that made the claim stays a terminal refusal (no earlier run existed). A cancel of a quarantined command is records.command.cancel_too_late unless the host's IFormAcceptedCommandEffects (FindAsync(FormAcceptedCommandEffectQuery(tenant, command)) -> Unknown, Committed or Absent; optional FormAcceptedCommandCancellation constructor argument; no Platform implementation) answers Absent, meaning the effect did not commit and cannot still commit; then IFormAcceptedCommandStore.AbandonQuarantinedCommandAsync cancels it with the cancel decision's snapshot, audited with after_claim true (frame type 9). (R2-L1) Only binding failures count toward the limit: IFormAcceptedCommandStore.RecordBindingFailureAsync(commandId, code) increments FormAcceptedRecordCommand.BindingFailures and records the attempt atomically (frame type 8); infrastructure failures, a worker equal to the submitter and a form revision that is not found (now an infrastructure failure, never binding_mismatch) do not count. (R2-L2, D4 and K2) A targeted row without an accepted command (a role target) whose inline delivery failed stays pending and is redelivered only inside its own submitter's idempotent replay, after that request's current authorization and the existing submitter check, through IFormAcceptedCommandStore.LeasePendingProjectionAsync(tenant, outboxId); each failed attempt is recorded on the row, recovery never delivers it and another caller's replay conflicts. (R2-L3) The mapped-body digest port is held to AcceptanceDecisionTimeout like the decider (form.engine.resource-bound, its token cancelled, the scope released). (R2-L4) Both stores lease least recently enqueued first: a row enters the queue at its commit and re-enters at the back after every failed attempt (retry or binding failure; a lease release keeps its place), from a store-local sequence the journal rebuilds from its frame order, so a row that keeps failing yields to every row waiting at its failure (M2) and a waiting row only moves forward, so no row waits forever; a lease is exclusive and does not expire while its holder runs, which the run-that-made-the-claim rule relies on (a W10 store with expiring leases must fence a stale holder). (R2-L5) The audit payload spellings are single named constants (FormAcceptedCommandAudit), accepted 2026-10-12 under open items 4 and 7.",
    "Revision 16 also: a quarantined command leaves quarantine as completed only through FormAcceptedCommandResolution(submissions, IFormAcceptedCommandEffects, clock, workerId).ResolveAsync(tenant, commandId) -> FormAcceptedCommandResolveResult(Completed, Unresolved, NotQuarantined or NotFound; the lookup's answer): it asks the host's receipt lookup and only on Committed calls IFormAcceptedCommandStore.ResolveQuarantinedCommandAsync(tenant, commandId, KernelAuditEvidence), which moves Quarantined to Completed, settles the row, reports the receipt Complete and commits the audit (op accepted-command-resolved, the quarantine code, after_claim true) in the same transition (journal frame type 10, format 3); any other answer changes nothing, and an Absent effect is resolved by an audited cancel, never here. CompleteProjectionAsync refuses any accepted-command row that is not Claimed, including a quarantined one, and journal replay refuses such a completion. The resolver is run by the host as its configured worker identity and decides no permission (it creates no Records effect); an infrastructure failure throws form.engine.provider-unavailable and changes nothing.",
    "Revision 17 (text only: review F1, F4 and F5 of the revision-16 findings and the stale M2 sentence, lead decision 2026-10-13; no operation, port member, error code, persisted shape or audit spelling changes): (F1) a submit whose published head targets a Record Type (a role target, or a form_only one) refuses form.engine.provider-unavailable when the submission store does not implement IFormAcceptedCommandStore, after the revision-14/15 record-creation admission and before the submit gate is asked, reuse is resolved or anything is written. The refusal includes an idempotent replay of an existing targeted submission, which then discloses no receipt, also for a submission committed on that store before this refusal: the base port has no read by idempotency key, so a replay cannot be told from a new submit before the gate, and the revision-16 form_only refusal behaves the same way. It fails closed (I-1): without the port a role target's failed inline delivery has no redelivery path (R2-L2), and recovery never delivers it. (F5) Recovery on a store without the port leases through IFormSubmissionTransactionStore.LeasePendingAsync, which admits every kind; a targeted row without a command that it leases (one written before revision 16, or before the F1 refusal) is still never delivered, and is rotated with RetryProjectionAsync under form.engine.projection-pending, recording one attempt, instead of being released in place. A store with the port leases by kind, so it hands over no such row, and releases a stray one in place. The base port's LeasePendingAsync defines no order, and none is required of a host store: the rotation keeps these rows from filling every batch ahead of deliverable rows only on a store that leases a row with a newly recorded attempt behind the rows already waiting, as both built-in stores do (R2-L4). On a host store whose order ignores recorded attempts such rows can still fill every batch; that is a documented limit of this revision. (F4) The M1 clause's lease-order sentence formerly read: lease by attempts, then submit instant, then outbox id. Neither built-in store implements that order; the sentence now names the R2-L4 order. (M2) The M1 clause's claimed-command sentence formerly read: a claimed one is never executed and is refused after FormEngineOptions.AcceptedCommandBindingRetryLimit (default 3) attempts. No code refuses a claimed command for a broken binding; at the limit it is quarantined, as R2-M1 states.",
    "Revision 18 (T-688, ADR 0099 decision 7; additive: no existing operation, port member, error code, persisted shape or audit spelling changes): IFormDefinitionAuthoringPublisher.RegisterAndPublishWithImpactAsync admits the Draft exactly as RegisterAndPublishAsync does, then FormPublicationImpactAssessment.AssessAsync(candidate, IFormDefinitionStore, context) computes the assessment, then the one atomic register-and-publish commits, and FormDefinitionPublicationResult returns the committed revision with the assessment. No outcome refuses or changes the publication: Block is a compatibility result, not a lifecycle refusal, and there is no migration approval or new error code. The context's FormPublicationBasis carries host-attested FormPublicationBinding values for the candidate and the exact predecessor (tenant, Form id, semantic Version label, a distinct nonblank opaque VersionId supplied by the owning writer, and trusted Provenance), NoPredecessor (true only for a declared first publication, never inferred from a failed lookup) and the candidate and predecessor FormPublicationEnvironment (the recorded BorrowerEnvironmentDeclaration with its provenance, or explicitly unknown); declaration collections are copied before any provider is awaited. No opaque identity is derived from a semantic label, and host provenance is a trusted composition input, not cryptographic authenticity. The assessor reads the actual current and exact predecessor Forms revisions and both SchemaRef bodies from the registry and applies the decision 7 table as FormPublicationCompatibility: an additive optional field or a presentation-only change (titles, descriptions, labels, help text, control hints, section and page titles, layout and placement, wizard review and confirmation chrome) is ProposalEligible; a changed field identity, a removed field, or a type, rule, submit gate, lineage, async check, aspect, wizard callback or redirect, or environment change is AuthorResolution; a newly required field without a default or a changed captured record type is Block, and Block takes precedence. Only an eligible assessment with a known predecessor carries a FormRepublishProposal (the predecessor and candidate bindings and the exact impacted surface versions, never a latest-head reference); it is data, and no component applies it. Missing, mismatched, unknown, failed or unsupported input returns FormPublicationAssessment.Unavailable with no compatibility, surfaces or proposal, never a healthy empty set: a basis that does not match the candidate, an unknown environment, a predecessor that is not the current published head, a schema outside the first interpreter's explicit flat object of primitive fields (references, composition, nesting, patterns, unknown dialects, malformed keyword values and constrained defaults are unsupported), and an incomplete, wrong-tenant or malformed census. Its reasons (publication_basis_unavailable, predecessor_basis_unavailable, predecessor_mismatch, schema_unavailable, surface_census_unavailable, assessment_input_unavailable, publisher_assessment_unsupported) are local diagnostics, not wire codes, and expose no exception text or body. RegisterAndPublishAsync keeps its behaviour and produces no assessment. Shipping writer emission of historical identity and environment, latest-compatible surface selection for new instances and the required record_type_id rollout (T-484, T-485) are not part of this revision.",
    "Decision D3 / plan W5: a submit whose scope names an engine or reserved principal (exact system, or the sys., system: and installer: prefixes, case-insensitive) is denied with the generic form.engine.denied before the form is loaded, whatever context provider produced the scope.",
    "Submit checks the form's own submit gate on the published head through the host's IFormSubmitGateAccess port, which receives the shared hlp.contracts.authorization SubmitGate (T-755), before reuse, bindings or the candidate are resolved; a declared gate with no port, an unsatisfied gate or a failing port refuses with the generic denial and writes nothing.",
    "Render decides each declared page's visibility through its Rules guard in the Render phase, over the same sensitive-stripped candidate its field rules read with resolved computed values materialised first, and projects the verdict, never the guard; a guard that does not evaluate hides its page.",
    "Bound fields use the shared field runtime for complete-membership narrowing, inherited domain authority, kind-limit execution and readable-domain editor choice; author-carried ControlHint does not select the rendered editor, including for unbound schemas.",
    "Unreadable or withheld fields expose neither permitted values nor a derived editor. Shared required, multiplicity, domain and kind validation receives the accepted candidate without rewriting its numeric spelling, and preserves neutral field.* refusals at escaped RFC 6901 pointers.",
    "Unknown, inactive-tenant, cross-tenant, and absent instances are indistinguishable at the caller interface.",
    "Render, validate, and submit use the same current published and reuse-resolved effective definition revision for one operation.",
    "Current Okta/OIDC roles are resolved per request and are never accepted from a bearer payload or cached in a singleton engine.",
    "Each current-request bearer carries one action-bound Harborline identifier and exactly one matching read or write caveat; legacy identifiers and multiple actions deny because additive source semantics otherwise let a bearer holder widen authority by continuing the HMAC chain.",
    "The current-request capability adapter handles read, validate, and submit only; unattended projection recovery requires a separately registered job-scoped execution-context adapter because the pinned source defines no recovery bearer action.",
    "Schema and rule provider timeouts fail closed; a rule timeout can never fall back to schema-only acceptance.",
    "Only accepted values after authorization, pruning, and deterministic calculation enter protection, persistence, audit, and projection envelopes.",
    "Sensitive cleartext never enters mutation audit or projection payloads and is never rendered when protection, policy, capability, or read-audit providers fail.",
    "Encryption and authorization use separate domains: encrypted-field-aes for tenant key selection and forms-decrypt-on-render for short-lived decrypt authority.",
    "Protected envelopes bind tenant, form, definition version, instance, and field as authenticated data; malformed envelopes, unknown suites or key versions, wrong-tenant capabilities, expired capabilities, and authentication failures are withheld.",
    "Rule projection never receives decrypted sensitive values, preventing a computed field from laundering decrypted input into an unclassified output.",
    "A successful submit makes submission, mutation audit, and outbox durable atomically or makes none of them durable.",
    "The same idempotency key with the same canonical request fingerprint returns the original receipt; a different fingerprint conflicts.",
    "Receipt, mutation audit, and outbox share exactly one engine submit instant.",
    "The atomic outbox carries the resolved submission context and only accepted calculated/pruned values; projection adapters never receive the original candidate.",
    "Projection skips are typed value-free outcomes with reason, field pointer, and optional target; infrastructure failure is pending, never a skip.",
    "Outbox delivery is retryable across engine restarts; the store suppresses concurrent in-process attempts and the projection sink must make crash-boundary retries idempotent so duplicate attempts produce one observable effect.",
    "The built-in durable submission adapter holds one exclusive process lock for its lifetime and is a single-process/single-node adapter; it does not claim distributed leases or multi-node high availability.",
    "Production composition fails at startup when any mandatory persistence, security, audit, projection, or selected request-context adapter provider is missing; a job-scoped recovery context does not require browser bearer ports.",
