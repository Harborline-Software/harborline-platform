{
  "schemaVersion": 1,
  "moduleId": "hlp.foundation.actor",
  "interfaceRevision": 2,
  "status": "frozen",
  "purpose": "Expose authenticated actor resolution and Access set filtering, predicate-time row checks, admitted scope evaluation and stored trace projection/read contracts. The host authorization gate remains the sole decider; audit storage and HTTP remain host adapters.",
  "dependencies": [
    {"moduleId": "hlp.contracts.identities", "interfaceRevision": 1},
    {"moduleId": "hlp.foundation.tenancy", "interfaceRevision": 1},
    {"moduleId": "hlp.foundation.rule-runtime", "minimumRevision": 1}
  ],
  "types": {
    "ICurrentUser": {"members": ["string UserId", "IReadOnlyList<string> Roles"]},
    "IAuthenticatedActorContext": {
      "extends": ["ICurrentUser", "Harborline.Foundation.MultiTenancy.ITenantContext"],
      "members": []
    },
    "IPrincipalPartyResolver": {
      "members": ["ValueTask<Guid?> ResolveAsync(string userId, TenantId tenantId, CancellationToken cancellationToken)"]
    },
    "IPartyContext": {
      "members": ["ValueTask<Guid> GetCurrentPartyIdAsync(CancellationToken cancellationToken)"]
    },
    "PrincipalPartyResolutionFailure": ["NoAuthenticatedPrincipal", "TenantUnresolved", "TenantSentinel", "PartyNotProvisioned"],
    "PrincipalPartyResolutionException": {"members": ["PrincipalPartyResolutionFailure Failure"]},
    "IAuthorizationDecider": {"members": ["DecideAsync(AccessRequest, CancellationToken) -> AuthorizationDecisionEvidence; adapter to the existing host gate"]},
    "IAccessSetFilter": {"members": ["Bind(operation, principal, tenant, recordKind, instant) -> AccessSetPredicate"]},
    "AccessProvider": {"members": ["CheckAsync(request) -> AccessCheck", "ValidateAsync(request, validationAtSameInstant) -> AccessCheck"]},
    "AccessScopeEvaluator": {"members": ["Evaluate(expression, request, admittedAuthority) -> AccessCheck"]},
    "AuthorizationDecisionEvidence": {"members": ["Project() -> four immutable AuthorizationTraceStep values; verdict supplied only by the enforcing gate"]},
    "IAuthorizationTraceStore": {"members": ["FindAsync(tenant, entryId) -> stored AuthorizationTraceSnapshot or absence"]},
    "AuthorizationTraceReader": {"members": ["ReadAsync(tenant, caller, entryId, instant) -> Available | NotAvailable | Refused | PreDecisionRefusal"]}
  },
  "operations": [
    {
      "id": "party.resolve-current",
      "input": "IAuthenticatedActorContext plus IPrincipalPartyResolver",
      "result": "server-derived Guid PartyId for the exact (Tenant.Id, UserId) pair"
    }
  ],
  "selectedDesign": {
    "choice": "narrow authenticated-actor composite",
    "rejected": "Inject ICurrentUser and ITenantContext independently into PartyContext.",
    "reason": "One composite instance makes same-authentication-scope user and tenant derivation structural without reintroducing authorization-policy members from the legacy sum interface."
  },
  "invariants": [
    "UserId and Roles are host-derived current-principal values; Roles may be empty but UserId must be non-blank before party resolution.",
    "The tenant and user used for party resolution come from one IAuthenticatedActorContext instance.",
    "PartyId is server-derived; no public operation accepts an acting, worker, approver, or other caller-supplied PartyId.",
    "An unresolved, default, or system-sentinel tenant fails before the resolver is called.",
    "An unmapped or cross-tenant principal fails closed as PartyNotProvisioned.",
    "Cancellation is forwarded to the resolver.",
    "Roles do not authorize operations in this module; the existing host gate remains the sole decider.",
    "Scope evaluation requires exact principal, tenant, record and instant authority and declared references before calling the shared evaluator once.",
    "The Access predicate filters the complete candidate set before counts, groups, sums, exports or pages.",
    "Validation executes a fresh row check at its predicate instant; stage-one evidence cannot substitute for it.",
    "Evidence projection never calculates a verdict. Trace reads authorize the current read and return frozen historical steps and counterfactual without replay.",
    "Unauthorized reads hide existence; no decision is absence; pre-decision refusal is distinct from a four-step decision."
  ],
  "notScope": [
    "grant union, binding intersection, roster policy or a second authorization verdict calculator",
    "audit-store implementation, HTTP adapters and Access administration",
    "OIDC or Okta token validation",
    "session establishment and persistence",
    "People or Party persistence",
    "in-memory production mappings and dependency-injection registration",
    "principal-kind resolution",
    "the legacy authorization ITenantContext sum interface"
  ],
  "projectionPolicy": {
    "dotnet": "canonical implementation",
    "react": "session consumer",
    "blazor": "consumer through authenticated host scope"
  },
