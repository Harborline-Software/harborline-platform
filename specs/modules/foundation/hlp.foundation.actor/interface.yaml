    "The Access predicate filters the complete candidate set before counts, groups, sums, exports or pages.",
    "Validation executes a fresh row check at its predicate instant; stage-one evidence cannot substitute for it.",
    "CheckWithEvidenceAsync is the same row check as CheckAsync with the decider's own evidence returned: the decider is called once, an invalid context never reaches it, and evidence naming any other principal, tenant, instant, operation, record kind or record id is withheld and refuses access.decision_mismatch. It calculates no verdict; a writer persists the returned evidence through its host trace plumbing (revision 4).",
    "A typed Records target (AccessRecord.RecordTypeId, revision 5, plan W9) is a request context field: a blank one refuses access.context_invalid before the decider, and evidence whose RecordTypeId differs ordinally from the request's, including a dropped or an added type, is withheld and refuses access.decision_mismatch. Untyped requests are unchanged, and the type adds no trace fact.",
    "Evidence projection never calculates a verdict. Trace reads authorize the current read and return frozen historical steps and counterfactual without replay.",
