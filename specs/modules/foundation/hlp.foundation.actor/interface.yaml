  "selectedDesign": {
    "choice": "narrow authenticated-actor composite",
    "rejected": "Inject ICurrentUser and ITenantContext independently into a host party adapter.",
    "reason": "One composite instance makes same-authentication-scope user and tenant derivation structural without reintroducing authorization-policy members from the legacy sum interface."
