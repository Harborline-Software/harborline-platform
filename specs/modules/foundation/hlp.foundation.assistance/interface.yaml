{
  "schemaVersion": 1,
  "moduleId": "hlp.foundation.assistance",
  "interfaceRevision": 2,
  "status": "draft",
  "purpose": "Own the Assistance composition's AssistanceDefinition (DES-0026, DefinitionKind.Pilot): its envelope, canonical JSON, phase-aware structural intent admission and the reserved content-kind pack entry. Assistance owns no primitive row and no second action catalogue; the binding narrows the Workflows-owned catalogue it references.",
  "dependencies": [],
  "callerInterface": {
    "name": "AssistanceDefinitionJson / AssistanceDefinitionAdmission / AssistanceDefinitionPackExporter / AssistanceDelegationJson / AssistanceProposalDigest",
    "operations": [
      "AssistanceDefinitionJson.SerializeCanonical / Deserialize -> canonical snake_case, ordinal-sorted, newline-terminated UTF-8 JSON; unknown members refuse; a missing or null required member refuses at deserialize rather than reaching admission",
      "AssistanceDefinitionAdmission.Validate(definition, phase, window, commands, previous) / AdmitJson(body, phase, window, commands, catalogue, previous) -> the complete refusal list at the Author, Publish and Install boundaries against the required host DefinitionContractWindow: an envelope contract that is missing or outside the host window (definition.contract.missing or definition.contract.out_of_window at /envelope/contract, T-572), unresolved command references, a lowered classification tier or a widened args schema/recipient set against `previous`, an invalid or missing NEVER archetype/justification, a duplicate command id, and envelope/version/schema-version shape",
      "AssistanceDefinitionPackExporter.Export(definition, window, commands) -> the reserved content-kind pack entry of canonical bytes after Publish admission",
      "Catalogue comparison at Author, Publish and Install: refuse unexported entries, tiers below the catalogue, argument schemas not provably at least as strict, and recipients outside the intersection of all referenced entries permitted sets. Previous-version schema narrowing uses the same bounded fail-closed checker.",
      "AssistanceDelegationJson.Deserialize<T> / SerializeCanonical<T> -> strict snake_case proposal, delegation, disposition and standing-approval wire shapes; unknown, duplicate, missing and invalid members refuse with JsonException. Proposal serialization uses RFC 8785 ordinal UTF-16 key order at every depth, preserves array order, and emits compact UTF-8 without a newline.",
      "AssistanceProposalEnvelope = {schema: pilot.proposal/3, surface, command, args}; AssistanceProposalDigest.Compute -> sha256: plus lowercase hex SHA-256 of its canonical bytes. Integers anywhere in args must be within -9007199254740991 through 9007199254740991; strict deserialization, serialization and digesting refuse outside that range with args-integer-out-of-range. Admitted integers serialize exactly without double conversion; arguments are never coerced (M11 2026-11-12, RFC 7493 section 2.2).",
      "The proposal digest identifies the strictly validated envelope as received, including any command alias and unchanged args (M11, merged control 1373). The shared fixture pins alias digest literals, duplicate raw-JSON refusals and canonical bytes for runtime shapes in both lanes.",
      "AssistanceDelegationRecord = {subject, actor, disposition}; actor is null for a hand-performed act, otherwise exactly {binding_key, binding_version, provider_id, model_version, proposal_digest}, never proposal content or context.",
      "Actor proposal_digest refuses at parse unless it is sha256: plus exactly 64 lowercase hex digits. The other four fields get no added grammar or length bound; host copies from the bound definition and registered-floor provider/model literals, and actor-to-binding matching, belong to T-613 minting (M11 control 1378). Required nonblank strings use the shared 25-character ECMA-262 WhiteSpace plus LineTerminator set from T-1107/R-0125, not IsNullOrWhiteSpace: U+0085 alone admits unchanged and U+FEFF alone refuses.",
      "AssistanceDisposition is either {kind: approve|dismiss|clarify|reject} or {kind: standing, approval_id, approver, scope, expires_at}; AssistanceStandingApproval = {id, approver, binding_key, scope: {surface, commands[]}, schedule, expires_at, revoked_at}. Approver and nonempty scope.commands are required. expires_at is a required UTC ISO 8601 instant; revoked_at is a UTC instant or null; schedule is a nonempty RRULE string or null, preserved without expansion. Act-time coverage belongs to T-613."
    ],
    "context": "Bindings are portable pack content stored in the shared builder-definitions catalogue; this package owns their typed shape, canonical JSON and structural admission, never a store, never the Workflows-owned action catalogue, and never a provider or proposal runtime. Command references are resolved through injected ICommandCatalogueRegistry entries carrying CommandId, ExportingPackage, Exported, Tier, ArgsSchema and PermittedRecipients. This entry shape is the seam T-612 fills from the released command-authority artifact (ADR 0096 ruling 5f); this module does not read that artifact. Proposal, digest, delegation, disposition and standing-approval wire shapes agree with hlp.copilot.contracts through conformance/hlp.copilot/delegation-cases.json. No dispatch receipt has a wire form or is minted here; no runtime wire shape travels in AssistanceDefinitionPackExporter output. This foundation package carries no adapter into the shared builder-definitions catalogue's DefinitionAdmission delegate: foundation must not reference blocks (the repository's own tier-direction fence), so that adapter belongs in the blocks tier once a host consumes Pilot definitions, mirroring DataExchange's own unwired foundation package."
  },
  "invariants": [
    "Assistance owns no primitive row in DES-0002 and creates no second action catalogue or interpreter (pilot-ck-1).",
    "A binding may only narrow a referenced command: raise its classification tier, tighten its args schema, or shrink its recipient set; never the reverse (pilot-ck-8, pilot-auth-10).",
    "A NEVER command always carries one of the five named archetypes and a non-empty justification (pilot-ck-9, pilot-auth-11).",
    "No prompt or instruction-text member exists anywhere on the definition (pilot-ck-20, pilot-auth-12).",
    "Tenant, proposals, dispositions, audit rows, model weights and provider credentials never travel in the pack."
  ],
  "errors": [
    "definition.body_invalid",
    "definition.settings_not_object",
    "definition.version_invalid",
    "definition.schema_version_unsupported",
    "definition.surface_required",
    "definition.route_required",
    "definition.envelope_required",
    "definition.envelope_mismatch",
    "definition.provider_required",
    "definition.model_required",
    "definition.command_unregistered",
    "definition.command_duplicate",
    "definition.args_schema_not_object",
    "definition.args_schema_widened",
    "definition.tier_lowered",
    "definition.never_archetype_required",
    "definition.never_archetype_unknown",
    "definition.never_justification_required",
    "definition.context_definition_required",
    "definition.context_field_required",
    "definition.recipient_required",
    "definition.recipients_widened",
    "definition.catalogue_mismatch",
    "definition.command_not_exported",
    "definition.tier_below_catalogue",
    "definition.args_schema_looser_than_catalogue",
    "definition.recipient_outside_target_permission"
  ],
  "publicSeams": [
    "definition intent admission (Author, Publish, Install) and canonical JSON",
    "the reserved DefinitionKind.Pilot content-kind pack entry",
    "ICommandCatalogueRegistry command-reference resolution port",
    "proposal canonical JSON and digest; strict delegation, disposition and user-owned standing-approval wire shapes, never dispatch authority or pack content"
  ]
}
