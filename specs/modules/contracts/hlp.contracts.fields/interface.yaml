{
  "schemaVersion": 1,
  "moduleId": "hlp.contracts.fields",
  "interfaceRevision": 1,
  "status": "draft",
  "purpose": "Carry the shared field-kind, domain and constraint vocabulary across the kernel Records and foundation field-runtime seam without an outward kernel dependency.",
  "dependencies": [],
  "types": {
    "FieldKindReference": ["KindId", "Version", "Parameters"],
    "AdmittedFieldKind": ["KindId", "Version", "GovernanceDefaults", "ValueShape"],
    "ValueDomainDefinition": ["LiteralValues", "TaxonomyScheme", "RecordQuery"],
    "FieldConstraintDefinition": ["Required", "MinimumCount", "MaximumCount", "ReadRoleIds", "ValueDomain"],
    "FieldRefusal": ["Code", "JsonPointer", "Message"]
  },
  "invariants": [
    "One shared vocabulary is promoted from the T-615 declarations; members do not redeclare it.",
    "Contracts contain declarations, not the field-runtime enforcement implementation.",
