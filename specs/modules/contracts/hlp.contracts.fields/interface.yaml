    "Substrate refusals carry member-neutral field.* codes and authored RFC 6901 locations."
  ],
  "notScope": ["kind lookup", "domain evaluation", "limit enforcement", "editor selection", "Records grammar", "JSON Schema compilation"],
  "packageContribution": "Harborline.Contracts"
