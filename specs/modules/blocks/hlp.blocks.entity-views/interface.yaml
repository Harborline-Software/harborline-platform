  "invariants": [
    "A bound record-type descriptor carries tenant, SchemaRef and shared field bindings. Selected column domains resolve through IFieldDomainRuntime for the actual tenant and principal after view-open authorization; a missing runtime, mismatched descriptor or missing selected binding refuses rather than returning an unbound result.",
    "ColumnDomains exposes shared readable membership and editor choice only for selected fields whose inherited read-role gate permits access. The host supplies the typed role vocabulary and held roles; domain read authority is not cached across principals.",
    "GetEntityAsync/GetTreeAsync return null for not-found ONLY; every other failure surfaces as a typed EntityViewsException with a stable views.* code — a non-404 failure is never projected as absence.",
    "Breadcrumb resolution is owned below the renderer: an unresolved ancestor yields a stable placeholder label and a raw entity id is never caller-visible in any breadcrumb result.",
    "A contains edge updates the target's ContainerId and Path exactly as the pinned client wires them; a newly created entity is containable immediately.",
    "Condition history and submissions return explicit empty collections for unknown entities, mirroring the pinned client, and carry provenance (sourceForm/sourceField, assessorRef) untouched.",
    "Form-binding descriptors and navigation targets read the frozen Forms r4 wire only (Design B); the module never references the Harborline App Forms builder model — the dependency-pollution FAILED condition.",
    "The development preview adapter fails closed in Production (views.preview.production_forbidden), takes an injected clock, and seeds the pinned Harborline App preview tree so dev and durable adapters stay indistinguishable through the same ports.",
    "Wire timestamps remain ISO-8601 strings end to end; the default condition scale max is 5, mirroring the pinned ConditionRating default.",
    "Tenant is ambient: no port method carries a tenant id; cross-tenant reads are indistinguishable from absence (the opaque 404 at the seam) via per-tenant store scoping.",
    "The shared pack seed is immutable: editing a seeded type creates a tenant override and revert restores the seed; a tenant's created types are invisible to other tenants.",
    "Condition capture is one act, two artifacts: an out-of-range grade records nothing and returns a surfaced skip (never silent success); an in-range capture returns no skip fields.",
    "A submission links to a record only through a resolved case reference; no case reference leaves no link.",
    "Authored view coordinates and stored definition-and-binding snapshots are immutable and revision history is append-only; restore creates a new draft rather than mutating a published revision, and published-head resolution uses semantic-version ordering.",
    "Definition admission is terminal at definition.validate and returns stable codes with RFC 6901 pointers; offered kinds use the same record-shape compatibility predicate as admission.",
    "The runtime authorizes view-open before Access or row reads, validates kind and shape before Access or row reads, and always applies the Access predicate before the authored predicate, paging, grouping, counting, or measure evaluation.",
    "Measures receive only the current authorized and authored-filtered rows plus the injected kernel instant; query results are transient and carry no content owner, signatory, edition, or basis fields.",
    "Personal definitions are never exported into a pack; only published system/public definitions with their authored bindings are eligible."
  ],
