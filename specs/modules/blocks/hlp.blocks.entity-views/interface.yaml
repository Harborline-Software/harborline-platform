    "context": "Persistence lives behind the store ports a host supplies; the in-memory store is the test/dev double and the development preview adapter (pinned Harborline App seed tree, injected TimeProvider) throws in Production. The module references only the identity/forms/fields contracts — never a Foundation aggregate, a Kernel, a host, or a UI framework."
