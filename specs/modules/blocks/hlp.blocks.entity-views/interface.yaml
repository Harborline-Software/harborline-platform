  "purpose": "Own the Views read model behind Harborline-owned ports: entity list/type-filter/detail-with-breadcrumb/containment-tree reads with the 404-only-null rule, condition history with provenance, the two previewed writes with typed rejections, breadcrumb resolution below any renderer with the no-raw-id rule, form-binding descriptors and navigation targets over the frozen Forms wire (Design B), and a development preview adapter that fails closed in Production.",
  "dependencies": [{"moduleId": "hlp.contracts.identities", "minimumRevision": 1}, {"moduleId": "hlp.contracts.forms", "minimumRevision": 4}],
  "callerInterface": {
    "name": "IEntityReadStore / IConditionHistoryStore / IFormBindingSource / IViewNavigationTargets / BreadcrumbResolver",
    "operations": [
      "ListEntitiesAsync(type?) -> EntitySummary[] (display-name ordered)",
      "GetEntityAsync(id) -> EntityDetail? (null MEANS not-found ONLY)",
      "GetTreeAsync(containerId, asOf?) -> TreeView? (null = unknown container only)",
      "CreateEntityAsync(body) -> EntityDetail (typed rejection on unknown type/validation)",
      "AddEdgeAsync(body) -> EdgeSummary (contains wiring updates ContainerId + Path)",
      "GetConditionHistoryAsync(entityId, asOf?) -> ConditionHistory (empty history for unknown entity)",
      "GetSubmissionsAsync(entityId) -> SubmissionList (empty likewise)",
      "ResolveBreadcrumb(path) -> labels (an unresolved ancestor yields a placeholder, never the raw id)",
      "GetBoundFormsAsync(recordType) -> BoundFormDescriptor[] (explicit empty state)",
      "FillForm(definition, entityId, recordName) -> '/forms?form={definition}&into={entityId}' + recordName state; ViewSubmission(formId, instanceId) -> '/forms?form={formId}&instance={instanceId}'",
      "EntityViewsTenantScopes.ForTenant(tenantId) -> tenant-scoped IEntityReadStore/IConditionHistoryStore/ITypeCatalogStore (tenant is ambient — never on a port method)",
      "ITypeCatalogStore: GetEffectiveCatalogAsync (immutable pack seed + tenant overrides), GetTypeAsync (null = unknown-or-other-tenant only), CreateTypeAsync/UpdateTypeAsync (editing a SEEDED type creates an override, never mutates the seed), RevertTypeAsync (pack seed effective again), bindings + capital-planning round-trip",
      "ConditionCapture.CaptureFromSubmission -> one act, two artifacts; an out-of-range grade records NOTHING and returns a surfaced skip; an in-range capture returns no skip fields",
      "SubmissionLinking.LinkFromCase(caseRef?, ...) -> links the submission to the case-resolved record via an injected resolver; a null/absent case ref leaves no link"
    ],
    "context": "Persistence lives behind the store ports a host supplies; the in-memory store is the test/dev double and the development preview adapter (pinned Harborline App seed tree, injected TimeProvider) throws in Production. The module references only the identity/forms contracts — never a Foundation aggregate, a Kernel, a host, or a UI framework."
  },
  "invariants": [
    "GetEntityAsync/GetTreeAsync return null for not-found ONLY; every other failure surfaces as a typed EntityViewsException with a stable views.* code — a non-404 failure is never projected as absence.",
    "Breadcrumb resolution is owned below the renderer: an unresolved ancestor yields a stable placeholder label and a raw entity id is never caller-visible in any breadcrumb result.",
    "A contains edge updates the target's ContainerId and Path exactly as the pinned client wires them; a newly created entity is containable immediately.",
    "Condition history and submissions return explicit empty collections for unknown entities, mirroring the pinned client, and carry provenance (sourceForm/sourceField, assessorRef) untouched.",
    "Form-binding descriptors and navigation targets read the frozen Forms r4 wire only (Design B); the module never references the Harborline App Forms builder model — the dependency-pollution FAILED condition.",
    "The development preview adapter fails closed in Production (views.preview.production_forbidden), takes an injected clock, and seeds the pinned Harborline App preview tree so dev and durable adapters stay indistinguishable through the same ports.",
    "Wire timestamps remain ISO-8601 strings end to end; the default condition scale max is 5, mirroring the pinned ConditionRating default.",
    "Tenant is ambient: no port method carries a tenant id; cross-tenant reads are indistinguishable from absence (the opaque 404 at the seam) via per-tenant store scoping.",
    "The shared pack seed is immutable: editing a seeded type creates a tenant override and revert restores the seed; a tenant's created types are invisible to other tenants.",
    "Condition capture is one act, two artifacts: an out-of-range grade records nothing and returns a surfaced skip (never silent success); an in-range capture returns no skip fields.",
    "A submission links to a record only through a resolved case reference; no case reference leaves no link."
  ],
