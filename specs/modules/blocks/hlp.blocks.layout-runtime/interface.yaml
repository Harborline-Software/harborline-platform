{"schemaVersion":1,"moduleId":"hlp.blocks.layout-runtime","interfaceRevision":2,"semantics":{"operation":"resolve one immutable Layout definition binding and lower its admitted node tree into a projection-neutral flow plan","binding":"a surface supplies both its definition id and immutable version id; resolution refuses absent, malformed, or unpublished bodies","measureBinding":"the bounded measure adapter requires the caller to supply the surface default intent, uses the block intent when present or otherwise inherits that default, and for an effective observe intent supplies the authored measure name and caller's trusted request to IMeasureCatalogue exactly once before placing its unchanged typed result or one refusal at the Layout block","flow":"screen flow preserves tree order; page flow separates static regions and preserves explicit break boundaries","ownership":"the runtime owns binding identity and placement; it does not persist definitions, mint versions, fetch or enumerate caller rows, infer a basis or intent, provide ambient request defaults, filter Access, narrow authored filters, dispatch on measure entry kind, aggregate, or render framework markup"},"dependencies":["hlp.blocks.builder-definitions","hlp.blocks.measure-catalogue"],"capabilities":["projection-neutral flow planning","exact-version published surface resolution","bounded measure-observe binding placement"],"invariants":["Runtime admission rejects malformed persisted values before planning.","The resolver binds exactly the caller-supplied immutable definition version.","Unknown layout block kinds are not converted into fallback content.","The flow planner preserves declared order and static-region identity.","A block without an intent inherits the explicitly supplied surface default; an explicit block intent overrides that default.","A measure block whose effective intent is observe delegates one caller-supplied MeasureRequest to IMeasureCatalogue and never retries a refusal.","Measure refusal cause codes and pointers remain visible through the Layout binding refusal.","Non-measure blocks and measure blocks whose effective intent is not observe refuse at the bounded measure adapter boundary."]}
