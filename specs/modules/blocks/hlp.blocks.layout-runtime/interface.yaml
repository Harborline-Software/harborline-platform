{"schemaVersion":1,"moduleId":"hlp.blocks.layout-runtime","interfaceRevision":3,"semantics":{"operation":"resolve one immutable Layout definition binding, lower its admitted node tree into a projection-neutral flow plan, and resolve every authored block binding by name","binding":"a surface supplies both its definition id and immutable version id; resolution refuses absent, malformed, or unpublished bodies. Record-field, query, measure, template and static bindings resolve by name through a caller-supplied source; an unresolvable name yields one refusal naming the block and the binding kind","flow":"screen flow preserves tree order; page flow separates static regions and preserves explicit break boundaries; a repeating block's children resolve once per row in a fresh scope","ownership":"the runtime does not persist definitions, mint versions, fetch data, capture a field, compute a measure, run a query, or render framework markup"},"dependencies":["hlp.blocks.builder-definitions","hlp.foundation.rule-runtime"],"invariants":["Runtime admission rejects malformed persisted values before planning.","The resolver binds exactly the caller-supplied immutable definition version.","Unknown layout block kinds are not converted into fallback content.","The flow planner preserves declared order and static-region identity.","Every block binding resolves by name; an unresolvable one is reported by block and binding kind and never silently dropped.","A repeating block's children resolve in a fresh per-row scope and cannot read another row.","show_when is evaluated by the shared rule engine and fails closed; the runtime holds no conditional interpreter of its own.","Binding results arrive already produced from their owning subsystem; the runtime places them and derives nothing.","A repeating block with collection bounds places all of its rows or none: a row count outside the bounds refuses the whole block (layout-ck-40) and nothing is truncated.","A missing optional related target and a denied one produce identical viewer output with no refusal, marker or correlation id; the denial is written only to the caller-supplied protected decision trace, keyed by block, relationship and request (layout-eng-31, layout-run-5).","A published form reference resolves its exact pinned version through the definition store and never the published head (layout-ck-37)."]}
