{"schemaVersion":1,"moduleId":"hlp.blocks.layout-runtime","interfaceRevision":5,"semantics":{"operation":"resolve one immutable Layout definition binding, lower its admitted node tree into a projection-neutral flow plan, and resolve every authored block binding by name","binding":"a surface supplies both its definition id and immutable version id; resolution refuses absent, malformed, or unpublished bodies. Record-field, query, measure, template and static bindings resolve by name through a caller-supplied source; an unresolvable name yields one refusal naming the block and the binding kind","flow":"screen flow preserves tree order; page flow separates static regions and preserves explicit break boundaries; a repeating block's children resolve once per row in a fresh scope","ownership":"the runtime does not persist definitions, mint versions, fetch data, capture a field, compute a measure, run a query, or render framework markup"},"dependencies":["hlp.blocks.builder-definitions","hlp.foundation.rule-runtime"],"invariants":["Runtime admission rejects malformed persisted values before planning.","The resolver binds exactly the caller-supplied immutable definition version.","Unknown layout block kinds are not converted into fallback content.","The flow planner preserves declared order and static-region identity.","Every block binding resolves by name; an unresolvable one is reported by block and binding kind and never silently dropped.","A repeating block's children resolve in a fresh per-row scope and cannot read another row.","show_when is evaluated by the shared rule engine and fails closed; the runtime holds no conditional interpreter of its own.","Binding results arrive already produced from their owning subsystem; the runtime places them and derives nothing.","A repeating block with collection bounds places all of its rows or none: a row count outside the bounds refuses the whole block (layout-ck-40) and nothing is truncated.","A missing optional related target and a denied one produce identical viewer output with no refusal, marker or correlation id. Each denial is emitted to the host's protected decision trace with the request id, the acting principal id, the authored block and relationship, and the typed denied record; the platform defines no reader, and the host owns the store and every reader. Resolution refuses to run without a trace, a request id and a principal id, and a denial reported without its target, code and pointer faults rather than being lost (layout-eng-31, layout-run-5).","A published form reference resolves its exact pinned version through the definition store and never the published head (layout-ck-37).","The host binding source must make missing and denied related targets observationally indistinguishable to an unauthorized caller, including response shape, status or error classification where applicable, and externally observable timing (owner ruling 2026-09-24, R-0115).","A page run may cite the page layouts and page masters installed packs supply through the host's page register; the flow planner and the published-surface resolver use the same register admission used, so a cited supplied master is never silently dropped (layout-bound-7).","A block guard is evaluated as exactly the Rules definition publication compiled (LayoutGuardRule), at the same Schema or Row scope (T-724 ruling 39).","show_when is an object holding exactly one of expression or predicate; absent, the block always shows. A predicate resolves only through its ExactPin in the pinned closure the resolver is given, and a guard holding neither or both forms, or one whose pin will not resolve, withholds its block (layout-ck-29)."]}
