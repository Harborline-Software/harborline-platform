    {"moduleId": "hlp.kernel.work-items", "minimumRevision": 1}
  ],
  "projectionInterface": {
    "name": "InspectionReviewProjectionSink",
    "operation": "DeliverAsync(FormProjectionEnvelope, cancellationToken) -> FormProjectionDeliveryResult",
    "context": "The trusted Forms Engine envelope tenant must equal the current active tenant. Work Items resolves the current server-derived Party and owns mutation atomicity."
  },
  "callerInterface": {
    "name": "IInspectionReviewService",
    "operations": [
      "ListSubjectsAsync(cancellationToken) -> IReadOnlyList<InspectionSubject>",
      "GetSubjectAsync(subjectRef, cancellationToken) -> InspectionSubject?",
      "ListPendingAsync(cancellationToken) -> IReadOnlyList<InspectionReviewView>",
      "GetAsync(reviewId, cancellationToken) -> InspectionReviewView?",
      "DecideAsync(reviewId, expectedVersion, approve|rework, idempotencyKey, optionalNote, cancellationToken) -> InspectionReviewMutationResult"
    ],
    "context": "Tenant and Party are resolved from the current authenticated server scope and never accepted from caller payloads."
  },
  "authorizationPort": {
    "name": "IInspectionReviewAuthorizer",
    "operation": "IsAllowedAsync(read-subjects|read-reviews|decide, cancellationToken) -> bool",
    "context": "The adapter resolves current roles and policy from server authentication; the module never accepts roles in request payloads."
  },
  "invariants": [
    "Only a tenant-owned frozen binding for the exact form revision can activate inspection review.",
    "The projection reads only Forms Engine accepted calculated and pruned values; a client status field is never authoritative.",
    "Condition classification, review identity, process definition, and work-item create key are deterministic and versioned.",
    "At-least-once Forms projection delivery creates at most one review and exact replay returns the original result.",
    "A changed projection under the same retry identity conflicts and remains recoverable rather than partially mutating.",
    "The trusted projection-envelope tenant must equal one active non-system tenant before subject lookup or mutation.",
    "The review subject must exist through the same-tenant subject-directory port; absent and foreign subjects produce one value-free skip.",
    "Review callers choose only approve or rework and provide the expected snapshot version; arbitrary next state, workflow payload, actor, audit, or outbox data is impossible.",
    "Every subject read, review read, and decision passes a mandatory server-side authorization port; denial is indistinguishable from no visible data.",
    "Unknown, inactive-tenant, absent, foreign-tenant, completed, and non-inspection work are indistinguishable at list/detail/decision boundaries.",
    "The frozen Workflow contract admission-checks the closed human-action process, but no arbitrary workflow graph is interpreted at runtime.",
    "Work Items atomically owns state, event, fingerprint-bound receipt, Party audit, and module-generated outbox behavior.",
    "A recovery scope mismatch leaves the Forms projection pending for retry under the correct trusted tenant scope."
  ],
  "errors": [
