  "purpose": "Compose accepted Dynamic Forms submissions into deterministic, tenant-scoped inspection-review work without importing a general workflow interpreter, asset registry, or UI framework.",
  "dependencies": [
    {"moduleId": "hlp.contracts.forms", "minimumRevision": 4},
    {"moduleId": "hlp.contracts.identities", "minimumRevision": 1},
