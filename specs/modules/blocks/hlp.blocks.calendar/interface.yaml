  "status": "frozen",
  "purpose": "Own the calendar domain engine: event/occurrence/instant expansion with DST wall-clock retention, availability expansion, free/busy and viewer free/busy, booking outcomes, participation invariants, shared-calendar layers with visibility policy, padding envelopes, occupancy, and the calendar context query.",
  "dependencies": [{"moduleId": "hlp.contracts.identities", "minimumRevision": 1}, {"moduleId": "hlp.foundation.actor", "minimumRevision": 2}, {"moduleId": "hlp.foundation.scheduling", "minimumRevision": 5}, {"moduleId": "hlp.blocks.builder-definitions", "minimumRevision": 10}],
  "callerInterface": {
    "name": "ICalendarEventExpansionService / IAvailabilityExpansionService / IFreeBusyService / IBookingService / ICalendarContextQuery / calendar models",
    "operations": [
      "Expand events to occurrences and occurrence instants with DST wall-clock retention (an event keeps its civil wall-clock time across transitions; explicit IANA zone ids resolved by TimezoneResolver, never TimeZoneInfo.Local)",
      "Expand availability windows and derive free/busy and viewer-scoped free/busy over shared-calendar layers under the visibility policy",
      "Book against availability with padding envelopes and occupancy limits, yielding typed booking outcomes; the requester is the authenticated principal's server-derived Party read from hlp.foundation.actor's IPartyContext, never a caller-supplied id (T-568)",
      "Read availability through the substrate contract (IAvailabilityRuntime, T-626): a mandatory bounded window refused before any store read, exclusive or pool capacity derived from supply and current occupancy, and the required-resource set as a conjunction over the window plus each resource's buffers",
      "Commit a claim under an epoch-conditional write (ICalendarEventStore.GetCapacityEpochAsync / SaveIfCapacityUnchangedAsync, T-659): the capacity recheck and the commit are one step, and a save conditional on a capacity epoch that has moved is refused with nothing written",
      "Claim through the scoped IBookingInterpreter (T-606, booking-eng-1, booking-eng-19, booking-run-1): resolve the Bookable and every required Resource at their published heads, using caller-supplied supplier identities. Missing heads or suppliers refuse with their identity and write nothing; drafts are never used. A valid candidate reports each supplier's buffered footprint on success and capacity refusal. The interface is the pre-resolution seam for the later book gate (T-608).",
      "Claim a Bookable (BookableClaimService.Claim(tenant, bookable, resources, startUtc, endUtc), T-606, DES-0025 booking-eng-3 to -8, -13, -21): the window must be one of the Bookable's declared durations (booking-eng-3); each required Resource's footprint is the window widened by its own setup and cleanup minutes, the buffer the owner ruled on 2026-09-29 lives on the Resource (booking-ck-5, booking-eng-5); every required Resource is tested as a conjunction, all or none (booking-eng-6); exclusive capacity refuses any overlap (booking-eng-7) and a pool refuses at its size (booking-eng-8); a waitlist flag declares a queue and the claim owns nothing after it (booking-eng-13); capacity is read only through the injected IAvailabilityRuntime, which the claim never implements (booking-eng-21). Refusals write nothing and are stable codes: booking.claim.window_invalid, requirement_unresolved, no_requester, outside_supply, capacity_exhausted, contended.",
      "Commit a multi-resource claim whole or not at all (ICalendarEventStore.SaveAllIfCapacityUnchangedAsync(tenant, events, expectedEpochs), T-606, DES-0025 booking-eng-24): callers supply the epoch read before the capacity check for every required resource; the store compares every supplied epoch and writes every event in one step, or writes nothing and returns false when an epoch has moved; an event of another tenant is refused with ArgumentException. A claim that loses an epoch re-reads, up to three passes, then refuses booking.claim.contended.",
      "Apply a Booking hold transition (BookingHoldEffect.AcquireAsync / ConfirmAsync / CancelAsync / ExpireAsync, T-606, DES-0025): each transition commits the hold's new state and its capacity effect (reserve, keep or release) through one version-fenced IBookingHoldTransactionPort write, using the kernel clock read during transaction preparation. A confirm at or after expiry at that read commits Expired and releases capacity instead. ADR-0095 also requires expiry to win at commit time; a clock advance after preparation remains unguarded and is owned by T-606/hold-capacity. Workflows chooses which transition to invoke and owns neither the state nor the capacity effect.",
      "Admit Booking Resource and Bookable definitions (T-605, DES-0025) on the shared versioned-definition store: BookingDefinitionAdmission.For(context) is the store validator for DefinitionKind.Resources and DefinitionKind.Bookables at author and publish, BookingDefinitionPackage.Export projects one published version to pack content (primitive 13, content kinds 18 and 19) and BookingDefinitionPackage.Admit reports every install refusal without mutation; both refuse an envelope contract that is missing or outside the platform seed window (definition.contract.missing or definition.contract.out_of_window at /envelope/contract, T-572)",
      "Answer the calendar context query over subscriptions, owned and shared calendars, and participations"
    ],
    "context": "The module reads NO ambient time: callers supply civil dates, instants, and zone ids; entity timestamps are caller-supplied with deterministic defaults when omitted (the pinned package's six executable ambient-clock reads were deliberately not ported — the full 163-case pinned suite proves the behavior identical without them). Recurrence expansion composes the packed hlp.foundation.scheduling RRULE engine — the draft-era local compatibility copy was replaced by the real module reference at merge review to prevent cross-assembly type ambiguity."
  },
  "invariants": [
    "DST wall-clock retention: an occurrence's civil time is preserved across zone transitions; instants are derived from explicit zone ids only. A local time resolves through the shared WallClockResolver per RFC 5545 s3.3.5 and Errata 4271: an ambiguous fall-back time is its first occurrence (01:30 on 2026-11-01 in New York is 05:30Z) and a spring-forward gap time is read at the offset before the gap (T-1175; ADR-0123 decision 4).",
    "A timed event or availability window expands as a timed series (ExpandZonedOccurrences), so a UTC UNTIL bounds it at that instant (RFC 5545 s3.3.10; ADR-0122 decision 3); an all-day event expands as a date-valued series.",
    "The engine reads no ambient clock or zone (no DateTime.Now/UtcNow/Today, DateTimeOffset.Now/UtcNow, TimeZoneInfo.Local, or TimeProvider.System anywhere in the module).",
    "Free/busy never leaks event detail beyond the visibility policy; viewer free/busy folds shared-calendar layers under that policy.",
    "Booking respects padding envelopes and occupancy limits with typed outcomes — never a silent double-book.",
    "A prior availability read is advisory and cannot authorize an unconditional save: a claim reads the resource's capacity epoch before the capacity read and commits conditional on it, so two concurrent claims on one exclusive slot yield exactly one success without a caller-side lock, and release or expiry restores capacity exactly once (control ticket T-659, DES-0025 booking-eng-24, ADR 0095 ruling 8).",
    "Every booking is attributed to the authenticated requester (the Party the host's IPartyContext resolves); requester-resolution failure refuses with NO_REQUESTER on IBookingService and booking.claim.no_requester on BookableClaimService, with nothing written (control ticket T-568, ledger L535).",
    "Participation invariants hold as pinned (the two participation theories expand to their six pinned rows).",
    "All 163 pinned executable cases are preserved under their pinned names."
  ],
  "errors": [
    "typed booking/availability outcomes as pinned, plus NO_REQUESTER (interface revision 2: no authenticated requester); interface revision 3 adds no error kind for IBookingService — a stale capacity epoch refuses as SLOT_CONFLICT on that path; BookableClaimService refuses exhausted capacity-epoch attempts as booking.claim.contended; interface revision 4 adds the booking.* definition refusal codes in BookingDefinitionCodes, each with an RFC 6901 pointer",
    {"code":"booking.claim.window_invalid","when":"The window is not a positive exact whole-minute duration declared by the Bookable, or the availability runtime refuses the window."},
    {"code":"booking.claim.requirement_unresolved","when":"The Bookable or a required Resource has no published head, a required Resource has no supplier, or the Bookable requires none."},
    {"code":"booking.claim.no_requester","when":"No authenticated requester could be resolved."},
    {"code":"booking.claim.outside_supply","when":"The window is not inside a required Resource's supply."},
    {"code":"booking.claim.capacity_exhausted","when":"A required Resource has no place left over its buffered footprint."},
    {"code":"booking.claim.contended","when":"Every attempt lost a capacity epoch to a concurrent write; nothing was written."}
  ],
