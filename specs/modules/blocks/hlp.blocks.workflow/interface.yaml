    "context": "All durable state lives behind the IWorkflowStore seam a host supplies. The engine composes ports, never a persistence backend. Confirmer and proposer identities are server-derived, never payload-supplied."
  },
  "invariants": [
    "The idempotency key derives from (instance, iteration, step) with a cross-architecture byte-stable v5 GUID derivation, never from a freshly minted id.",
    "The atomic-advance contract co-commits effect, outcome event, idempotency row, and instance position in one store transaction; a redelivered trigger replays as a no-op.",
    "A loop-back park bumps the durable iteration counter and escalates to a terminal Failed state at the max-iterations cap; the counter is read back on resume, never recomputed.",
    "An action with no explicit CP/AP classification is refused at admission; the declared class must equal the class derived from the canonical capability-authority registry; an unknown capability derives CP.",
    "A CP action admits only when a HumanAction transition gates its firing, or every incoming transition of its non-initial on-enter state is a HumanAction.",
    "The definition store admits fail-closed at register, keeps (tenant, key, version) revisions immutable, resolves current-published to the highest published version, and isolates tenants.",
    "The execution face exposes only re-admitting reads, so a definition loaded for execution is always re-validated against the current registry.",
    "Only a System-owned Pack-provenance projection can traverse the restore seam; forward-only publication is otherwise preserved.",
    "The effect-factory resolve and build surface is internal; hosts register effects through the public delegate seam and the broker is the sole Build caller.",
    "A CP effect builds only through the confirm path under separation of duties: a non-human confirmer is refused, and an agent-proposed op requires a distinct human confirmer.",
    "An OutboundExternal effect classifies CP regardless of its registry authority.",
    "Every CP confirm and override feeds the counting decision sink so the override rate is owned, never merely asserted.",
    "The engine core references no financial assembly and imports no financial type.",
    "The built-in durable adapter is a versioned append-only file journal with authenticated headers and checksummed payload frames: each atomic advance stages the effect first, appends one frame carrying effect payloads, the outcome event with the next per-instance monotonic sequence, the idempotency row, and the instance position, and flushes it to durable storage before updating indexes.",
    "Recovery truncates only an authenticated incomplete final frame and fails startup on corruption or unknown versions; committed frames survive a process kill without adapter disposal.",
    "The durable loop-back iteration counter and the pinned definition version are persisted with the park and read back verbatim on resume, never recomputed.",
    "The built-in durable workflow adapter holds one exclusive process lock for its lifetime and is a single-process/single-node adapter; it does not claim distributed leases or multi-node high availability.",
    "The durable store registration refuses layering over an already-registered store.",
    "Route-level semantics narrow to the engine seams: cross-tenant and absent instances are indistinguishable at the caller interface, admission refusals fail closed before persistence, and real HTTP status mapping is proven by the package-only loopback host."
  ],
