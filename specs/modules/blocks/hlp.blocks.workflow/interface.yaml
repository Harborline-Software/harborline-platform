  "invariants": [
    "ADR-0141: a typed WorkflowInterpreterDecisionException names the actual failing step; the dispatcher converts only this interpreter decision error into WorkflowStepOutcome.InterpreterFailure and commits Failed with reason not-retryable, no effect and no retry through its existing atomic advance. Admission, authorization refusals, cancellation and action exceptions propagate unchanged.",
    "Revision 10 adds typed state field requirements, lock scope and escalation schedule, and a notification declaration on a Notify action (ADR-0057, DES-0055).",
    "Revision 9 (T-488/autonomous-trigger-match; R-0155 D1, control 1227): a trigger that matches no transition is discarded. The step handler returns WorkflowStepOutcome.Discard, the dispatcher commits nothing (no event, no step result, no position change) and returns WorkflowDispatchResult.Discarded, so the same step can still advance on a later matching trigger. A trigger that has already taken an edge in this dispatch is not discarded: its progress commits and the run rests at the first state whose edge it does not match.",
    "Revision 8 (T-488/subject-union; ADR 0099, ADR 0126): WorkflowDefinition.Subject is a WorkflowSubjectDef that replaces SubjectFormRef and FormDefinitionRef, so the model carries no Forms definition reference. Its WorkflowSubjectKind is Record or Set, built only through factories: a record or set names a non-empty Record Type. The mapper reads exactly one of the wire's record or set members and throws on any other shape.",
    "WorkflowDefinition carries a typed WorkflowDefinitionEnvelope (DES-0019 workflows-ck-2) whose Contract has no default; a validator composed with a DefinitionContractWindow requires the envelope and checks the contract, and one composed without it still refuses a present envelope that is malformed or names another revision.",
    "Transitions and actions carry RequiredRoles and RequiredStandings. sys.roles is sealed to Anyone, Author, Reviewer and Approver and Access owns every other role (ADR 0041); a standing is a bare name and every one must hold, so a workflow can only narrow. Refusing a required role that widens the record type's own gate is workflows-auth-23, in T-488/admission-refusals.",
    "The idempotency key derives from (instance, iteration, step) with a cross-architecture byte-stable v5 GUID derivation, never from a freshly minted id.",
    "The atomic-advance contract co-commits effect, outcome event, idempotency row, and instance position in one store transaction; a redelivered trigger replays as a no-op.",
    "A loop-back park bumps the durable iteration counter and escalates to a terminal Failed state at the max-iterations cap; the counter is read back on resume, never recomputed.",
    "An action with no explicit CP/AP classification is refused at admission; the declared class must equal the class derived from the canonical capability-authority registry; an unknown capability is refused (workflow.admission.unknown_capability), never derived to CP.",
    "A CP action admits only when a HumanAction transition gates its firing, or every incoming transition of its non-initial on-enter state is a HumanAction.",
    "The definition store admits fail-closed at register, keeps (tenant, key, version) revisions immutable, resolves current-published to the highest published version, and isolates tenants.",
    "The execution face exposes only re-admitting reads, so a definition loaded for execution is always re-validated against the current registry.",
    "Every dispatch carries the host gate's authorization decision; before a typed handler or the interpreter runs, the dispatcher refuses one that is missing, denied, principal-less, or not records:write on the instance (record/instance id) in the instance's tenant.",
    "A trigger carries the act-specific decision separately from the dispatch authority; both invoice posting acts (the human approve and the under-threshold auto-post) run only under an allowed ledger:post decision on a journal entry in the instance's tenant, and hand that decision to the host post effect (IInvoiceApprovalContext.BuildPostEffect(instance, postStepKey, admittedDecision)); an over-threshold decide parks and needs none.",
    "Only a System-owned Pack-provenance projection can traverse the restore seam; forward-only publication is otherwise preserved.",
    "The effect-factory resolve and build surface is internal; hosts register effects through the public delegate seam and the broker is the sole Build caller.",
    "A CP effect builds only through the confirm path under separation of duties: a non-human confirmer is refused, and an agent-proposed op requires a distinct human confirmer.",
    "An OutboundExternal effect classifies CP regardless of its registry authority.",
    "Every CP confirm and override feeds the counting decision sink so the override rate is owned, never merely asserted.",
    "The engine core references no financial assembly and imports no financial type.",
    "The built-in durable adapter is a versioned append-only file journal with authenticated headers and checksummed payload frames: each atomic advance stages the effect first, appends one frame carrying effect payloads, the outcome event with the next per-instance monotonic sequence, the idempotency row, and the instance position, and flushes it to durable storage before updating indexes.",
    "Recovery truncates only an authenticated incomplete final frame and fails startup on corruption or unknown versions; committed frames survive a process kill without adapter disposal.",
    "The durable loop-back iteration counter and the pinned definition version are persisted with the park and read back verbatim on resume, never recomputed.",
    "The built-in durable workflow adapter holds one exclusive process lock for its lifetime and is a single-process/single-node adapter; it does not claim distributed leases or multi-node high availability.",
    "The durable store registration refuses layering over an already-registered store.",
    "Route-level semantics narrow to the engine seams: cross-tenant and absent instances are indistinguishable at the caller interface, admission refusals fail closed before persistence, and real HTTP status mapping is proven by the package-only loopback host.",
    "Revision 7 (T-1176 Q1, owner ruling 2026-11-07): admission refuses a RequiredRoles or RequiredStandings gate on a transition whose trigger is not HumanAction, or on an action that fires without a HumanAction gating it, with workflow.admission.gate_on_autonomous_step; autonomy is the CP fence's own test. IWorkflowGateAccess is the host port a role gate is decided through: the engine asks with a WorkflowGateIntent built from the pinned definition and the verified dispatch principal, and refuses an answer that does not bind it (workflow.gate.answer_unbound) or is not satisfied (workflow.gate.denied). IDeclarativeWorkflowInterpreter gains an overload taking the verified WorkflowDispatchAuthority, which the dispatcher calls.",
    "Revision 12 (T-1176/platform-gate-instant): WorkflowGateIntent carries DateTimeOffset DecidedAt and Binds compares it. The interpreter requires the host TimeProvider through RequireClock, reads GetUtcNow once on the verified WorkflowDispatchAuthority overload per act, and carries that same instant to its human transition and effecting action gates. Trigger payload time is evidence only and cannot supply the instant; an answer at another instant is workflow.gate.answer_unbound. The store event clock remains separate."
