  "canonicalReferences": {
    "occurrenceFormat": "rc1/{escapedChain}/{escapedNode}/{escapedRoundTripDueInstant}/r{revision}",
    "escaping": "Encode chain, node and the due instant independently as UTF-8 components. The due instant uses invariant round-trip O format (for example 2026-07-01T08:00:00.0000000+00:00). Leave only RFC 3986 unreserved ALPHA / DIGIT / hyphen / period / underscore / tilde literal; encode every other byte as percent followed by two uppercase hexadecimal digits. Components are non-empty and have no fixed byte maximum; consumers treat the result as opaque.",
    "limits": {
      "referenceUtf8Bytes": {
        "minimum": 1
      },
      "nodeCount": {
        "minimum": 1,
        "maximum": 1024
      },
      "revision": {
        "minimum": 1,
        "maximum": 2147483647
      },
      "offsetOrToleranceDays": {
        "minimum": 0,
        "maximum": 36500
      },
      "ledgerVersion": {
        "minimum": 0,
        "maximum": 9223372036854775807
      }
    }
  },
  "invariants": [
    "No due generator or chain implementation remains in this assembly."
  ],
  "failureCodes": [
