    "recordTypePreflight": ["Revision 26 (T-618): RecordTypeDefinitionStore.PreflightAsync(tenant, document, cancellationToken) returns RecordTypePreflight(Document, Refusals, JsonSchemaText, Warnings) with Stage Publish. It writes, registers and publishes nothing and is no publication verdict: no revision, replay, expected-revision or head fence, receipt or authorization. It takes no record type id, so the SaveDraftAsync identity checks stay outside it", "Stages run in order, each only when its prerequisite holds: FirstMissing (records.document_invalid at its pointer), canonical serialization (records.document_invalid, empty pointer), envelope presence (records.envelope_required /envelope) and tenant (definition.catalogue_mismatch /envelope/tenant, ordinal against the trusted tenant), kind defaults, Publish-phase structural admission, then the draft compile, the catalogue edges with publication's fail-closed creation-role check, and the warning preview. Refusals keep the first occurrence per code, pointer and target; JsonSchemaText is present whenever the body compiles, beside other refusals, and is never registered", "Edges resolve on a lookup copy that drops a blank class_id, a reference not naming exactly one target and a blank required_trait_id, keeping field indices; the returned document, compile and warnings use the canonical materialized candidate. An edge-free body makes no catalogue read", "Guards precede any read: a blank tenant is ArgumentException (null: ArgumentNullException), a null document ArgumentNullException, a FieldDomainScope for another tenant InvalidOperationException. No scope is no fault; records.field.runtime_required appears only when a trait slot binding needs narrowing. The host validates the tenant at TenantId and binds the role vocabulary to it; the preview proves no authorization. Faults and cancellation propagate as thrown. No new error code"],
    "recordTypeConflictPolicyAndCategories": ["revision 26 (T-615, records-ck-16 declaration, records-ck-23): nullable init-only FieldDefinition.ConflictPolicy and RecordTypeDocument/NewRecordType Categories preserve positional constructors and legacy absence. conflict_policy accepts exactly ask, additive or latest_observation through a dedicated converter, with no last-write-wins spelling; any other non-null wire or typed value is the existing records.document_invalid with empty pointer, and an explicit null reads as the absent default. An explicit ask and an empty categories list canonicalize to absent, so legacy bodies, fixture digests and the compiled record schema are byte-identical; readers before revision 26 refuse bodies that carry either declaration and the contract version is unchanged", "categories[] is text tags in authored order: a null element is records.document_invalid at /categories/{i}; every present text tag is admitted in every phase and kept verbatim, with no blank, trimming, normalization, character or duplicate rule, because tag comparison is not ruled (L103 open); since admission re-checks published bodies, a later comparison rule needs a migration or grandfathering path. Absent, explicit null and an empty list mean no tags; a value that is not a list of text is records.document_invalid with empty pointer", "Owner rulings 2026-10-25, for these two members only: explicit null equals absent; explicit ask and an empty list are omitted from canonical storage as a deliberate normalization. Save is full-document replacement, not a patch: an omitted conflict_policy or categories clears and is never carried forward from the expected revision, unlike the policies; the expected-revision fence does not protect an older client that drops members it does not understand", "No version machinery in this prerelease declaration slice: compatibility (ADR-0007 change classification, pack capability, version floor) must be resolved before the first pack publishes