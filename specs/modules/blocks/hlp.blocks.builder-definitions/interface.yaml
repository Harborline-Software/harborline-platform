  "invariants": [
    "The versioned store exposes no member-specific type; host-supplied pure validators admit each supported registry.",
    "RuleDefinitionCatalog composes Rules source admission with the shared store and lifecycle; foundation never depends on blocks.",
    "Older published history arrivals cannot lower the highest semantic-version head. The offline RuleRegistry remains a separate mechanism.",
    "Every consumer pin names both the stable definition key and immutable version id.",
    "Published versions never change and production resolution never returns a draft.",
    "Every accepted lifecycle change appends to history; restore never edits a published body.",
    "Version syntax, registry admission and member constraints refuse by stable code and RFC 6901 pointer; bodies are never repaired, normalized or clamped.",
    "Mutations fence the per-tenant/registry/definition stream by expected revision; exact request replay returns the original result and mismatched replay refuses.",
    "Durable adapters must conditionally commit history, head and replay together; the reference in-memory store claims no restart durability.",
    "Generation v1 hashes UTF-8 compact JSON with the domain harborline.configuration-generation/v1, tenant, active roots, resolved package/content references, dependency edges, ownership, platform contract, and applicable policy references.",
    "All identity collections sort by exact key using ordinal comparison; duplicate keys refuse rather than silently coalescing conflicting references. Digests are exactly 64 lowercase hexadecimal SHA-256 characters. Properties have the order emitted by ConfigurationGeneration.Resolve; there is no trailing newline or Unicode normalization.",
    "The host supplies a complete resolved snapshot. Every dependency resolves in the supplied closure, every supplied package is reachable from an active root, and every content key has exactly one ownership selection pointing to a supplying package.",
    "The host verifies referenced content and determines applicable policy before resolution. Generation identity neither authorizes reads nor establishes authenticity, release status, installation, compatibility, or effective-pointer authority.",
    "The public read document contains references only, never configuration values, credentials, signatures, or raw policy content. Hosts supply public identifiers and digests, authorize tenant reads, and bind the effective snapshot through ConfigurationGenerationDetail.Bind.",
    "The platform seed exports configurationGenerationDetail in ck-7. React SchemaForm and Blazor HarborlineSchemaForm render that same definition and the producer's bindings in host read-only mode; the generation digest is distinct from package revisions.",
    "Preparation consumes ConfigurationGeneration.Resolve identities without re-deriving them. Its trusted host validator builds an isolated immutable projection against the expected complete baseline and checks every applicable compatibility dimension. Unknown compatibility refuses; missing validation never means success.",
    "A prepared token binds baseline, candidate, immutable projection reference and ownership read from the candidate's canonical snapshot. Preparation never changes the effective generation or confers authority.",
    "One activation request binds the prepared token, acting principal and evidence intent identity and reason. The switch decision rechecks the current complete baseline and resolves live Access authority for exactly that request. A stale baseline is a refusal, never an automatic retry.",
    "The API implements IConfigurationActivationTarget: under its atomic transaction, verify the projection and destination compatibility, check the baseline, authorize, and commit ownership, effective pointer, Access decision reference and reconstructable evidence intent together. All reads and writes pin one generation per unit of work.",
    "Evidence intent identity is tenant-scoped and binds the entire switch decision; conflicting reuse refuses. The API owns outbox publication and commit acknowledgement. Recovery of a prepared generation, the effective pointer and the evidence outbox left by a crash belongs to the platform kernel, not to the API and not to a released definition. Lost commit acknowledgement is indeterminate, never a fabricated refusal or blind retry.",
    "The pure switch decision is not a commit. Only host confirmation after durable commitment yields an effective outcome. Refusal retains the observed current generation. Preparation and decision exceptions propagate without a success token or outcome.",
    "ck-7 exports configurationActivationDetail and configurationActivationStatuses. One released Form and vocabulary distinguish released, preparing, refused and effective in both SchemaForm lanes. Successful preparation remains preparing; a refused projection cannot bind as effective.",
    "A proposed change records the exact baseline generation it started from and keeps it across every autosave and saved version. The producer exposes no path from a proposed change to an effective generation; only a prepared candidate can become effective.",
    "Autosave replaces only the named definition's body and preserves every other working edit. A body that is not parseable JSON refuses rather than being repaired. An edit states the transport content kind its definition is, and an edit that states none refuses; that stated kind is part of the working digest, so restating a definition under another kind invalidates a check taken before it.",
    "A saved version freezes the working edits with a required author and required rationale at an admitted instant; its frozen edit list is immutable and a later edit changes the working digest without touching it.",
    "A check binds one working digest. Any later edit moves that digest, so the check no longer describes the state and a release naming it refuses configuration-check-invalidated.",
    "Release exports exactly the named saved version as one provider-neutral manifest whose own package record carries the baseline, the saved version, its authorship, its rationale and the check receipt. Each exported definition item carries the content kind its edit stated, so a consumer converts the document mechanically and never derives a kind from a definition key: this block states the mapping once, per edit, and deliberately does not enumerate the transport's kinds. A baseline that is no longer effective refuses configuration-baseline-stale naming both generations, and a proposed change with no recorded check refuses configuration-check-required. The platform signs nothing: transport, signing and installation are the api's (ADR 0097 decision 6).",
    "The released digest is the SHA-256 of the exported document bytes, so the digest shown to the author cannot drift from the artifact those bytes are.",
    "ck-7 exports configurationProposalDetail and configurationProposalStatuses. One released Form and the domain-facing Proposed change, Saved version and Released package vocabulary render in both SchemaForm lanes over one shared Records-and-Forms example fixture.",
    "A verification suite is declarative data only: a case names one registered action and registered predicates from the closed catalogue, so there is no place for a script, expression, address or prompt, and admission refuses an unregistered name.",
    "An assertion is meaningful only when it names a registered predicate, carries an expected value that is well typed for that predicate's declared kind, and reads an observation channel the case's own action produces. A case with no meaningful assertion is refused at authoring by verification-assertion-required, so it never becomes a suite and never runs.",
    "A case outcome's status is derived from its observations and can never be supplied. No observation is Vacuous, not Passed; a receipt whose outcomes include any status other than Passed is not a passing run. Unsupported and Blocked are results, not skips.",
    "A fixture declares its instant, time zone, locale, identifier seed, collection ordering, actor, held grants and every simulated port. A blank determinism input refuses rather than defaulting, and an undeclared port is denied.",
    "An invariant binds every parameter of its action; a parameterized case binds them per row, every row varies the same input keys, and every row states an expected value for every assertion. An unbound input or an unexpressed row expectation refuses.",
    "Suite v1 hashes UTF-8 compact JSON with the domain harborline.verification-suite/v1, the catalogue digest, every fixture and every case, ordinal by identity. Parse re-admits a document through Declare, so a faithful parse reproduces the digest and cannot carry a case authoring would have refused. It refuses a document written against another catalogue rather than re-deriving its meaning under this one, reads only string members so a malformed document reaches a named refusal rather than an exception, and treats an instant that does not parse as an undeclared instant.",
    "Receipt v1 binds the tenant, the candidate generation, the baseline generation, the suite reference, one reference per fixture the suite itself derives, and every engine identity including the action and predicate catalogue. A missing binding refuses and no receipt is minted.",
    "A receipt answers every declared case and every declared examples row exactly once, and an outcome that observed anything observed every assertion its case declares; a missing, unknown or duplicate outcome or observation refuses, so a run cannot be made green by dropping a case or by dropping the one assertion it would have failed. Observing nothing remains legal and remains Vacuous. Engine identities are deduplicated and fully ordered, so the receipt digest depends on the engine set rather than on how the caller assembled the list, and a list repeating the catalogue is not a second engine.",
    "The platform executes nothing. It owns the declarative model, its admission and the receipt contract; isolated execution through the production interpreters, the ephemeral tenant context, receipt persistence and transport are the api's, per R-0091's authority table and ADR 0096 decision 3, under which producers are built in the platform and the api consumes the released feed.",
    "ck-7 exports verificationRunDetail, verificationRunStatuses and verificationCatalogue. One released Form and the Passed, Failed, Nothing was checked, Not supported and Blocked vocabulary render in both SchemaForm lanes over one shared Records-and-Rules example fixture.",
    "DefinitionKeySuggester is advisory and never claims allocation authority.",
    "Archive state is isolated by exact tenant, DefinitionKind, and definition key.",
    "Archive and unarchive are idempotent and never delete authored definitions.",
    "Lifecycle state survives construction of a new store over the same durable path.",
    "Manifest item order is the replay order and bootstrap stages never decrease.",
    "Every dependency names an earlier item in the same manifest.",
    "A non-empty manifest begins with exactly one platform package record.",
    "The complete manifest is validated before one atomic apply-to-empty target call receives the ordered batch.",
    "The target commits every item or none and atomically refuses a non-empty target, including under concurrency or failure.",
    "The checked-in platform-pack.export.json is byte-identical to PlatformPackageSeed.Export and ships in the NuGet package.",
    "The canonical fixture contains ck-1 through ck-14 only; ck-15 is an external Access-pack boundary and ck-16 is verified through absence assertions.",
    "The fixture contains no first-authority source or preloaded Access-pack provenance kind while those DES-0007 rulings remain open.",
    "The 13 navigation ids and catalogue:read, records:read, and audit:read role offers preserve the current harborline-api platform export migration authority.",
    "Unresolved DES-0007 policy is represented as absent content and refused; this module does not invent a default.",
    "Package reattachment restores missing seeded safety floors, clamps lower integers, and refuses a present non-integer member by name.",
    "The receipt writer reads committed installed state; it never reports a value the install requested, and the installed digest is recomputed by re-exporting the items the node committed.",
    "The expected authorization outcome is derived from the installed bindings and grants, never from the gate; the checker is the only thing that asks the gate, and a disagreement refuses naming the capability.",
    "An install mints the witness inside the apply that commits the items. A document carrying any other witness is refused, so a hand-written or fixture-written receipt cannot pass and a receipt kept from an earlier install cannot pass against the next one.",
    "The receipt document is canonical, so re-exporting a faithful parse reproduces its exact bytes; any edit, including to the digest, refuses.",
    "DES-0007 platform-package-ck-3 and platform-package-ck-4 must enumerate exactly the sealed operational types and sealed traits the receipt reports; a difference in either direction refuses and names the id. A name the row itself says the seed omits is excluded by that clause, not by a rule invented here (ADR 0100 ruling 15; ADR 0097 decision 2).",
    "Pilot manager registration, handlers, navigation, and React snapshots are excluded app-host concerns."
  ],
  "errors": [
    {"code":"configuration-baseline-stale", "when":"The expected complete baseline differs from the current generation at preparation or at the atomic switch decision; no retry is requested."},
