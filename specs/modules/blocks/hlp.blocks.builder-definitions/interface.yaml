  "invariants": [
    "LayoutFieldControlRegistry.Released ships the text and currency declarations in the library. Currency accepts only decimals (integer), currencyCode (string), min and max (number) parameters; precision and other names refuse. Hosts consume this register rather than restating descriptors. LayoutValidationRuleRegistry.Released is empty until an admitted installed Rules catalogue supplies published Validate-action rules; it invents no required-value rule. Both schema-form lane implementations are checked against the released control ids and parameter names (T-1012, layout-bound-3 and layout-bound-8).",
    "A Layout submit_gate is the shared hlp.contracts.authorization SubmitGate. A surface that pins a form refuses its own submit_gate by name at /submit_gate (layout.capture.submit_gate_on_pinned_form), at whichever stage admission runs; the pinned form's gate is the sole gate for that submit, and only a surface that pins no form keeps its own (layout-ck-31, layout-auth-23, T-724 ruling 81).",
    "The versioned store exposes no member-specific type; host-supplied pure validators admit each supported registry.",
    "TaxonomyDefinitionStore composes Taxonomy admission with the shared store under DefinitionKind.Taxonomy (T-493 S7, DES-0024); a reference that names no exact three-part version refuses definition.reference_unpinned at /version and never resolves to a published head, and an absent, draft or other-tenant version resolves to TaxonomyDefinitionNotFound.",
    "RuleDefinitionCatalog composes Rules source admission with the shared store and lifecycle; foundation never depends on blocks.",
    "Older published history arrivals cannot lower the highest semantic-version head. The offline RuleRegistry remains a separate mechanism.",
    "Every consumer pin names both the stable definition key and immutable version id.",
    "RecordWriteOperation decides every call through the sole gate first, a retry included; a denial reaches no receipt lookup, binder, registry or store and discloses no receipt or conflict. The gate is asked once, through AccessProvider.CheckWithEvidenceAsync (hlp.foundation.actor revision 4, typed since revision 5). A create stages that AuthorizationDecisionEvidence as its audit's KernelAuditEvidence.AuthoritySnapshot (hlp.kernel.core revision 6) inside the one prepared command, so the snapshot commits or rolls back atomically with the record, its operation identity and its audit (ADR 0068), and Decision is null on that outcome: the host appends it nowhere else. Every other outcome (a denial, a refusal after the gate, a replay or a conflict) carries Decision for the host to persist through its trace plumbing; it is null only when the request never reached the gate, the gate's evidence named another context, or the host's Created commit returned a missing or foreign receipt (records.write.receipt_unsupported): that refusal is the one refusal after which something persisted, since the record, its identity, its audit and the snapshot committed, and a retry with the same operation id settles from the stored operation. RecordWriteOutcome.Committed is false for it, because no usable receipt came back. The snapshot bytes are the evidence's tenant, principal, trace version and four projected steps (byte grammar proposed for review). The gate is asked for a typed target, AccessRecord.RecordTypeId set to the requested Record Type (hlp.foundation.actor revision 5, plan W9), and the evidence must name the same type; the trace adds no fact for it. The form-origin entry for form_only types is CompleteAcceptedAsync (revision 18, below).",
    "Creation policy (decision D1, K9; revision 17): RecordTypeDocument carries optional creation_gate (RecordCreationGate: exact lowercase form_only, role, engine; any other spelling, case or a number is records.document_invalid) and creation_role_id. Absent creation_gate means form_only, the default DES-0004 section 1 defines, and the canonical body omits an explicit form_only, so every existing body, digest and the goal-4 canonical literal stay byte-identical. Outside the Author stage a role gate requires a nonblank creation_role_id (records.creation_role.required) and any other gate refuses one (records.creation_role.unexpected), both at /creation_role_id. Publication resolves a role gate's creation_role_id as a domain role through the RoleVocabulary the store was constructed with and fails closed without one (records.creation_role.unknown, /creation_role_id); a supplied vocabulary is honoured by DiagnoseAsync too, and the bind path never re-resolves it. RecordCreationPolicy.Of and RecordTypeDefinitionStore.GetCreationPolicyAsync(tenant, recordTypeId, version?) are the one governing policy read: the head or a pinned published version, null when unpublished.",
    "RecordWriteOperation.CreateAsync is a principal's direct create. After the gate allows and the type binds, the bound revision's own creation gate is enforced before anything is staged, whatever the decider answered and whatever form metadata existed: form_only refuses records.write.form_only and engine refuses records.write.engine_only, both in the bind stage at /record_type_id (the refusing fact belongs to the bound revision; no refusal is reported in the authorize stage beside an allowed decision, DES-0032), returning Decision, the authorize stage's own verdict. A role gate proceeds on the decider's allow. RecordCreationAuthorization states the host decider contract (W10): Platform sends exactly one request, act records:write, kind record, the minted record id, RecordTypeId the requested type, empty Fields (no pin, no role, no form); a conforming adapter decides on the type's published head policy read through GetCreationPolicyAsync, allowing only a holder of a role gate's creation_role_id and denying form_only, engine, an unpublished type and an engine or reserved principal. So the newest publication governs every create (E4): a pin to an older role version under a newer role head is decided on the head's role, a pin to an older role version cannot widen a newer form_only head, and a pin to a form_only version is refused by the bound revision. L152 is met only when a W10 adapter honours the contract. A form invoking a role-gated create uses this same single decision and adds no creation gate (D1).",
    "A committed Records write operation is identified by ambient tenant, its originator and operation id, plus an origin frame for an accepted command (revision 18): RecordWriteOperationKey.IdempotencyKey frames tenant, originator (CallerId) and operation id exactly as before, so every direct-create key is byte-unchanged, and an accepted command's key appends a fourth frame, origin accepted-command, so a direct operation never shares a scope with an accepted one. For a direct create the originator is the authenticated caller. The operation id, wire member operation_id, is taken exactly as sent: nonempty, at most 255 UTF-8 bytes, compared ordinally, never trimmed or normalized (D6). An empty, longer or non-text id refuses records.write.operation_id_invalid at /operation_id in the validate stage, after the gate and before any lookup (spelling proposed by 003c; the rule is approved). Its intent digest (records-write-intent/1, persisted with the operation) is compared without re-execution: the same intent returns the original receipt and original binding, and a changed body, Record Type or explicit pin refuses records.write.replay_conflict with the pointer /operation_id. A reader null is a lookup miss and the only way to a first-seen write, which binds and validates; an unpinned one binds the current published head (RW-6). An operation already accepted is settled from what was stored by one rule, whether the lookup returns it or the host's commit settles the staged identity Replayed or Conflict and returns it as RecordWriteCommit.Stored: an unsupported stored encoding version or a blank stored digest refuses records.write.receipt_unsupported; another intent refuses records.write.replay_conflict whether or not a receipt is readable; the same intent with a missing receipt or one naming another operation id refuses records.write.receipt_unsupported. A Replayed or Conflict commit without Stored, and a Created commit whose receipt is missing or names another operation id, refuse records.write.receipt_unsupported; nothing is disclosed. Insert-freedom is structural on the lookup path (nothing is staged) and contractual on the commit path.",
    "Host conformance (T-619 qualification, before enablement): the host store keys committed Records write operations by RecordWriteOperationKey.IdempotencyKey under a uniqueness constraint enforced inside the commit; a Replayed or Conflict commit publishes no record, audit or authority snapshot and returns the operation exactly as stored; a Created commit returns the new receipt naming the requested operation id; and the receipt reader returns an accepted operation even when its receipt is unreadable, null meaning only a miss.",
    "The audit payload and the authority snapshot are compact UTF-8 JSON from the default Utf8JsonWriter, which escapes + as \\u002B and non-ASCII and HTML-sensitive characters as \\uXXXX; the bytes are deterministic, and consumers parse them rather than compare bytes.",
    "Intent normalization is comparison-only: the validator and the store receive the submitted body with ordinal object-member order, every number in its submitted text and every other value equal to the submitted one (strings may be re-escaped), so representation-sensitive numeric facets (total_digits, fraction_digits, max_bytes) judge the original lexemes. No number is converted to binary64 and no exponent is expanded or parsed at arbitrary precision: the written exponent's leading zeros are skipped, and a written exponent with more than 18 significant digits (magnitude 10^18 or more, whatever the significand, zero included) has no intent; every number within that bound encodes exactly, and encoding costs time and memory linear in the lexeme. A body string that is not Unicode text, or a body number whose exponent is beyond that bound, refuses entity.validation.body_invalid with no pointer before any lookup (provisional mapping).",
    "Records write refusals carry an ADR 0038 stage, a stable code and RFC 6901 pointers and never the body, an intent digest or authority evidence: entity.validation.schema_unknown (bind or validate), entity.validation.body_invalid (validate), records.write.operation_id_invalid (validate, /operation_id), records.write.replay_conflict (commit, /operation_id) and records.write.receipt_unsupported (commit, no pointer), records.write.form_only and records.write.engine_only (bind, /record_type_id; spellings proposed). D6 (approved 2026-10-10) makes records.write.replay_conflict and records.write.receipt_unsupported the only codes for those conditions: a host maps them as they are and emits no competing code for the same condition (for example authorization.idempotency_key_reused, a forms idempotency code or definition.replay_conflict), so a Records write route does not also pass through a generic idempotency-key layer.",
    "The audit payload of a committed Records write is exactly seven identifier keys, in this order: act (records:write), operation_id, record_id, record_type_id, version, definition_digest, schema_id (D6). version is the published Record Type definition version the write bound to, the same version the receipt reports; it is not the intent encoding version, a schema version or a payload format version. The payload carries no body value, no intent digest and no authority evidence. Format versioning, tenant, the actual executor (the envelope's ActorId), submitter provenance and outcome belong to the audit envelope, never the payload; KernelAuditEvidence carries the audit id, actor, recorded instant, authority snapshot and, since hlp.kernel.core revision 8, OriginatorId, the submitter provenance of a completed accepted command; it has no format-version, tenant or outcome member yet (an open envelope gap, not a payload key).",
    "Revision 18 (plan W8; ADR-0110 accepted 2026-10-12; its readings are isolated in AcceptedRecordCommandReadings): RecordWriteOperation.CompleteAcceptedAsync(RecordWorkerScope worker, AcceptedRecordCreate command) completes one durably accepted Records create as the host's worker. The gate first decides the worker's own bounded act on the exact command (AcceptedRecordCommandAuthorization: act records:complete-accepted, kind accepted-command, id the command id, RecordTypeId the command's type, fields submitter and operation_id; spellings accepted 2026-10-12, open item 4); a refusal reaches no lookup, binder or store. The submitter is never decided for again (AcceptedRecordCommandReadings.CreationAuthorizationDecided = at-acceptance, ADR-0110 decision 1 reading, accepted 2026-10-12), so an ordinary revocation after acceptance does not cancel the command (rulings D4, K2). Then the binding is validated at runtime: a worker scope in another tenant than the command, or a worker equal to the submitter (impersonation), refuses records.command.binding_mismatch at bind; an acceptance snapshot that is not the shared grammar (hlp.foundation.actor revision 6), names another tenant or principal than the command's tenant and submitter, records a verdict other than allowed, or was decided after AcceptedAt refuses records.command.not_accepted at bind: such a command is ordinary queued work, decided at commit through CreateAsync (ADR-0100 decision 3), never completed here. The operation id keeps the D6 bound. The operation is keyed by the command's tenant, the submitter and the original operation id with origin accepted-command, never by the executor, so duplicate delivery and recovery by another worker or a delegate settle the original operation from its stored receipt and never insert twice (K5); another payload under it refuses records.write.replay_conflict; a missing or unreadable receipt for it refuses records.write.receipt_unsupported and never authorizes another insertion. At execution the published head binds (ADR-0110 decision 2; open item 9 unresolved): engine refuses records.write.engine_only and any other gate than form_only refuses records.command.creation_gate_changed, both at bind (AcceptedRecordCommandReadings.AdmitsCreationGate, open item 11 reading: only a form-originated create of a form_only type is an accepted command). The record, operation identity and audit commit once: the row's ActorId and the audit actor are the worker, RecordWriteRow.OriginatorId and KernelAuditEvidence.OriginatorId are the submitter, RecordWriteRow.AcceptedCommandId is the command id, and the authority snapshot is the worker's own decision; the seven-key payload is unchanged. AcceptedRecordCreateOutcomes.IsTerminalRefusal classifies an outcome for the host worker: authorize-stage refusals and records.write.receipt_unsupported stay pending and retryable, every other refusal is terminal and audited. The caller must hold the accepting store's execution claim (the shared cancel/execute fence).",
    "Revision 18 (acceptance binding): AcceptedRecordCreate carries BodyDigestEncoding, BodyDigest, FormRevision, AcceptanceAuditId and AcceptanceDecidedAt. AcceptedRecordCommandReadings.IsAcceptanceEvidence binds the snapshot to the command's own acceptance decision: kind AcceptanceKind (Gate), act AcceptanceAct (forms:submit-gate), target AcceptanceTargetKind/FormRevision (form/{formId}@{version}), the submitter and tenant at the top level and in the act stage, verdict allowed, at: exactly AcceptanceDecidedAt, which is at or before AcceptedAt, and a nonblank acceptance audit id; anything else is records.command.not_accepted. Then the body's records-write-intent/1 digest over (type, no pin, body) must equal BodyDigest under encoding records-write-intent/1, else records.command.binding_mismatch, both at bind before any lookup (plan W6). RecordWriteRow.AcceptanceAuditId links the materialized record to the acceptance audit. What bytes alone cannot prove (that the accepting store holds the command and that the form revision targets the type) is escalated, not claimed. The spellings AcceptedRecordCommandAuthorization.Act and RecordKind, AcceptedRecordCommandReadings.AcceptanceAct, AcceptanceKind and AcceptanceTargetKind, and RecordWriteOperationKey.AcceptedCommandOrigin are single named constants, accepted as implemented 2026-10-12 (open item 4); host enablement (W10) stays held.",
    "Revision 21 (records-eng-15; DES-0015 RW-2, DES-0030, ADR-0095 rulings 1, 2 and 4): the public RecordWriteOperation constructor gains two mandatory inputs after the clock, IFieldKindRuntime fieldKinds (the compiler's admitted field-kind runtime) and IFieldDomainRuntime fieldDomains (the runtime over the tenant's complete domain sources and the executor's read authority), both from hlp.contracts.fields; a null for either throws ArgumentNullException, so every composing host supplies both. On both create paths, CreateAsync and CompleteAcceptedAsync, inside the prepared command after registered schema validation passes and before anything is staged, every field of the bound revision that declares a binding is checked in declaration order: the field key is one literal property of the submitted body (dots and slashes never traverse; an absent member is undefined), its kind binds through fieldKinds.Bind, its declared constraints intersect through fieldDomains.IntersectAsync in the scope of the tenant and the executor (the worker for an accepted command, never the submitter), and the submitted value validates through fieldDomains.Validate. The first field that fails to bind, resolve or validate refuses with the existing validate-stage entity.validation.body_invalid whose only pointer is that field's key as an RFC 6901 pointer (~ escaped ~0, / escaped ~1); later fields are not reported, the transaction rolls back, nothing is staged, and no field-runtime diagnostic code, source detail or submitted value is disclosed. Any other failure from a domain source, caller cancellation included, propagates with rollback and no partial command. A replay settled from the receipt lookup returns before any field-runtime call; a replay or conflict settled at commit is decided after the field checks ran.",
    "Authority evidence and intent digests are not disclosed: they never appear in the audit payload, a refusal or a receipt, the operation emits no telemetry, and a host does not log KernelAuditEvidence.AuthoritySnapshot, KernelOperationIdentity.Fingerprint or RecordWriteCommittedOperation.IntentDigest.",
    "Published versions never change and production resolution never returns a draft.",
    "Every accepted lifecycle change appends to history; restore never edits a published body.",
    "Version syntax, registry admission and member constraints refuse by stable code and RFC 6901 pointer; bodies are never repaired, normalized or clamped.",
    "Mutations fence the per-tenant/registry/definition stream by expected revision; exact request replay returns the original result and mismatched replay refuses.",
    "Durable adapters must conditionally commit history, head and replay together; the reference in-memory store claims no restart durability.",
    "Generation v1 hashes UTF-8 compact JSON with the domain harborline.configuration-generation/v1, tenant, active roots, resolved package/content references, dependency edges, ownership, platform contract, and applicable policy references.",
    "All identity collections sort by exact key using ordinal comparison; duplicate keys refuse rather than silently coalescing conflicting references. Digests are exactly 64 lowercase hexadecimal SHA-256 characters. Properties have the order emitted by ConfigurationGeneration.Resolve; there is no trailing newline or Unicode normalization.",
    "The host supplies a complete resolved snapshot. Every dependency resolves in the supplied closure, every supplied package is reachable from an active root, and every content key has exactly one ownership selection pointing to a supplying package.",
    "The host verifies referenced content and determines applicable policy before resolution. Generation identity neither authorizes reads nor establishes authenticity, release status, installation, compatibility, or effective-pointer authority.",
    "The public read document contains references only, never configuration values, credentials, signatures, or raw policy content. Hosts supply public identifiers and digests, authorize tenant reads, and bind the effective snapshot through ConfigurationGenerationDetail.Bind.",
    "The platform seed exports configurationGenerationDetail in ck-7. React SchemaForm and Blazor HarborlineSchemaForm render that same definition and the producer's bindings in host read-only mode; the generation digest is distinct from package revisions.",
    "Preparation consumes ConfigurationGeneration.Resolve identities without re-deriving them. Its trusted host validator builds an isolated immutable projection against the expected complete baseline and checks every applicable compatibility dimension. Unknown compatibility refuses; missing validation never means success.",
    "A prepared token binds baseline, candidate, immutable projection reference and ownership read from the candidate's canonical snapshot. Preparation never changes the effective generation or confers authority.",
    "One activation request binds the prepared token, acting principal and evidence intent identity and reason. The switch decision rechecks the current complete baseline and resolves live Access authority for exactly that request. A stale baseline is a refusal, never an automatic retry.",
    "The API implements IConfigurationActivationTarget: under its atomic transaction, verify the projection and destination compatibility, check the baseline, authorize, and commit ownership, effective pointer, Access decision reference and reconstructable evidence intent together. All reads and writes pin one generation per unit of work.",
    "Evidence intent identity is tenant-scoped and binds the entire switch decision; conflicting reuse refuses. The API owns outbox publication and commit acknowledgement. Recovery of a prepared generation, the effective pointer and the evidence outbox left by a crash belongs to the platform kernel, not to the API and not to a released definition. Lost commit acknowledgement is indeterminate, never a fabricated refusal or blind retry.",
    "The pure switch decision is not a commit. Only host confirmation after durable commitment yields an effective outcome. Refusal retains the observed current generation. Preparation and decision exceptions propagate without a success token or outcome.",
    "ck-7 exports configurationActivationDetail and configurationActivationStatuses. One released Form and vocabulary distinguish released, preparing, refused and effective in both SchemaForm lanes. Successful preparation remains preparing; a refused projection cannot bind as effective.",
    "A proposed change records the exact baseline generation it started from and keeps it across every autosave and saved version. The producer exposes no path from a proposed change to an effective generation; only a prepared candidate can become effective.",
    "Autosave replaces only the named definition's body and preserves every other working edit. A body that is not parseable JSON refuses rather than being repaired. An edit states the transport content kind its definition is, and an edit that states none refuses; that stated kind is part of the working digest, so restating a definition under another kind invalidates a check taken before it.",
    "A saved version freezes the working edits with a required author and required rationale at an admitted instant; its frozen edit list is immutable and a later edit changes the working digest without touching it.",
    "A check binds one working digest. Any later edit moves that digest, so the check no longer describes the state and a release naming it refuses configuration-check-invalidated.",
    "Release exports exactly the named saved version as one provider-neutral manifest whose own package record carries the baseline, the saved version, its authorship, its rationale and the check receipt. Each exported definition item carries the content kind its edit stated, so a consumer converts the document mechanically and never derives a kind from a definition key: this block states the mapping once, per edit, and deliberately does not enumerate the transport's kinds. A baseline that is no longer effective refuses configuration-baseline-stale naming both generations, and a proposed change with no recorded check refuses configuration-check-required. The platform signs nothing: transport, signing and installation are the api's (ADR 0097 decision 6).",
    "A released package's closure.dependencies names every package its edits reference, the baseline owner of each edited definition and the package each edit names, except the released package itself, each once as {key, version} pinned at the revision the baseline generation resolved; the pin is a minimum-inclusive floor and the closure resolves under hlp.kernel.core KernelPackageClosure. A referenced package the baseline does not resolve refuses configuration-release-dependency-unpinned naming it rather than being dropped (DES-0029 ck-2).",
    "The released digest is the SHA-256 of the exported document bytes, so the digest shown to the author cannot drift from the artifact those bytes are.",
    "A release with a published-revision resolver (Goal 3 P1, Option A; DES-0015 records-ck-40, records-ck-41) asks the host only for the package's own exposed definitions, in ordinal key order. Each must resolve to a revision Published in the proposal's tenant, of kind Records, whose BodyJson is ordinal-equal to the edit's body, whose catalogue DefinitionId is ordinal-equal to the top-level record_type_id string that body names (review #282 identity), and whose envelope package_id is the released package key; otherwise the release refuses configuration-release-exposure-unpublished (no revision, not Published, another tenant's, a body naming no record_type_id string, or a revision catalogued under another id), configuration-release-exposure-not-records, configuration-release-exposure-body-mismatch or configuration-release-exposure-package-mismatch naming the key. The exposed key is the baseline-closure name, not a catalogue key; mapping it to the definition it names stays the resolver's (host) duty. Under the Class hold an exposed Class is not a Record Type, so it refuses configuration-release-exposure-not-records and a package exposing one cannot be released bound. The exposure then carries, per key, that revision's Document.Version and CatalogueFieldSource.DigestOf digest as exposedDefinitions: the catalogue's version, never the package revision, a content id or a body member, and the digest of the stored bytes, never a re-serialization. A release exposing nothing asks for nothing and exports the bytes the resolver-free release exports; the resolver-free release binds nothing, so a consumer pin to its exposure refuses records.reference.closure_missing at install. PlatformPackageManifest refuses platform-package-exposure-malformed for an entry naming a key the exposure does not, a repeated key, a blank version or a digest other than sha256: and 64 lowercase hex digits.",
    "ck-7 exports configurationProposalDetail and configurationProposalStatuses. One released Form and the domain-facing Proposed change, Saved version and Released package vocabulary render in both SchemaForm lanes over one shared Records-and-Forms example fixture.",
    "A verification suite is declarative data only: a case names one registered action and registered predicates from the closed catalogue, so there is no place for a script, expression, address or prompt, and admission refuses an unregistered name.",
    "An assertion is meaningful only when it names a registered predicate, carries an expected value that is well typed for that predicate's declared kind, and reads an observation channel the case's own action produces. A case with no meaningful assertion is refused at authoring by verification-assertion-required, so it never becomes a suite and never runs.",
    "A case outcome's status is derived from its observations and can never be supplied. No observation is Vacuous, not Passed; a receipt whose outcomes include any status other than Passed is not a passing run. Unsupported and Blocked are results, not skips.",
    "A fixture declares its instant, time zone, locale, identifier seed, collection ordering, actor, held grants and every simulated port. A blank determinism input refuses rather than defaulting, and an undeclared port is denied.",
    "An invariant binds every parameter of its action; a parameterized case binds them per row, every row varies the same input keys, and every row states an expected value for every assertion. An unbound input or an unexpressed row expectation refuses.",
    "Suite v1 hashes UTF-8 compact JSON with the domain harborline.verification-suite/v1, the catalogue digest, every fixture and every case, ordinal by identity. Parse re-admits a document through Declare, so a faithful parse reproduces the digest and cannot carry a case authoring would have refused. It refuses a document written against another catalogue rather than re-deriving its meaning under this one, reads only string members so a malformed document reaches a named refusal rather than an exception, and treats an instant that does not parse as an undeclared instant.",
    "Receipt v1 binds the tenant, the candidate generation, the baseline generation, the suite reference, one reference per fixture the suite itself derives, and every engine identity including the action and predicate catalogue. A missing binding refuses and no receipt is minted.",
    "A receipt answers every declared case and every declared examples row exactly once, and an outcome that observed anything observed every assertion its case declares; a missing, unknown or duplicate outcome or observation refuses, so a run cannot be made green by dropping a case or by dropping the one assertion it would have failed. Observing nothing remains legal and remains Vacuous. Engine identities are deduplicated and fully ordered, so the receipt digest depends on the engine set rather than on how the caller assembled the list, and a list repeating the catalogue is not a second engine.",
    "The platform executes nothing. It owns the declarative model, its admission and the receipt contract; isolated execution through the production interpreters, the ephemeral tenant context, receipt persistence and transport are the api's, per R-0091's authority table and ADR 0096 decision 3, under which producers are built in the platform and the api consumes the released feed.",
    "ck-7 exports verificationRunDetail, verificationRunStatuses and verificationCatalogue. One released Form and the Passed, Failed, Nothing was checked, Not supported and Blocked vocabulary render in both SchemaForm lanes over one shared Records-and-Rules example fixture.",
    "DefinitionKeySuggester is advisory and never claims allocation authority.",
    "Archive state is isolated by exact tenant, DefinitionKind, and definition key.",
    "Archive and unarchive are idempotent and never delete authored definitions.",
    "Lifecycle state survives construction of a new store over the same durable path.",
    "Manifest item order is the replay order and bootstrap stages never decrease.",
    "Every dependency names an earlier item in the same manifest.",
    "A non-empty manifest begins with exactly one platform package record.",
    "The complete manifest is validated before one atomic apply-to-empty target call receives the ordered batch.",
    "The target commits every item or none and atomically refuses a non-empty target, including under concurrency or failure.",
    "The checked-in platform-pack.export.json is byte-identical to PlatformPackageSeed.Export and ships in the NuGet package.",
    "K6 (revision 17): the released platform package revision 1.0.0 keeps its bytes and signatures, including ck-14 creationGate \"form-only\". PlatformCreationGateCompatibility.ReadCreationGate reads that exact spelling as form_only for revision 1.0.0 only; every other revision reads exactly form_only, role or engine, and the seed writes SeedSpelling(revision), the released spelling for 1.0.0 and form_only otherwise. Any other value, a value spelled for another revision, a non-string or absent value, or a ck-1 version that disagrees with the export revision refuses platform-package-creation-gate-malformed: no published revision defines a default for an absent value. PlatformPackageSeed.CreationGate reads the checked-in export through it.",
    "ck-1 declares one non-negative application contract major and minor plus a two-major window capped at that major; PlatformPackageSeed.ContractWindow reads that checked-in carrier and rejects a missing, negative or malformed declaration. Layout admission (author, publish, install, render) and RuleDefinitionCatalog.Admit (author, publish) refuse an envelope contract that is missing or outside that window (definition.contract.missing or definition.contract.out_of_window at /envelope/contract, T-572); an install entry that also fails its minimum_platform_version floor reports both refusals.",
    "The canonical fixture contains ck-1 through ck-14 only; ck-15 is an external Access-pack boundary and ck-16 is verified through absence assertions.",
    "The fixture contains no first-authority source or preloaded Access-pack provenance kind while those DES-0007 rulings remain open.",
    "The 13 navigation ids and catalogue:read, records:read, and audit:read role offers preserve the current harborline-api platform export migration authority.",
    "Unresolved DES-0007 policy is represented as absent content and refused; this module does not invent a default.",
    "Package reattachment restores missing seeded safety floors, clamps lower integers, and refuses a present non-integer member by name.",
    "The receipt writer reads committed installed state; it never reports a value the install requested, and the installed digest is recomputed by re-exporting the items the node committed.",
    "The expected authorization outcome is derived from the installed bindings and grants, never from the gate; the checker is the only thing that asks the gate, and a disagreement refuses naming the capability.",
    "An install mints the witness inside the apply that commits the items. A document carrying any other witness is refused, so a hand-written or fixture-written receipt cannot pass and a receipt kept from an earlier install cannot pass against the next one.",
    "The receipt document is canonical, so re-exporting a faithful parse reproduces its exact bytes; any edit, including to the digest, refuses.",
    "DES-0007 platform-package-ck-3 and platform-package-ck-4 must enumerate exactly the sealed operational types and sealed traits the receipt reports; a difference in either direction refuses and names the id. A name the row itself says the seed omits is excluded by that clause, not by a rule invented here (ADR 0100 ruling 15; ADR 0097 decision 2).",
    "Pilot manager registration, handlers, navigation, and React snapshots are excluded app-host concerns."
  ],
  "errors": [
    {"code":"records.write.replay_conflict", "when":"A Records write operation id already accepted in the same tenant and caller scope is reused with another intent (body, Record Type or explicit pin); the pointer is /operation_id and nothing is written."},
    {"code":"records.write.receipt_unsupported", "when":"A Records write operation is already accepted, but its stored receipt is missing, names another operation id or uses an intent encoding this producer does not write, or the host's Created commit returned a missing or foreign receipt; nothing is disclosed. Nothing is inserted, except after that Created commit, where this call's record and its authority snapshot did commit (Decision null; a retry settles from the stored operation)."},
    {"code":"records.write.operation_id_invalid", "when":"A Records write operation id is empty, longer than 255 UTF-8 bytes or not Unicode text; the pointer is /operation_id (spelling proposed by 003c)."},
    {"code":"platform-package-creation-gate-malformed", "when":"A platform package export's ck-14 creationGate is absent, not a string, outside its revision's spelling set (1.0.0: exactly form-only; any other revision: exactly form_only, role or engine), or the export's ck-1 version disagrees with its revision (K6)."},
    {"code":"records.write.form_only", "when":"A principal's direct Records create binds a Record Type revision whose creation gate is form_only (explicit or the default); bind stage, pointer /record_type_id; nothing is staged (K9; spelling proposed)."},
    {"code":"records.write.engine_only", "when":"A principal's direct Records create, or an accepted command's completion, binds a Record Type revision whose creation gate is engine; bind stage, pointer /record_type_id; nothing is staged (K9; spelling proposed)."},
    {"code":"records.command.binding_mismatch", "when":"An accepted command's completion is asked in a worker scope of another tenant than the command, or by a worker equal to the command's submitter; bind stage, no pointer, nothing staged, terminal (ADR-0110 open item 7; spelling provisional)."},
    {"code":"records.command.not_accepted", "when":"An accepted command's acceptance snapshot is missing, not the shared snapshot grammar, names another tenant or principal than the command, records a verdict other than allowed, or was decided after the acceptance instant; bind stage, no pointer, nothing staged, terminal (ADR-0110 decision 1; spelling provisional)."},
    {"code":"records.command.creation_gate_changed", "when":"An accepted command's completion binds a Record Type head whose creation gate is no longer form_only (and is not engine); bind stage, pointer /record_type_id, nothing staged, terminal (ADR-0110 open items 9 and 11; spelling provisional)."},
    {"code":"records.creation_role.required", "when":"Outside the Author stage, a Record Type whose creation_gate is role has no nonblank creation_role_id; pointer /creation_role_id (D1)."},
    {"code":"records.creation_role.unexpected", "when":"Outside the Author stage, a Record Type whose creation_gate is not role (including the absent default) names a creation_role_id; pointer /creation_role_id (D1)."},
    {"code":"records.creation_role.unknown", "when":"Publication (or a diagnosis with a supplied vocabulary) of a role-gated Record Type whose creation_role_id is not a domain role in Access's role vocabulary, or with no vocabulary at publication; pointer /creation_role_id (D1)."},
    {"code":"configuration-baseline-stale", "when":"The expected complete baseline differs from the current generation at preparation or at the atomic switch decision; no retry is requested."},
    {"code":"configuration-tenant-mismatch", "when":"The candidate and effective baseline belong to different tenants."},
    {"code":"configuration-validation-required", "when":"The host provides no explicit projection and compatibility validation result or finding list."},
    {"code":"configuration-validation-invalid", "when":"A refusal finding lacks a stable code, public target or explanation."},
    {"code":"configuration-projection-required", "when":"Successful preparation lacks a complete immutable projection reference."},
    {"code":"configuration-principal-required", "when":"An activation request lacks the acting principal."},
    {"code":"configuration-evidence-required", "when":"An activation request lacks an evidence intent identity or reason."},
    {"code":"configuration-authority-refused", "when":"Live Access authority denies the exact switch request or provides no retained decision identity."},
    {"code":"configuration-switch-refused", "when":"A caller tries to confirm a refused decision as committed; throws instead of producing an effective outcome."},
    {"code":"configuration-refusal-required", "when":"A caller tries to convert a successful decision into a refusal without a named failure."},
    {"code":"verification-suite-id-required", "when":"A suite is declared without an identity."},
    {"code":"verification-suite-version-required", "when":"A suite is declared without a version."},
    {"code":"verification-suite-document-invalid", "when":"A suite document is not valid JSON."},
    {"code":"verification-suite-contract-unknown", "when":"A suite document does not declare harborline.verification-suite/v1."},
    {"code":"verification-case-required", "when":"A suite declares no case, so it verifies nothing."},
    {"code":"verification-case-id-required", "when":"A case is declared without an identity."},
    {"code":"verification-case-title-required", "when":"A case does not state its claim in domain language."},
    {"code":"verification-case-duplicate", "when":"Two cases share one identity."},
    {"code":"verification-fixture-unknown", "when":"A case names a fixture the suite does not declare, or a fixture digest is requested for one."},
    {"code":"verification-fixture-duplicate", "when":"Two fixtures share one identity."},
    {"code":"verification-fixture-input-required", "when":"A fixture omits its time zone, locale, identifier seed, ordering or actor; determinism inputs are explicit, never defaulted."},
    {"code":"verification-fixture-fact-invalid", "when":"A seed fact body is not valid JSON."},
    {"code":"verification-fixture-port-invalid", "when":"A declared port does not name both the port and its simulator."},
    {"code":"verification-action-unknown", "when":"A case names an action outside the registered catalogue."},
    {"code":"verification-input-unbound", "when":"A case or examples row leaves an action parameter unbound, so it has no determinate result to assert."},
    {"code":"verification-row-id-required", "when":"An examples row has no identity, so a failure could not name it."},
    {"code":"verification-row-duplicate", "when":"Two examples rows share one identity."},
    {"code":"verification-row-shape-mismatch", "when":"Examples rows vary different input keys, so they are not one claim."},
    {"code":"verification-assertion-required", "when":"A case asserts nothing; a check containing no meaningful assertion cannot pass."},
    {"code":"verification-assertion-duplicate", "when":"Two assertions compare the same predicate and target."},
    {"code":"verification-assertion-target-invalid", "when":"A predicate that requires a target has none, or one that takes none was given one."},
    {"code":"verification-predicate-unknown", "when":"An assertion names a predicate outside the registered catalogue."},
    {"code":"verification-observation-unavailable", "when":"An assertion reads a channel the case's action does not produce, so it could never disagree."},
    {"code":"verification-expected-invalid", "when":"An expected value is absent, or is not well typed for the predicate's declared kind."},
    {"code":"verification-expected-ambiguous", "when":"A parameterized case carries an inline expected value; its rows state the expectation."},
    {"code":"verification-receipt-id-required", "when":"A receipt is minted without an identity."},
    {"code":"verification-receipt-tenant-required", "when":"A receipt does not name the tenant it was run in."},
    {"code":"verification-candidate-required", "when":"A receipt does not bind a candidate generation digest."},
    {"code":"verification-baseline-required", "when":"A receipt does not bind a baseline generation digest."},
    {"code":"verification-run-interval-invalid", "when":"A run reports completing before it started."},
    {"code":"verification-engine-catalogue-required", "when":"A receipt does not carry the action and predicate catalogue that defined its observations."},
    {"code":"verification-engine-required", "when":"A receipt names no interpreter beyond the catalogue, so it does not say what executed the cases."},
    {"code":"verification-engine-digest-invalid", "when":"An engine identity has no SHA-256 digest."},
    {"code":"verification-catalogue-mismatch", "when":"A suite document was written against another action and predicate catalogue digest."},
    {"code":"verification-observation-missing", "when":"An outcome that observed something reports no observation for an assertion its case declares."},
    {"code":"verification-observation-unexpected", "when":"An outcome reports an observation for an assertion its case does not declare."},
    {"code":"verification-observation-duplicate", "when":"An outcome reports two observations for one assertion."},
    {"code":"verification-outcome-missing", "when":"The run reports no outcome for a declared case or examples row."},
    {"code":"verification-outcome-unknown", "when":"The run reports an outcome for a case the suite does not declare."},
    {"code":"verification-outcome-duplicate", "when":"Two outcomes answer the same case and row."},
    {"code":"definition.registry_unknown", "when":"The registry is unknown or has no host-supplied admission."},
    {"code":"definition.version_invalid", "when":"The semantic-version label is malformed."},
    {"code":"definition.version_id_required", "when":"An immutable version identity is absent."},
    {"code":"definition.tenant_required", "when":"The tenant namespace is absent."},
    {"code":"definition.id_required", "when":"The stable definition identity is absent."},
    {"code":"definition.request_id_required", "when":"A mutation lacks a replay identity."},
    {"code":"definition.revision_conflict", "when":"The expected stream revision is invalid or stale."},
    {"code":"definition.replay_conflict", "when":"A request identity is reused with another operation, fence or payload."},
    {"code":"definition.version_conflict", "when":"An immutable identity or equal-precedence published version conflicts."},
    {"code":"definition.version_immutable", "when":"An edit targets a published version identity."},
    {"code":"definition.reference_unpinned", "when":"A Taxonomy resolution names no exact semantic version (absent, blank, a label or a range)."},
    {"code":"definition.published_version_required", "when":"Restore targets a draft rather than a publication."},
    {"code":"definition.body_invalid", "when":"The opaque body is not valid JSON."},
    {"code":"definition.admission_invalid", "when":"A configured validator fails to return a refusal list."},
    {"code":"definition.not_found", "when":"A mutation targets an absent version."},
    {"code":"configuration-reference-required", "when":"A generation reference key, revision, tenant, root, dependency or owner is blank."},
    {"code":"configuration-reference-duplicate", "when":"An identity collection repeats a key, even with identical content."},
    {"code":"configuration-digest-invalid", "when":"A referenced digest is not 64 lowercase SHA-256 hexadecimal characters."},
    {"code":"configuration-active-packages-required", "when":"No active package root is supplied."},
    {"code":"configuration-dependency-missing", "when":"An active root or transitive dependency is absent from the supplied closure."},
    {"code":"configuration-package-outside-closure", "when":"A supplied package cannot be reached from an active root."},
    {"code":"configuration-ownership-incomplete", "when":"The selected definition keys differ from the distinct content keys in the closure."},
    {"code":"configuration-owner-content-missing", "when":"The chosen owner does not supply the selected content key."},
    {"code":"definition-key-required", "when":"A lifecycle operation receives an empty key."},
    {"code":"definition-tenant-required", "when":"A lifecycle operation receives an empty tenant."},
    {"code":"definition-lifecycle-corrupt", "when":"Persisted lifecycle state cannot be decoded."},
    {"code":"platform-seed-manifest-empty", "when":"Replay is requested with no seed items."},
    {"code":"platform-seed-package-record-first", "when":"The first seed item is not the platform package record."},
    {"code":"platform-seed-package-record-count-invalid", "when":"A manifest contains more than one package-record stage item."},
    {"code":"platform-seed-target-not-empty", "when":"Replay is requested against a target that already contains package state."},
    {"code":"platform-seed-item-duplicate", "when":"A manifest repeats an item id."},
    {"code":"platform-seed-stage-unknown", "when":"An item uses a bootstrap stage outside the declared PlatformSeedStage set."},
    {"code":"platform-seed-stage-order-invalid", "when":"A later manifest item belongs to an earlier bootstrap stage."},
    {"code":"platform-seed-dependency-missing", "when":"An item dependency is absent from the manifest."},
    {"code":"platform-seed-dependency-not-replayed", "when":"An item dependency is not earlier in replay order."},
    {"code":"platform-seed-content-unresolved", "when":"An item names a policy reference whose content is not yet ruled."},
    {"code":"platform-package-dependency-key-required", "when":"A manifest closure dependency has a blank package key."},
    {"code":"platform-package-dependency-version-required", "when":"A manifest closure dependency has a blank pinned version."},
    {"code":"platform-package-dependency-self", "when":"A manifest names its own package key in its closure."},
    {"code":"platform-package-dependency-duplicate", "when":"A manifest closure names one package key twice; a closure holds one version per key."},
    {"code":"configuration-release-dependency-unpinned", "when":"A saved version references a package the baseline generation does not resolve, so it has no pinned version; the refusal names the package."},
    {"code":"configuration-release-exposure-unpublished", "when":"A release with a published-revision resolver exposes a definition the host resolves to no revision, to one that is not Published, to one in a tenant other than the proposal's, or to one whose byte-equal body names no record_type_id string or a record_type_id other than the revision's catalogue DefinitionId; the refusal names the definition key."},
    {"code":"configuration-release-exposure-not-records", "when":"A release with a published-revision resolver exposes a definition whose resolved published revision is not of kind Records; the refusal names the definition key."},
    {"code":"configuration-release-exposure-body-mismatch", "when":"A release with a published-revision resolver exposes a definition whose edit body is not ordinal-equal to the resolved published revision's body; the refusal names the definition key."},
    {"code":"configuration-release-exposure-package-mismatch", "when":"A release with a published-revision resolver exposes a definition whose published body's envelope package_id is absent or is not the released package key, so no consumer pin could match its carried facts; the refusal names the definition key."},
    {"code":"configuration-release-interface-ambiguous", "when":"A saved version exposes owned definitions at more than one interface version; a package has one interface version."},
    {"code":"platform-package-exposure-malformed", "when":"A manifest exposure has an interface version below 1, an empty, blank or repeated definition key, or an exposed-definition entry that is null, names a key the exposure does not, repeats a key, has a blank version or a digest other than sha256: and 64 lowercase hex digits."},
    {"code":"platform-package-safety-floor-malformed", "when":"A seeded or reattached safety-floor member is present without an integer value; the result names the member."},
    {"code":"install-receipt-malformed", "when":"A candidate receipt is not a receipt document."},
    {"code":"install-receipt-digest-mismatch", "when":"A receipt does not reproduce its own canonical bytes, so it was edited after it was written."},
    {"code":"install-receipt-artifact-mismatch", "when":"The receipt names an artifact id, version or digest other than the published one; the result names the field."},
    {"code":"install-receipt-not-written-by-install", "when":"The receipt carries a witness no install on this node minted; the result names the package whose witness failed."},
    {"code":"install-receipt-installed-unknown", "when":"The receipt reports a package the node has not installed."},
    {"code":"install-receipt-installed-missing", "when":"The node has an installed package the receipt does not report."},
    {"code":"install-receipt-installed-version-mismatch", "when":"The reported version differs from the version read back from the installed state."},
    {"code":"install-receipt-installed-digest-mismatch", "when":"The digest read back from the installed state differs from the reported or the published digest; the result names the field."},
    {"code":"install-receipt-capability-not-declared", "when":"The receipt reports a capability the installed packages do not declare."},
    {"code":"install-receipt-capability-missing", "when":"The installed packages declare a capability the receipt does not report."},
    {"code":"install-receipt-capability-mismatch", "when":"The reported expected outcome differs from the outcome the installed bindings and grants predict."},
    {"code":"install-receipt-authorization-mismatch", "when":"The node gate decides a declared capability differently from the receipt; the result names the capability."},
    {"code":"install-receipt-record-unknown", "when":"The receipt reports a record the install did not write."},
    {"code":"install-receipt-record-missing", "when":"The install wrote a record the receipt does not report."},
    {"code":"install-receipt-record-digest-mismatch", "when":"A reported record digest differs from the digest read back for that record."},
    {"code":"install-receipt-sealed-type-not-installed", "when":"The receipt reports a sealed operational type the installed state does not carry."},
    {"code":"install-receipt-sealed-type-missing", "when":"The installed state carries a sealed operational type the receipt does not report."},
    {"code":"install-receipt-sealed-type-not-in-record", "when":"The receipt reports a sealed operational type DES-0007 ck-3 does not enumerate; the result names the id."},
    {"code":"install-receipt-sealed-type-not-reported", "when":"DES-0007 ck-3 enumerates a sealed operational type the receipt does not report; the result names the id."},
    {"code":"install-receipt-sealed-trait-not-installed", "when":"The receipt reports a sealed trait the installed state does not carry."},
    {"code":"install-receipt-sealed-trait-missing", "when":"The installed state carries a sealed trait the receipt does not report."},
    {"code":"install-receipt-sealed-trait-not-in-record", "when":"The receipt reports a sealed trait DES-0007 ck-4 does not enumerate; the result names the id."},
    {"code":"install-receipt-sealed-trait-not-reported", "when":"DES-0007 ck-4 enumerates a sealed trait the receipt does not report; the result names the id."},
    {"code":"records.read.not_found", "when":"RecordReadOperation finds no committed row for the tenant and record id; answered before the records:read decision."},
    {"code":"layout.definition.body_invalid", "when":"A Layout entry payload raises JsonException in LayoutDefinitionJson.Deserialize at Install: malformed JSON, an empty or unresolved payload, a JSON null, strict typed-body decoding, or an object at a LayoutBlock.Binding position whose first member is not the exact binding_kind discriminator (absent or out of order).", "errorContract":{"owner":"Layout","canonicalSource":"projections/dotnet/blocks/hlp.blocks.builder-definitions/LayoutDefinitionAdmission.cs#LayoutDefinitionCodes.BodyInvalid","meaning":"One whole-entry refusal for each caught JsonException, including the owned structural binding_kind-first failure; skip that entry's semantic and capability checks, continue other entries and refuse the entire pack. Unrelated operational exception types propagate and are not classified by this path.","recovery":{"category":"correct_input","action":"Correct the Layout entry syntax or typed shape and resubmit the pack. This metadata does not authorize automatic retry."},"pointer":{"applicability":"required","relativeTo":"layout-entry-payload","wholeDocument":true,"examples":[""]},"target":{"applicability":"conditional","rule":"Only the verified entry DefinitionId@Version, when safe, authorized and fetchable; never derive it from unreadable payload data."},"stage":{"applicability":"required","vocabulary":"DefinitionAdmissionPhase","allowed":["Install"]},"presentation":{"rule":"Keep the existing client-derived localized code/authorized labels. No exception Message, JsonException.Path or payload text. No arguments for this identity.","arguments":[]}}}
  ],
  "presentation": {"disposition":"not-applicable", "rationale":"The module stores catalogue state and exports provider-neutral package data; managers render it."},
  "distribution": "internal-only"
}
