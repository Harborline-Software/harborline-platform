on a temporal identity requires an explicit authority clock"],
    "fileJournalRecordWriteStore": ["records-write-file-journal/2 retains an explicit contiguous raw legacy/1 prefix and bound/2 entries. First temporal Created on /1 or /2 converts directly to records-write-file-journal/3, retaining every raw legacy/bound span and original Receipt7 before appending temporal/3. Later ordinary or accepted Created on /3 preserves temporal entries and appends unchanged bound/2. No open/read/replay/conflict conversion or legacy provenance strengthening", "All constructor, receipt, current/effective/history/target and ordinary/temporal commit load routes validate the complete journal. Owned members require presence/unique decoded names, strict Unicode/UTF8, unchanged eight-field bound hash/seven receipt fields, operation/audit associations and /3 temporal binding/identity/causal chain. Malformed unrelated evidence refuses as existing InvalidDataException without fallback; dependency/I/O/cancellation retain their classes", "RecordWriteRow adds nullable init-only PublicationVersionId without changing its thirteen positional parameters/deconstruction; the receipt retains seven fields. New prepared writes take identity only from the admitted immutable publication and verify exact body/digest/tenant/type before staging; internal faults roll back without claiming schema-registry rollback", "Current/effective/history/target reads are async 16 MiB bounded; constructor, receipt and commit loads remain uncapped. Legacy /1 depth64 and /2-/3 depth65 remain. Complete finished temporary output is validated before replacement. Unkeyed hashes are integrity evidence, not authentication or valid-downgrade detection", "CreateEffectiveAsync and AmendAsync add immutable half-open effective intervals and causal supersession with exact revision/hash CAS. Explicit temporal prepared/receipt/read ports must be the same object as ordinary storage; old composition returns TemporalStoreUnavailable. New operations require selected immutable publication explicit supersession/reason/history opt-in; legacy rows cannot become temporal via amendment", "Current records:write authorization precedes shared-key temporal receipt replay. Exact accepted intent returns the original detached receipt without fresh publication/policy/basis/head checks or stamp; unsupported receipts/comparable conflicts retain existing refusals. A miss validates publication/schema/fields/domains and applicable creation-only gate. Locked operation replay precedes CAS and explicit authority-clock sampling; one prepared atomic replacement commits event/operation/Receipt7/audit or none. AuthorityRecordedAt is acceptance allocation, not OS durability; Receipt.RecordedAt stays gate-act time", "Before first /2 write drain/fence /1 writers; before /3 drain/fence every incompatible writer including genuine already-loaded /2. Preserve read-only backup/hash and stray temporary evidence, use one qualified writer and verify mixed raw prefix, original receipts/replay and later ordinary preservation. Restoring /1 or /2 requires reconciliation of newer events/operations. Final-head native and J09/J12 proofs remain owed; no host enablement/cutover, Forms or accepted-command temporal adoption, cross-process/power-loss guarantee or full T617/M11 qualification"],
