  "capabilities": {
    "recordTypePolicies": ["Nullable init-only RecordTypeDocument and NewRecordType AmendmentPolicy/HistoryPolicy preserve positional constructors and legacy absence. Amendment accepts exactly reason_required:true with optional mode:supersession; history_policy accepts exactly enabled. RecordAmendmentPolicy.Mode stays null when omitted. Dedicated converters reject unknown/duplicate decoded members, explicit null mode and unsupported wire/typed values as existing records.document_invalid with empty pointer. Reason-only canonical bytes stay unchanged; explicit mode canonicalizes before reason_required", "CreateDraftAsync alone supplies missing reason-required and history-enabled declarations; save, publish, restore and install never initialize an absent policy. A positional resave carries an omitted declaration from the accepted expected revision, preserving an exact original replay after later changes; unseen stale writes remain fenced by the shared catalogue CAS. Default creation remains reason-only; no mode is inferred", "RecordTypePublication.PolicyWarnings defaults empty. Both fresh and replayed PublishAsync compute records.retention.unset at /retention_policy from the returned immutable body; binding through ResolvePublishedSchemaAsync and authoring/refusal diagnostics return no publication warning; only the no-write PreflightAsync preview (recordTypePreflight) previews them","Partial T615 declaration/default/warning behavior selects no implicit mode. Additive T617 temporal writes require explicit supersession mode, reason_required:true and history_policy:enabled in the selected admitted immutable publication. RecordedAt retains its gate-act meaning. No retention authoring/enforcement, wider ck-20/ck-21 completion or host enablement is supplied", "Legacy absent bodies and fixture digests remain byte-identical. New creation retains explicit default members and changes its canonical body/digest; an exact create retried across this upgrade can refuse definition.rep