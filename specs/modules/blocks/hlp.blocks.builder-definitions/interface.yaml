  "invariants": [
    "The versioned store exposes no member-specific type; host-supplied pure validators admit each supported registry.",
    "Every consumer pin names both the stable definition key and immutable version id.",
    "Published versions never change and production resolution never returns a draft.",
    "Every accepted lifecycle change appends to history; restore never edits a published body.",
    "Version syntax, registry admission and member constraints refuse by stable code and RFC 6901 pointer; bodies are never repaired, normalized or clamped.",
    "Mutations fence the per-tenant/registry/definition stream by expected revision; exact request replay returns the original result and mismatched replay refuses.",
    "Durable adapters must conditionally commit history, head and replay together; the reference in-memory store claims no restart durability.",
    "Generation v1 hashes UTF-8 compact JSON with the domain harborline.configuration-generation/v1, tenant, active roots, resolved package/content references, dependency edges, ownership, platform contract, and applicable policy references.",
    "All identity collections sort by exact key using ordinal comparison; duplicate keys refuse rather than silently coalescing conflicting references. Digests are exactly 64 lowercase hexadecimal SHA-256 characters. Properties have the order emitted by ConfigurationGeneration.Resolve; there is no trailing newline or Unicode normalization.",
    "The host supplies a complete resolved snapshot. Every dependency resolves in the supplied closure, every supplied package is reachable from an active root, and every content key has exactly one ownership selection pointing to a supplying package.",
    "The host verifies referenced content and determines applicable policy before resolution. Generation identity neither authorizes reads nor establishes authenticity, release status, installation, compatibility, or effective-pointer authority.",
    "The public read document contains references only, never configuration values, credentials, signatures, or raw policy content. Hosts supply public identifiers and digests, authorize tenant reads, and bind the effective snapshot through ConfigurationGenerationDetail.Bind.",
    "The platform seed exports configurationGenerationDetail in ck-7. React SchemaForm and Blazor HarborlineSchemaForm render that same definition and the producer's bindings in host read-only mode; the generation digest is distinct from package revisions.",
    "Preparation consumes ConfigurationGeneration.Resolve identities without re-deriving them. Its trusted host validator builds an isolated immutable projection against the expected complete baseline and checks every applicable compatibility dimension. Unknown compatibility refuses; missing validation never means success.",
    "A prepared token binds baseline, candidate, immutable projection reference and ownership read from the candidate's canonical snapshot. Preparation never changes the effective generation or confers authority.",
    "One activation request binds the prepared token, acting principal and evidence intent identity and reason. The switch decision rechecks the current complete baseline and resolves live Access authority for exactly that request. A stale baseline is a refusal, never an automatic retry.",
    "The API implements IConfigurationActivationTarget: under its atomic transaction, verify the projection and destination compatibility, check the baseline, authorize, and commit ownership, effective pointer, Access decision reference and reconstructable evidence intent together. All reads and writes pin one generation per unit of work.",
    "Evidence intent identity is tenant-scoped and binds the entire switch decision; conflicting reuse refuses. The API owns durable recovery and outbox publication. Lost commit acknowledgement is indeterminate, never a fabricated refusal or blind retry.",
    "The pure switch decision is not a commit. Only host confirmation after durable commitment yields an effective outcome. Refusal retains the observed current generation. Preparation and decision exceptions propagate without a success token or outcome.",
    "ck-7 exports configurationActivationDetail and configurationActivationStatuses. One released Form and vocabulary distinguish released, preparing, refused and effective in both SchemaForm lanes. Successful preparation remains preparing; a refused projection cannot bind as effective.",
    "DefinitionKeySuggester is advisory and never claims allocation authority.",
    "Archive state is isolated by exact tenant, DefinitionKind, and definition key.",
    "Archive and unarchive are idempotent and never delete authored definitions.",
    "Lifecycle state survives construction of a new store over the same durable path.",
    "Manifest item order is the replay order and bootstrap stages never decrease.",
    "Every dependency names an earlier item in the same manifest.",
    "A non-empty manifest begins with exactly one platform package record.",
    "The complete manifest is validated before one atomic apply-to-empty target call receives the ordered batch.",
    "The target commits every item or none and atomically refuses a non-empty target, including under concurrency or failure.",
    "The checked-in platform-pack.export.json is byte-identical to PlatformPackageSeed.Export and ships in the NuGet package.",
    "The canonical fixture contains ck-1 through ck-14 only; ck-15 is an external Access-pack boundary and ck-16 is verified through absence assertions.",
    "The fixture contains no first-authority source or preloaded Access-pack provenance kind while those DES-0007 rulings remain open.",
    "The 13 navigation ids and catalogue:read, records:read, and audit:read role offers preserve the current harborline-api platform export migration authority.",
    "Unresolved DES-0007 policy is represented as absent content and refused; this module does not invent a default.",
    "Package reattachment restores missing seeded safety floors, clamps lower integers, and refuses a present non-integer member by name.",
    "Pilot manager registration, handlers, navigation, and React snapshots are excluded app-host concerns."
