  "purpose": "Own schedule reservation coordination (caller-supplied stable reservation ids with global idempotency, exactly-one-wins under concurrency, fail-closed quorum-unavailable, lease-guarded writes) and the harvested planning seed: the prototype's finite-candidate compiler, validators, complete-pinned-fact admission, and constructive/exhaustive/greedy solvers with the 12-fixture authored corpus (ticket 084 dispositions). T-491 concern one: lone due date and four basis generators, distinct tolerance and validity windows, stable occurrence identities, and the moved append-only chain ledger.",
