    "nativeTestNote": "Reservation/planning coverage plus due generation, literal window classification, admission, per-series kernel clock, all four identities and migrated authored chain/ledger cases. Revision 9 adds 29 authoring/K9 and compatibility cases (all owned item IDs) consuming conformance/hlp.blocks.scheduling/authoring-refusals.json. T-1197/bounded-expansion adds literal window, override-horizon, work-budget, shared-preprocessing and rule-membership coverage, including both UTC range overflow directions for overrides and YEARLY/BYMONTHDAY due dates across February and March with COUNT from January, plus a UTC UNTIL midnight-rollback due-query case and direct public-source rule/override preprocessing refusal cases. Calendar composers remain untouched and off the work budget (control PR 1378; T-1202)."
  },
