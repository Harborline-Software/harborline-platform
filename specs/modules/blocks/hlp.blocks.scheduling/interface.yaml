  "callerInterface": {
    "name": "IScheduleReservationCoordinator / Planning (FixtureSchedulingValidator, FixtureConstructivePlanner) / ScheduleDefinitionCatalogue / IDueOccurrenceSource / IDueQueueQueryService / IRelativeChainExpansionService",
    "operations": [
      "ReserveAsync(SlotReservation) -> ReservationOutcome: happy-path acquires+releases the lease; a duplicate reservation id returns the prior outcome (idempotent, never rebinds to a new slot/resource); an inverted slot is rejected without a lease; an overlapping slot is rejected after the lease; quorum-unavailable blocks the write and returns a rejection",
      "CancelAsync(reservationId) -> bool: removes under the lease; quorum-unavailable returns false and leaves the reservation; unknown returns false with no lease attempt",
      "ListForResource(resourceId) -> reservations ordered by start",
      "Planning: parse/semantic-validate/canonicalize a fixture problem; compile named, versioned fact-set pins with explicit completeness; solve to a positive plan, an exact scheduling.unassigned.* fixture reason with non-empty explanation refs, or Indeterminate with PINNED_FACTS_INCOMPLETE naming incomplete fact sets or WORK_BUDGET_EXHAUSTED when complete pins exhaust the work budget",
      "Scheduling definitions (T-491 S1, DES-0022 ruling 8): ScheduleDefinitionCatalogue.Admission is the shared versioned-definition store's validator for DefinitionKind.Schedules at author and publish; SaveDraftAsync / PublishAsync / RestoreAsDraftAsync address a version by its semantic version (version id definition-id@semantic-version); PinHeadAsync pins the highest published semantic version and refuses scheduling.definition.no_published_head; ResolveAsync(ScheduleDefinitionPin) resolves only an exact published pin and refuses scheduling.definition.unpinned or scheduling.definition.not_found at /versionId",
      "Typed definition (revision 5, T-491/typed-definition, DES-0022 section 2): SaveDraftAsync takes a ScheduleDefinition and every catalogue read returns ScheduleDefinitionRevision(Revision, Definition) in place of an opaque body. ScheduleDefinition carries ScheduleDefinitionEnvelope (required past authoring, with a required Contract), name, starts (form, workflow or work_item), on_type_id, one basis (fixed_calendar with its RRULE text checked by the shared bounded-subset validator, completion_offset, threshold or event_anchored_chain with one external anchor), window, tolerance, grace, missed_behaviour (record_and_replan or window_closed), escalation, problem_class (None by default, or Workforce, Timetabling, ProtocolAdmission, Project, JobShop, Mobility or CompositeRecovery), modules and legality_ref. A window and a form with no basis are complete and name no solver (L1445). The window is two instants with no basis and two durations from the generated due point with one; a chain's nodes carry their own tolerance instead. Unknown members, kinds and literals refuse scheduling.definition.body_invalid; the named scheduling.definition.* codes refuse at their member's pointer. The store's document version is the one source of the envelope version: a stored envelope omits it and the catalogue fills it in on read, so a restored draft publishes under its own version. SchedulableTrait states the sealed trait, its three slots and AdmitsToPlanning. ScheduleDefinitionCatalogue.ContentKind reads kind 11 from PackContentKindRegistry.",
      "Solver binding (revision 12, scheduling-ck-26): ScheduleDefinition.Solver carries backend_id, parameters object, guarantee and work_budget separately from the problem class and modules. It is required for planning, versioned and resolved with the pinned definition; a schedule without a problem class needs none. Static Admission checks shape. Catalogue save and publish check the registered internal solver declarations and reuse SolverBackend.Validate for problem class, guarantee and budget. AddHarborlineSchedulingPlanRuns registers the catalogue against the same solver set; planning enters through PlanRun.",
      "IDueQueueQueryService.Query(DueOccurrenceRequest) -> instant-valued SchedulingOccurrences, using KernelClock once; per-series local start/zone; actual completion timestamps; explicit missing-reading and missing-first-due refusals.",
      "IRelativeChainExpansionService.Expand -> current and appended immutable revisions, explicit supersessions and failures, expected prior ledger version. One external anchor; ISO duration offsets and per-node validity windows.",
      "AddHarborlineSchedulingDueQueries registers IDueQueueQueryService independently of reservation coordination; the host supplies IRruleExpansionService via AddFoundationScheduling and its KernelClock.",
      "ConstraintModuleAdmission: elicited -> shape-candidate -> admitted -> backend-supported -> certified, one rung per Advance. The four admitted names are time_windows, resource_requirements, no_overlap and precedence. Unknown names or parameters refuse MODULE_UNSUPPORTED; precedence parameters are {constraints:[{id,beforeActivityId,afterActivityId,minimumGapSlots}]}. minimumGapSlots is required, even when zero. Other modules accept only absent or empty parameters. Duplicate names refuse at the duplicate member pointer. Authoring and publish refuse scheduling.definition.module_unsupported at /modules/{i}/module.",
      "FiniteCandidateCompiler.Compile(profile, definition, backend, guarantee, deterministicWorkBudget) compiles the Harborline-ruled Project or JobShop problem class into typed modules. Both built-in finite backends implement all four modules, with FeasibleProof or BoundedHeuristic respectively and an int.MaxValue maximum deterministic work budget. Unsupported problem classes, guarantees, budgets or modules refuse before enumeration, naming what is missing and required. The seven authored problem-class names are Harborline rulings, not an industry taxonomy.",
      "No module reaches certified. Advance to certified refuses MODULE_CERTIFICATE_UNDEFINED pending DES-0022 open ruling 3; nothing reports a module or proposal as certified. Execution requires backend-supported for the chosen backend. Existing proposal status and guarantee semantics are independent of certification.",
      "Internal SchedulePlanner.PlanAsync resolves an exact published ScheduleDefinitionPin, admits modules before enumeration or runtime reads, binds the explicit slot time axis and one distinct exclusive resource without buffers per resource id, then asks the shared IAvailabilityRuntime for each candidate full interval. Caller AvailableSlots are replaced; runtime refusals propagate and unavailable candidates are excluded. Both solvers require every typed module to be BackendSupported for their own backend; legacy profiles without modules keep working. Compiled problems carry the definition pin when present, and proposal identity includes its tenant, definition id and version while legacy identity is preserved without a pin. Scheduling never composes supply or references the calendar block. AddHarborlineSchedulingPlanRuns is the public planning registration and registers the catalogue, both existing backends and the internal planner; the host supplies the versioned definition store and IAvailabilityRuntime. Catalogue construction is internal and shares the registered solver set with the internal planner.",
      "SchedulingCrossPackageAuthoring.Check(ScheduleDefinition consumer, IReadOnlyList<CrossPackageReference> references, IReadOnlyList<PackageExposure> exposures) -> DefinitionRefusalReport at Author: host-resolved edges require consumer Envelope.Requires capabilities and matching producer exposure through the shared CrossPackageEdges check (scheduling-auth-28; T-724 ruling 57; control PR 1358). Same-package edges pass; undeclared dependencies, unexposed targets and incompatible version/digest refuse with Scheduling codes. A target is disclosed only when exposed. This authoring-only facade does not alter the static admission callback and has no publish/install authority (T-615).",
      "PlanRun.PlanAsync(principal, pin, facts, backendId, guarantee, deterministicWorkBudget, epoch, slotDuration, resources, causedBy?, cancellationToken) -> PlanRunResult: asks the host AccessProvider once for scheduling:plan against the schedule record before any run or planner read; denial returns the gate reason. PlanRun.Register registers plan-run under scheduling without a handler. Allowed runs use immediate-or-fail; every returned Proposal is saved in the scheduling journal under the run id before success. Before a Plan is saved, unsupported inputs dead-letter not-retryable, caller cancellation cancels, and unexpected planning errors dead-letter retries-exhausted. A BeginAttemptAsync failure cancels the pending run without failing an unbegun attempt. Cleanup failures attach as PlanRunCleanupError in the original exception Data and never replace it. After SavePlanAsync returns, a SucceedAsync failure propagates unchanged without cancelling or dead-lettering the run or removing its Plan. GetPlanAsync(tenant, runId) reloads the write-once Plan including exact schedule pin, caused_by, gate instant, fact pins and the complete Proposal.",
      "SchedulingPermissions: Author=scheduling:author, Plan=scheduling:plan, Commit=scheduling:commit; Declarations supplies exactly these three capabilities at version 1, with ScheduleRecordKind=schedule. AddHarborlineSchedulingPlanRuns is the sole public planning registration; SchedulePlanner, IPlanningSolver, DeterministicExhaustiveProofSolver, GreedyFirstFitSolver, AddHarborlineSchedulingPlanner and the PlanRun and ScheduleDefinitionCatalogue constructors are internal; the host supplies AccessProvider, RunLifecycle, TimeProvider, FileJournalSchedulingStore and registers the run kind once.",
      "Plan mediation (revision 14, T-491/plan-mediation): PlanRun is the only exported planning producer. FileJournalSchedulingStore.GetPlanAsync remains public as the store-port/reference-implementation read used by API EF adapters; it reloads a Plan and cannot plan. IPlanningSolver and both concrete solvers are internal so a caller cannot bypass the scheduling:plan gate through Solve. The shipped block grants internals only to Harborline.Blocks.Scheduling.Tests. The experiments reference the non-packable experiments/scheduling-decision-model/block project, which compiles the canonical scheduling sources with the experiment friend grants into its own bin and obj directories. The experiment copy keeps the Harborline.Blocks.Scheduling assembly identity and the same six project dependencies without duplicating solver source. Experiment references to the copy use PrivateAssets=all so it stays out of production-test dependency graphs, while each experiment references it directly. All experiment projects inherit repository build settings normally; no experiment flag or global property is used or propagated."
    ],
    "context": "The lease dependency is carried as a LOCAL narrow compatibility port under the Harborline.Kernel.Lease namespace because no lease kernel module exists in the platform catalog yet; composition replaces it with the ratified platform lease contract when one lands (recorded deviation, not a design endorsement). The planning seed is the ticket-084 harvest: corpus + solver seed, never a matrix module; the authored corpus carries the six unsatisfied-reason classes."
  },
  "invariants": [
    "Revision 6 (T-491/expression-environment, DES-0022 scheduling-ck-23, ADR 0099 decision 8): SchedulingExpressionEnvironment.Declaration states the constraint-expression environment in Rules' shared BorrowerEnvironmentDeclaration and is admitted by BorrowerEnvironmentAdmission; it equals the released scheduling-ck-23 entry in conformance/hlp.foundation.rule-runtime/borrower-contracts.json, canonical form included: variables field (candidate assignment or resource/chain/occurrence fact) and clock (planning clock), Rules' kernel functions without table aggregation, field-read the only effect, missing fields read null, the planning clock in UTC, the Run phase only, deterministic replay (scheduling-auth-14, scheduling-bound-5). The solver's inner loop stays local arithmetic and names no expression language, fenced by SchedulingInnerLoopArchitectureTests (scheduling-eng-11); attaching an expression to a constraint and evaluating it is a later slice.",
    "Reservation ids are caller-supplied and globally idempotent: a duplicate id returns the prior outcome and never rebinds to a different slot or resource.",
    "Under concurrent reservation of the same slot exactly one caller wins; disjoint resources all succeed.",
    "Quorum-unavailable fails closed on both reserve and cancel: no write occurs and the outcome says so.",
    "Solver outcomes are deterministic under contrasting ambient timezone configurations (cross-process TZ determinism — the planner reads no process-global time or zone).",
    "Direct finite profiles return ProvenInfeasible only after exhaustive search over complete pins for activities, time windows, resources, resource requirements, and precedence; a missing or incomplete pin returns Indeterminate and names each incomplete fact set. SchedulePlanner runtime reads carry no fact version, so its exhausted search returns Indeterminate with UNPINNED_AVAILABILITY_READS; found assignments remain proposals and commit re-reads availability (C8). DES-0022 open ruling 4 owns future fact pinning.",
    "Every unsatisfied authored fixture outcome carries at least one exact scheduling.unassigned.* reason and non-empty explanation references.",
    "The fixture manifest is static: exactly the 12 shipped fixture files, byte-exact against the pinned prototype blobs.",
    "Scheduling definitions carry semantic-version heads on the shared versioned-definition store (scheduling-ck-20); a published version is immutable, restore registers a new draft whose publication moves the head (scheduling-ck-21), and a consumer resolves only an exact published pin (scheduling-eng-1). L491's integer revisions are retired: a non-semantic version, a body revision member, a numeric body version or a version id not derived from the semantic version refuses, and a journal still holding a draft frame refuses at startup.",
    "A no-basis schedule carries its own due instant and may carry a window; a basis carries no lone due date. Every window contains due; chain windows sit on nodes.",
    "Calendar identity is series id plus original local recurrence date-time, without instant or node; completion-offset identity uses the completion id (or first), threshold uses the triggering reading and re-arm completion, chain uses its immutable node-ledger revision.",
    "Initial markers and caller completion ids have disjoint identity shapes; resolved instants are filtered only after padded nominal-date expansion handles midnight-crossing gaps.",
    "Revision 11 (T-1197/bounded-expansion): fixed-calendar queries allow at most 3660 inclusive series-local dates in the requested window, checked before expansion; a wider window refuses scheduling.occurrence.window_maximum_exceeded. One budgeted producer visit walks from the original anchor through the later of the padded end and originals of overrides whose new instant lands in the window (control PR 1372). Only relevant override originals are taken beyond the padded end, and only if produced by the rule. Overrides moved out never extend the walk. One 50000-unit budget spans input, overrides and the whole walk: each UTF-16 rule character is charged before generation admission parses selectors, every supplied override is charged before checking or resolving it, and every recurrence period and matched date is charged before filtering (control PR 1378). Budget refusal during preprocessing never calls the producer. Rule-bound metadata is null only when the rule text itself exceeds the available work before classification. The final result retains its 1000-occurrence cap; no path returns a truncated success. Scheduling translates every budget refusal, including direct RruleDueOccurrenceSource.DeriveDue budget creation and override preprocessing, to OccurrenceRefusalException with its stable code and all eight structured fields in Exception.Data, keyed by their property names.",
    "Revision 9 (T-491/schedule-refusals, DES-0022 section 4): recovery_replanning=true, any non-null regulator_rule_set_requirement and any non-null input_plan_id refuse at validate before draft history changes, at their member pointers. These nullable init-only intent properties preserve the existing 14-argument CLR constructor and Deconstruct, participate in record equality and retain their JSON wire names. They distinguish unsupported recovery, regulator-compliance obligations and plan-output input from admitted record_and_replan, legality_ref citations and within-plan precedence. False/absent recovery and absent unsupported requirements preserve existing definitions. The shared store callback applies these gates to raw and typed writes and every admission phase. Unknown configurations retain body_invalid; module_unsupported uses the existing ConstraintModuleAdmission set. fixed_calendar continues to use InMemoryRruleExpansionService.ValidateRule at save (DES-0057 ck-1/cc-1).",
    "The shared authoring-refusals.json corpus carries literal stable codes and RFC 6901 pointers with missing/required reasons for both editor lanes; tests execute those inputs through production admission or the K9 facade. It is data for consumers, not a second validator. Codes and pointers are localizable shared refusal envelopes; Target retains its existing exposed-definition-only meaning."
  ],
