{"schemaVersion":1,"moduleId":"hlp.ui.scroll-affordance","interfaceRevision":1,"semantics":{"operation":"render a labelled horizontal or vertical scroll region that exposes logical-edge fades, keyboard scrolling, optional snapping, and localized position announcements only while content overflows","observableOutput":"Equivalent overflow-dependent tab stop, group name, axis behavior, snap policy, logical fade mask, keyboard movement, live announcement, host attributes, and child content across projections."},"sourceSurface":{"repository":"shipyard","commit":"a5036ff8b500e0d857d7e0a698408e7cf7f6cf31","path":"packages/ui-react/src/components/layout/ScrollAffordance.tsx","blob":"0ef5117a775a44b6fb8e6bec14a86c8da9386329","capturedExports":["ScrollAffordance"],"carrierCallers":["apps/carrier/src/admin/AdminConsole.tsx","apps/carrier/src/admission/InvitePanel.tsx","apps/carrier/src/calendar/CalendarLegend.tsx","apps/carrier/src/routes/activity.tsx","apps/carrier/src/routes/data-import-preview.tsx","apps/carrier/src/routes/run-report.tsx","apps/carrier/src/scheduling/prototype/ScheduleBuilderPrototype.tsx"]},"authorityNote":"Revision 1 freezes the pinned component wrapper over the already-frozen hlp.ui.use-scroll-affordance policy; it does not duplicate geometry or localization rules.","dependencies":["hlp.ui.cn","hlp.ui.default-strings","hlp.ui.locale-provider","hlp.ui.use-scroll-affordance"],"designEvaluation":{"selected":"policy-backed-scroll-region","alternatives":[{"id":"policy-backed-scroll-region","ownership":"The module owns rendered group semantics, overflow axis, snap styling, conditional focusability, host attributes, live status, and delegation to the frozen scroll-affordance policy.","tradeoff":"Preserves one geometry policy and a small projection-specific observer shell."},{"id":"css-overflow-only","ownership":"Render overflow CSS without measuring or announcing it.","tradeoff":"Loses Harborline App keyboard, focus, fade, and accessible position behavior."}],"decision":"Select policy-backed-scroll-region and keep overflow calculations in hlp.ui.use-scroll-affordance."},"invariants":["ariaLabel is required and names a role=group scroll region.","Orientation defaults to horizontal; snap defaults false; fade size defaults to twenty-four CSS pixels.","The horizontal axis uses overflow-x auto and the vertical axis uses overflow-y auto without forcing the other axis to scroll.","Snap styling follows the selected axis and is absent when snap is false.","The region enters the tab order only while measured content overflows.","Arrow, Home, and End behavior delegates to the frozen logical scroll policy and unrelated keys remain untouched.","The fade mask appears only while overflow hides content and follows logical edges under RTL.","A separate polite atomic live region exposes the localized position message without duplicating visible content.","Children, class name, data attributes, and a forwarded element reference remain intact.","The module owns no item virtualization, business paging, content layout, or persistence."],"errors":[{"code":"missing-accessible-name","when":"ariaLabel is empty."},{"code":"invalid-fade-size","when":"fadeSize is negative or non-finite."},{"code":"invalid-item-count","when":"itemCount is negative or non-integral."}],"presentation":{"disposition":"required","gallery":"gallery/scenarios/hlp.ui.scroll-affordance.json"},"cases":[{"id":"scroll-affordance.component-defaults"},{"id":"scroll-affordance.component-horizontal"},{"id":"scroll-affordance.component-vertical"},{"id":"scroll-affordance.component-no-overflow"},{"id":"scroll-affordance.component-overflow-focus"},{"id":"scroll-affordance.component-keyboard"},{"id":"scroll-affordance.component-snap"},{"id":"scroll-affordance.component-fade"},{"id":"scroll-affordance.component-live-status"},{"id":"scroll-affordance.component-rtl"},{"id":"scroll-affordance.component-host-ref"},{"id":"scroll-affordance.component-replacement"},{"id":"scroll-affordance.component-projection-equivalence"}]}
