    "provenanceSources": ["base", "pack", "tenant", "instance", "unknown"]
  },
  "performance": {"operation": "O(n + e) projection for n outline nodes and e lens edges with no I/O", "maximumFixtureNodes": 1000, "maximumFixtureEdges": 4000},
