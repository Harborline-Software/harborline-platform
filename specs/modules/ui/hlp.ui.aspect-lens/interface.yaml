    "consumers": ["Dynamic Forms builder", "Workflows builder"],
    "hostDataPolicy": "The module projects host data and never stores form or workflow state."
  },
  "invariants": [
    "Canvas nodes have stable identifiers, host-defined kinds, localized labels, non-negative depth, and at most one outline parent.",
    "Graph consumers provide a deterministic spanning-tree outline; non-tree relationships are lens edges rather than additional parents.",
    "Selecting an outline node delegates exactly once to the host selection callback.",
    "A lens is data, not a host-specific component branch, and is either colorize or filter.",
    "Filter lenses ghost non-participating nodes without deleting structural context.",
    "Color is never the sole signal: participating states may pair a semantic tone with badge or title text.",
    "Provenance uses the closed base, pack, tenant, instance, unknown vocabulary and preserves the complete source chain.",
    "Unresolved provenance fails closed as source unknown, resolved false, and locked true.",
    "The contract performs no network, persistence, authorization, locale resolution, or theme-token resolution."
