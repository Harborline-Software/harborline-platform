  "invariants": [
    "Sections and fields render in FormView order; the renderer introduces no ordering of its own.",
    "A control hint resolves through an overridable registry whose text renderer is mandatory, so an unrecognised string hint falls back to text rather than failing.",
    "A structured value whose shape is not recognised fails closed to an unavailable output; the renderer never guesses a control for it.",
    "Rule outcomes project as exactly five effects: visibility, required, read-only, injected computed value, and presentation.",
    "A rule graph that is pending or errored blocks submission; the save gate is fail-closed.",
    "A validation error addressed by a one-segment JSON Pointer renders inline on that field; deeper pointers and form-level errors remain in the summary.",
    "The validation summary receives focus when a submission returns errors.",
    "Submission hands the complete candidate to the host; the renderer does not prune values of hidden fields, because pruning is the engine's decision and duplicating it would let the two disagree.",
    "Setting a value at a group or collection path leaves sibling values byte-identical.",
    "Collection cardinality is enforced from the FormView; add and remove are refused past the declared bounds rather than accepted and rejected later.",
    "Label, hint, and error text are caller-localized strings carried by the FormView and are never synthesised by the renderer.",
    "ReadOnly/readOnly renders admitted scalar values as output, removes the submit control, and refuses value, submission, and action callbacks; false preserves editing.",
    "Read-only multiselect admits only scalar values declared by the field options and renders caller-localized option labels; undeclared or non-scalar collections remain unavailable.",
    "Boolean is the checkbox renderer alias; hidden is intentionally nonvisual in both editable and host read-only modes.",
    "Host read-only structured values remain unavailable and are never stringified or flattened; sensitive and unreadable redaction takes precedence.",
    "Runtime editor verdicts None, SingleValue, ChoiceList, RadioGroup, RecordPicker and TaxonomyPicker have explicit renderers; they never fall through to text. The producer, not the renderer or an author, chooses cardinality and source policy.",
    "Canonical permittedValues, including an empty set, takes precedence over host option hints. Domain editors never offer additional host values or choose a default candidate.",
    "None offers no value editor. SingleValue and ChoiceList require explicit permitted selection; RadioGroup renders the permitted members as radios.",
    "RecordPicker and TaxonomyPicker search only the supplied authorized membership locally and render at most 25 matching choices. Query text is not a candidate value; only explicit permitted selection changes the candidate.",
    "Editable controls compose registered platform controls: domain searches use searchable SelectField, multiselect uses multiple SelectField, form/collection actions use Button, and remaining visible native-input kinds use Input. Semantic form, fieldset, legend, output and nonvisual hidden-input markup may remain native HTML.",
    "SchemaForm maps admitted field/runtime values and callbacks to platform controls; it owns no duplicate query draft, active-option index, listbox keyboard or popup dismissal implementation. Domain search uses only the supplied authorized membership with a 25-match render bound, and never accepts free text as a candidate.",
    "Platform-control substitution preserves explicit selection, empty-domain behavior, read-only and authority-denied rendering, field labels/errors, collection cardinality, disabled/no-op behavior, submission and action callback counts. Button visual treatment belongs to Button; SchemaForm styles action layout rather than reimplementing control appearance."
  ],
