{"schemaVersion":1,"moduleId":"hlp.ui.chat","interfaceRevision":1,"semantics":{"operation":"render an ordered accessible conversation with a controlled composer, suggestions, typing state, and host-provided message or empty content","observableOutput":"Equivalent message order and ownership, controlled submission requests, suggestion visibility, typing state, accessible conversation structure, locale direction, timestamps, and complete replacement across projections."},"sourceSurface":{"repository":"shipyard","commit":"a5036ff8b500e0d857d7e0a698408e7cf7f6cf31","path":"packages/ui-react/src/components/ai/Chat.tsx","blob":"f227e76a4ba1b264904b52b86c5afcd9697cb27f","capturedExports":["Chat","ChatMessage"],"carrierCallers":[{"path":"apps/carrier/src/copilot/CopilotPanel.tsx","blob":"394efdde7d823bac814d0998f7b5b5cff49ccd17"},{"path":"apps/carrier/src/copilot/CopilotFloatingWindow.tsx","blob":"e56b07953863cbf63cede5a26b6cd411ce9aa96a"}]},"authorityNote":"Revision 1 freezes the controlled Harborline App Copilot surface, not the complete latent Wave-N Chat API. Files, paging, pinning, reply, context menus, custom message boxes, and persistence remain outside this revision.","dependencies":["hlp.ui.default-strings","hlp.ui.locale-provider"],"designEvaluation":{"selected":"controlled-conversation","alternatives":[{"id":"controlled-conversation","ownership":"Platform owns ordered message semantics, explicit roles, controlled composer requests, suggestions, typing, accessible structure, and locale intent; hosts own transport and persistence.","tradeoff":"Matches both Harborline App callers and is fixtureable without importing AI or application workflow."},{"id":"complete-wave-n-port","ownership":"Platform owns every latent Chat prop, template, file action, toolbar, paging, scroll, pin, reply, and context-menu behavior.","tradeoff":"Would freeze unused accidental breadth and couple the seam to one React implementation."}],"decision":"Select controlled-conversation and defer broader application scope to additive revisions."},"invariants":["Messages preserve caller order and unique stable IDs; replacing the collection removes stale messages.","Explicit user, assistant, or system role determines ownership; localized author-name equality never determines alignment.","One named polite conversation log contains one focusable article per message.","The composer is rendered only when submit capability is supplied.","Click, Enter, and suggestion activation submit trimmed nonblank text exactly once and then request one controlled clear.","Composer-disabled suppresses every submission route.","Suggestions appear only before the first user message and retain caller order.","Streaming messages do not repeatedly announce partial text; an explicit typing status remains accessible.","ArrowUp and ArrowDown move focus between adjacent message articles without wrapping.","Default timestamps represent instants and use the active locale; explicit direction overrides locale-provider direction.","Message-content and no-data slots replace only their bounded content while retaining canonical shell semantics.","Root host attributes and styles are preserved.","The module owns no LLM call, conversation persistence, proposal execution, panel modality, or business workflow."],"errors":[{"code":"duplicate-message-id","when":"Two messages share an ID."},{"code":"controlled-composer-handler-required","when":"A controlled input value is supplied without an input-change handler."},{"code":"accessible-user-name-required","when":"A participant name is empty or whitespace-only."},{"code":"invalid-message-timestamp","when":"A timestamp cannot represent an instant."}],"presentation":{"disposition":"required","gallery":"gallery/scenarios/hlp.ui.chat.json"},"cases":[{"id":"chat.empty"},{"id":"chat.ordered-messages"},{"id":"chat.outgoing-incoming"},{"id":"chat.avatar-hidden"},{"id":"chat.controlled-input"},{"id":"chat.submit-click"},{"id":"chat.submit-enter"},{"id":"chat.submit-trim-empty"},{"id":"chat.submit-disabled"},{"id":"chat.suggestions-initial"},{"id":"chat.suggestion-submit"},{"id":"chat.suggestions-after-user-message"},{"id":"chat.typing"},{"id":"chat.streaming-announcement"},{"id":"chat.message-content-slot"},{"id":"chat.empty-slot"},{"id":"chat.keyboard-navigation"},{"id":"chat.locale-rtl-time"},{"id":"chat.host-attributes"},{"id":"chat.replacement"},{"id":"chat.invalid-input"},{"id":"chat.projection-equivalence"}]}
