{
  "schemaVersion": 1,
  "moduleId": "hlp.ui.scheduling-authoring",
  "interfaceRevision": 2,
  "semantics": {
    "operation": "Edit a producer-owned Schedule body and render supplied server refusals before publish. The host validates and owns storage and lifecycle.",
    "availability": "Read-only shared availability runtime; configuration belongs to Booking per Resource.",
    "valueDomains": "Resource, capability and calendar resolver binding is carried to workshop-mount: this editor selects references from host catalogues, while the app host owns resolver wiring. No resolver selection is persisted in ScheduleDefinition.",
    "numericInput": "Threshold text uses plain signed decimal notation within System.Decimal bounds, with at most 15 significant digits and normalized scale at most 28, and must retain its exact decimal value on the JSON number wire. Insignificant zeros and negative zero are normalized. Surrounding ASCII whitespace is trimmed and empty input clears to null. Work budget uses integral plain decimal notation within signed Int32 bounds. Invalid or inexact text leaves the body unchanged and presents an error; server admission remains authoritative."
  },
  "dependencies": [
    "hlp.ui.button"
  ],
  "invariants": [
    "No local admission or solver implementation.",
    "No automatic backend, module or chain-scope selection.",
    "Host-owned and unknown body members survive field edits."
  ],
