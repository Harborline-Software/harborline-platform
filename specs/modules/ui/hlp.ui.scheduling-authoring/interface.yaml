{"schemaVersion":1,"moduleId":"hlp.ui.scheduling-authoring","interfaceRevision":1,"semantics":{"operation":"author a Schedule definition draft locally and report each change with its local generation; saving, admission and publication stay with the host","grammar":"DES-0022 ScheduleDefinition as ScheduleDefinitionAdmission admits it: name, on_type_id, starts (form, workflow or work_item with a target), a single due_date or a basis (fixed_calendar, completion_offset, threshold, event_anchored_chain with ordered nodes), window, tolerance, missed_behaviour, problem_class, a bound solver (backend_id, guarantee, work_budget, parameters), constraint modules and legality_ref.","unauthoredMembers":"The envelope, grace, escalation, input plan, recovery replanning, any module after the first and any member the editor does not show are carried unchanged through every edit.","refusals":"Every admission refusal is listed in the Refusal list as its code at its pointer, with the field its pointer names when that field is on screen; an empty pointer reads as the whole definition. A polite live region announces refusals that were not in the previous set. Refusals render only for the exact identity, canonical revision and local generation.","supply":"Supply is shown read-only: it is read from the shared availability runtime, from each Resource's own availability source set in the Booking editor (scheduling-bound-6). No edit writes a member for it.","readOnly":"A read-only editor disables every control, including Keep and Discard, and emits nothing.","pendingEdits":"A new identity, version or expected revision replaces a clean draft silently. With local edits it waits behind Keep edits or Discard edits and never overwrites them.","revision":"The expected revision is a canonical ASCII decimal Int64 string carried byte-exactly and never parsed; a host draft with any other revision is refused, never repaired.","numbers":"Numbers are read with the JSON number grammar, invariantly; an emptied number removes its member and other text leaves the draft unchanged.","optionShapes":"Catalogue options are an id and label pair or a bare id that is also its label. A current value the host does not offer is shown as not offered.","hostSeam":"The screen renders the editor inside a host-supplied shell; the editor does no recurrence or interval arithmetic and calls no solver."},"dependencies":["hlp.ui.button"],"invariants":["Both lanes author the same Schedule from an empty draft and emit equal bodies, written from the ScheduleDefinition grammar.","Choosing a basis removes the single due date; choosing an event-anchored chain also removes the top-level window.","Each chain node states its scope in words, not by colour alone.","A solver guarantee is offered only from the chosen backend's declared guarantees.","Supply is never written by the editor."],"presentation":{"disposition":"required"},"cases":[{"id":"scheduling-authoring.schedule-from-nothing"},{"id":"scheduling-authoring.chain-from-nothing"},{"id":"scheduling-authoring.solver-and-module"},{"id":"scheduling-authoring.refusal-list"}]}
