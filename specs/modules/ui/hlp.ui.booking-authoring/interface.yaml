{"schemaVersion":1,"moduleId":"hlp.ui.booking-authoring","interfaceRevision":1,"semantics":{"operation":"author a Booking Resource or Bookable definition draft locally and report each change with its local generation; saving, admission and publication stay with the host","grammar":"DES-0025 Booking definitions as BookingDefinitionAdmission admits them: a Resource names from_type_id, capacity (exclusive, or pool with pool_size), setup and cleanup minutes, maintenance sources and an availability source; a Bookable names on_type_id, duration intervals, required Resources and a waitlist flag.","unauthoredMembers":"The envelope, hold policy, book_gate, eligibility_expression, require_all and any member the editor does not show are carried unchanged through every edit.","refusals":"Admission refusals render beside the field their pointer's first reference token names; any other pointer is listed with its pointer. Refusals render only for the exact identity, canonical revision and local generation.","readOnly":"A read-only editor disables every control, including Keep and Discard, and emits nothing.","pendingEdits":"A new identity, version or expected revision replaces a clean draft silently. With local edits it waits behind Keep edits or Discard edits and never overwrites them.","revision":"The expected revision is a canonical ASCII decimal Int64 string carried byte-exactly and never parsed; a host draft with any other revision is refused, never repaired.","numbers":"Numbers are read invariantly; an emptied number removes its member and text that is not a finite number leaves the draft unchanged.","optionShapes":"Catalogue options are an id and label pair or a bare id that is also its label. A current value the host does not offer is shown as not offered; an empty option list shows a named fallback.","hostSeam":"The screen renders the editor inside a host-supplied shell; the editors do no interval arithmetic and reference no calendar service."},"dependencies":["hlp.ui.button"],"invariants":["Both lanes author the same Resource and Bookable from an empty draft and emit equal bodies, which BookingDefinitionAdmission admits with no refusal.","Choosing exclusive capacity removes pool_size in the same edit.","Maintenance is chosen from host-offered record state, never authored as blocks.","Required resources keep the order they were chosen.","The waitlist is a flag only; clearing an absent flag writes nothing."],"presentation":{"disposition":"required"},"cases":[{"id":"booking-authoring.resource-from-nothing"},{"id":"booking-authoring.bookable-from-nothing"},{"id":"booking-authoring.refusals-by-field"}]}
