{"schemaVersion":1,"moduleId":"hlp.ui.records-authoring","interfaceRevision":2,"contribution":"Existing hlp.ui.button aggregate contribution (React and Blazor); no new package identity and no catalogue conformance status.","scope":"Local Record Type draft editing only. A bounded subset of T618, not T618 completion.","semantics":{"operation":"edit a Record Type draft body locally and report each local change; nothing is evaluated, saved, created or published","draft":"RecordsDraft = { identity, versionId, expectedRevision?, definitionKind?, body }. identity, versionId and expectedRevision are host-supplied lifecycle metadata shown read-only; expectedRevision is a string (see revision). definitionKind is 'Records' or absent; it is chosen before Name on an empty draft. body is the current producer Record Type body (snake_case members per RecordTypeDocument), carried as extensible JSON: every member the editor does not edit, including unknown members, is preserved as given.","edits":"definition kind on an empty draft; name; envelope.section; per field field_key and display_name; binding.kind kind_id+version chosen only from host-supplied kind options (no automatic selection); existing string and number binding.kind.parameters values only (other JSON types are carried unchanged; invalid numeric input does not change the draft); existing reference target_type_id, cardinality and on_delete with other reference members preserved; retention_clock_field_id chosen from the draft's field keys; adding a field with only field_key and display_name; removing a field.","notEdited":"binding.constraints (including the existing Boolean required floor), governance, defaults_provenance, traits, class_id, record_class, envelope members other than section, and any unknown member are carried unchanged. No required-condition property, null or false sentinel is written. No compatibility clearing or defaults materialization is applied when a kind or version changes.","revision":"expectedRevision is the producer draft revision as the disabled host contract transports it: a canonical ASCII decimal Int64 STRING, never a JSON number. Grammar: '0' or [1-9][0-9]* using ASCII digits only, at most 9223372036854775807 (no sign, no leading zero, no whitespace, no decimal point or exponent, no non-ASCII digit). Absent (omitted, or JSON null as the host wire's string? serializes it) means none and is carried unchanged; two absent revisions match. The editor carries it byte-exactly through clean replacement, held Keep/Discard, diagnostic matching and every change it reports; it never parses it to a number, rounds, increments, compares numerically or defaults it. Diagnostic matching compares it as an exact string.","rejection":"A host draft or diagnostic set whose expectedRevision is present but not canonical (including a JSON number, an empty string or a value above 9223372036854775807) is rejected, never repaired: the draft is not adopted or held and the diagnostics are not shown, nothing is reported, and the current draft, dirty state, generation and any held draft are unchanged. While the host value is rejected the editor shows a status note. With no earlier acceptable value there is no draft to edit; the first acceptable value is then loaded as the initial draft, at the initial generation.","change":"onDraftChange / DraftChanged receives { draft, generation } after every local edit and after Discard. It reports local state only; it does not persist anything.","generation":"A local numeric counter that advances on every local edit, on a clean incoming replacement and on Discard. It is owned by the editor, is separate from the revision and is never derived from, compared with or written into it. The current value is also exposed as data-generation on the editor form.","incoming":"A host value whose identity, versionId or expectedRevision differs from the current draft replaces a clean draft. A dirty draft holds it behind an inline Keep edits / Discard edits choice. A host echo with the same identity, versionId and expectedRevision is not a replacement and does not reset dirty state.","diagnostics":"Optional host-supplied { identity, expectedRevision?, generation, diagnostics: [{ code, pointer, target? }], warnings?: [{ code, pointer }] }, such as a producer publication preview (RecordTypePreflight: refusals and warnings). Rendered verbatim and in order only when identity, expectedRevision (exact string) and generation all equal the current draft; otherwise neither list is shown. A diagnostic with a non-empty target renders as '<code> at <pointer> for <target>' with the target verbatim, and carries it as data-target; without one (absent, null or empty) it renders exactly as in revision 1, '<code> at <pointer>'. Warnings render as '<code> at <pointer>' in their own list (aria-label Warnings), preceded by the visible note 'Warnings do not block publication.', apart from the diagnostics (aria-label Diagnostics), whose revision-1 rendering is unchanged, and are never presented as refusals or as blocking; absent warnings mean none. The editor never computes, reorders, merges or invents diagnostics, warnings or producer refusals. Revision 2 (T-618 item 4, records-auth-42): target and warnings added; existing hosts that send neither are unchanged.","readOnly":"A local host flag. It disables every control and makes every edit handler a no-op, so no change is reported. It is not an authorization decision and grants nothing."},"dependencies":["hlp.ui.button"],"invariants":["No Save, Create, Publish, Preview or evaluation action, callback or request type exists.","A local change never implies persistence.","Stale diagnostics (identity, revision or generation mismatch) are never shown.","Unedited body members, known or unknown, round-trip unchanged.","No permission names are read or invented.","The revision round-trips byte-exactly; it is never parsed, rounded, incremented, defaulted or repaired, and a noncanonical one is rejected."],"sourceFixtures":"conformance/hlp.ui.records-authoring/source-fixtures (records-current-grammar.json, records-refusal-cases.json, records-parity-inputs.json, manifest.json)","cases":[{"id":"records-authoring.kind-before-name"},{"id":"records-authoring.local-edit-preserves-body"},{"id":"records-authoring.supplied-diagnostics-verbatim"},{"id":"records-authoring.incoming-and-stale-generation"},{"id":"records-authoring.kind-version-change-local"},{"id":"records-authoring.read-only-no-emission"},{"id":"records-authoring.lossless-revision"}]}
