{"schemaVersion":1,"moduleId":"hlp.ui.records-authoring","interfaceRevision":4,"contribution":"Existing hlp.ui.button aggregate contribution (React and Blazor); no new package identity and no catalogue conformance status.","scope":"Local Record Type draft editing only. A bounded subset of T618, not T618 completion.","semantics":{"operation":"edit a Record Type draft body locally and report each local change; nothing is evaluated, saved, created or published","draft":"RecordsDraft = { identity, versionId, expectedRevision?, definitionKind?, body }. identity, versionId and expectedRevision are host-supplied lifecycle metadata shown read-only; expectedRevision is a string (see revision). definitionKind is 'Records' or absent; it is chosen before Name on an empty draft. body is the current producer Record Type body (snake_case members per RecordTypeDocument), carried as extensible JSON: every member the editor does not edit, including unknown members, is preserved as given.","edits":"definition kind on an empty draft; name; envelope.section; per field field_key and display_name; binding.kind kind_id+version chosen only from host-supplied kind options (no automatic selection); existing string and number binding.kind.parameters values only (other JSON types are carried unchanged; invalid numeric input does not change the draft); existing reference target_type_id, cardinality and on_delete with other reference members preserved; revision 4 references: 'Make field N a reference' on a field with neither a binding nor a reference adds an empty reference, and 'Remove reference from field N' deletes it; the target kind is chosen as Record type or Class (or 'Not set', which removes both targets), keeping an existing value of the chosen kind and removing the other target member, because a reference names exactly one target; a reference carrying both target members as strings (empty included) shows 'Both targets present (choose one)' and both target controls; a reference or binding member that is not an object is treated as absent, and non-string cardinality, on_delete or target_type_id shows as not set (an empty Record type target); the Record type target is the existing free-text target_type_id; the Class target is chosen only from host-supplied class options or 'Not set' (an empty target_class_id), a current class not offered shown as '(not offered)' and kept; the parent checkbox writes parent true or false, the canonical form; pin and required_trait_id are carried unchanged; retention_clock_field_id chosen from the draft's field keys; revision 3 header: class_id chosen only from host-supplied class options or 'Not set' (absent), a current class the host does not offer shown as '(not offered)' and kept; record_class chosen from reference, master or transactional; creation_gate chosen from form_only, role or engine, or 'Not set (form_only)' (absent), and choosing any gate other than role also removes creation_role_id in the same edit because the producer refuses a creation role on another gate; for the role gate only, creation_role_id chosen only from host-supplied role options or 'Not set' (absent), a current role the host does not offer shown as '(not offered)' and kept; amendment_policy present as reason_required:true (checkbox 'Amendments require a reason', other policy members kept) or absent, with mode chosen from supersession or 'No mode' (absent) while present; history_policy 'enabled' (checkbox 'Keep history') or absent. A policy the host draft already declares (amendment_policy with reason_required:true, or history_policy 'enabled') cannot be removed here and its checkbox is disabled, because the producer has no 'off' value and save carries an omitted declaration forward from the stored revision (ADR-0097); on a draft not yet created (empty identity) CreateDraftAsync sets an absent or null policy (the producer reads JSON null as absent), so such a policy shows checked and disabled, choosing a mode with no amendment_policy or a null one writes { reason_required: true, mode }, the draft's own body decides what is declared (a malformed value stays repairable, and once admitted cannot be unchecked), and while either checkbox is locked this way the note 'Creation sets any policy that is not set, so it cannot be turned off.' is shown; a policy added locally to an existing draft that had none can be removed again; only a non-empty string is a header value, so an empty or non-string class_id, record_class, creation_gate, creation_role_id or mode, or an amendment_policy that is not an object, shows as not set and stays unchanged unless edited, and a history_policy other than 'enabled' shows unchecked; adding a field with only field_key and display_name; removing a field.","notEdited":"binding.constraints (including the existing Boolean required floor), governance, defaults_provenance, traits, envelope members other than section, and any unknown member are carried unchanged. No required-condition property, null or false sentinel is written. No compatibility clearing or defaults materialization is applied when a kind or version changes.","revision":"expectedRevision is the producer draft revision as the disabled host contract transports it: a canonical ASCII decimal Int64 STRING, never a JSON number. Grammar: '0' or [1-9][0-9]* using ASCII digits only, at most 9223372036854775807 (no sign, no leading zero, no whitespace, no decimal point or exponent, no non-ASCII digit). Absent (omitted, or JSON null as the host wire's string? serializes it) means none and is carried unchanged; two absent revisions match. The editor carries it byte-exactly through clean replacement, held Keep/Discard, diagnostic matching and every change it reports; it never parses it to a number, rounds, increments, compares numerically or defaults it. Diagnostic matching compares it as an exact string.","rejection":"A host draft or diagnostic set whose expectedRevision is present but not canonical (including a JSON number, an empty string or a value above 9223372036854775807) is rejected, never repaired: the draft is not adopted or held and the diagnostics are not shown, nothing is reported, and the current draft, dirty state, generation and any held draft are unchanged. While the host value is rejected the editor shows a status note. With no earlier acceptable value there is no draft to edit; the first acceptable value is then loaded as the initial draft, at the initial generation.","change":"onDraftChange / DraftChanged receives { draft, generation } after every local edit and after Discard. It reports local state only; it does not persist anything.","generation":"A local numeric counter that advances on every local edit, on a clean incoming replacement and on Discard. It is owned by the editor, is separate from the revision and is never derived from, compared with or written into it. The current value is also exposed as data-generation on the editor form.","hostOptions":"Optional host-supplied classOptions [{ classId }] and roleOptions [{ roleId }] (revision 3), like kindOptions: the editor only offers them and never selects, defaults or invents a class or role. Absent options mean none are offered. creation_role_id stays the landed bare domain-role string of the creation policy (decision D1); this revision does not change it.","incoming":"A host value whose identity, versionId or expectedRevision differs from the current draft replaces a clean draft. A dirty draft holds it behind an inline Keep edits / Discard edits choice. A host echo with the same identity, versionId and expectedRevision is not a replacement and does not reset dirty state.","diagnostics":"Optional host-supplied { identity, expectedRevision?, generation, diagnostics: [{ code, pointer, target? }], warnings?: [{ code, pointer }] }, such as a producer publication preview (RecordTypePreflight: refusals and warnings). Rendered verbatim and in order only when identity, expectedRevision (exact string) and generation all equal the current draft; otherwise neither list is shown. A diagnostic with a non-empty target renders as '<code> at <pointer> for <target>' with the target verbatim, and carries it as data-target; without one (absent, null or empty) it renders exactly as in revision 1, '<code> at <pointer>'. Warnings render as '<code> at <pointer>' in their own list (aria-label Warnings), preceded by the visible note 'Warnings do not block publication.', apart from the diagnostics (aria-label Diagnostics), whose revision-1 rendering is unchanged, and are never presented as refusals or as blocking; absent warnings mean none. The editor never computes, reorders, merges or invents diagnostics, warnings or producer refusals. Revision 2 (T-618 item 4, records-auth-42): target and warnings added; existing hosts that send neither are unchanged.","readOnly":"A local host flag. It disables every control and makes every edit handler a no-op, so no change is reported. It is not an authorization decision and grants nothing."},"dependencies":["hlp.ui.button"],"invariants":["No Save, Create, Publish, Preview or evaluation action, callback or request type exists.","A local change never implies persistence.","Stale diagnostics (identity, revision or generation mismatch) are never shown.","Unedited body members, known or unknown, round-trip unchanged.","No permission names are read or invented.","The revision round-trips byte-exactly; it is never parsed, rounded, incremented, defaulted or repaired, and a noncanonical one is rejected."],"sourceFixtures":"conformance/hlp.ui.records-authoring/source-fixtures (records-current-grammar.json, records-refusal-cases.json, records-parity-inputs.json, manifest.json)","cases":[{"id":"records-authoring.kind-before-name"},{"id":"records-authoring.local-edit-preserves-body"},{"id":"records-authoring.supplied-diagnostics-verbatim"},{"id":"records-authoring.incoming-and-stale-generation"},{"id":"records-authoring.kind-version-change-local"},{"id":"records-authoring.read-only-no-emission"},{"id":"records-authoring.lossless-revision"}]}
