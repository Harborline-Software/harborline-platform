{"schemaVersion":1,"moduleId":"hlp.ui.text-box","interfaceRevision":1,"semantics":{"operation":"edit a raw string through a controlled or uncontrolled text input with optional clear and password-reveal actions, FormField metadata, validation, prefix and suffix content, host input attributes, locale direction, touch targets, and canonical appearance variants","observableOutput":"Equivalent value ownership, exact change payloads, clear and reveal behavior, form identity and relationships, validation and disabled state, host attributes and keyboard events, prefix and suffix order, localized labels, direction, touch sizing, appearance, focus, and complete replacement across projections."},"sourceSurface":{"repository":"shipyard","commit":"a5036ff8b500e0d857d7e0a698408e7cf7f6cf31","path":"packages/ui-react/src/components/forms/TextBox.tsx","blob":"89955c64285275275bbee43ca8b916c0cb7c1b91","capturedExports":["TextBox"],"carrierCallers":["apps/carrier/src/asset-tree/AssetTree.tsx","apps/carrier/src/asset-types/AssetTypeEditor.tsx","apps/carrier/src/asset-types/AssetTypesList.tsx","apps/carrier/src/calendar/CalendarPicker.tsx","apps/carrier/src/documents/editor/DocumentCanvas.tsx","apps/carrier/src/documents/editor/DocumentPreviewPanel.tsx","apps/carrier/src/documents/manager/DocumentsManagerList.tsx","apps/carrier/src/documents/manager/NewTemplateDialog.tsx","apps/carrier/src/forms/builder/BuilderTopBar.tsx","apps/carrier/src/forms/builder/FieldConfigurator.tsx","apps/carrier/src/forms/builder/RuleBuilder.tsx","apps/carrier/src/forms/formControls.ts","apps/carrier/src/forms/manager/FormsManagerList.tsx","apps/carrier/src/forms/manager/NewFormDialog.tsx","apps/carrier/src/invoices/detail/InvoiceDetail.tsx","apps/carrier/src/invoices/manager/InvoicesManagerList.tsx","apps/carrier/src/invoices/manager/NewInvoiceForm.tsx","apps/carrier/src/pack-composer/PackComposer.tsx","apps/carrier/src/parties/PartyWorkspace.tsx","apps/carrier/src/rules/editor/DecisionTableEditor.tsx","apps/carrier/src/rules/editor/FormulaEditor.tsx","apps/carrier/src/rules/editor/RulePreviewPanel.tsx","apps/carrier/src/rules/manager/NewRuleDialog.tsx","apps/carrier/src/rules/manager/RulesManagerList.tsx","apps/carrier/src/scheduling/product/FrontOfficeRehearsal.tsx","apps/carrier/src/scheduling/product/SchedulingHome.tsx","apps/carrier/src/scheduling/product/SimpleEventForm.tsx","apps/carrier/src/workflows/builder/ElementConfigurator.tsx","apps/carrier/src/workflows/builder/SimulationPreview.tsx","apps/carrier/src/workflows/manager/NewWorkflowDialog.tsx","apps/carrier/src/workflows/manager/WorkflowsManagerList.tsx"]},"authorityNote":"Revision 1 preserves the pinned TextBox and Input surface used by Harborline App while closing two accessibility gaps: action buttons remain keyboard reachable and disabled password controls cannot reveal. Arbitrary input attributes target the input, not an adapter wrapper.","dependencies":["hlp.ui.default-strings","hlp.ui.form-field","hlp.ui.input","hlp.ui.locale-provider"],"designEvaluation":{"selected":"input-composition","alternatives":[{"id":"input-composition","ownership":"TextBox owns string state, clear/reveal actions, FormField merge, and action labels while hlp.ui.input owns input appearance, host attributes, prefix/suffix composition, touch sizing, and focus treatment.","tradeoff":"Preserves one input authority and adds only TextBox-specific behavior."},{"id":"provider-text-box","ownership":"Expose Telerik or React-specific TextBox props and templates.","tradeoff":"Breaks package replacement and duplicates the existing Input seam."}],"decision":"Select input-composition; provider APIs, debounce, persistence, and business validation remain outside the interface."},"invariants":["Supplying value selects controlled mode; omitting value selects uncontrolled mode initialized once from defaultValue or the empty string.","Native input changes emit the exact new string once; uncontrolled mode also updates internal state, while controlled mode waits for caller replacement.","Clear appears only when enabled, requested, and the effective value is nonempty; activation emits the empty string exactly once and retains focus in the text-entry group.","Password reveal appears only for type=password when requested; it toggles only the rendered type, preserves the value and selection when possible, and uses localized show or hide labels.","Clear and reveal are keyboard reachable, have at least forty-four CSS pixel coarse-pointer targets, and are disabled or absent when the input is disabled.","Explicit required, disabled, invalid or error, ID, and described-by values take precedence over FormField context; missing values may come from that context.","error and invalid normalize to one visual and aria-invalid state.","Input ID, name, autocomplete, placeholder, tab index, ARIA attributes, and keyboard handlers target the native text input; class name targets the root input composition according to hlp.ui.input semantics.","Caller key handlers run once after the TextBox internal key behavior and may prevent caller-owned actions.","Prefix precedes the input and suffix follows it; TextBox actions compose after a caller suffix without discarding it.","Direction follows locale context unless an explicit host direction is supplied; clear and reveal labels follow instance, catalog, then fallback precedence.","Canonical sizes are sm, md, and lg; deprecated small, medium, and large aliases normalize to them. Fill modes are solid, outline, and flat; rounding is small, medium, large, or full.","Required, invalid, disabled, focus, hover, filled, password-revealed, and clearable states remain perceivable without relying on motion or color alone.","Complete controlled replacement never leaves stale text, reveal state does not change the value, and no request is duplicated.","The module owns no parsing, debounce, validation message, persistence, calculation, schema rule, or provider option."],"errors":[{"code":"conflicting-value-mode","when":"Both value and defaultValue are supplied and the adapter cannot preserve controlled precedence."},{"code":"unsupported-input-type","when":"A provider cannot represent the requested native text input type without changing value semantics."}],"presentation":{"disposition":"required","gallery":"gallery/scenarios/hlp.ui.text-box.json"},"cases":[{"id":"text-box.defaults"},{"id":"text-box.controlled-change"},{"id":"text-box.uncontrolled-default"},{"id":"text-box.default-once"},{"id":"text-box.external-replacement"},{"id":"text-box.clear-visible"},{"id":"text-box.clear-action"},{"id":"text-box.clear-disabled"},{"id":"text-box.password-reveal"},{"id":"text-box.reveal-disabled"},{"id":"text-box.form-context"},{"id":"text-box.validation"},{"id":"text-box.host-input-attributes"},{"id":"text-box.keyboard-handler"},{"id":"text-box.prefix-suffix-actions"},{"id":"text-box.locale-rtl-labels"},{"id":"text-box.targets-focus"},{"id":"text-box.appearance"},{"id":"text-box.replacement"},{"id":"text-box.projection-equivalence"}]}
