  "semantics":{"operation":"open a trigger-owned action menu, navigate enabled entries, invoke one action, and dismiss deterministically","observableOutput":"Menu-button ARIA state, ordered items and separators, active enabled item, and at most one action invocation."},
  "sourceSurface":{"repository":"shipyard","commit":"a5036ff8b500e0d857d7e0a698408e7cf7f6cf31","path":"packages/ui-react/src/components/buttons/ActionMenu.tsx","blob":"41095c89f29cf88784160562bdd791ca6e6e5ecd","capturedExports":["ActionMenu","ActionMenuProps","ActionMenuEntry","ActionMenuItem"]},
