  "invariants":[
    "The trigger exposes aria-haspopup menu, aria-expanded, and an id-linked aria-controls value.",
    "The menu starts closed; pointer click toggles it and ArrowDown, ArrowUp, Home, or End can open it with deterministic focus.",
    "Arrow navigation wraps and skips separators and disabled entries; Home, End, and printable-character typeahead select enabled entries.",
    "Enter and Space invoke the active enabled entry exactly once and close the menu.",
    "Escape and selection close and restore trigger focus, Tab closes without trapping focus, and outside pointer closes without stealing focus from its target.",
    "Disabled entries remain native-disabled and never invoke or close the menu.",
    "Separators are semantic and never participate in focus order.",
    "Left and right alignment map to logical start and end under RTL.",
    "The default trigger has a localized accessible name; custom triggers retain their original click and key handlers.",
    "An empty or all-disabled menu keeps focus on the trigger and remains safely dismissible.",
    "A menu with nothing to draw renders a declared empty message in place of entries and keeps its trigger; an all-disabled menu still draws its items.",
    "Destructive styling and optional decorative icons do not alter action semantics.",
    "Every composed menu carries a scope: an omitted scope id resolves to the nearest scope host and then to the shell root surface, so a scope can expose neither two homes nor a menu without one."
  ],
