{"schemaVersion":1,"moduleId":"hlp.ui.app-layout","interfaceRevision":1,"semantics":{"operation":"compose one application shell with optional header and navigation, one required main landmark, responsive rail-to-drawer adaptation, and explicit scroll ownership","observableOutput":"Equivalent landmark structure, navigation instance and mode, controlled state requests, drawer lifecycle, focus, breakpoint transitions, header behavior, scroll ownership, reflow, safe areas, and direction in React and Blazor."},"sourceSurface":{"repository":"shipyard","commit":"a5036ff8b500e0d857d7e0a698408e7cf7f6cf31","path":"packages/ui-react/src/components/layout/AppLayout.tsx","blob":"42e0ded82ecd7b556c7eb5dfc5ec3e38afdf22a1","capturedExports":["AppLayout","AppLayoutProps"]},"dependencies":["hlp.ui.cn","hlp.ui.icon-button","hlp.ui.touch-target","hlp.ui.use-is-mobile","hlp.ui.use-media-query"],"invariants":["The shell renders exactly one main landmark with stable id main; required body content appears once and the content column has min-width zero.","Optional Header and SideNav content are opaque host-owned slots and each mounted slot appears at most once.","SideNavMode is rail, overlay, hidden, or auto and defaults auto; hidden mounts no navigation or navigation trigger.","Rail capability is the exact query min-width 768 CSS pixels and min-height 600 CSS pixels.","Rail mode renders one retained navigation subtree when rail-capable, with 240 CSS pixel expanded width and 64 CSS pixel collapsed width controlled by SideNavOpen.","Below rail capability, rail and auto modes expose exactly one logical-leading hamburger and one modal drawer; the navigation subtree is never duplicated in a legacy overlay.","Overlay mode uses one modal drawer at every viewport; auto uses rail when capable and the drawer otherwise.","MobileNavOpen may be controlled or uncontrolled; interactions request state change exactly once and controlled rendering continues to follow the supplied value.","Escape, scrim or outside pointer, and close control dismiss the modal drawer and restore trigger focus; focus is contained while open.","Crossing from drawer viewport into a rail-capable viewport closes the drawer and emits at most one close request without stale callbacks.","HeaderFixed defaults false; fixed header remains at block-start and reserves layout space without obscuring main content.","ContentScroll is main or page and defaults main; exactly one declared owner receives vertical scrolling and wide body content remains reachable without page-level overflow.","Navigation trigger and close targets are at least 44 CSS pixels; drawer and rail use logical inline-start in either direction.","Safe-area insets at block-start, inline-start, inline-end, and block-end are applied to shell chrome without changing semantic structure.","Host attributes remain on the shell root; MobileNavLabel is caller-overridable or locale-catalog-backed and names trigger and drawer.","The module owns no route table, navigation selection, authentication, authorization, page content state, or platform-window chrome."],"errors":[{"code":"app-layout-body-required","when":"Required body content is absent."},{"code":"unsupported-side-nav-mode","when":"SideNavMode is outside rail, overlay, hidden, or auto."},{"code":"unsupported-content-scroll","when":"ContentScroll is outside main or page."}],"performance":{"operation":"O(1) shell structure plus opaque O(n) body and navigation content","maximumFixtureNavigationItems":256,"maximumFixtureUpdates":96},"presentation":{"disposition":"visual"},"cases":[{"id":"app-layout.body"},{"id":"app-layout.header"},{"id":"app-layout.defaults"},{"id":"app-layout.hidden"},{"id":"app-layout.rail-expanded"},{"id":"app-layout.rail-collapsed"},{"id":"app-layout.rail-boundary"},{"id":"app-layout.portrait-drawer"},{"id":"app-layout.landscape-drawer"},{"id":"app-layout.uncontrolled-mobile"},{"id":"app-layout.controlled-mobile"},{"id":"app-layout.viewport-transition"},{"id":"app-layout