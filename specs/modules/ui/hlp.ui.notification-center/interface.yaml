{"schemaVersion":1,"moduleId":"hlp.ui.notification-center","interfaceRevision":1,"semantics":{"operation":"summarize caller-owned notifications behind an accessible bell, filter them by kind, and dispatch bounded item actions","observableOutput":"Equivalent badge and bell labels, dialog state, ordered groups/items, action callbacks, dismissal, truncation, and focus behavior in React and Blazor."},"sourceSurface":{"repository":"shipyard","commit":"a5036ff8b500e0d857d7e0a698408e7cf7f6cf31","path":"packages/ui-react/src/components/navigation/NotificationCenter.tsx","blob":"3abe871588062bc22b5eac2131e33e2b9fec414a","capturedExports":["NotificationCenter","NotificationCenterItem"]},"dependencies":["hlp.ui.cn","hlp.ui.popover","hlp.ui.touch-target","hlp.ui.use-is-mobile","hlp.ui.use-media-query"],"invariants":["Items are caller-owned, preserve caller order, require unique stable ids, and are never mutated, persisted, marked read, or removed internally.","The bell is a dialog trigger with expanded and controls relationships and a caller-localizable accessible label derived from unread, pending-proposal, and badge mode counts.","Unread mode shows the unread count; decisions mode shows the pending proposal count, otherwise a nonnumeric dot for unread informational items; numeric overflow is bounded at 99+ and formatting is caller-injectable.","Opening moves focus into the dialog; Escape, outside pointer, trigger toggle, proposal decision, and View all close it, and dismissal restores trigger focus except when outside-pointer focus belongs to the target.","Explicit groups preserve caller order and labels; absent groups are derived from first kind appearance. Tabs exist only for multiple groups and filtering never reorders items.","Proposal items expose Confirm and Deny and invoke only the selected callback once before close; informational and custom items expose the optional action callback without close.","Mark all read exists only when unread items and a callback both exist; per-item dismiss exists only for nonproposal rows with a callback; View all exists when supplied or when filtered items exceed maxVisible.","maxVisible defaults to 10 and truncates after filtering without dropping history from caller state.","Title, body, preview, actor, timestamp display text, kind, and read state are preserved; the module performs no date or number formatting beyond injected formatters.","All visible chrome and title-qualified action labels are caller-overridable or locale-catalog-backed; direction uses logical edges.","The bell target grows to at least 44 CSS pixels whenever the application rail cannot be shown.","The module owns no notification transport, authorization, approval admission, persistence, routing, or domain-specific command execution."],"errors":[{"code":"duplicate-notification-id","when":"Two items use the same stable id."},{"code":"invalid-notification-limit","when":"maxVisible is negative or non-finite."},{"code":"accessible-notification-label-required","when":"The effective bell or dialog label is empty."}],"performance":{"operation":"O(n + g) counting, grouping, filtering, and rendering for n items and g groups","maximumFixtureItems":500},"presentation":{"disposition":"visual"},"cases":[{"id":"notification-center.empty"},{"id":"notification-center.badge-unread"},{"id":"notification-center.badge-decisions"},{"id":"notification-center.overflow-format"},{"id":"notification-center.open-close"},{"id":"notification-center.dismissal-focus"},{"id":"notification-center.groups"},{"id":"notification-center.filter"},{"id":"notification-center.proposal"},{"id":"notification-center.informational"},{"id":"notification-center.mark-read"},{"id":"notification-center.dismiss-item"},{"id":"notification-center.limit-view-all"},{"id":"notification-center.localization"},{"id":"notification-center.rtl-touch"},{"id":"notification-center.invalid-input"},{"id":"notification-center.projection-equivalence"}]}
