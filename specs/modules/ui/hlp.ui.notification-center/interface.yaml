{"schemaVersion":1,"moduleId":"hlp.ui.notification-center","interfaceRevision":2,"semantics":{"operation":"summarize caller-owned notifications behind an accessible bell, filter them by kind, and dispatch bounded item actions","observableOutput":"Equivalent badge and bell labels, dialog state, ordered groups/items, action callbacks, dismissal, truncation, and focus behavior in React and Blazor."},"sourceSurface":{"repository":"shipyard","commit":"a5036ff8b500e0d857d7e0a698408e7cf7f6cf31","path":"packages/ui-react/src/components/navigation/NotificationCenter.tsx","blob":"3abe871588062bc22b5eac2131e33e2b9fec414a","capturedExports":["NotificationCenter","NotificationCenterItem"]},"dependencies":["hlp.ui.cn","hlp.ui.default-strings","hlp.ui.locale-provider","hlp.ui.popover","hlp.ui.touch-target","hlp.ui.use-is-mobile","hlp.ui.use-media-query"],"invariants":["Items are caller-owned, preserve caller order, require unique stable ids, and are never mutated, persisted, marked read, or removed internally.","The bell is a dialog trigger with expanded and controls relationships and a caller-localizable accessible label derived from unread, pending-proposal, and badge mode counts. Without a caller label, the default comes from the locale catalog: navigation.notifications.bell.pending.<category> or navigation.notifications.bell.unread.<category>, where the category is the effective locale's cardinal plural category for the count and other is the fallback key, interpolated with {title} and the caller-formatted {count}; for each key in that order, blank or missing host text falls back to the same key in the default catalog, and a key absent from both falls through to the next; a zero count names the bell with the title alone.","Unread mode shows the unread count; decisions mode shows the pending proposal count, otherwise a nonnumeric dot for unread informational items; numeric overflow is bounded at 99+ and formatting is caller-injectable.","Opening moves focus into the dialog; Escape, outside pointer, trigger toggle, proposal decision, and View all close it, and dismissal restores trigger focus except when outside-pointer focus belongs to the target.","Explicit groups preserve caller order and labels; absent groups are derived from first kind appearance. Tabs exist only for multiple groups and filtering never reorders items.","Proposal items expose Confirm and Deny and invoke only the selected callback once before close; informational and custom items expose the optional action callback without close.","Mark all read exists only when unread items and a callback both exist; per-item dismiss exists only for nonproposal rows with a callback; View all exists when supplied or when filtered items exceed maxVisible.","maxVisible defaults to 10 and truncates after filtering without dropping history from caller state.","Title, body, preview, actor, timestamp display text, kind, and read state are preserved; the module performs no date or number formatting beyond injected formatters.","All visible chrome, the group tab list name, and title-qualified action labels are caller-overridable and otherwise come from the locale catalog (navigation.notifications.*: the host catalog, else hlp.ui.default-strings); direction uses logical edges.","Caller label text is preserved exactly, even when it equals a default; blank caller or catalog text is no text and falls back to the next source, so no name is empty. Projections whose labels are one record (Blazor) treat the unsupplied default record as absent caller text and a supplied record as caller text. An unset group tab list name also comes from the catalog.","The bell target grows to at least 44 CSS pixels whenever the application rail cannot be shown.","The module owns no notification transport, authorization, approval admission, persistence, routing, or domain-specific command execution."],"errors":[{"code":"duplicate-notification-id","when":"Two items use the same stable id."},{"code":"invalid-notification-limit","when":"maxVisible is negative or non-finite."},{"code":"accessible-notification-label-required","when":"The effective bell or dialog label is empty."}],"performance":{"operation":"O(n + g) counting, grouping, filtering, and rendering for n items and g groups","maximumFixtureItems":500},"presentation":{"disposition":"visual"},"cases":[{"id":"notification-center.empty"},{"id":"notification-center.badge-unread"},{"id":"notification-center.badge-decisions"},{"id":"notification-center.overflow-format"},{"id":"notification-center.open-close"},{"id":"notification-center.dismissal-focus"},{"id":"notification-center.groups"},{"id":"notification-center.filter"},{"id":"notification-center.proposal"},{"id":"notification-center.informational"},{"id":"notification-center.mark-read"},{"id":"notification-center.dismiss-item"},{"id":"notification-center.limit-view-all"},{"id":"notification-center.localization"},{"id":"notification-center.catalog-defaults"},{"id":"notification-center.caller-text-exact"},{"id":"notification-center.bell-catalog"},{"id":"notification-center.rtl-touch"},{"id":"notification-center.invalid-input"},{"id":"notification-center.projection-equivalence"}]}
