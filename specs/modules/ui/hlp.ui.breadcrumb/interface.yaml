    "Items retain caller order and caller-owned localized labels; callers should provide stable item identity.",
    "When current is omitted, only the final item is inferred current; an explicit current value wins.",
    "An item with a destination renders a link only when it is not current; all other items render non-link text.",
    "The current item exposes aria-current=page and non-current items do not.",
    "Separators appear only between items, are hidden from assistive technology, and default to a direction-neutral chevron.",
    "An empty collection renders nothing at all: no navigation landmark, no list, no sentence. A trail with no crumbs names no location, so the component declines to render rather than emitting an empty landmark.",
    "The navigation landmark has the localized accessible label supplied by the host adapter, with a stable Breadcrumb fallback.",
    "The ordered list wraps without truncating labels at 200 percent zoom and uses logical spacing in RTL.",
    "Consumer class, id, lang, dir, data, and aria attributes are preserved on the root navigation landmark.",
    "Every non-link item carries hl-breadcrumb__text and the current item additionally carries hl-breadcrumb__text--current, the only current-item selector the shared stylesheet defines."
