{"schemaVersion":1,"moduleId":"hlp.ui.search-input","interfaceRevision":1,"semantics":{"operation":"edit a controlled search term locally, publish debounced changes, and clear immediately","observableOutput":"Equivalent searchbox value, busy state, debounce cancellation, localized labels, clear behavior, and logical layout in React and Blazor."},"sourceSurface":{"repository":"shipyard","commit":"a5036ff8b500e0d857d7e0a698408e7cf7f6cf31","path":"packages/ui-react/src/components/structural/SearchInput.tsx","blob":"4592ff663080af3f2ee62c4bb5ba0575ae126cae","capturedExports":["SearchInput","SearchInputProps"]},"dependencies":["hlp.ui.cn","hlp.ui.default-strings","hlp.ui.locale-provider","hlp.ui.touch-target"],"invariants":["The host value initializes the local draft and any later external value replaces the draft and cancels a pending publication.","Typing updates the local draft immediately, marks the region busy, replaces any pending timer, and publishes only the latest value once after the non-negative debounce delay.","Clear cancels pending publication, empties the draft, clears busy state, and publishes the empty string exactly once without waiting.","The clear button exists only for a nonempty draft, has a localized accessible name, and owns at least a 44 by 44 CSS-pixel target.","The native input is type search with searchbox semantics; its accessible name and placeholder resolve from caller text before the locale catalog default.","Direction and icon/control placement use logical edges and do not alter value or callback ordering.","Unmount cancels pending work and publishes nothing.","The module owns no query execution, filter syntax, persistence, result list, or server cancellation."],"errors":[{"code":"invalid-debounce-delay","when":"debounceMs is negative or non-finite."}],"performance":{"operation":"O(1) per edit with at most one pending timer and no I/O"},"presentation":{"disposition":"visual"},"cases":[{"id":"search-input.defaults"},{"id":"search-input.typing"},{"id":"search-input.coalesce"},{"id":"search-input.busy"},{"id":"search-input.external-sync"},{"id":"search-input.clear"},{"id":"search-input.empty"},{"id":"search-input.localization"},{"id":"search-input.rtl"},{"id":"search-input.unmount"},{"id":"search-input.invalid-delay"},{"id":"search-input.projection-equivalence"}]}
