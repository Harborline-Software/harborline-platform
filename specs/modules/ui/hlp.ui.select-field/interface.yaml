{"schemaVersion":1,"moduleId":"hlp.ui.select-field","interfaceRevision":1,"semantics":{"operation":"render one controlled, named select trigger and listbox popup with caller-owned options and optional controlled open state","observableOutput":"Equivalent selected value, popup lifecycle, option navigation, relationships, validation metadata, callbacks, sizing, dismissal, and direction behavior in React and Blazor."},"sourceSurface":{"repository":"shipyard","commit":"a5036ff8b500e0d857d7e0a698408e7cf7f6cf31","path":"packages/ui-react/src/components/forms/SelectField.tsx","blob":"7bed632d289df0f1714e03f9f153be5af47208b5","capturedExports":["SelectField","SelectOption","SelectFieldSize"]},"dependencies":["hlp.ui.cn","hlp.ui.default-strings","hlp.ui.form-field","hlp.ui.locale-provider"],"invariants":["Name is required stable control identity; Value and ordered Options are caller-owned and selection requests the chosen string exactly once.","An empty selection displays the caller placeholder or the locale catalog select placeholder when absent; selected display text is the matching caller option label.","The trigger exposes expanded and controls relationships; while open, one listbox contains one option per ordered unique value.","Open may be host-controlled; an interaction requests open-state change while rendered state continues to follow the supplied controlled value.","Disabled state native-disables the trigger and prevents open and value callbacks.","Error and required state are exposed as validation metadata; Form Field label, hint, error, required, and disabled context flow to the control with local values taking precedence.","Accessible name, described-by order, tab index, focus and blur callbacks, and host attributes reach the interactive trigger.","Canonical sizes are sm, md, and lg with md default and do not alter semantics.","Arrow keys, Home, End, Enter, Space, and typeahead provide deterministic listbox navigation and exactly-once selection.","Escape, Tab, and outside pointer close the popup; Escape restores trigger focus, Tab is not trapped, and outside-pointer focus remains on its target.","Popup width is at least the trigger width and remains viewport-clamped under zoom, reflow, and expanded content.","Direction uses logical trigger-icon, checkmark, and popup alignment while option DOM order remains unchanged.","Name is frozen as control identity; native browser form serialization is not promised until package-consumer evidence proves it.","The module owns no option loading, persistence, validation rules, authorization, or domain-specific filtering."],"errors":[{"code":"select-field-name-required","when":"Name is empty."},{"code":"duplicate-select-option-value","when":"Two options use the same stable value."},{"code":"unsupported-select-field-size","when":"Size is outside sm, md, or lg."}],"performance":{"operation":"O(n) rendering and typeahead matching for n options","maximumFixtureOptions":500},"presentation":{"disposition":"visual"},"cases":[{"id":"select-field.placeholder"},{"id":"select-field.explicit-placeholder"},{"id":"select-field.selected"},{"id":"select-field.identity"},{"id":"select-field.open"},{"id":"select-field.select"},{"id":"select-field.controlled-open"},{"id":"select-field.disabled"},{"id":"select-field.invalid-required"},{"id":"select-field.form-field"},{"id":"select-field.sizes"},{"id":"select-field.keyboard"},{"id":"select-field.dismissal"},{"id":"select-field.rtl"},{"id":"select-field.projection-equivalence"}]}
