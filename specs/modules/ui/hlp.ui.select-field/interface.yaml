  "semantics": {
    "operation": "render a controlled named single- or multiple-choice field, optionally searchable, over caller-owned options",
    "observableOutput": "Equivalent selected value, popup lifecycle, option navigation, relationships, validation metadata, callbacks, sizing, dismissal, and direction behavior in React and Blazor."
  },
  "sourceSurface": {
    "repository": "shipyard",
    "commit": "a5036ff8b500e0d857d7e0a698408e7cf7f6cf31",
    "path": "packages/ui-react/src/components/forms/SelectField.tsx",
