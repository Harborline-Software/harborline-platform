  "designEvaluation": {
    "selected": "extend-select-field",
    "evidence": "docs/evidence/t621-control-composition.md",
    "alternatives": [
      {
        "id": "extend-select-field",
        "ownership": "Keep option identity, selected state, listbox interaction, field metadata and popup lifecycle with their existing owner; reuse Input for editable search.",
        "tradeoff": "Adds explicit selection/search axes and tests their combinations while preserving the default single-select interface."
      },
      {
        "id": "separate-combobox-and-multiselect",
        "ownership": "New public owners for editable search and multiple selection.",
        "tradeoff": "No distinct source, authorization or persistence responsibility justifies duplicating options, navigation, dismissal, labels and popup layout. Rejected for this scope."
      },
      {
        "id": "schema-form-composition",
        "ownership": "SchemaForm combines SearchInput or Input with Popover and CheckBox.",
        "tradeoff": "Leaves query-versus-selection, listbox keyboard state and field accessibility duplicated in the consumer; moves markup without moving shared behavior. Rejected."
      },
      {
        "id": "reuse-spotlight",
        "ownership": "Adapt modal command palette actions into field selection.",
        "tradeoff": "Modal focus, action invocation and ranked sections conflict with an inline form field and controlled candidate values. Rejected."
      }
    ],
    "decision": "Extend the existing SelectField interface; create no new component identity. Domain membership resolution and authorization remain outside UI."
  }
