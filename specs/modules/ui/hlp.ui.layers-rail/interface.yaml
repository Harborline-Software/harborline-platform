{"schemaVersion":1,"moduleId":"hlp.ui.layers-rail","interfaceRevision":1,"semantics":{"operation":"orchestrate host-owned canvas structure, lens state, provenance, and localized rail chrome into one keyboard-operable layers rail","observableOutput":"Equivalent active/passive lens controls, mode status, outline tree, selection, collapse/focus state, provenance, and insert requests in React and Blazor."},"sourceSurface":{"repository":"shipyard","commit":"a5036ff8b500e0d857d7e0a698408e7cf7f6cf31","path":"packages/builder-kit/src/LayersRail.tsx","blob":"af1134239f1bda55f464488cd7b593a135e780f6","capturedExports":["LayersRail","LayersRailProps"]},"dependencies":["hlp.ui.aspect-lens","hlp.ui.layers-state","hlp.ui.rail-labels","hlp.ui.tone-style"],"invariants":["Canvas, lens, layers-state, provenance, and labels use the already-frozen dependency interfaces; Layers Rail owns presentation and interaction choreography but no host document state.","The rail is a named complementary region with a lens group above one outline tree and preserves caller lens and node order.","Activating a lens makes it the single active lens and enables it; toggling the eye changes passive enablement without invoking activation.","Number keys 1 through 9 scoped inside the lens group activate the corresponding lens; Escape clears active state without disabling passive lenses.","A noncompact active lens exposes a polite Viewing status and an exit button; compact mode omits text chrome while retaining accessible names and state.","The outline implements roving tabindex tree semantics: Up and Down move, Right expands or enters, Left collapses or moves to parent, Home and End jump, and Enter or Space select exactly once.","Collapsing an ancestor of the focused node moves focus to the nearest visible ancestor rather than the document body.","Filter lenses ghost nonparticipating nodes without removing structural context; active badges and passive counts preserve text signals in addition to tone.","Provenance is optional presentation; unresolved provenance fails closed and locked state is not communicated by color alone.","Insert is absent without a callback and invokes exactly once when present; selection, lens, and insert callbacks remain host-owned.","showProvenance defaults true and compact defaults false; lens switches preserve node identity, selection, scroll, and focus.","The module owns no form/workflow domain branch, persistence, authorization, localization runtime, provenance resolution, or canvas mutation."],"errors":[{"code":"duplicate-layer-identity","when":"Lens or canvas-node identifiers are duplicated."},{"code":"invalid-outline-tree","when":"Depth, parent relationships, or selected identity cannot form the frozen single-parent outline."},{"code":"accessible-rail-label-required","when":"The effective rail, lens-group, or outline name is empty."}],"performance":{"operation":"O(n*l + e) rendering for n visible nodes, l enabled lenses, and e outline relationships","maximumFixtureNodes":1000,"maximumFixtureLenses":9},"presentation":{"disposition":"visual"},"cases":[{"id":"layers-rail.structure"},{"id":"layers-rail.lenses"},{"id":"layers-rail.active-status"},{"id":"layers-rail.toggle"},{"id":"layers-rail.shortcuts"},{"id":"layers-rail.compact"},{"id":"layers-rail.outline"},{"id":"layers-rail.tree-keyboard"},{"id":"layers-rail.collapse-focus"},{"id":"layers-rail.selection"},{"id":"layers-rail.filter-badges"},{"id":"layers-rail.provenance"},{"id":"layers-rail.insert"},{"id":"layers-rail.empty"},{"id":"layers-rail.continuity"},{"id":"layers-rail.invalid-input"},{"id":"layers-rail.projection-equivalence"}]}
