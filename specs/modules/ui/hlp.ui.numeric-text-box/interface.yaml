{"schemaVersion":1,"moduleId":"hlp.ui.numeric-text-box","interfaceRevision":1,"semantics":{"operation":"edit a nullable numeric value through a raw text buffer, commit on Enter or blur, clamp committed values, expose optional step controls, and render the non-editing value with locale-aware plain, currency, or percentage formatting","observableOutput":"Equivalent controlled or uncontrolled value state, raw edit buffer, strict parsing, clamping, stepping, formatting, callbacks, accessibility, locale direction, appearance, and complete replacement across projections."},"sourceSurface":{"repository":"shipyard","commit":"a5036ff8b500e0d857d7e0a698408e7cf7f6cf31","path":"packages/ui-react/src/components/forms/NumericTextBox.tsx","blob":"e2dd9b047e6a0500670efb7718783179d5a0f69b","capturedExports":["NumericTextBox"],"carrierCallers":[{"path":"apps/carrier/src/asset-types/AssetTypeEditor.tsx","blob":"a5e8f324e80330532477928666448843afc40a91"}]},"authorityNote":"Revision 1 preserves all application-controlled numeric uses and the pinned formatting/editing surface. It deliberately closes source gaps: strict full-string parsing replaces parseFloat prefixes, c0 means zero fraction digits, readOnly never emits, and Enter suppresses a duplicate blur commit.","dependencies":["hlp.ui.default-strings","hlp.ui.locale-provider"],"designEvaluation":{"selected":"nullable-formatted-editor","alternatives":[{"id":"nullable-formatted-editor","ownership":"Platform owns nullable controlled/uncontrolled state, raw/display phases, parsing, clamping, formatting intent, stepping, accessibility, and callback order; projections own Intl or Culture formatting adapters.","tradeoff":"A deep but provider-neutral module that matches Harborline App and remains swappable."},{"id":"native-number-input","ownership":"Delegate state, parsing, formatting, and spinners to native type=number or Telerik NumericTextBox.","tradeoff":"Cannot preserve formatted display, nullable state, raw edit buffering, callback timing, or cross-provider parity."}],"decision":"Select nullable-formatted-editor; do not alias the shallow number field or expose Telerik options."},"invariants":["Null means empty and zero is a real value.","Supplying value, including explicit null, selects controlled mode; omitting value selects uncontrolled mode initialized once from defaultValue.","Uncontrolled mode updates internal state on commit or spinner activation; controlled mode only requests a new value.","Focus copies the current value into an invariant ungrouped undecorated raw buffer.","Typing changes only the raw buffer and emits no value request.","Blur and Enter strictly parse the complete trimmed decimal or exponent string, clamp it, and emit at most one commit request; empty or invalid text commits null.","Step affects spinner activation only and never rounds or snaps typed values.","A spinner starts from current or zero, applies signed step, then clamps; a button at an active bound is disabled and emits nothing.","readOnly hides spinners and never emits; disabled retains but disables controls and never emits.","The input remains type text with decimal input mode in display and edit states.","Plain, currency, and percentage formats use active or explicit locale; currency uses an ISO code; c0 and p0 mean zero fraction digits.","Direction comes from locale context; a formatting-locale override does not independently change direction.","Canonical sizes are sm, md, and lg; deprecated small, medium, and large aliases normalize to them.","Fill modes are solid, outline, and flat; rounding is small, medium, large, or full.","Required and invalid semantics target the textbox; ID and name target the form value, while host classes and attributes target the root.","The module owns no calculation rule, dynamic form schema, currency conversion, persistence, validation message, or Telerik/provider option."],"errors":[{"code":"invalid-min-max","when":"Minimum exceeds maximum."},{"code":"invalid-step","when":"Step is non-finite or not positive."},{"code":"invalid-decimals","when":"Decimals is outside zero through twenty."},{"code":"invalid-bound","when":"A minimum or maximum is non-finite."},{"code":"invalid-controlled-value","when":"A supplied value is non-finite."}],"presentation":{"disposition":"required","gallery":"gallery/scenarios/hlp.ui.numeric-text-box.json"},"cases":[{"id":"numeric-text-box.defaults"},{"id":"numeric-text-box.controlled-value"},{"id":"numeric-text-box.controlled-null"},{"id":"numeric-text-box.uncontrolled-default"},{"id":"numeric-text-box.focus-raw"},{"id":"numeric-text-box.typing-buffer"},{"id":"numeric-text-box.blur-commit"},{"id":"numeric-text-box.enter-commit"},{"id":"numeric-text-box.empty-invalid-commit"},{"id":"numeric-text-box.controlled-request"},{"id":"numeric-text-box.default-value-once"},{"id":"numeric-text-box.external-update"},{"id":"numeric-text-box.focus-blur-order"},{"id":"numeric-text-box.commit-clamp"},{"id":"numeric-text-box.spinner-step"},{"id":"numeric-text-box.spinner-null-anchor"},{"id":"numeric-text-box.spinner-bound-disabled"},{"id":"numeric-text-box.step-not-snap"},{"id":"numeric-text-box.formatting"},{"id":"numeric-text-box.locale-rtl-labels"},{"id":"numeric-text-box.disabled-readonly"},{"id":"numeric-text-box.validation-identity"},{"id":"numeric-text-box.appearance"},{"id":"numeric-text-box.replacement"},{"id":"numeric-text-box.projection-equivalence"}]}
