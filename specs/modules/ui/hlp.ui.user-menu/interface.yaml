{"schemaVersion":1,"moduleId":"hlp.ui.user-menu","interfaceRevision":1,"semantics":{"operation":"render one identity trigger and an ordered account-action surface using menu semantics for simple entries or dialog semantics when custom content is present","observableOutput":"Equivalent identity display, initials, trigger and panel state, ordered entries, action/link/custom behavior, sign-out, keyboard model, dismissal, focus, placement, touch sizing, and direction in React and Blazor."},"sourceSurface":{"repository":"shipyard","commit":"a5036ff8b500e0d857d7e0a698408e7cf7f6cf31","path":"packages/ui-react/src/components/navigation/UserMenu.tsx","blob":"5a352539d66987ccc3a12ec4e73f0969d8277068","capturedExports":["UserMenu","UserMenuItem"]},"dependencies":["hlp.ui.cn","hlp.ui.popover","hlp.ui.touch-target","hlp.ui.use-is-mobile","hlp.ui.use-media-query"],"invariants":["Structured Identity with required Name and optional Email, Role, and AvatarUri is authoritative; deprecated flat projection props may only normalize into it.","When AvatarUri is absent, initials use the first grapheme of first and last nonempty name segments, or the first two graphemes of a single segment.","Items preserve caller order and stable unique identities; action, link, custom, and separator are the closed entry kinds.","A surface containing only action, link, and separator entries uses a complete nonmodal menu pattern with roving focus, Up, Down, Home, End, Enter, Space, Escape, and printable-character navigation.","Any custom entry changes the surface to a nonmodal dialog so embedded native controls retain their own semantics and keyboard behavior.","Disabled entries remain visible, are skipped by menu navigation, and never navigate or invoke callbacks.","Action activation invokes exactly once; link activation preserves its destination; CloseOnSelect defaults true and may keep either action or custom content open.","Sign out is appended after ordered items only when supplied, uses the localized SignOut label, invokes exactly once, and closes.","Trigger, panel, and sign-out labels are caller-overridable or locale-catalog-backed and every trigger name includes the user identity.","Trigger toggle, Escape, and outside pointer close the surface; close restores trigger focus except when outside-pointer focus belongs to the target.","Placement is top or bottom with bottom default; alignment is inline-start, center, or inline-end and uses logical direction.","When the application rail cannot be shown, the trigger target is at least 44 CSS pixels without changing avatar scale.","Avatar failure falls back to initials without changing the accessible trigger name.","The module owns no authentication, session termination, profile persistence, route authorization, or avatar fetching policy."],"errors":[{"code":"user-menu-name-required","when":"Identity Name is empty."},{"code":"duplicate-user-menu-item-id","when":"Two nonseparator entries use the same stable identity."},{"code":"invalid-user-menu-entry","when":"An entry lacks the fields required by its kind."}],"performance":{"operation":"O(n) rendering and enabled-entry navigation for n items","maximumFixtureItems":100},"presentation":{"disposition":"visual"},"cases":[{"id":"user-menu.identity"},{"id":"user-menu.initials"},{"id":"user-menu.avatar"},{"id":"user-menu.closed"},{"id":"user-menu.toggle"},{"id":"user-menu.simple-pattern"},{"id":"user-menu.custom-pattern"},{"id":"user-menu.ordered-entries"},{"id":"user-menu.selection"},{"id":"user-menu.keep-open"},{"id":"user-menu.custom-keep-open"},{"id":"user-menu.disabled"},{"id":"user-menu.sign-out"},{"id":"user-menu.dismissal-focus"},{"id":"user-menu.keyboard-menu"},{"id":"user-menu.keyboard-dialog"},{"id":"user-menu.placement"},{"id":"user-menu.rtl-touch"},{"id":"user-menu.localization"},{"id":"user-menu.invalid-input"},{"id":"user-menu.projection-equivalence"}]}
