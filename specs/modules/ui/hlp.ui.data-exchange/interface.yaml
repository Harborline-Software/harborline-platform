{"schemaVersion":1,"moduleId":"hlp.ui.data-exchange","interfaceRevision":4,"semantics":{"operation":"author an inbound Data Exchange definition and emit host-owned discovery, dry-run, and commit intents","profile":"hl:tabular-mapping/v1","schemaUri":"https://schemas.harborline.software/mapping/tabular/v1","documentVersion":"1.0.0","credentials":"The editor accepts only an opaque secret reference and never a credential value.","replayPolicies":["append","overwrite","append_dedup"],"promotion":"Commit is enabled only for a current persisted dry run when the host grants commit authority.","readOnly":"A read-only admission disables every authoring control and every host intent, including save, publish, dry run and commit; persisted run evidence stays visible.","identityHierarchy":"Persisted run evidence renders distinct dry-run, commit-run, batch, effect, and attempt scopes. Missing post-review identities remain named rather than being conflated with the dry run.","pendingEdits":"A new definition identity or expected revision is adopted silently only when the author has no pending edits. Otherwise the editor keeps the local draft, names the revision change, withholds every host intent until the author keeps or discards the edits, and emits the incoming draft on discard.","optionShapes":"Catalogue options are either an id and label pair or a bare id that is also its label; an omitted format catalogue falls back to CSV.","exchangeRecordType":"The exchange names its catalogue-supplied canonical Records contract independently of individual mapping rows.","columnExtensions":"The ten admitted hl: terms are authored per column: hl:target and hl:transform use the existing target-pointer and transform controls; hl:operation, hl:entityType, hl:identity, hl:role, hl:matchPolicy, hl:onInvalid, hl:onMissing and hl:errorPolicy retain their profile string values in extensions. The host owns immutable profile admission and execution.","runEvidence":"The host supplies the server terminal result, six census counts, IsStale, DriftReason and RetentionClass from DryRunEvidence (foundation PR 460). The editor displays these values without deriving a census or a terminal status; commit authorization remains host-owned.","layout":"Container-relative sm (below 40rem), md (40rem), and lg (64rem) arrange one, two and three columns and reflow at 320 CSS pixels. No authorable numeric constraints are introduced. Neither lane composes a versioned Forms definition; the HTML form is only a native event boundary and the Form-pin clause is not applicable."},"dependencies":[],"invariants":["The profile family, immutable schema URI, and initial document version are visible and not caller-editable.","Mappings terminate at catalogue-supplied canonical Records contracts.","The source and format are separately named capabilities; source discovery can be narrowed before mapping without mutating connector state in the component.","The component invokes host callbacks and performs no acquisition, persistence, authorization, or target write itself.","Stale or absent dry runs and refused commit authority fail closed.","Run results expose normalized census, refusal, staleness, and checkpoint evidence without requiring raw source payloads.","Both lanes render the server census, staleness, status, distinct dry-run, commit, batch, effect and attempt identities, and checkpoint verbatim; the persisted run evidence section contains no editable control.","An empty discovered source shape, an empty mapping list and an absent dry run each render a named fallback in their section."],"presentation":{"disposition":"required"},"cases":[{"id":"data-exchange.authoring"},{"id":"data-exchange.stale-review"},{"id":"data-exchange.read-only"},{"id":"data-exchange.pending-revision"},{"id":"data-exchange.run-evidence"},{"id":"data-exchange.partial-failure"},{"id":"data-exchange.from-empty"}]}
