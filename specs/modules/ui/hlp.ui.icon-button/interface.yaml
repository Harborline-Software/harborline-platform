{"schemaVersion":1,"moduleId":"hlp.ui.icon-button","interfaceRevision":1,"semantics":{"operation":"invoke one icon-only command through an accessible native button","observableOutput":"Equivalent naming, activation suppression, busy state, sizing, appearance, form type, and focus behavior."},"sourceSurface":{"repository":"shipyard","commit":"a5036ff8b500e0d857d7e0a698408e7cf7f6cf31","path":"packages/ui-react/src/components/buttons/IconButton.tsx","blob":"aeb3d95e15cf5640d5d0b3ae860cf2f325bf1b36","capturedExports":["IconButton"]},"dependencies":["hlp.ui.cn","hlp.ui.touch-target"],"invariants":["A nonblank accessible name is required and exposed by the native button.","The native button defaults to type button, preserves an explicit button, submit, or reset type, and invokes at most once per activation.","Disabled and loading states use native disabled semantics and are inert; loading exposes aria-busy and replaces the visual icon with a decorative indicator without inventing a live-region announcement.","Appearance is closed to default, ghost, outline, and destructive.","Size is closed to sm, md, lg, and touch; every size retains at least a 44 by 44 CSS-pixel hit target while touch has an explicit 44 by 44 visual box.","The caller owns the icon fragment, ref, form binding, and host attributes; the module owns command semantics and state styling.","Icon Button does not reuse Button loading semantics because pinned Icon Button is natively disabled while loading."],"errors":[{"code":"accessible-name-required","when":"The accessible name is empty or whitespace-only."}],"presentation":{"disposition":"required","gallery":"gallery/scenarios/hlp.ui.icon-button.json"},"cases":[{"id":"icon-button.invoke"},{"id":"icon-button.disabled-noop"},{"id":"icon-button.loading-noop"},{"id":"icon-button.accessible-name"},{"id":"icon-button.form-type"},{"id":"icon-button.variants"},{"id":"icon-button.sizes"},{"id":"icon-button.touch-target"},{"id":"icon-button.host-attributes"},{"id":"icon-button.projection-equivalence"}]}
