{"schemaVersion":1,"moduleId":"hlp.ui.input","interfaceRevision":1,"semantics":{"operation":"render one host-bindable text-like input with normalized appearance, optional adornments, and responsive touch sizing","observableOutput":"Equivalent value, attributes, events, appearance axes, adornment layout, invalid styling, and touch-target behavior in React and Blazor."},"sourceSurface":{"repository":"shipyard","commit":"a5036ff8b500e0d857d7e0a698408e7cf7f6cf31","path":"packages/ui-react/src/components/forms/Input.tsx","blob":"4861232e9373bdcd8eda8b98d4b3848235e29e22","capturedExports":["Input","InputProps"]},"dependencies":["hlp.ui.cn","hlp.ui.touch-target","hlp.ui.use-can-show-master-detail","hlp.ui.use-media-query"],"invariants":["The rendered value remains host-controlled and an input event requests the new string exactly once.","Input type, id, name, placeholder, direction, autocomplete, autofocus, required, disabled, readonly, input mode, spellcheck, described-by, accessible label, and host attributes reach the native input.","Canonical sizes sm, md, and lg and compatibility aliases small, medium, and large normalize losslessly; md is the default.","Fill mode is the closed solid, outline, or flat vocabulary and defaults to solid; rounding is small, medium, large, or full and defaults to medium.","Prefix and suffix are optional decorative/content slots around the same native input; focus, value, and host attributes remain on the input and logical padding reflects the present slots.","Invalid changes visual styling only; aria-invalid is emitted only when the host explicitly supplies it.","Disabled inputs are native-disabled and emit no value request.","Coarse-pointer or phone form factors grow dense controls to at least 44 CSS pixels without changing text scale or semantic size.","The module owns no validation rules, parsing, masking, persistence, labels, form submission, or authorization."],"errors":[{"code":"unsupported-input-appearance","when":"A size, fill mode