rder, have unique nonblank IDs and titles, and use inclusive calendar-date start and end values with end not before start.","Progress is finite and between zero and one hundred; optional color is a semantic token or CSS custom-property value, never a provider option.","Dependencies preserve caller order and revision 1 treats every valid edge as finish-to-start; edges with unknown endpoints are ignored without throwing.","Default columns are localized task, start, and end; supplied columns replace them and have positive widths when specified.","Zoom is caller-controlled as day, week, or month; a visible picker emits a request and rendering continues to follow the supplied value.","Read-only is always true in revision 1 and no task move, resize, editor, dependency mutation, or accidental unchanged update callback is exposed.","Date labels and scales use active locale calendar-date semantics and never change task instants through timezone conversion.","The timeline has one named region with equivalent table or treegrid task access; decorative dependency geometry is hidden from assistive technology.","Replacing inputs removes stale rows, bars, connectors, and scale cells.","Root host attributes and classes are preserved.","Fixtures and public contracts contain no Telerik, DOM, SVG, canvas, WebGL, coordinate, renderer-instance, scheduling-engine, workflow, capacity, or persistence identity."],"errors":[{"code":"task-id-required","when":"A task ID is empty or whitespace-only."},{"code":"duplicate-task-id","when":"Two tasks share an ID."},{"code":"task-title-required","when":"A task title is empty or whitespace-only."},{"code":"invalid-task-range","when":"A task end date precedes its start date."},{"code":"invalid-progress","when":"Progress is non-finite or outside zero through one hundred."},{"code":"invalid-column-width","when":"A supplied column width is not positive."}],"presentation":{"disposition":"required","gallery":"gallery/scenarios/hlp.ui.gantt.json"},"cases":[{