{"schemaVersion":1,"moduleId":"hlp.ui.scheduler","interfaceRevision":1,"semantics":{"operation":"render and optionally edit a locale-aware day, week, month, or agenda schedule with controlled or uncontrolled view and date, work-calendar policy, all-day and overlapping events, responsive navigation, a live now indicator, bounded recurrence expansion, occurrence-or-series actions, and deterministic large-data replacement","observableOutput":"Equivalent event normalization and expansion, view and date ownership, navigation and CRUD requests, read-only suppression, work-calendar shading, event layout, responsive fallback and overflow, localized date/time, RTL, now behavior, recurrence dialogs, accessibility, theme appearance, performance bounds, and complete replacement across projections."},"sourceSurface":{"repository":"shipyard","commit":"a5036ff8b500e0d857d7e0a698408e7cf7f6cf31","path":"packages/ui-react/src/components/datagrid/Scheduler.tsx","blob":"0d683a7e4b6ffb7ca4e592d1b90eb49086f86971","additionalSources":[{"path":"packages/ui-react/src/components/datagrid/SchedulerRecurrence.ts","capturedExports":["parseRRule","expandRecurrence"]}],"capturedExports":["Scheduler","SchedulerProps","SchedulerEvent","SchedulerView","SchedulerViewType","SchedulerModelFields","SchedulerWorkingHours","SchedulerWorkDay","parseRRule","expandRecurrence"],"carrierCallers":["apps/carrier/src/calendar/CalendarPane.tsx"]},"authorityNote":"Harborline App currently consumes the read-only day schedule with pre-expanded events, but Scheduler is the scheduling-pillar UI seam and its pinned public source, recurrence tests, responsive tests, and locale tests are retained. Revision 1 closes source inconsistencies: controlled date updates synchronize, Today emits the same date request as navigation, and readOnly suppresses mutations in every view.","dependencies":["hlp.ui.default-strings","hlp.ui.empty-state","hlp.ui.locale-provider","hlp.ui.use-is-mobile","hlp.ui.use-scroll-affordance"],"designEvaluation":{"selected":"neutral-calendar-engine","alternatives":[{"id":"neutral-calendar-engine","ownership":"Platform owns normalized schedule events, four views, view/date state, work calendar, layout, recurrence subset, CRUD request semantics, responsive policy, localization, accessibility, and deterministic bounds; projections privately adapt pointer geometry and browser clocks.","tradeoff":"A deep Tier-C seam that preserves Harborline App and remains swappable between native and Telerik-backed rendering."},{"id":"read-only-carrier-snapshot","ownership":"Retain only the exact CalendarPane props and pre-expanded day rendering.","tradeoff":"Faster initially but too shallow for the essential scheduling pillar and would force consumers to bind directly to Telerik."},{"id":"provider-scheduler-options","ownership":"Expose Kendo, Telerik, React, or Blazor scheduler models and event args.","tradeoff":"Breaks provider replacement and creates incompatible consumer contracts."}],"decision":"Select neutral-calendar-engine and keep provider models, timezone services, persistence, authorization, and workflow orchestration outside the public interface."},"invariants":["An event has stable string or numeric identity, title, start, and end; end is not before start. Optional all-day, color, description, resource, recurrence, exception, and extension fields survive normalization.","Views are day, week, month, and agenda; defaultView is week. A supplied view is controlled, otherwise the component owns view initialized once from defaultView.","A supplied selectedDate is controlled and external replacements synchronize; otherwise date initializes once from defaultDate or the current date.","View changes and previous, Today, or next navigation request the resulting canonical view or date exactly once. Controlled mode does not silently replace caller state.","The default view selector exposes all four localized views; a supplied ordered subset limits the selector without changing view identity.","Day and week render a twenty-four-hour grid, an all-day band, half-hour interaction snapping, stable overlap columns, working-hour shading, non-work-day shading, and a current-time indicator only when today is visible.","Legacy workingHours wins over workDayStart and workDayEnd; defaults are eight through eighteen and Monday through Friday.","Month preserves day ordering, renders at most three event rows before a localized more action, and drills that day into day view.","Agenda orders future events by start, exposes all-day and description state, and renders the localized empty state when none remain.","Narrow uncontrolled instances default to agenda until the user explicitly selects a view; controlled view always wins. Day, week, and month retain a legible minimum width and expose horizontal keyboard scrolling, logical fades, and a polite status only when overflow exists.","A caller-supplied now instant freezes time. Without one, the internal clock advances no more frequently than once per minute and never grows the rendered structure.","Day or week opening anchors today near the first third of the viewport or anchors workDayStart for a non-today range. The off-screen Now action honors reduced motion.","When readOnly is true, no create, move, edit, delete, popup, or recurrence action is available in any view and no mutation request can be emitted.","When editable, dragging an empty timed slot requests a snapped event, dragging an event requests a move, double activation opens the editor, and agenda deletion requests the full event.","Event add, update, and delete callbacks receive provider-neutral SchedulerEvent values exactly once and never provider event args.","Model fields may remap canonical event fields; unmapped extension fields survive normalization.","The bounded RRULE subset is case-insensitive and supports DAILY, WEEKLY, MONTHLY, YEARLY, INTERVAL, COUNT, UNTIL, BYDAY with supported ordinals, BYMONTHDAY one through twenty-eight, and BYMONTH.","Recurrence expansion preserves duration and extension fields, sets recurrenceId on occurrences, merges exception records by original start, excludes recurrence exceptions, clips to the half-open requested range, and caps output at one thousand occurrences.","Editing or deleting a recurring occurrence asks whether to affect this occurrence or the series in an accessible modal, restores focus, and emits either an exception record, an updated master, or the master deletion exactly once.","Toolbar, view labels, empty state, action labels, date and time formats, recurrence text, and scroll status follow locale context; chevrons and logical placement mirror under RTL.","Long labels reflow without overlapping schedule chrome, every action has a stable accessible name and visible focus, and states remain perceivable in light, dark, forced colors, and reduced motion.","Rendering and replacement are bounded by visible events and recurrence cap; repeated view, date, and data replacement leaves no stale chips, duplicate callbacks, timers, observers, or dialogs.","The module owns no persistence, remote loading, timezone conversion, resource capacity, authorization, workflow transition, notification, or provider option.","Both lanes spell the scroll container hl-scheduler__scroll, the month day-number a plain time element in hl-scheduler__month-day, the month and all-day chips hl-scheduler__event, the agenda an ordered hl-scheduler__agenda list whose row actions are hl-scheduler__agenda-actions, the editor labels hl-scheduler__editor-field, and the stacked recurrence choices hl-scheduler__dialog-actions--stacked; the authority stylesheet defines every class either lane emits and no lane-only alias exists."],"errors":[{"code":"invalid-event-range","when":"An event end precedes its start."},{"code":"duplicate-event-key","when":"Rendered event identity plus occurrence start is not unique."},{"code":"invalid-work-hours","when":"Work-day start or end is outside zero through twenty-four or start is not before end."},{"code":"invalid-work-day","when":"A work-day value is outside zero through six."},{"code":"invalid-view","when":"A controlled or default view is not present in the allowed view set."},{"code":"invalid-recurrence","when":"A recurrence rule is malformed or uses an unsupported frequency."},{"code":"invalid-range","when":"Recurrence range end is not after range start."},{"code":"invalid-model-field","when":"A required canonical field cannot be read through modelFields."}],"performance":{"visibleEventTarget":256,"replacementUpdates":96,"recurrenceCap":1000,"expectation":"Rendering is linear in visible event and day-cell count, recurrence is hard-capped, and replacement retains constant observer, timer, dialog, and toolbar structure."},"presentation":{"disposition":"required","gallery":"gallery/scenarios/hlp.ui.scheduler.json"},"cases":[{"id":"scheduler.defaults-empty"},{"id":"scheduler.event-normalization"},{"id":"scheduler.controlled-view"},{"id":"scheduler.uncontrolled-view"},{"id":"scheduler.controlled-date"},{"id":"scheduler.navigation"},{"id":"scheduler.custom-views"},{"id":"scheduler.day-week-layout"},{"id":"scheduler.all-day"},{"id":"scheduler.overlap"},{"id":"scheduler.work-calendar"},{"id":"scheduler.month-more-drilldown"},{"id":"scheduler.agenda-empty-order"},{"id":"scheduler.narrow-default"},{"id":"scheduler.horizontal-affordance"},{"id":"scheduler.now-controlled-tick"},{"id":"scheduler.anchor-now-action"},{"id":"scheduler.readonly"},{"id":"scheduler.event-create-move-edit-delete"},{"id":"scheduler.model-fields"},{"id":"scheduler.rrule-parse"},{"id":"scheduler.recurrence-expand"},{"id":"scheduler.recurrence-exceptions"},{"id":"scheduler.recurrence-dialog"},{"id":"scheduler.locale-rtl"},{"id":"scheduler.appearance-reflow"},{"id":"scheduler.large-data"},{"id":"scheduler.replacement"},{"id":"scheduler.projection-equivalence"},{"id":"scheduler.lane-classes"}]}
