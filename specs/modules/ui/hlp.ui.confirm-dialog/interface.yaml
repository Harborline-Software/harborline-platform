{"schemaVersion":1,"moduleId":"hlp.ui.confirm-dialog","interfaceRevision":1,"semantics":{"operation":"render a controlled confirmation modal that composes the dialog shell, presents a localized cancel and confirm pair, reports confirmation exactly once, and closes itself on either outcome","observableOutput":"Equivalent mounted state, localized action labels, confirm-then-close ordering, destructive emphasis, dismissal policy pass-through, and complete replacement across projections."},"sourceSurface":{"repository":"shipyard","commit":"a5036ff8b500e0d857d7e0a698408e7cf7f6cf31","path":"packages/ui-react/src/components/dialogs/ConfirmDialog.tsx","blob":"758343b5fb1405e613264e41c5f6b035b032a154","capturedExports":["ConfirmDialog","ConfirmDialogProps"],"carrierCallers":[]},"authorityNote":"Revision 1 freezes the caller-proven confirmation surface only. ConfirmDialog COMPOSES hlp.ui.dialog rather than re-implementing modal chrome: the frozen dialog interface already owns focus, overlay, escape and scroll behaviour, so re-implementing any of it here would be the input-composition defect class recorded in wave 04-01. Result types, promise-returning confirm APIs, and predefined button sets remain out of scope.","dependencies":["hlp.ui.dialog","hlp.ui.cn","hlp.ui.default-strings","hlp.ui.locale-provider"],"designEvaluation":{"selected":"compose-dialog-with-action-pair","alternatives":[{"id":"compose-dialog-with-action-pair","ownership":"Owns only the action pair, their localization, and the confirm-then-close ordering; every modal behaviour is delegated to hlp.ui.dialog.","tradeoff":"Keeps one modal implementation and inherits its accessibility work."},{"id":"standalone-confirmation-modal","ownership":"Re-implements overlay, focus trap and dismissal alongside the action pair.","tradeoff":"Duplicates frozen behaviour and drifts from dialog \u2014 the exact defect wave 04-01 corrected in text-box."}],"decision":"Select compose-dialog-with-action-pair; the dialog module remains the single modal authority."},"invariants":["open is caller-controlled and the module never mutates it directly; both actions request open=false.","Confirm invokes the caller callback exactly once and then requests close, in that order.","Cancel requests close without invoking the confirm callback.","Confirm and cancel labels resolve from the shared catalog (common.confirm, common.cancel) and an instance override wins over the catalog.","A key that resolves to itself is treated as unresolved and falls back, never rendered as a raw key.","variant=destructive changes only emphasis; it does not change ordering, focus or semantics.","closeOnOverlayClick and closeOnEscape pass through to the dialog shell unchanged.","The module owns no modal chrome: role, aria-modal, focus lifecycle, overlay and body scrolling belong to hlp.ui.dialog.","Long titles and descriptions wrap and remain usable at narrow widths and 200 percent zoom.","Direction follows locale context and the action pair mirrors under RTL."],"errors":[],"presentation":{"disposition":"required","gallery":"gallery/scenarios/hlp.ui.confirm-dialog.json"},"cases":[{"id":"confirm-dialog.controlled-open"},{"id":"confirm-dialog.confirm-invokes-once-then-closes"},{"id":"confirm-dialog.cancel-closes-without-confirm"},{"id":"confirm-dialog.localized-labels"},{"id":"confirm-dialog.label-override"},{"id":"confirm-dialog.key-echo-fallback"},{"id":"confirm-dialog.destructive-emphasis"},{"id":"confirm-dialog.dismissal-passthrough"},{"id":"confirm-dialog.composes-dialog"},{"id":"confirm-dialog.long-content-reflow"},{"id":"confirm-dialog.locale-rtl"},{"id":"confirm-dialog.replacement"},{"id":"confirm-dialog.action-classes"},{"id":"confirm-dialog.projection-equivalence"}]}
