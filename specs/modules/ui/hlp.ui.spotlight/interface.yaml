{"schemaVersion":1,"moduleId":"hlp.ui.spotlight","interfaceRevision":1,"semantics":{"operation":"present a controlled command/search palette over caller-owned ranked sections","observableOutput":"Equivalent query requests, option ordering, keyboard selection, loading/empty state, result announcements, dismissal, and focus behavior in React and Blazor."},"sourceSurface":{"repository":"shipyard","commit":"a5036ff8b500e0d857d7e0a698408e7cf7f6cf31","path":"packages/ui-react/src/components/navigation/Spotlight.tsx","blob":"d857264d1514383edc29f7d1731bfaad10a6371f","capturedExports":["Spotlight","SpotlightProps","SpotlightItem","SpotlightSection"]},"dependencies":["hlp.ui.cn"],"designEvaluation":{"selected":"caller-owned-ranked-sections","alternatives":[{"id":"caller-owned-ranked-sections","ownership":"Platform owns palette interaction and accessibility while callers own query execution, ranking, grouping, localized copy, and actions.","tradeoff":"Keeps search/domain policy out of UI and makes both projections deterministic."},{"id":"platform-search-provider","ownership":"Platform accepts a provider and owns asynchronous search, ranking, cancellation, and result shaping.","tradeoff":"Would pull App/API policy and lifecycle into a UI module and create a shallow service locator."}],"decision":"Select caller-owned-ranked-sections; provider and domain search remain host concerns."},"invariants":["Open, query, sections, and callbacks are controlled host inputs; the UI never owns search execution or ranking.","Flattened keyboard order is pinned action first, then caller section order, then item order; item IDs are stable and unique across the palette.","The input has combobox semantics, points to the listbox, and tracks the active option through aria-activedescendant.","ArrowDown and ArrowUp clamp within available options; Enter selects the active option; hover changes the active option; click selects the clicked option.","Selection closes before invoking the action unless keepOpen is true; controlled close requests do not mutate host state directly.","Opening or a changed result count resets the active option to the first item and opening focuses the query input.","Empty sections are omitted unless loading; a loading section may render localized loading text without creating an option.","Pinned action, descriptions, badges, shortcut hints, footer, placeholder, Escape hint, empty copy, section labels, and result-count announcements remain caller localized.","Escape and scrim dismiss through the dialog boundary and restore prior focus; results reflow at 200 percent without horizontal page overflow.","Reduced motion removes nonessential palette transitions without changing ordering, focus, or selection.","Both lanes spell the query input hl-spotlight__query and the result-count status hl-spotlight__sr-only, and neither puts a class on the section group element; the shared stylesheet defines every class either lane emits and no lane-only alias exists."],"errors":[{"code":"duplicate-item-id","when":"Two items, including a pinned action, share an ID."},{"code":"section-label-required","when":"A rendered section has an empty accessible label."}],"presentation":{"disposition":"required","gallery":"gallery/scenarios/hlp.ui.spotlight.json"},"cases":[{"id":"spotlight.closed"},{"id":"spotlight.combobox"},{"id":"spotlight.sections"},{"id":"spotlight.query"},{"id":"spotlight.keyboard"},{"id":"spotlight.select-close"},{"id":"spotlight.keep-open"},{"id":"spotlight.pinned"},{"id":"spotlight.empty"},{"id":"spotlight.loading"},{"id":"spotlight.footer"},{"id":"spotlight.results-announcement"},{"id":"spotlight.dismiss-focus"},{"id":"spotlight.invalid-identities"},{"id":"spotlight.projection-equivalence"},{"id":"spotlight.classes"}]}
