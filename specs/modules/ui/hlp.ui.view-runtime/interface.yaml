{"schemaVersion":1,"moduleId":"hlp.ui.view-runtime","interfaceRevision":7,"semantics":{"operation":"render a supplied compiled render plan without fetching data or reading the source definition","gridKind":"layout.table","mapping":"Each field in bindings.parameters.fields becomes one data-grid column in plan order; caller rows provide values keyed by field id.","unknownKind":"Every bindings.viewKind other than layout.table renders nothing and produces no error or console output.","accessor":"A rendered plan exposes one atomic JSON-valued data-definition-source accessor containing definitionId, definitionVersion, and packKey.","action":"The runtime forwards the delegated data grid row-activation action by canonical row id.","declaredActions":"Optional bindings.actions declares ordered buttons with an id and caller-localized label; activation forwards only the action id to the host.","actionsDisabled":"Optional actionsDisabled (default false) disables every declared action through the canonical Button; disabled actions invoke no callback and row activation remains unchanged."},"dependencies":["hlp.ui.data-grid","hlp.ui.button"],"invariants":["The runtime fetches no data and accepts no source definition.","A grid render plan maps every compiled field to one ordered data-grid column and every supplied row to one grid row.","Unknown or incomplete plan kinds are inert and silent in both projections.","Definition provenance is atomic: both projections expose all three source coordinates through one accessor.","Both projections expose the same row-activation action and the runtime performs no navigation.","Declared actions render as non-submit buttons in plan order, including when rows are empty; absent actions render no buttons.","Unknown or incomplete plans render no actions and invoke no callbacks.","Action activation forwards exactly its declared id; the runtime performs no operation itself.","Declared actions use the canonical small secondary Button in one wrapping group named by the accessible view label; declaration order and labels are preserved."],"presentation":{"disposition":"required","gallery":"gallery/scenarios/hlp.ui.view-runtime.json"},"cases":[{"id":"view-runtime.grid"},{"id":"view-runtime.unknown-kind"},{"id":"view-runtime.empty-rows"},{"id":"view-runtime.long-content"},{"id":"view-runtime.declared-actions"},{"id":"view-runtime.unknown-kind-actions"},{"id":"view-runtime.incomplete-plan-actions"}]}
