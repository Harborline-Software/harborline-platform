{"schemaVersion":1,"moduleId":"hlp.ui.dialog","interfaceRevision":1,"semantics":{"operation":"render a controlled modal dialog with a named title, optional description and footer, independently configurable close button, Escape dismissal, and overlay dismissal, plus trapped and restored focus and an internally scrollable body","observableOutput":"Equivalent mounted state, modal relationships, open-change requests, dismissal policy, focus lifecycle, body scrolling, localized close control, direction, reflow, and complete replacement across projections."},"sourceSurface":{"repository":"shipyard","commit":"a5036ff8b500e0d857d7e0a698408e7cf7f6cf31","path":"packages/ui-react/src/components/dialogs/Dialog.tsx","blob":"ac990893094709965a15c3711220adc7124ad29b","capturedExports":["Dialog"],"carrierCallers":["apps/carrier/src/apps/AppCard.tsx","apps/carrier/src/apps/InstallPreviewDialog.tsx","apps/carrier/src/asset-tree/AssetTree.tsx","apps/carrier/src/asset-tree/EntityDetailPanel.tsx","apps/carrier/src/components/AboutDialog.tsx","apps/carrier/src/documents/editor/DocumentEditor.tsx","apps/carrier/src/documents/manager/NewTemplateDialog.tsx","apps/carrier/src/forms/builder/ShortcutsHelp.tsx","apps/carrier/src/forms/builder/VersionHistory.tsx","apps/carrier/src/forms/manager/NewFormDialog.tsx","apps/carrier/src/invoices/detail/InvoiceDetail.tsx","apps/carrier/src/invoices/manager/NewInvoiceForm.tsx","apps/carrier/src/rules/editor/RuleEditor.tsx","apps/carrier/src/rules/manager/NewRuleDialog.tsx","apps/carrier/src/webclient/AdminTeamAccessContainer.tsx","apps/carrier/src/workflows/builder/ShortcutsHelp.tsx","apps/carrier/src/workflows/manager/NewWorkflowDialog.tsx"]},"authorityNote":"Revision 1 freezes the small caller-proven modal surface. Portal, Radix, Lucide, Telerik, JS interop, drag, resize, confirmation results, and predefined buttons remain private implementation choices or separate modules.","dependencies":["hlp.ui.default-strings","hlp.ui.locale-provider","hlp.ui.use-scroll-affordance"],"designEvaluation":{"selected":"controlled-modal-shell","alternatives":[{"id":"controlled-modal-shell","ownership":"The module owns controlled visibility, modal naming, dismissal policy, focus lifecycle, pinned chrome, and scroll-affordanced body; projections privately adapt browser focus and portal mechanics.","tradeoff":"Preserves Harborline App behavior and keeps provider replacement possible."},{"id":"window-or-provider-dialog","ownership":"Expose drag, resize, provider options, predefined buttons, and result types.","tradeoff":"Broadens the seam beyond Harborline App and couples consumers to a provider."}],"decision":"Select controlled-modal-shell; confirmation and window behavior remain separate modules."},"invariants":["open is caller-controlled; closed content is unmounted and no adapter mutates caller state directly.","An open instance exposes role=dialog, aria-modal=true, a title relationship, and an optional description relationship.","Title and body are required; description and footer are optional.","The close button is localized and optional; when present it requests open=false exactly once.","Escape dismissal and overlay dismissal independently request open=false only when their policies allow it.","Suppressing the close icon does not suppress Escape or overlay behavior.","Focus enters the modal, cycles within its focusable descendants in both directions, and returns to the opener after close.","Nested interactive children remain reachable; the overlay never treats content activation as outside dismissal.","Header and footer remain pinned while only the body scrolls within a viewport-bounded surface.","The body is keyboard-scrollable with vertical Arrow, Home, and End behavior, logical fades, and a polite status message.","Direction follows locale context and logical spacing mirrors under RTL.","Long title, description, body, and footer content wrap and remain usable at narrow widths and 200 percent zoom.","Opening and closing remain understandable with reduced motion and in forced colors.","The module owns no confirmation result, nonmodal window, drag, resize, business workflow, or provider option."],"errors":[],"presentation":{"disposition":"required","gallery":"gallery/scenarios/hlp.ui.dialog.json"},"cases":[{"id":"dialog.closed-open-controlled"},{"id":"dialog.title-description"},{"id":"dialog.body-footer"},{"id":"dialog.close-control"},{"id":"dialog.escape-dismissal"},{"id":"dialog.overlay-dismissal"},{"id":"dialog.independent-dismissal"},{"id":"dialog.focus-entry-cycle-restore"},{"id":"dialog.modal-semantics"},{"id":"dialog.scrollable-body"},{"id":"dialog.localized-close-rtl"},{"id":"dialog.long-content-reflow"},{"id":"dialog.nested-content"},{"id":"dialog.replacement"},{"id":"dialog.projection-equivalence"}]}
