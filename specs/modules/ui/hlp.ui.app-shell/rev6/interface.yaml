  "decisionRecord": {
    "path": "specs/modules/ui/hlp.ui.app-shell/rev6/decisions.md",
    "title": "Harness rev 6 decisions",
    "asOf": "2026-10-11",
    "governingRule": "The harness decides how things look and behave on screen. It never decides what is true or allowed. If two people could disagree about an answer, or it changes when data changes, it comes from the API. If it is only about this person's screen, the harness owns it.",
    "citation": "Each invariant ends with the decision ids it encodes, in square brackets. 'rev 5' marks a rule carried from revision 5 unchanged in substance."
  },
  "semantics": {
    "operation": "compose the Harborline harness from a rail, an optional sidebar, a main area that shows one stream face, and a side panel that hosts tabs; Chat and Workspace are two registered mode compositions of the same parts; everything with business meaning arrives from the app adapter, and the harness decides only how it looks and behaves",
    "observableOutput": "Equivalent rail, sidebar, main and panel order; mode resolution and face selection; tab identity, preview, pin, group and persistence transitions; capacity-based docking; the shortcut table and Esc ladder; numeric attention counts; sync strip states; avatar menu and Settings rendering; announcements and focus order in React and Blazor."
  },
  "sourceSurface": {
    "kind": "prototype",
    "description": "Harness gallery version 5, the domain-agnostic rev 6 prototype run through four sample packs. harness.js holds the behavior encoded here: KIND and KEYS, budget() with MIN_MAIN 560, PANEL_W 380 and SIDE_W 240, tab dedupe and preview logic in mount(), and the Esc ladder.",
    "artifact": "claude.ai artifact QZvewbb6BTswTQEeeCGfCg, version 5",
    "fixtures": "specs/modules/ui/hlp.ui.app-shell/rev6/packs.json"
  },
  "dependencies": [
    "hlp.ui.icon-button",
    "hlp.ui.tooltip"
  ],
  "invariants": [
    "The harness owns layout, tabs and groups, the Esc ladder, shortcuts, focus and announcements, form classes, and the person's on-screen state (open and pinned tabs, mode, rail labels, theme). Permissions and their reasons, counts, My work membership, the action catalogue and approval rules, settings values and their source, sync recency, conflicts, job states and tenant membership arrive as input from the app adapter. The harness renders them as given and never filters, recomputes or infers them. [§1, C3, V0]",
    "The frame is rail, sidebar, main area and side panel in that order, inside one root that renders data-shell-id. The main area renders once inside the single main landmark, the rail and the phone drawer each render one navigation landmark, and each panel group renders one complementary region. Focusable DOM order follows the visual order. Overlays (search, menus, drawer, shortcuts sheet) take focus while open and return it to their trigger on close. [V0, rev 5]",
    "shellId is required, matches [a-z0-9-]+, keys persistence, and renders as data-shell-id on the shell root; absence raises app-shell-id-required. [rev 5]",
    "Destination, conversation, record, page, tab and system addresses derive from kind plus stable identity and never from display labels. [rev 5]",
    "Chat and Workspace are two mode compositions registered in the same internal registry that packs feed, and every built-in tab kind, face and destination arrives through that registry. Workspace is never labeled legacy. Every Workspace-mode feature is built from parts that also exist in Chat mode; that test is the acceptance check for this revision. [M2, M6, M13, V1]",
    "The active mode resolves in this order: the person's stored choice for this workspace on this device class, then the default the adapter supplies for the person's role or tenant, then Chat. The choice is stored per user, per workspace, per device class as the host reports it (phone, tablet, desktop); first use on a new device class follows the role or tenant default. The mode switch sits in the rail directly under the tenant mark. [M4, M12]",
    "Switching mode keeps every open tab and its group. The primary stream changes face (conversation to structured, or back), and its other face stays available as a tab. The switch is announced, including that the tabs stayed open. [M14]",
    "The main area shows one stream at a time. Records, places, runs and conversations are streams with a conversation face; Chat mode shows that face first and Workspace mode shows the structured face first. Lists, boards, Details, Timeline and Files are faces built from Views over streams, and render inline in a conversation, as panel tabs, or as pages. A saved view has no conversation face; Ask about this list starts a conversation that carries the view as a context chip. [M1, M6, M7]",
    "People and agents share one conversation kind. A conversation shows its participants, an agent joins by @mention or by assignment, and an Assistant tab is a conversation in which Pilot is a participant. A conversation stands alone or attaches to a record, and events of a conversation attached to a record appear in that record's Log. [M3, M15]",
    "A conversation header carries explicit, removable context chips. A record mentioned in the conversation is offered with an Add to context action and is never added silently. [M9]",
    "A structured answer renders as a live block bound to its query, marked Live in text, with Open in tab and Open as page. A proposed write renders as an approval card with a before and after table and an AI label. Approve renders only when the adapter marks the viewer as an approver, and nothing changes until approval hands the command or Workflow run to the app; the harness never executes it. [M8, P11, C2]",
    "Chat-mode Home is a central composer with the person's My work items as cards above it and recent conversations below. Workspace-mode Home keeps its figures and needs-you list, with conversations one click away. On first run, before any work exists, no count renders anywhere and Home says what it is for. [M10]",
    "The rail is, top to bottom: the tenant mark (always Home), the mode switch, the workspace switcher when more than one workspace exists, then in Chat mode My work, Conversations and Browse, or in Workspace mode My work, the pack's primary destinations, a separator, its secondary destinations and Conversations, and the avatar button last. Empty optional zones are absent. Browse lists every destination as a card that opens as a page. [M11, T1, T4, T6]",
    "The rail is 56 CSS pixels with icons only, or 80 with first-word labels when Rail labels is on, and the avatar then shows the first name. The rail has no resize and no collapsed state; on laptop and wide forms only Focus mode hides it. On phone a drawer carries the same items and the My work count as a number. Each rail item's accessible name is its full label plus its count. [T6, M12, A3]",
    "The Conversations sidebar shows Pinned, Recent and the person's own sections, with a People, Agents and Places filter and a New conversation button. A destination sidebar shows the place chip, the destination's views and its pinned views. [M11, S2]",
    "Scope switchers (the rail workspace switcher and the place picker) follow one contract: a trigger button with a single-line truncated label; a menu with menuitemradio semantics; the active option first regardless of pin state, pinned options next in pin order; a filter input only above 7 options; an optional directory entry as the menu footer; Escape and outside dismissal restoring trigger focus; and a selection emitting exactly one change request. The workspace switcher is absent at one or zero workspaces. [T4, rev 5]",
    "A pin on a scope option is a sort preference, never membership, with a cap of 4. Within a switcher menu the pin affordance is pointer-only and hidden from assistive technology, because a menu item admits no nested interactive content; the sidebar's sibling pin toggles are the keyboard and assistive-technology path to the same preference. [rev 5]",
    "A pinned view or conversation renders exactly once, in the Pinned section of its sidebar, and its source section omits it while pinned. Pin identity is workspace id plus item id. The pin cap defaults to 8; a pin request at the cap is not emitted; controlled pinned ids above the cap render as given; a pinned id the adapter no longer supplies stays in storage and does not render. [M11, rev 5]",
    "Pin toggles and row menus are interactive siblings of the activation target, never nested inside it, at least 44 CSS pixels on coarse pointers, keyboard reachable, and activating one neither navigates nor moves focus off it. [rev 5]",
    "A conversation row shows an icon for its kind (person, agent, place), a title, a second line and an unread count as a number. Its row menu lists actions with destructive entries after a divider. Rename is host-controlled and inline: Enter and Escape emit rename and cancel requests and the shell never commits the value. Activating a row emits exactly one request and sets aria-current=page on the single matching row. [M11, rev 5]",
    "Rail, sidebar, conversation and system targets keep their identity-derived href. Workspace selection is handled by the shell and cancels native navigation. A target with a host activation handler emits exactly one request and cancels native navigation; without a handler it follows its href. [rev 5]",
    "Mod+K opens one modal search-and-ask dialog, scoped by its place chip. Results group by kind with an All filter. Enter acts on the highlighted row. Ask the Assistant is a row: last, or first when the trimmed query ends in a question mark (?, ？ or ؟). Mod+Enter always asks. Tab only moves focus. An empty query lists recent items and actions. Asking opens the conversation in the main area in Chat mode, and opens or focuses an Assistant tab in Workspace mode. [S1]",
    "A list destination's context bar holds the status tabs on the leading side and Filter, Sort, the view switch and New on the trailing side. Filter includes text contains, so no second search box renders. The view switch renders only when the pack declares two or more views. While rows are selected, a selection bar with the count and catalogue actions replaces the context bar. [S2, C1]",
    "New follows the create cardinality of the current destination's permitted create actions: zero means no New, one means a button, two or three mean a split button with the declared default, and more than three mean no New, with every create action still reachable from search Actions. [C1, rev 5]",
    "Shortcuts are one data table: the shortcuts sheet and the remap setting read the same rows. The default shell bindings are Mod+K search and ask, Mod+Enter ask from search, Mod+J open the Assistant tab, Mod+Shift+I show or hide the side panel, Mod+Alt+T new panel tab, Mod+Alt+W close the active panel tab, Mod+Comma Settings, Mod+Slash shortcuts sheet, and Esc. Mod is Control, or Command on Apple platforms. The shell binds no single-letter key, never binds Mod+T, Mod+W, Mod+N or Mod+1 to Mod+9 (browsers keep them), and leaves Mod+I unbound. Every binding can be remapped or turned off, and a pack command contributes a row with no default key. [S3, S4]",
    "Editable targets and already-handled events suppress shell shortcuts, except Esc and Mod+Enter inside the search dialog. A binding turned off or set to none is absent from the sheet's active rows and does nothing. [rev 5, S3]",
    "J and K move to the next and previous row only while focus is inside a list. They retarget the preview tab and keep focus on the row moved to. [S3, P4]",
    "Esc closes exactly one layer per press, in this order: shortcuts sheet, search dialog, tab search, open menu, phone drawer, new-tab page, row selection, side panel, Focus mode. [V0]",
    "A panel tab is a kind plus a target (Details of a record, Assistant of a conversation). Opening a kind and target that is already open focuses that tab, so several Assistant conversations are several tabs. Mod+J focuses the Assistant tab of the current context's conversation, or opens one. [P1]",
    "Tab kinds are platform registrations: Details, Related, Log, Timeline, Files, Page, Measures, Layout, Output and Assistant. The adapter supplies which kinds apply to each record kind; Assistant applies everywhere. Timeline is a time axis of spans, overlaps and planned items; the chronological list of events is Log. [P2, E1, V1]",
    "Log has filter chips All, People, System and Agents. An entry caused by an agent names who proposed it and who approved it. [P3]",
    "At most one tab is a preview tab. Selecting a list row retargets the preview tab to that row and keeps its kind, or opens a Details preview tab when none exists. Editing in the tab, double-clicking it, Keep open, or Pin makes it permanent. A preview tab renders its label in italics and carries preview in its accessible name and sub-bar text. Preview tabs close on a destination change; pinned tabs survive. [P4, P9]",
    "The new-tab page lists Tools (the kinds that apply to the selection, with their shortcuts), Suggested (from the selection and place, as supplied) and Recents (recently closed tabs, which reopen). A kind that does not apply is absent, never disabled. [P5]",
    "The side panel opens only from the person's action. One exception: when a job the person started finishes, its output tab opens if Open results when ready is on (default on) and either the panel is visible or the person is on the page that started the job. Otherwise the panel toggle shows a numeric badge and the result becomes a My work item. Nothing the harness opens moves focus. Restoring tabs at load restores the panel's visibility as the person left it. [P6]",
    "A tab whose target stops applying stays open and says why, with a way out (Show Details instead, or Close). Restored tabs reload through the API, so a refused target shows the server's reason. [P7]",
    "Tab count is unlimited. Tabs shrink to a minimum width and then the strip scrolls, and the active tab scrolls into view. Search tabs lists every open tab across groups. Pinned tabs render first, as icons with full accessible names, and close only after unpinning. The strip follows the APG tabs pattern. [P8]",
    "A tab can move into a second group when the budget allows two groups. Closing the last tab of the second group merges back to one group. No rule pairs particular kinds side by side. [P8, P12]",
    "Form class comes from the shell's measured inline size: phone below 600, tablet 600 to 1023, laptop 1024 to 1599, wide 1600 and above. The rail takes 0 on phone and in Focus mode, otherwise 56 or 80. The 240 pixel sidebar shows on laptop and wide outside Focus mode, in Chat mode or on a destination that is not a system page. With available equal to width minus rail minus sidebar, the panel docks only on laptop or wide when available minus 380 is at least 560, and a second group is offered only when available minus 760 is at least 560. Otherwise the panel floats over the main area with a scrim on tablet, laptop and wide, and is a bottom sheet on phone. At 1024 with the sidebar the main area would keep 348, so the panel floats. The 560, 380 and 240 values are spec-owned taste. [P12]",
    "On phone the panel is a bottom sheet whose strip shows the active tab's label and the tab count; the count opens a grid of all tabs plus New tab. [P8]",
    "The panel edge and the boundary between groups are separators that resize with pointer capture and arrow keys (8 pixels, Shift 32), Home and End to the limits, Enter to commit and Escape to cancel. A docked panel never drops below 380 and never leaves the main area below 560. Sizes the person sets are remembered per form class, and crossing into another class uses that class's sizes. [P12, rev 5]",
    "Open tabs, pins, groups, the active tab per group, panel visibility, mode and rail labels persist per user, per tenant and per workspace through the injectable asynchronous storage seam: versioned records, at most one restore update per axis after defaults paint, silent fallback on corrupt, old or failing reads, and precedence of controlled value, then restored value, then declared default. Preview tabs are not restored into a different destination. [P9, T3, rev 5]",
    "Pages (lasting documents in a tree) and Outputs (what a conversation or job produced) both open as tabs. An Output reads Draft until the person saves it to a record or a page. An Assistant edit to a page renders inline as a before and after proposal with Accept and Reject, and its attribution comes from the event stream. [P10, P11]",
    "My work carries the only needs-you count: assigned items and runs waiting for the person, as the adapter supplies them, including sync conflicts and finished jobs awaiting review. Updates (mentions, finished work, notices) list inside My work with no count. There is no bell. [A1, A4, C2]",
    "Every count renders as a number, never a dot, and the number is in the accessible name; a pack cannot choose a dot. Needs-you uses the attention token (indigo); red is reserved for failed, error and destructive states. Colour is never the only cue: counts, preview, locks and selection each carry text, weight or an icon. A dashed border means only not sent yet. [A2, A3]",
    "A sync strip renders under the header only when the adapter reports offline, queued changes, a conflict, or a last confirmation older than the supplied threshold. It formats the supplied recency instant as locale relative time and never says Synced; the healthy state renders no strip, and the avatar menu's Sync line reads Last confirmed with the recency. A conflict states that nothing was overwritten, offers Review, and appears as a My work item. [A4]",
    "One action catalogue, supplied from Workflows with effect, permission, approval and offline policy, feeds search Actions, New, the selection bar, More and the Assistant's slash menu. The shell owns only chrome commands: panel, tabs, search, settings, shortcuts, Focus mode, mode and theme. An action the adapter marks hidden is absent; one marked disabled renders disabled with the server's reason as its description. Navigation the person cannot use is absent. [C1, C3]",
    "While a job the person started runs, the Ask box shows its verb and progress, and the panel toggle shows a numeric badge when the panel is closed. The job centre lists runs as the runs read supplies them; the harness never derives run state. [C2, P6]",
    "The avatar button is the rail's last item and opens a menu (APG menu button pattern) holding, in order: an identity header (name, role, tenant); account-action rows when present; the tenant list, with the current tenant checked and each membership showing its role and needs-you count, and past five memberships an All tenants item that opens a dialog; Settings (Mod+Comma); a static Sync line; Help and shortcuts (Mod+Slash); and Sign out last. Profile, notifications, theme and language live in Settings. With one tenant the tenant list is absent and the header still names the tenant. [T1, T2]",
    "Switching tenant is a hard boundary: tabs, mode, pins and place memory are stored per tenant, nothing carries across, and jobs stay in their tenant. Tenant switching lives only in the avatar menu and workspace switching only in the rail. The tenant mark is always Home and never a switcher. [T1, T3, T4]",
    "The avatar badge counts account actions only (sign in again, device lease, invitations), as a number. Other tenants' counts appear only inside the menu. The avatar's accessible name includes the person, the tenant and the account-action count. [T5, T6]",
    "Settings is one surface, opened by Mod+Comma or the avatar menu, with scope sections You, This device, Workspace and Organization; a section renders only when the adapter supplies settings for it. Each setting renders its value, its source, and a lock when a higher scope set it, the lock shown as an icon and text. The harness renders settings and submits changes and never resolves the cascade. Operational admin (members, grants, audit, packs) is an Admin destination, never part of Settings. Sign-out is silent unless the local node reports something to warn about, and then shows one dialog. [§9, E3]",
    "Focus mode hides the rail, sidebar and panel. A slim header offers Panels and Exit focus, and Esc exits when no higher layer is open. [V0]",
    "A place is a pack-declared record type with a hierarchy. The place chip in the destination sidebar and in the search dialog shows the current place or Everywhere, starts at the last used place, and passes the place to Views as a parameter; the harness never filters rows itself. [X2]",
    "The harness input is the app adapter's output (the person and their capabilities, the navigation declaration, and Views results). Pack JSON survives only as gallery and test fixtures. [X1]",
    "Packs never ship UI code. Only the platform adds renderers (tab kinds, faces, block kinds), compiled into both projections, and packs and admins compose them. R1 accepts no third-party contributions; ids, versioning and conditions are designed so they could be added later. [E1, E2]",
    "Contributions arrive at twelve points: destinations, sidebar sections, tab kinds per record kind, block kinds, actions with placements, Home cards, context providers, search sources, suggestions, modes, shortcuts, and look and words. Each contribution has a stable id unique within its point and fills a fixed system slot within that slot's budget; past the budget, later contributions move to the slot's overflow in declaration order with the diagnostic contribution-over-budget. A condition is data that can only show or hide; it never grants. An unknown contribution or condition is skipped with the diagnostic unknown-contribution and never stops the rest from rendering. [E4]",
    "Arrangement resolves through the settings cascade pack, then organization, then workspace, then user. Each level may hide, reorder and choose defaults (tabs, Home cards) within the same budgets, and no level adds what no pack contributed. Admin-authored Layout tabs wait until Layout authoring exists. [E3]",
    "Each new harness behavior ships behind a per-tenant flag that moves off, then opt-in, then default on with opt-out, then required. The harness reads the resolved flag value as input; the app resolves it through OpenFeature. The flag is removed at the next revision. [V2]",
    "A pack declares the minimum harness revision it needs. A pack needing a revision above 6 contributes nothing and raises pack-requires-newer-harness, and other packs still render. A breaking change to the declaration keeps the previous form readable for one deprecation window. [V2]",
    "One polite live region announces mode changes, tab open, close and retarget, job completion and sync changes. The harness never moves focus in response to data. [P6, A3]",
    "Every shell-owned scroll region is explicitly marked and uses a transparent track, a --color-border thumb with a 3 CSS pixel inset, --color-muted-foreground on hover, a 24 CSS pixel grab target, and theme tokens whose surface contrast is at least 3:1. [rev 5]",
    "React and Blazor render the same frame order, the same tab state transitions for the same inputs and events, and the same form class, dock and group results for the same measured width. [HLP-0002]"
  ],
