  "semantics": {
    "operation": "compose the fixed Harborline kernel frame from a content-column bar, an open-or-gone resizable rail, required workspace content, and an optional shrinking dock; packs fill declared slots without rearranging kernel zones",
    "observableOutput": "Equivalent four-surface and nine-zone order, presence rather than disabled state, workload and notification count semantics, identity-derived addresses, controlled state requests, complete shell shortcuts, Material breakpoint collapse, content-floor geometry, themed scroll regions, and focus order in React and Blazor."
