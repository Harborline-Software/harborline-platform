{"schemaVersion":1,"moduleId":"hlp.ui.layout-runtime","interfaceRevision":2,"semantics":{"operation":"provide aggregate Layout runtime and authoring contributions to the shared React and Blazor shells","authoring":"the editor exposes only sm, md, and lg container tokens, canonical layout block kinds, fixed alignment choices, semantic page controls, and a binding picker over the five authored binding kinds whose names come from the supplied catalogue","rendering":"the renderer consumes a resolved Layout flow plan and leaves product chrome, data binding, and navigation outside the contribution","validation":"numeric constraints are not clamped in the editor and remain publish-time admission failures"},"dependencies":["hlp.blocks.layout-runtime"],"invariants":["The contribution does not create a local definition store.","The editor does not offer arbitrary numeric constraints or a reading-order control.","Window classes are not Layout container tokens.","The React and Blazor contributions remain aggregate members rather than independent packages.","Rebinding a block preserves it: changing the binding kind clears the name and marks the block as needing a binding rather than deleting it.","The editor offers binding names from the supplied catalogue only, and never invents one.","Static content is authored on the block; the editor offers no name list for it.","Both lanes offer the same five binding kinds under the same accessible names."]}
