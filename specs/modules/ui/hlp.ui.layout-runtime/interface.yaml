{"schemaVersion":1,"moduleId":"hlp.ui.layout-runtime","interfaceRevision":5,"semantics":{"operation":"provide aggregate Layout runtime and authoring contributions to the shared React and Blazor shells","authoring":"the editor exposes only sm, md, and lg container tokens, canonical layout block kinds, fixed alignment choices, semantic page controls, a binding picker over the five authored binding kinds whose names come from the supplied catalogue, and the block and surface behaviour DES-0052 authors: a parent and repeat-per-row for collection bindings, a declared related-record relationship, a show_when guard holding either a Rules expression or a catalogue named predicate by exact pin, capture narrowing (an added requirement, registered validation rules, a prompt override and a registered field control), a default selection, filter edges to the surface's other blocks, and the surface's drill-through targets","rendering":"the renderer consumes a resolved Layout flow plan and leaves product chrome, data binding, and navigation outside the contribution","validation":"numeric constraints are not clamped in the editor and remain publish-time admission failures"},"dependencies":["hlp.blocks.layout-runtime","hlp.ui.rule-authoring"],"invariants":["The contribution does not create a local definition store.","The editor does not offer arbitrary numeric constraints or a reading-order control.","Window classes are not Layout container tokens.","The React and Blazor contributions remain aggregate members rather than independent packages.","Rebinding a block preserves it: changing the binding kind clears the name and marks the block as needing a binding rather than deleting it.","The editor offers binding names from the supplied catalogue only, and never invents one.","Static content is authored on the block; the editor offers no name list for it.","Both lanes offer the same five binding kinds under the same accessible names.","Only a query or record-field binding can repeat; rebinding to another kind drops the repeat, and a block is never placed inside itself or its own descendant (layout-auth-18).","A related block is offered only the relationships the catalogue declares and stores the relationship key alone; only an observing block carries one (layout-auth-19).","show_when is authored with the shared guided expression editor from hlp.ui.rule-authoring and lowered through Rules' own formula lowering into its expression, with raw Rules text, stored exactly as written, as the escape hatch; the editor keeps no conditional grammar (layout-auth-20, T-724 ruling 39).","A show_when guard holds exactly one form: an expression, or a named predicate picked from the catalogue and stored as its whole exact pin (layout-ck-29).","Only a capture block carries capture properties. A requirement Records declares is shown and cannot be removed; validation rules and field controls come from the catalogue's registered names; a prompt override is stored on the block for this surface only (layout-auth-21, layout-auth-22, layout-bound-3).","A default selection is authored on the block; the editor never stores a reader's live selection (layout-auth-33).","Filter edges name only the surface's other blocks, and removing a block removes every edge to it (layout-auth-34).","Drill-through targets are a surface property naming released surfaces from the catalogue (layout-auth-35).","An empty authored member is removed rather than stored empty.","A record field whose value domain picks its editor offers no authored control; the resolver's choice passes through (layout-bound-10, T-724 ruling 37).","A block gets a default stack container when it is made to repeat or another block is placed inside it, and its container can be changed but not removed while it repeats or has children, so a repeating block authored in either editor passes admission (layout-auth-18, T-724 ruling 41).","Both lanes render the platform's receipt and classified Access trace verbatim: the trace is read only when its disclosure opens, closing it triggers no read, a failed read offers a retry, and absent, missing, forbidden, malformed and valid evidence each render distinctly (layout-eng-30)."]}
