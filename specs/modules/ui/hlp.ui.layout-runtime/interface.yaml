{"schemaVersion":1,"moduleId":"hlp.ui.layout-runtime","interfaceRevision":3,"semantics":{"operation":"provide aggregate Layout runtime and authoring contributions to the shared React and Blazor shells","authoring":"the editor exposes only sm, md, and lg container tokens, canonical layout block kinds, fixed alignment choices, semantic page controls, a binding picker over the five authored binding kinds whose names come from the supplied catalogue, and the block and surface behaviour DES-0052 authors: a parent and repeat-per-row for collection bindings, a declared related-record relationship, a show_when Rules expression, capture narrowing (an added requirement, registered validation rules, a prompt override and a registered field control), a default selection, filter edges to the surface's other blocks, and the surface's drill-through targets","rendering":"the renderer consumes a resolved Layout flow plan and leaves product chrome, data binding, and navigation outside the contribution","validation":"numeric constraints are not clamped in the editor and remain publish-time admission failures"},"dependencies":["hlp.blocks.layout-runtime"],"invariants":["The contribution does not create a local definition store.","The editor does not offer arbitrary numeric constraints or a reading-order control.","Window classes are not Layout container tokens.","The React and Blazor contributions remain aggregate members rather than independent packages.","Rebinding a block preserves it: changing the binding kind clears the name and marks the block as needing a binding rather than deleting it.","The editor offers binding names from the supplied catalogue only, and never invents one.","Static content is authored on the block; the editor offers no name list for it.","Both lanes offer the same five binding kinds under the same accessible names.","Only a query or record-field binding can repeat; rebinding to another kind drops the repeat, and a block is never placed inside itself or its own descendant (layout-auth-18).","A related block is offered only the relationships the catalogue declares and stores the relationship key alone; only an observing block carries one (layout-auth-19).","show_when is stored exactly as written for the shared rule engine; the editor keeps no conditional grammar (layout-auth-20).","Only a capture block carries capture properties. A requirement Records declares is shown and cannot be removed; validation rules and field controls come from the catalogue's registered names; a prompt override is stored on the block for this surface only (layout-auth-21, layout-auth-22, layout-bound-3).","A default selection is authored on the block; the editor never stores a reader's live selection (layout-auth-33).","Filter edges name only the surface's other blocks, and removing a block removes every edge to it (layout-auth-34).","Drill-through targets are a surface property naming released surfaces from the catalogue (layout-auth-35).","An empty authored member is removed rather than stored empty."]}
