{"schemaVersion":1,"moduleId":"hlp.ui.segmented-control","interfaceRevision":1,"semantics":{"operation":"render one controlled, named set of mutually exclusive options with rich labels and responsive touch sizing","observableOutput":"Equivalent radio-group structure, checked and disabled state, roving focus, keyboard selection, callbacks, density, width, and direction behavior in React and Blazor."},"sourceSurface":{"repository":"shipyard","commit":"a5036ff8b500e0d857d7e0a698408e7cf7f6cf31","path":"packages/ui-react/src/components/buttons/SegmentedControl.tsx","blob":"b83aa3c6ba9f176a3d8928186af081554d29853d","capturedExports":["SegmentedControl","SegmentedOption"]},"dependencies":["hlp.ui.default-strings","hlp.ui.locale-provider","hlp.ui.touch-target","hlp.ui.use-can-show-master-detail","hlp.ui.use-media-query"],"invariants":["The control is one radiogroup with a required stable accessible name and one radio per ordered option.","Value is host-controlled; activating an enabled option requests that option value exactly once and never invents deselection.","The selected enabled option is the tab stop; when selection is absent or disabled, the first enabled option is the tab stop.","Arrow keys wrap and skip disabled options while moving focus and selection exactly once; Home and End choose the first and last enabled options.","In right-to-left direction, horizontal arrow progression mirrors while vertical arrow behavior and option DOM order remain unchanged.","Group disabled state native-disables every option; option disabled state prevents pointer and keyboard activation without removing the option.","Option label content is projection-owned opaque content; an optional accessible label names rich or icon-only content.","Canonical sizes are sm, md, lg, and touch with md default; touch has a minimum 44 CSS pixel target and 8 CSS pixel separation.","Coarse-pointer or phone form factors grow dense hit boxes to at least 44 CSS pixels without changing typography or semantic size.","Full width fills the host container and distributes available width across options without changing radio semantics.","Host attributes remain on the radiogroup; per-option automation identity remains on its radio.","The module owns no persistence, routing, authorization, content localization, or domain-specific option generation."],"errors":[{"code":"accessible-segmented-control-label-required","when":"The effective radiogroup accessible name is empty."},{"code":"duplicate-segmented-option-value","when":"Two options use the same stable value."},{"code":"unsupported-segmented-control-size","when":"Size is outside sm, md, lg, or touch."}],"performance":{"operation":"O(n) rendering and enabled-option navigation for n options","maximumFixtureOptions":50},"presentation":{"disposition":"visual"},"cases":[{"id":"segmented-control.roles"},{"id":"segmented-control.controlled"},{"id":"segmented-control.activate"},{"id":"segmented-control.reactivate"},{"id":"segmented-control.disabled"},{"id":"segmented-control.option-disabled"},{"id":"segmented-control.tab-fallback"},{"id":"segmented-control.keyboard-ltr"},{"id":"segmented-control.keyboard-rtl"},{"id":"segmented-control.rich-label"},{"id":"segmented-control.sizes"},{"id":"segmented-control.coarse-pointer"},{"id":"segmented-control.full-width"},{"id":"segmented-control.projection-equivalence"}]}
