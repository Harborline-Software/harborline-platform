{"schemaVersion":1,"moduleId":"hlp.ui.side-nav","interfaceRevision":1,"semantics":{"operation":"render the Harborline App side-navigation compatibility surface from labelled groups and recursive navigation items, with controlled active identity, optional collapse, expansion, activation requests, href semantics, disabled policy, badges, tooltips, and responsive touch targets","observableOutput":"Equivalent group and item hierarchy, active and expanded state, collapsed icon rail, accessible names, activation or navigation behavior, disabled policy, keyboard and focus behavior, badges, direction, responsive targets, and complete replacement across projections."},"sourceSurface":{"repository":"shipyard","commit":"a5036ff8b500e0d857d7e0a698408e7cf7f6cf31","path":"packages/ui-react/src/components/navigation/SideNav.tsx","blob":"daf72bef683708ee97bf84ffa8d7ea3683c97906","capturedExports":["SideNav"],"carrierCallers":["apps/carrier/src/app.tsx"]},"authorityNote":"The pinned SideNav is a deprecated shim over Menu variant=sidenav. Revision 1 freezes the observable application-compatible structure, not the Menu implementation, tooltip provider, ReactNode icon type, or deprecated wrapper mechanics.","dependencies":["hlp.ui.side-nav-group","hlp.ui.tooltip","hlp.ui.use-can-show-master-detail","hlp.ui.use-media-query","hlp.ui.use-outside-click"],"designEvaluation":{"selected":"recursive-navigation-model","alternatives":[{"id":"recursive-navigation-model","ownership":"Platform owns provider-neutral groups, recursive items, active and expanded state, collapse policy, activation/navigation semantics, labels, badges, and accessibility; projections privately render icons and links.","tradeoff":"Preserves Harborline App and can adapt to native Blazor or Telerik without exposing either."},{"id":"provider-menu-options","ownership":"Expose React nodes, Radix/Telerik menu items, or provider templates.","tradeoff":"Prevents package swapping and leaks rendering frameworks through the seam."}],"decision":"Select recursive-navigation-model with opaque icon content and provider-neutral item records."},"invariants":["items is a required ordered sequence of navigation groups; each group and item has stable string identity.","A group may expose a label and contains an ordered recursive item sequence.","An item has a label and may have an icon, badge, href, activation callback, disabled state, or children.","The root is a navigation landmark with a localized Navigation name.","activeItemId marks exactly the matching leaf with aria-current=page and does not activate it.","Activating an enabled leaf requests onItemActivate and follows its href according to host navigation policy; disabled items do neither.","Items with children disclose expansion state and toggle their subtree without treating expansion as leaf activation.","Expansion remains stable for the mounted model and includes an active descendant by default.","Collapsed mode hides visible labels but preserves explicit accessible names and exposes icon labels through a side tooltip.","Badges are noninteractive siblings of the activation target and never create nested interactive controls.","Fine-pointer targets remain at least thirty-six CSS pixels and coarse-pointer targets at least forty-four.","Keyboard focus follows document order; Enter and Space activate buttons, native link keyboard behavior is retained, and focus remains visible.","Logical indentation, icon placement, disclosure, tooltip placement, and badge order mirror under RTL.","Class name applies to the navigation root.","The module owns no route table, authorization decision, persistence, drawer overlay, or provider option.","Both lanes spell the item list hl-side-nav__list (nested lists add hl-side-nav__list--nested), the active leaf control hl-side-nav__control--active, and the trailing badge slot hl-side-nav__accessory; the collapsed rail's tooltip is hl-side-nav__tooltip-trigger over hlp.ui.tooltip in React and hl-side-nav__tooltip in Blazor. The shared stylesheet defines every one of them and no lane-only alias exists."],"errors":[{"code":"duplicate-id","when":"Any group or item identity repeats within the structure."},{"code":"missing-label","when":"An item label is empty."},{"code":"invalid-action","when":"An item combines children with only a leaf-specific activation contract that cannot be represented."}],"presentation":{"disposition":"required","gallery":"gallery/scenarios/hlp.ui.side-nav.json"},"cases":[{"id":"side-nav.defaults"},{"id":"side-nav.groups-recursion"},{"id":"side-nav.active"},{"id":"side-nav.activate"},{"id":"side-nav.href"},{"id":"side-nav.disabled"},{"id":"side-nav.expand-collapse"},{"id":"side-nav.active-descendant"},{"id":"side-nav.collapsed"},{"id":"side-nav.badge"},{"id":"side-nav.keyboard-focus"},{"id":"side-nav.targets"},{"id":"side-nav.rtl"},{"id":"side-nav.host-class"},{"id":"side-nav.replacement"},{"id":"side-nav.projection-equivalence"},{"id":"side-nav.class-vocabulary"}]}
