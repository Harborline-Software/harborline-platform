{"schemaVersion":1,"moduleId":"hlp.ui.data-grid","interfaceRevision":5,"semantics":{"operation":"render an identity-stable outline grid using ordered columns with declared removal priorities, optional ordered grouping, branch disagreement aggregates, caller-owned leaf content, and optional zebra presentation","observableOutput":"Equivalent row identity, responsive column retention, cell values and content, grouping hierarchy and expansion, exact mixed-value branch cells, accessible grid structure, keyboard operation, locale direction, theme, complete replacement, and bounded large-data behavior across projections.","lazyChildren":{"fixture":"conformance/hlp.ui.data-grid/lazy-children-v1.json","prop":"lazyChildren / LazyChildren","shape":"Map keyed by stable row ID. Each value is { count: integer 0..2147483647, state: unloaded|loading|loaded|failed, children: ordered rows }. Omit the map for static rows. Children can themselves declare lazy children. IDs are unique across all supplied rows and descendants.","count":"Host supplies the query-backed pre-fetch count from the same query as tab counts. Display count before expansion and keep it independent of loaded children. The grid performs no query.","request":"onChildrenRequest / OnChildrenRequest emits exactly {\"rowId\":\"<id>\"} on expansion of unloaded or failed branches. No page/cursor exists in the source model. Host owns fetching and publishes loading, loaded or failed snapshots. Callback is required when lazy children are supplied.","transitions":"Branches start collapsed. Click, Enter, Space and ArrowRight share the request path; ArrowLeft collapses. Duplicate requests survive count refreshes and loading snapshots; only a replacement loaded/failed snapshot or branch removal retires the pending request. Collapsing while loading retains the request and hides subsequently supplied children. Host response order is represented only by its latest supplied map; the component never applies asynchronous results itself. Removed branch IDs discard expansion and pending state.","loaded":"Insert children below their branch in supplied order, reusing the existing bounded window, priority-removal and ID-based focus routes. Existing grouped ancestors aggregate only loaded descendant leaves, excluding branch records.","labels":{"aggregateScope":"loaded children only","loading":"Loading children…","failed":"Children failed to load. Collapse and expand to retry."},"aggregate":"Every lazy branch uses slice-1-grid.json distinct-value and first-representative rules over loaded descendant leaves only, even while collapsed, loading or failed; zero loaded leaves gives blank aggregate cells. The query count never participates in aggregates.","failure":"failed is a named visible alert; it does not become an empty branch. Supplied loaded children remain visible if retained in the failed snapshot."},"selection":{"fixture":"conformance/hlp.ui.data-grid/selection-v1.json","seam":"listState / ListState in, onListStateChange / ListStateChanged out. One object carries selectedRowId, scrollTop and columnWidths; selection never travels through a second channel and is never re-decided downstream. Omit it and the grid owns the same state internally.","peek":"drilldown-model.md row 0. A single click on a leaf row, or an Arrow key that moves focus onto one, selects exactly that row. aria-selected marks it. Focus and selection are distinct: focus moves within a row's cells without changing the selection, and the selection stays until something changes it.","commit":"drilldown-model.md row 1. Enter or a double click emits onRowActivate / OnRowActivate with the row id and leaves the selection untouched. The grid never navigates and owns no route table. Enter never selects.","durability":"Selection is remembered by row id, never by a row object or a rendered entry. It survives grouping, lazy expansion and collapse, a re-materialised equal snapshot, and responsive column removal, including while the selected row is hidden.","preservedListState":"L1701. Closing an inspector unmounts the grid; the host hands the same state back on remount and the grid renders the same scroll offset, the same selection and the same retained column set on its FIRST render, before any width measurement. Measured widths are republished only when their VALUE changes.","inspector":"tree-grid-model.md §5. selectedRowId is what drives an inspector; the grid neither opens nor owns one."}},"sourceSurface":{"repository":"shipyard","commit":"a5036ff8b500e0d857d7e0a698408e7cf7f6cf31","path":"packages/ui-react/src/components/datagrid/DataGrid.tsx","blob":"2202c3752b22e65d32bbd6956e3f5b01a19e78e3","capturedExports":["DataGrid","DataGridColumnDef","DataGridGroupingState"],"carrierCallers":[{"blob":"7e0f5cf11ae3164bac862303e10e77b7fc236147"},{"blob":"17cf2a10a272c51a8428908e492d38a179e7a0f4"}]},"authorityNote":"Revision 5 adds the one list-state seam: peek selection by row id, commit as a declared host action, and scroll/selection/column widths preserved across a remount. Revision 3 defines projection-independent scalar identity, first-by-source-order aggregate representatives, and nearest-survivor focus recovery after responsive column removal. Revision 2 added declared responsive column-removal priority and exact distinct-value branch aggregates; revision 1 Carrier semantics remain unchanged.","dependencies":["hlp.ui.default-strings","hlp.ui.locale-provider","hlp.ui.touch-target"],"designEvaluation":{"selected":"semantic-windowed-grid","alternatives":[{"id":"semantic-windowed-grid","ownership":"Platform owns neutral row/column/group semantics, stable identity, accessibility, keyboard behavior, and bounded window invariants; projections own native templates and virtualization providers.","tradeoff":"Small enough for Blazor/Telerik substitution while closing Carrier's unimplemented large-data promise."},{"id":"tanstack-surface-port","ownership":"Platform adopts all 54 React props and TanStack callback/type semantics.","tradeoff":"Leaks a React provider, freezes dead and incomplete APIs, and prevents idiomatic C# projections."}],"decision":"Select semantic-windowed-grid; keep business aggregate calculation outside this module while the grid owns its presentation-level distinct-value branch aggregate."},"invariants":["Rows and columns preserve caller order unless grouping creates a visible hierarchy.","Every column declares an integer removal priority; as width narrows the lowest priorities are removed first, independent of DOM order, while retained columns preserve declaration order.","Every branch row renders one cell per visible column; child disagreement renders exactly mixed — N <kind>, where N is the distinct normalized value count and kind is the column value kind, including dates.","When normalized child values agree, the branch cell displays the first representative in source order.","Row and column IDs are nonblank and unique; replacement uses stable row identity rather than array index.","Grouping is an ordered list of known column IDs and the first ID is the outermost group.","Scalar group and distinct-value identity is projection-independent; numbers use ECMAScript Number::toString spelling, declared dates use epoch milliseconds, and strings preserve exact ordinal content.","Group expansion is grid-owned presentation state; replacement retains still-valid group identities and removes stale ones.","Zebra presentation counts leaf rows only, never group or placeholder rows.","Caller-owned cell content remains projection-native while observable text, semantics, and tone remain equivalent.","Replacing rows, columns, or grouping replaces prior state and removes stale headers, cells, groups, focus, and expansion state.","Large-data rendering is provider-private; a ten-thousand-row by twenty-column dataset keeps a bounded rendered window while preserving total row count, stable identity, logical row indices, and keyboard reachability.","A keyboard user can enter the grid, navigate adjacent cells and rows, use Home and End, activate group disclosure, and retain logical focus across replacement and window changes; when a focused column is removed, focus recovers to the nearest survivor by column order.","Locale and direction do not reorder source rows, columns, or grouping keys.","No Telerik, TanStack, DOM, virtualization-library, or provider instance enters the canonical contract.","The grid owns no data fetching, report query, business aggregate calculation, authorization, persistence, export generation, or business workflow transition.","Lazy children replay the fixture-owned transition script in both projections; pre-fetch count never substitutes for loaded-child aggregates and failure is always named.","Selection is peek, not navigation: a single click or an Arrow key selects exactly one leaf row by id and marks it aria-selected; Enter and double click commit that row through a declared host action and never move the selection; the grid never navigates.","Focus and selection are distinct: focus moves between cells and rows, selection changes only on a click or a row-changing Arrow key and otherwise stays.","Selection is remembered by row id and survives grouping, lazy expansion and collapse, re-materialised equal snapshots and responsive column removal, including while the selected row is hidden.","Scroll offset, selection and measured column widths are one list-state object in and out; a remount handed that object reproduces all three on its first render, and measured widths are republished only when their value changes."],"errors":[{"code":"row-id-required","when":"A row ID is empty or whitespace-only."},{"code":"duplicate-row-id","when":"Two rows share an ID."},{"code":"column-id-required","when":"A column ID is empty or whitespace-only."},{"code":"duplicate-column-id","when":"Two columns share an ID."},{"code":"unknown-grouping-column","when":"Grouping names a column not in the supplied definition."},{"code":"unsupported-value-kind","when":"A column requests an unknown neutral value kind."},{"code":"column-removal-priority-required","when":"A column removal priority is absent or is not an integer."},{"code":"invalid-lazy-children","when":"A lazy state is unknown or its count is outside the declared nonnegative integer range."},{"code":"children-request-required","when":"Lazy children are supplied without a host request callback."}],"presentation":{"disposition":"required","gallery":"gallery/scenarios/hlp.ui.data-grid.json"},"cases":[{"id":"data-grid.app-grid-dump"},{"id":"data-grid.app-grouped-report"},{"id":"data-grid.column-order"},{"id":"data-grid.row-replacement"},{"id":"data-grid.group-replacement"},{"id":"data-grid.custom-cell"},{"id":"data-grid.zebra-grouping"},{"id":"data-grid.identity-errors"},{"id":"data-grid.removal-priority-required"},{"id":"data-grid.keyboard-small"},{"id":"data-grid.large-data"},{"id":"data-grid.repeated-update"},{"id":"data-grid.localized-context"},{"id":"data-grid.provider-isolation"},{"id":"data-grid.projection-equivalence"},{"id":"data-grid.lazy-children"},{"id":"data-grid.selection"}]}