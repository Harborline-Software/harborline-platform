{"schemaVersion":1,"moduleId":"hlp.ui.popover","interfaceRevision":2,"semantics":{"operation":"compose an anchored, dismissible nonmodal dialog with controlled or uncontrolled open state","observableOutput":"Equivalent trigger state, anchored content placement, dismissal, focus restoration, host attributes, and callbacks in React and Blazor."},"sourceSurface":{"repository":"shipyard","commit":"a5036ff8b500e0d857d7e0a698408e7cf7f6cf31","path":"packages/ui-react/src/components/feedback/Popover.tsx","blob":"af378c184feb8f031e6bb03541748b84e4ecef0a","capturedExports":["Popover","PopoverTrigger","PopoverAnchor","PopoverContent"],"retainedCompanionExports":["PopoverClose"]},"dependencies":["hlp.ui.cn","hlp.ui.use-outside-click"],"vocabulary":{"align":["start","center","end"],"side":["top","right","bottom","left"]},"invariants":["Content is absent while closed and root supports controlled open plus uncontrolled default-open state.","Trigger activation toggles state, exposes aria-haspopup=dialog and aria-expanded, and identifies mounted content with aria-controls.","Content has role=dialog by default, is anchored to an explicit anchor or trigger, and defaults to center alignment with six CSS pixels of side offset.","Requested side, alignment, offset, role, accessible label, class, and host attributes are preserved.","Escape, outside pointer interaction, and a close control dismiss the surface and emit one false state transition.","Opening moves focus into the content: its first focusable control, else the content element. Escape, a close control, trigger activation and a host-driven close restore focus to the trigger without scrolling, only when focus is inside the content or was lost with it; otherwise focus stays where the user put it. An outside pointer dismissal never moves focus: it stays on the pointed target when the browser focused it, else on the body. Focus is never trapped in this nonmodal surface.","While open, content follows its trigger in sequential focus order, inside the trigger's own focus scope: Tab on the trigger moves to the content's first Tab stop (or the content itself when it has none), and Shift+Tab from the next Tab stop after the trigger moves to the content's last stop; Tab from a point in the content with no later Tab stop in it moves to the next Tab stop after the trigger, and Shift+Tab from a point with no earlier Tab stop moves to the trigger (or, when the trigger cannot take focus, to the Tab stop before it). Tab between stops inside the content is not intercepted, and leaving the content by Tab does not dismiss it. Inside a modal layer, the layer's focus containment governs its boundary. The order is document order: positive tabindex and controls inside shadow roots are not modelled, and when no destination exists the key is left to the browser, never trapped.","Controlled mode emits requested state without mutating the rendered state until the host supplies it.","Placement flips then clamps: when the requested side has less room than the surface needs and the opposite side has more, the resolved side is the opposite one; the resolved coordinate is then clamped into the viewport with an eight CSS pixel margin. Clamping never substitutes for a flip, and both projections resolve the same side and the same offsets from the same anchor rectangle, surface size, viewport, requested side, alignment and offset. Alignment uses logical behavior in RTL.","Reduced motion removes nonessential transitions without changing lifecycle semantics."],"errors":[],"presentation":{"disposition":"required","gallery":"gallery/scenarios/hlp.ui.popover.json"},"cases":[{"id":"popover.closed"},{"id":"popover.uncontrolled"},{"id":"popover.controlled"},{"id":"popover.trigger-aria"},{"id":"popover.anchor"},{"id":"popover.content-options"},{"id":"popover.escape"},{"id":"popover.outside"},{"id":"popover.close-control"},{"id":"popover.focus"},{"id":"popover.projection-equivalence"},{"id":"popover.placement"},{"id":"popover.class-vocabulary"}]}
