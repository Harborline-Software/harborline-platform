{"schemaVersion":1,"moduleId":"hlp.ui.chart","interfaceRevision":1,"semantics":{"operation":"render a narrow provider-neutral line or donut definition as an accessible chart","observableOutput":"Equivalent ordered data, visibility intent, accessible naming, locale/direction, theme, and reduced-motion behavior across private renderer adapters."},"sourceSurface":{"repository":"shipyard","commit":"a5036ff8b500e0d857d7e0a698408e7cf7f6cf31","path":"packages/ui-react/src/components/charts/Chart.tsx","blob":"2d41fe603e989c2254c3d62177898bcc9fcca393","capturedExports":["Chart"]},"authorityNote":"The only Harborline App route is development-only. Revision 1 freezes only the line and donut behavior exercised there; implementation remains wave-03-05.","dependencies":["hlp.ui.default-strings","hlp.ui.locale-provider"],"designEvaluation":{"selected":"semantic-definition","alternatives":[{"id":"semantic-definition","ownership":"Platform owns line/donut data, accessibility, locale/theme/motion intent; projections privately own ECharts, Telerik, SVG/native, or WebGL adapters.","tradeoff":"Small and fixtureable; later chart kinds and interaction are additive revisions."},{"id":"neutral-render-plan","ownership":"Platform owns axes, arcs, paths, text runs, hit regions, coordinates, and drawing commands.","tradeoff":"Could tighten pixels but prematurely freezes geometry, text measurement, hit testing, and layout and reduces Telerik to a shallow drawing adapter."}],"decision":"Select semantic-definition; reject renderer option bags and neutral geometry plans."},"invariants":["A line definition contains ordered opaque localized category labels and one or more uniquely named series with exactly one finite-or-null value per category.","Null line values remain missing points and never become zero.","A donut definition contains ordered nonblank localized slice labels and finite-or-null values; null slices are omitted from rendered data and retained in the accessible data description as missing.","Legend and tooltip intent default to enabled and can be disabled; no outward legend event is invented.","Motion intent is host or disabled and adapters honor reduced-motion without changing data semantics.","Accessible-name precedence is explicit name, then title, then the localized charts.chart default; an equivalent ordered data description is available to assistive technology.","Replacing a definition removes stale categories, series, and slices rather than merging renderer state.","A definition with no plottable value renders a declared empty state and never an invented numeric range; the accessible data description still lists the labels the caller supplied.","Locale, direction, and theme are host semantic context and never provider option objects.","Fixtures and the public contract contain no ECharts, Telerik, DOM, SVG, canvas, WebGL, color, pixel-geometry, callback, export, zoom, pan, stack, date-category, provider-instance, or renderer-snapshot identity.","Implementation and provider selection remain projection-owned and host-composed; this freeze authorizes no Chart implementation before wave-03-05."],"errors":[{"code":"label-required","when":"A series or slice label is empty or whitespace-only."},{"code":"duplicate-series-name","when":"Two line series share a name."},{"code":"category-value-count-mismatch","when":"A line series value count differs from the category count."},{"code":"non-finite-value","when":"A value is NaN or infinite."}],"presentation":{"disposition":"required","gallery":"gallery/scenarios/hlp.ui.chart.json"},"cases":[{"id":"chart.line-single"},{"id":"chart.line-multiple"},{"id":"chart.line-count-mismatch"},{"id":"chart.line-null-gap"},{"id":"chart.donut"},{"id":"chart.donut-null"},{"id":"chart.labels-and-values"},{"id":"chart.visibility-defaults"},{"id":"chart.replace-not-merge"},{"id":"chart.accessible-name"},{"id":"chart.localized-context"},{"id":"chart.theme-motion"},{"id":"chart.accessible-data"},{"id":"chart.provider-isolation"},{"id":"chart.empty-series"}]}
