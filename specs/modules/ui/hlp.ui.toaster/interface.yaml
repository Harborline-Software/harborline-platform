{"schemaVersion":1,"moduleId":"hlp.ui.toaster","interfaceRevision":1,"semantics":{"operation":"manage a host-scoped toast queue and render its bounded visual host with deterministic lifecycle, action, and accessibility semantics","observableOutput":"Equivalent toast identity, variants, queue visibility, durations, transitions, roles, actions, dismissal, position, localization, and direction behavior in React and Blazor."},"sourceSurface":{"repository":"shipyard","commit":"a5036ff8b500e0d857d7e0a698408e7cf7f6cf31","path":"packages/ui-react/src/components/feedback/Sonner.tsx","blob":"d8a40c4a1c872c3771ed822fa9f69ccd06714607","capturedExports":["Toaster","toast"]},"dependencies":["hlp.ui.cn","hlp.ui.default-strings","hlp.ui.locale-provider"],"invariants":["Toast storage and subscriptions are scoped to one application root or Blazor circuit, are disposable, and are never process-global or shared between users.","Show, Success, Error, Warning, Information, and Loading create stable unique toast identities while preserving caller message, description, and action.","Variants are default, success, error, warning, information, and loading; error uses role alert and every other variant uses role status without redundant explicit aria-live.","The newest MaximumVisible open entries render and older open entries remain queued; MaximumVisible defaults to 3 and must be positive.","Duration precedence is per-call option, then host default option, then host duration; host duration defaults to 4000 milliseconds.","Errors are persistent when KeepErrorsPersistent is true regardless of finite lower-level durations; loading is persistent until transition or dismissal.","TrackAsync preserves the same toast identity from loading through success or error and returns or propagates the original operation result.","Dismiss with an identity closes only that toast; Dismiss without identity and Clear close all entries and release timers.","Persistent errors always expose a keyboard-operable close control; ordinary entries follow ShowCloseButton, which defaults false.","Action activation invokes exactly once and does not implicitly dismiss; per-call description and action override host defaults.","The six physical positions remain distinct and default to bottom-right for source compatibility; entry and exit motion follows logical inline direction.","DismissLabel is caller-overridable or locale-catalog-backed and supplies the close control accessible name.","Theme and expand may remain React compatibility inputs but are behaviorless in the pinned source and are not neutral revision-1 vocabulary.","The module owns no transport, persistence, authorization, retry policy, application logging, or domain command execution."],"errors":[{"code":"toast-message-required","when":"A requested toast message is empty."},{"code":"invalid-toast-limit","when":"MaximumVisible is not a positive finite integer."},{"code":"invalid-toast-duration","when":"A supplied duration is negative or non-finite."}],"performance":{"operation":"O(n) queue projection and O(1) identity transition for n open entries","maximumFixtureEntries":500},"presentation":{"disposition":"visual"},"cases":[{"id":"toaster.empty"},{"id":"toaster.variants"},{"id":"toaster.roles"},{"id":"toaster.queue-limit"},{"id":"toaster.dismiss-one"},{"id":"toaster.dismiss-all"},{"id":"toaster.duration-precedence"},{"id":"toaster.error-persistence"},{"id":"toaster.loading-persistence"},{"id":"toaster.close-policy"},{"id":"toaster.description-action"},{"id":"toaster.promise-success"},{"id":"toaster.promise-error"},{"id":"toaster.positions"},{"id":"toaster.localization"},{"id":"toaster.rtl"},{"id":"toaster.invalid-input"},{"id":"toaster.projection-equivalence"}]}
