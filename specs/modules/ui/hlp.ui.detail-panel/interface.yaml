{"schemaVersion":1,"moduleId":"hlp.ui.detail-panel","interfaceRevision":3,"semantics":{"operation":"present one labeled selection-detail aside of opaque host content at inline-end of a page's content row, docked at rail-capable viewports and as a modal end-side panel below rail capability","observableOutput":"Equivalent landmark naming, open lifecycle with exactly-once close requests, width clamping, docked-versus-sheet presentation across the rail boundary, sheet dismissal and focus restoration, scroll ownership, and direction handling in React and Blazor. Revision 3 adds the drill-down levels: a declared subject's facets render as addressable count-bearing tabs, exactly one pushed level carries a back row naming where you came from, a second push is refused by absence, and Open as page is a declared host action carrying the pushed subject's route."},"sourceSurface":{"repository":"shipyard","commit":"3410883405996dc8e4871418a441f52970d9994e","path":"packages/ui-core/Contracts/Layout/WorkspaceShell.Semantic.md","blob":"behavior-reference-inspector-region","capturedExports":[]},"dependencies":["hlp.ui.use-can-show-master-detail"],"invariants":["Open is controlled-or-uncontrolled, defaults closed, and is never persisted; interactions request state change exactly once and controlled rendering follows the supplied value.","Closed, the module renders nothing: no aside, no landmark, no reserved space.","Open at a rail-capable viewport, the module renders one complementary aside at inline-end whose accessible name is the required label; open below rail capability it renders the same content through one modal end-side presentation carrying the platform drawer pattern's dismissal, focus containment, and focus-restoration invariants.","Crossing the rail boundary in either direction re-presents the same open content in the other presentation without emitting a state request.","Width is one number clamped to 220 through 720 CSS pixels defaulting 360; there is no splitter or drag resize.","A dismissible panel (the default) renders one shell-owned close control of at least 44 CSS pixels whose activation emits one close request; dismissible false suppresses the control without changing other behavior.","The panel owns its vertical scroll; opening steals no focus in docked presentation.","Inline-end placement, close-control position, and padding mirror under RTL.","Host attributes remain on the aside root; open with nullish content raises detail-panel-content-required.","The module owns no selection model, route table, shell chrome, or persistence.","A declared subject renders its facets as one tab bar: every declared facet is an addressable tab carrying its declared count, no facet is hidden behind a verb surface, and a facet that is not declared is not rendered (drilldown-model.md:18, :41, :44; disclosure-model.md:14).","The selected facet is addressed by facet id: a controlled activeFacetId is rendered as given and an id the subject does not declare raises detail-panel-facet-unknown; uncontrolled, the panel remembers the facet against the subject's DECLARED ID, so a re-materialised equal subject keeps it and a different id starts at the first declared facet (drilldown-model.md:27).","ArrowRight, ArrowLeft, Home and End move the selection and the roving tab focus together, wrapping at both ends; every other key, Escape and Tab included, passes through to the surrounding shell and no key stops propagation.","At most one push level exists: with a pushed subject the panel renders the pushed subject's title and facets, one back row reading the back-label prefix followed by the underlying subject's title, and NO relation control, so a second push cannot be requested; the only onward control is Open as page, which emits the pushed subject's declared route and never navigates (drilldown-model.md:22, :23; chrome-spec.md §9 absence over disabled).","The panel never owns the stack, the route table or the facet body: pushing, going back and opening a page are host decisions reached through declared callbacks, and the facet body stays opaque host content."],"errors":[{"code":"detail-panel-content-required","when":"The panel is open with nullish content."},{"code":"detail-panel-facets-required","when":"A subject is declared with no facets."},{"code":"detail-panel-duplicate-facet-id","when":"A subject declares two facets sharing one id."},{"code":"detail-panel-facet-unknown","when":"The addressed facet id is not declared by the current subject."},{"code":"detail-panel-push-requires-object","when":"A pushed subject is declared with no subject beneath it."}],"performance":{"operation":"O(1) chrome plus opaque O(n) content","maximumFixtureNavigationItems":0,"maximumFixtureUpdates":96},"presentation":{"disposition":"visual"},"cases":[{"id":"detail-panel.closed-renders-nothing"},{"id":"detail-panel.open-docked"},{"id":"detail-panel.label-required-name"},{"id":"detail-panel.width-clamp"},{"id":"detail-panel.dismiss-control"},{"id":"detail-panel.not-dismissible"},{"id":"detail-panel.controlled-open"},{"id":"detail-panel.sheet-below-rail"},{"id":"detail-panel.sheet-dismissal-focus"},{"id":"detail-panel.viewport-transition-keeps-open"},{"id":"detail-panel.own-scroll"},{"id":"detail-panel.rtl"},{"id":"detail-panel.host-attributes"},{"id":"detail-panel.content-required"},{"id":"detail-panel.projection-equivalence"},{"id":"detail-panel.drilldown"}]}
