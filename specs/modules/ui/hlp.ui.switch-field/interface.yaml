{"schemaVersion":1,"moduleId":"hlp.ui.switch-field","interfaceRevision":1,"semantics":{"operation":"provide the deprecated Harborline App SwitchField compatibility surface as a named, controlled switch while delegating all switch behavior and appearance to hlp.ui.switch","observableOutput":"Equivalent name-derived identity, checked state, change requests, label, validation and form-field semantics, disabled behavior, sizing, touch target, locale direction, and complete replacement across projections."},"sourceSurface":{"repository":"shipyard","commit":"a5036ff8b500e0d857d7e0a698408e7cf7f6cf31","path":"packages/ui-react/src/components/forms/SwitchField.tsx","blob":"3f19e0883689022dc7cc4ab5b28e26911fe64e7b","capturedExports":["SwitchField"],"carrierCallers":["apps/carrier/src/documents/manager/DocumentsManagerList.tsx","apps/carrier/src/forms/manager/FormsManagerList.tsx","apps/carrier/src/invoices/manager/InvoicesManagerList.tsx","apps/carrier/src/rules/manager/RulesManagerList.tsx","apps/carrier/src/workflows/manager/WorkflowsManagerList.tsx"]},"authorityNote":"Revision 1 preserves the pinned deprecated adapter contract. It intentionally adds no second switch state machine: hlp.ui.switch remains the behavioral and visual authority.","dependencies":["hlp.ui.switch"],"designEvaluation":{"selected":"thin-switch-adapter","alternatives":[{"id":"thin-switch-adapter","ownership":"SwitchField owns required name, controlled checked value, callback shape, and id=name fallback; hlp.ui.switch owns interaction, accessibility, touch, locale, and appearance.","tradeoff":"Minimal compatibility surface with one authoritative implementation."},{"id":"duplicate-switch-control","ownership":"Implement a second switch and styles for the deprecated name.","tradeoff":"Creates immediate parity drift and defeats provider replacement."}],"decision":"Select thin-switch-adapter; no provider-specific option or duplicate CSS is public."},"invariants":["name, checked, and onCheckedChange are required.","When id is omitted, the interactive switch id equals name.","The checked value is controlled; activation requests but never invents caller state.","Label, accessible name, description, required, invalid, disabled, size, and host attributes preserve hlp.ui.switch semantics.","Pointer activation and Enter or Space keyboard activation request the same toggled value exactly once.","Disabled state blocks every request.","FormField context may supply label, description, required, invalid, and disabled state.","Direction, touch target, visual state, and theme tokens are inherited from hlp.ui.switch.","The adapter owns no uncontrolled default, persistence, business rule, or provider option.","Removing this module in favor of hlp.ui.switch is behaviorally safe once Harborline App callers migrate."],"errors":[{"code":"missing-name","when":"name is empty."}],"presentation":{"disposition":"required","gallery":"gallery/scenarios/hlp.ui.switch-field.json"},"cases":[{"id":"switch-field.defaults"},{"id":"switch-field.id-fallback"},{"id":"switch-field.checked"},{"id":"switch-field.pointer"},{"id":"switch-field.keyboard"},{"id":"switch-field.disabled"},{"id":"switch-field.label"},{"id":"switch-field.form-context"},{"id":"switch-field.validation"},{"id":"switch-field.appearance"},{"id":"switch-field.replacement"},{"id":"switch-field.projection-equivalence"}]}
