{"schemaVersion":1,"moduleId":"hlp.ui.locale-provider","interfaceRevision":1,"semantics":{"operation":"provide one nested localization scope for Harborline App UI text, plural selection, direction, and number formatting","observableOutput":"Equivalent resolved strings, plural categories, effective formatter requests, locale, and direction in React and .NET/Blazor."},"sourceSurface":{"repository":"shipyard","commit":"a5036ff8b500e0d857d7e0a698408e7cf7f6cf31","path":"packages/ui-react/src/i18n/ShipyardLocaleProvider.tsx","blob":"2740b7e540265b7f975412eb7265cf6eee3b59fb","capturedExports":["ShipyardLocaleProvider","directionForLocale","useShipyardLocale","useShipyardStrings"]},"dependencies":["hlp.ui.default-strings"],"invariants":["The zero-provider scope is locale en, direction ltr, an empty override catalog, and the frozen English default catalog.","Locale is a caller-supplied BCP-47 tag and direction is explicit or derived from exactly the ar, he, fa, ur, ps, sd, ug, yi, and dv primary subtags, case-insensitively.","A provider catalog replaces rather than merges an ancestor catalog; an ordinal known-key override, including an empty string, wins over the frozen English default.","Unknown runtime keys remain visibly equal to the key instead of becoming blank.","Single-brace named interpolation and explicit per-instance string precedence delegate to Default Strings semantics; missing variables remain visible.","Plural selection uses the effective locale's cardinal category, then the supplied category key, then the supplied other key; with no usable key it returns the invariant count string.","A nested provider independently defaults and owns its locale, direction, and catalog and inherits only the nearest configured number formatter.","A number formatter receives the effective request locale and options; a per-call locale override wins. Without a host formatter, the projection runtime formatter is used and invalid non-English locale data falls back to en.","Date, currency, list, relative-time, message parsing, resource fallback chains, persistence, global culture mutation, document attributes, and application i18n runtimes are outside revision 1 because pinned callers do not expose them."],"errors":[{"code":"locale-required","when":"The effective locale is empty or whitespace-only."}],"presentation":{"disposition":"not-applicable","rationale":"The provider has no DOM wrapper or standalone visual output; leaf projections consume locale and direction."},"cases":[{"id":"locale.defaults"},{"id":"locale.direction"},{"id":"locale.direction-override"},{"id":"locale.catalog-fallback"},{"id":"locale.empty-override"},{"id":"locale.unknown-key-visible"},{"id":"locale.resolve-string"},{"id":"locale.plural-en"},{"id":"locale.plural-ar"},{"id":"locale.plural-pl-ru"},{"id":"locale.plural-ja"},{"id":"locale.plural-other-fallback"},{"id":"locale.plural-no-key"},{"id":"locale.number-default"},{"id":"locale.number-invalid-locale"},{"id":"locale.number-explicit-formatter"},{"id":"locale.number-inherited-formatter"},{"id":"locale.number-child-formatter"},{"id":"locale.child-scope"},{"id":"locale.projection-equivalence"}]}
