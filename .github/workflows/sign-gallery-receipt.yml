# The reusable workflow is the certificate's Build Signer, pinned at main's digest (ADR-0139).
name: sign-gallery-receipt
on:
  workflow_call:
    inputs:
      policy-envelope:
        description: Non-secret current-attempt policy reader output
        type: string
        required: true
      policy-sha256:
        description: SHA-256 of the exact policy value bytes
        type: string
        required: true
      release-artifact-id:
        type: string
        required: false
        default: ''
      release-inventory-sha256:
        type: string
        required: false
        default: ''
      release-receipt-sha256:
        type: string
        required: false
        default: ''
      release-companion-sha256:
        type: string
        required: false
        default: ''
      release-sbom-artifact-id:
        type: string
        required: false
        default: ''
      release-sbom-sha256:
        type: string
        required: false
        default: ''
      release-sbom-policy-sha256:
        type: string
        required: false
        default: ''
      release-sbom-tested-tree:
        type: string
        required: false
        default: ''
    outputs:
      artifact-id:
        description: Verified gallery evidence artifact from this producer attempt
        value: ${{ jobs.sign.outputs.artifact-id }}
permissions: {}
jobs:
  sign:
    if: github.event_name == 'workflow_run' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
      id-token: write
      attestations: write
    env:
      RELEASE_POLICY_ENVELOPE: ${{ inputs.policy-envelope }}
      RELEASE_POLICY_SHA256: ${{ inputs.policy-sha256 }}
      RELEASE_APPROVED_COMMIT: ${{ vars.RELEASE_APPROVED_COMMIT }}
    outputs:
      artifact-id: ${{ steps.evidence.outputs.artifact-id }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
      - name: Fetch candidate only as Git data
        env:
          QUEUE_HEAD: ${{ github.event.workflow_run.head_sha }}
        run: git fetch --no-tags origin "$QUEUE_HEAD"
      - id: plan
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_POLICY_ENVELOPE: ${{ inputs.policy-envelope }}
          RELEASE_POLICY_SHA256: ${{ inputs.policy-sha256 }}
        run: node tooling/gates/scan-evidence-provenance.mjs --receipt plan
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        if: steps.plan.outputs.changed == 'true'
        with:
          name: gallery-run-${{ github.run_id }}-${{ github.run_attempt }}
          path: receipt
      - id: predicate
        if: steps.plan.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: node tooling/gates/scan-evidence-provenance.mjs --receipt build
      - id: attest
        if: steps.plan.outputs.changed == 'true'
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4 (actions/attest@v4)
        with:
          subject-name: gallery-tree
          subject-digest: ${{ steps.predicate.outputs.digest }}
          predicate-type: https://harborline.software/attestations/gallery-run/v1
          predicate-path: receipt/predicate.json
      - name: Retain the bundle beside the reports
        if: steps.attest.outcome == 'success'
        env:
          BUNDLE: ${{ steps.attest.outputs.bundle-path }}
        run: cp "$BUNDLE" receipt/receipt.sigstore.json
      - id: verify
        if: steps.plan.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: node tooling/gates/scan-evidence-provenance.mjs --receipt verify
      - id: evidence
        if: steps.verify.outcome == 'success'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: gallery-receipt-${{ github.run_id }}-${{ github.run_attempt }}
          path: receipt
          if-no-files-found: error
          retention-days: 90
      - name: Require exact producer output IDs and byte digests
        if: steps.plan.outputs.release-eligible == 'true'
        env:
          RELEASE_INPUT_ARTIFACT_ID: ${{ inputs.release-artifact-id }}
          RELEASE_INPUT_INVENTORY_SHA256: ${{ inputs.release-inventory-sha256 }}
          RELEASE_INPUT_RECEIPT_SHA256: ${{ inputs.release-receipt-sha256 }}
          RELEASE_INPUT_COMPANION_SHA256: ${{ inputs.release-companion-sha256 }}
          RELEASE_SBOM_ARTIFACT_ID: ${{ inputs.release-sbom-artifact-id }}
          RELEASE_SBOM_SHA256: ${{ inputs.release-sbom-sha256 }}
          RELEASE_SBOM_POLICY_SHA256: ${{ inputs.release-sbom-policy-sha256 }}
          RELEASE_SBOM_TESTED_TREE: ${{ inputs.release-sbom-tested-tree }}
        run: |
          [[ "$RELEASE_INPUT_ARTIFACT_ID" =~ ^[1-9][0-9]*$ ]]
          [[ "$RELEASE_INPUT_INVENTORY_SHA256" =~ ^[0-9a-f]{64}$ ]]
          [[ "$RELEASE_INPUT_RECEIPT_SHA256" =~ ^[0-9a-f]{64}$ ]]
          [[ "$RELEASE_INPUT_COMPANION_SHA256" =~ ^[0-9a-f]{64}$ ]]
          [[ "$RELEASE_SBOM_ARTIFACT_ID" =~ ^[1-9][0-9]*$ ]]
          [[ "$RELEASE_SBOM_SHA256" =~ ^[0-9a-f]{64}$ ]]
          [[ "$RELEASE_SBOM_POLICY_SHA256" =~ ^[0-9a-f]{64}$ ]]
          [[ "$RELEASE_SBOM_TESTED_TREE" =~ ^[0-9a-f]{40}$ ]]
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        if: steps.plan.outputs.release-eligible == 'true'
        with:
          artifact-ids: ${{ inputs.release-artifact-id }}
          path: release-evidence
      - id: release-predicate
        if: steps.plan.outputs.release-eligible == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TESTED_COMMIT: ${{ steps.plan.outputs.head }}
          RELEASE_INPUT_ARTIFACT_ID: ${{ inputs.release-artifact-id }}
          RELEASE_INPUT_INVENTORY_SHA256: ${{ inputs.release-inventory-sha256 }}
          RELEASE_INPUT_RECEIPT_SHA256: ${{ inputs.release-receipt-sha256 }}
          RELEASE_INPUT_COMPANION_SHA256: ${{ inputs.release-companion-sha256 }}
          RELEASE_SBOM_ARTIFACT_ID: ${{ inputs.release-sbom-artifact-id }}
          RELEASE_SBOM_SHA256: ${{ inputs.release-sbom-sha256 }}
          RELEASE_SBOM_POLICY_SHA256: ${{ inputs.release-sbom-policy-sha256 }}
          RELEASE_SBOM_TESTED_TREE: ${{ inputs.release-sbom-tested-tree }}
        run: node tooling/gates/scan-evidence-provenance.mjs --release-evidence build release-evidence "$RELEASE_TESTED_COMMIT"
      - id: release-attest
        if: steps.plan.outputs.release-eligible == 'true'
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-name: phase4-receipt
          subject-digest: ${{ steps.release-predicate.outputs.digest }}
          predicate-type: https://harborline.software/attestations/release-gate/v1
          predicate-path: release-evidence/release-predicate.json
      - name: Keep release gate bundle without changing receipt bytes
        if: steps.plan.outputs.release-eligible == 'true'
        env:
          BUNDLE: ${{ steps.release-attest.outputs.bundle-path }}
        run: cp "$BUNDLE" release-evidence/release.sigstore.json
      - name: Independently verify the produced release statement
        if: steps.plan.outputs.release-eligible == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TESTED_COMMIT: ${{ steps.plan.outputs.head }}
        run: node tooling/gates/scan-evidence-provenance.mjs --release-evidence verify-produced release-evidence "$RELEASE_TESTED_COMMIT"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: steps.plan.outputs.release-eligible == 'true'
        with:
          name: release-gate-receipt-${{ github.run_id }}-${{ github.run_attempt }}
          path: release-evidence
          if-no-files-found: error
          retention-days: 90
