# stryker: Stryker.NET mutation testing (control T-720; PROC-0002 "Mutation evidence as an artefact"; owner ruling Q43).
#
# Pull request: `node tooling/stryker.mjs run` mutates in full each project whose .cs/.razor source changed since
# origin/main and fails when that project's score is below max(its baseline in tooling/stryker-baselines.json, its
# configured break), or when 0 mutants were tested. Survivors on changed lines go to the step summary as review
# feedback. No source change: skipped, green. (Owner order 2026-09-30; PR #227 lost 16 points and merged green.)
#
# Schedule (07:40 UTC) and workflow_dispatch: `node tooling/stryker.mjs full` runs every
# configured project on main and fails when a project scores below its baseline in tooling/stryker-baselines.json.
#
# winbox, not the Macs: macpro carries verify-shared, the platform bottleneck, and mac16 is the perf-quiet runner
# (T-724 ruling 8). The fork guard is verify-shared's, character for character, so a fork pull request never runs
# its author's code on our machine; a draft waits until it is marked ready.
#
# T-724 ruling 118 (Q50): the pull_request path (changed-project score gate) moved to a standard GitHub-hosted
# ubuntu-latest runner -- Stryker.NET and its msbuild-path fallback are both no-ops off win32 (tooling/stryker.mjs),
# so nothing in `node tooling/stryker.mjs run` is Windows-only. The schedule/workflow_dispatch path (full run held
# to baselines) stays on winbox exactly as before.
name: stryker

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  schedule:
    - cron: '40 7 * * *'
  workflow_dispatch:

concurrency:
  group: ${{ github.event_name == 'pull_request' && format('stryker-pr-{0}', github.event.pull_request.number) || format('stryker-{0}', github.ref) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  workload-route:
    if: vars.ACTIONS_ENABLED == 'true'
    runs-on: ubuntu-latest
    outputs:
      enabled: ${{ steps.route.outputs.enabled }}
      labels: ${{ steps.route.outputs.labels }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Explain background routing
        id: route
        env:
          BACKGROUND_MUTATION_ROUTE: ${{ vars.BACKGROUND_MUTATION_ROUTE }}
          LOCAL_BACKGROUND_RESERVATION: ${{ vars.LOCAL_BACKGROUND_RESERVATION }}
        run: |
          node --test .github/workloads/workload-route.test.mjs .github/workloads/windows-default.test.mjs
          python3 .github/workloads/host-workload-lock.test.py
          node .github/workloads/workload-route.mjs
  stryker:
    needs: workload-route
    if: >-
      vars.ACTIONS_ENABLED == 'true' && needs.workload-route.outputs.enabled == 'true' &&
      (github.event_name == 'schedule' ||
       github.event_name == 'workflow_dispatch' ||
       (github.event.pull_request.head.repo.full_name == github.repository &&
        github.event.pull_request.draft == false &&
        !contains(github.event.pull_request.labels.*.name, 'stacked')))
    runs-on: ${{ fromJSON(needs.workload-route.outputs.labels) }}
    timeout-minutes: ${{ github.event_name == 'pull_request' && 60 || 720 }}
    defaults:
      run:
        shell: pwsh
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
    steps:
      # fetch-depth 0 so refs/remotes/origin/main exists: the configs' since target and the script's changed-source
      # test both diff against it. A plain clone, never a linked worktree (see tooling/stryker.mjs). Every later git
      # call is local (diff, ls-files, rev-parse), so the checkout token is not left in .git/config.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          clean: true
          persist-credentials: false

      # Provision the pinned toolchain on every route, using the hosted Node version.
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - uses: actions/setup-python@v6
        if: github.event_name != 'pull_request' && runner.os != 'Windows'
        with:
          python-version: '3.14'

      # The builder-definitions tests read DES-0007 from a control checkout, as verify's gate does. The token reaches
      # git as an environment-only config entry (GIT_CONFIG_COUNT): it is not in the URL, not in git's argv, and not
      # written to the mirror's .git/config.
      - name: Mirror harborline-control for the tests that read it
        env:
          PINS_TOKEN: ${{ secrets.HARBORLINE_PINS_TOKEN }}
        run: |
          $basic = [Convert]::ToBase64String([Text.Encoding]::ASCII.GetBytes("x-access-token:$env:PINS_TOKEN"))
          Write-Output "::add-mask::$basic"
          $env:GIT_CONFIG_COUNT = '1'
          $env:GIT_CONFIG_KEY_0 = 'http.https://github.com/.extraheader'
          $env:GIT_CONFIG_VALUE_0 = "AUTHORIZATION: basic $basic"
          git clone --quiet https://github.com/Harborline-Software/harborline-control.git "$env:RUNNER_TEMP/harborline-control"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Mutate changed projects and hold each to its break (pull request)
        if: github.event_name == 'pull_request'
        run: |
          dotnet tool restore
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node tooling/stryker.mjs run
        env:
          HARBORLINE_CONTROL_REPO: ${{ runner.temp }}/harborline-control

      - name: Mutate every project and hold each to its baseline (scheduled)
        if: github.event_name != 'pull_request'
        run: |
          if ($env:RUNNER_OS -eq 'Windows') {
            & ./.github/workloads/full-mutation.ps1
            exit $LASTEXITCODE
          }
          python .github/workloads/host-workload-lock.py -- pwsh -NoProfile -File .github/workloads/full-mutation.ps1
          exit $LASTEXITCODE
        env:
          HARBORLINE_CONTROL_REPO: ${{ runner.temp }}/harborline-control
          NUGET_PACKAGES: ${{ runner.temp }}/mutation-nuget-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Mutation reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: stryker-report-${{ github.run_id }}
          if-no-files-found: ignore
          retention-days: ${{ github.event_name == 'pull_request' && 7 || 14 }}
          path: StrykerOutput/*/reports/mutation-report.json
