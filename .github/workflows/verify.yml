# Isolated evidence branch only; never substitutes for protected PR or merge-group gates.
name: Frozen Platform full-project mutation evidence
run-name: "Frozen PR${{ inputs.pr }} ${{ inputs.mode }} ${{ inputs.project }} ${{ inputs.head }}"
on:
  workflow_dispatch:
    inputs:
      head:
        description: Exact reviewed Platform commit
        required: true
        type: string
      project:
        description: Whole configured test-project fragment
        required: true
        default: hlp.blocks.builder-definitions.tests
        type: string
      pr:
        description: Scoped PR number for evidence naming
        required: true
        type: string
      mode:
        description: Full configured project or separately measured focused hand proof
        required: true
        default: full-project
        type: choice
        options:
          - full-project
          - hand-proof
permissions:
  contents: read
jobs:
  frozen-mutation:
    if: vars.ACTIONS_ENABLED == 'true' && inputs.mode != 'hand-proof'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.head }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Mirror authoritative control test fixtures
        env:
          PINS_TOKEN: ${{ secrets.HARBORLINE_PINS_TOKEN }}
        shell: pwsh
        run: |
          $basic = [Convert]::ToBase64String([Text.Encoding]::ASCII.GetBytes("x-access-token:$env:PINS_TOKEN"))
          Write-Output "::add-mask::$basic"
          $env:GIT_CONFIG_COUNT = '1'
          $env:GIT_CONFIG_KEY_0 = 'http.https://github.com/.extraheader'
          $env:GIT_CONFIG_VALUE_0 = "AUTHORIZATION: basic $basic"
          git clone --quiet https://github.com/Harborline-Software/harborline-control.git "$env:RUNNER_TEMP/harborline-control"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Record exact source and unchanged full-project command
        env:
          EXPECTED_HEAD: ${{ inputs.head }}
          TEST_PROJECT: ${{ inputs.project }}
        run: |
          mkdir -p frozen-mutation-evidence
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          git rev-parse HEAD > frozen-mutation-evidence/source-head.txt
          git rev-parse HEAD^{tree} > frozen-mutation-evidence/source-tree.txt
          git -C "$RUNNER_TEMP/harborline-control" rev-parse HEAD > frozen-mutation-evidence/control-head.txt
          git status --porcelain=v1 > frozen-mutation-evidence/status-before.txt
          dotnet --info > frozen-mutation-evidence/dotnet-info.txt
          node --version > frozen-mutation-evidence/node-version.txt
          printf '%s\n' "node tooling/stryker.mjs full $TEST_PROJECT" > frozen-mutation-evidence/command.txt
      - name: Mutate entire frozen project and enforce existing score floors
        env:
          HARBORLINE_CONTROL_REPO: ${{ runner.temp }}/harborline-control
          TEST_PROJECT: ${{ inputs.project }}
        run: |
          set -o pipefail
          dotnet tool restore 2>&1 | tee frozen-mutation-evidence/tool-restore.log
          node tooling/stryker.mjs full "$TEST_PROJECT" 2>&1 | tee frozen-mutation-evidence/full-project.log
      - name: Preserve reports, provenance and complete output
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: frozen-mutation-${{ inputs.pr }}-${{ github.run_id }}
          path: |
            StrykerOutput/*/reports/mutation-report.json
            frozen-mutation-evidence
          if-no-files-found: error
          retention-days: 14
  hand-mutations:
    if: vars.ACTIONS_ENABLED == 'true' && inputs.mode == 'hand-proof'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
      - uses: actions/setup-python@v6
        with:
          python-version: '3.14'
      - name: Mirror authoritative control test fixtures
        env:
          PINS_TOKEN: ${{ secrets.HARBORLINE_PINS_TOKEN }}
        shell: pwsh
        run: |
          $basic = [Convert]::ToBase64String([Text.Encoding]::ASCII.GetBytes("x-access-token:$env:PINS_TOKEN"))
          Write-Output "::add-mask::$basic"
          $env:GIT_CONFIG_COUNT = '1'
          $env:GIT_CONFIG_KEY_0 = 'http.https://github.com/.extraheader'
          $env:GIT_CONFIG_VALUE_0 = "AUTHORIZATION: basic $basic"
          git clone --quiet https://github.com/Harborline-Software/harborline-control.git "$env:RUNNER_TEMP/harborline-control"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Measure focused compiled hand mutations at exact requested head
        env:
          HARBORLINE_CONTROL_REPO: ${{ runner.temp }}/harborline-control
          EXPECTED_HEAD: ${{ inputs.head }}
          SCOPED_PR: ${{ inputs.pr }}
        run: python tooling/records-hand-mutation-evidence.py --pr "$SCOPED_PR" --cases tooling/records-publication-hand-mutation-cases.json --expected-head "$EXPECTED_HEAD"
      - name: Preserve raw logs, TRX, diffs and source hashes
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: records-publication-hand-mutants-${{ inputs.pr }}-${{ github.run_id }}
          path: hand-mutation-evidence/${{ inputs.pr }}
          if-no-files-found: error
          retention-days: 14
