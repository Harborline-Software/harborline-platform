# Isolated evidence branch only. This workflow never substitutes for a protected PR gate.
name: Records focused hand mutation evidence
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  hand-mutations:
    if: vars.ACTIONS_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        pr: [260, 264, 265, 266]
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
      HARBORLINE_CONTROL_REPO: ${{ runner.temp }}/harborline-control
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
      - uses: actions/setup-python@v6
        with:
          python-version: '3.14'
      - name: Mirror authoritative control test fixtures
        env:
          PINS_TOKEN: ${{ secrets.HARBORLINE_PINS_TOKEN }}
        shell: pwsh
        run: |
          $basic = [Convert]::ToBase64String([Text.Encoding]::ASCII.GetBytes("x-access-token:$env:PINS_TOKEN"))
          Write-Output "::add-mask::$basic"
          $env:GIT_CONFIG_COUNT = '1'
          $env:GIT_CONFIG_KEY_0 = 'http.https://github.com/.extraheader'
          $env:GIT_CONFIG_VALUE_0 = "AUTHORIZATION: basic $basic"
          git clone --quiet https://github.com/Harborline-Software/harborline-control.git "$env:RUNNER_TEMP/harborline-control"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Measure independent focused hand mutants
        run: python tooling/records-hand-mutation-evidence.py --pr ${{ matrix.pr }}
      - name: Preserve raw logs, TRX, diffs and source hashes
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: records-hand-mutants-${{ matrix.pr }}-${{ github.run_id }}
          path: hand-mutation-evidence/${{ matrix.pr }}
          if-no-files-found: error
          retention-days: 14
