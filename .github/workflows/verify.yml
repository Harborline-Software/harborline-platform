# verify: the phase-4 gate on a self-hosted macOS runner, as a pull-request check and as the
# merge-queue check. This is the gate ADR-0004 calls binding — the one the Mac landings run and the
# one the receipt is bound to — and it is the gate the ubuntu `validate` job has never been green on
# (see the publish-libraries comment in validate.yml). Shape copied from harborline-api's verify.yml
# (control: docs/velocity/landing.md).
#
# Fork safety: harborline-platform is public and the shared lane runs on our own machines. It runs
# only for pull requests whose head lives in this repository, and for merge-queue groups (which are
# built from already-reviewed heads). A fork PR gets the hosted checks only.
#
# T-660 (the shape T-633 landed in harborline-api): `verify` is the required context, and it is an
# aggregator with no condition. GitHub counts a job skipped by its own `if` as a SUCCESSFUL required
# check, so a required job that carries `vars.ACTIONS_ENABLED == 'true'` turns green the moment the
# variable is deleted. The lane keeps the switch (it costs self-hosted machine time); the context
# cannot be skipped and is green only when the lane it stands for ran and passed.
name: verify

on:
  pull_request:
  merge_group:

concurrency:
  group: verify-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  verify-shared:
    if: >-
      vars.ACTIONS_ENABLED == 'true' &&
      (github.event_name == 'merge_group' ||
       github.event.pull_request.head.repo.full_name == github.repository)
    # Ticket 404: this job was pinned to macpro because the SchemaForm wall-clock budget passed there and
    # failed on mac16. That premise is measured false. The budget was asserted inside the parallel module
    # fan-out, where six module runners and their dotnet children compete, so it reported the scheduler and
    # not the host: mac16 sampled quiet measures a 115.8 ms p95 on the row that failed, against 537.8 ms on
    # the same machine under load. The pin was also the platform queue's serialisation point -- macpro was
    # the only eligible runner for every platform PR, observed with mac16 idle and a verify queued.
    # 404 slice 4 completes it: the budget now rides the serial perf slot, so it is asserted with
    # nothing else competing and any macOS runner gives the same verdict. The pin is gone (#35) and
    # the reason it existed cannot come back.
    runs-on: [self-hosted, macOS, ARM64, macpro]
    # The ubuntu gate took 49 minutes at PW_WORKERS=2. These hosts are 8-core and run the gallery at
    # the config default, but the whole gate is the long pole in this repository; 90 keeps a slow run
    # from being cut off mid-gallery, and the merge queue's check timeout must exceed it.
    timeout-minutes: 90
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
      DEVELOPER_DIR: /Library/Developer/CommandLineTools
    steps:
      - name: Runner
        shell: bash
        run: echo "runner: ${{ runner.name }} (${{ runner.os }}/${{ runner.arch }})" >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          clean: true

      # No setup-node / setup-dotnet / pnpm-action here, deliberately: the runner's PATH carries the
      # host toolchain that every green Mac gate in this repository was measured with, and
      # global.json pins the SDK that resolve-dotnet.mjs resolves. Printing the versions makes a
      # host-versus-host disagreement attributable instead of a mystery.
      - name: Host toolchain
        run: |
          for tool in node npm pnpm dotnet git jq; do
            printf '%-8s %s\n' "$tool" "$(command -v "$tool" || echo MISSING)"
          done
          node -v; npm -v; pnpm -v; dotnet --version

      # Placed first: it is a git-grep and costs a second, and there is no reason to spend an hour
      # of gallery before reporting a name that should not be in the tree. The gate's requiredStepIds
      # do not include it, so it stays an explicit step (validate.yml does the same).
      - name: Consumer-neutral boundary
        run: bash eng/verify-boundaries.sh

      # T-674, placed here for the same reason and at the same cost: two git commands, before an
      # hour of gate. docs/evidence/phase-4/gate.json must name a run this repository can produce
      # from main. T-568 committed one naming its own lane branch's HEAD; the squash merge discarded
      # that commit, and the gate's release-receipt step refused it weeks later -- but only on a
      # runner whose reused clone had lost the object, which is why it presented as flake rather
      # than as the bad commit it was. macpro's clone held it, mac16's did not, and a merge group
      # fetches only the queue ref. This refuses the commit instead, on every pull request and every
      # merge group, naming the field.
      #
      # Deliberately NOT a phase-4 gate step: adding one means changing requiredStepIds in three
      # files and invalidating every existing receipt (validate.yml says so at its own copy of the
      # boundary check). The same scanner runs from .githooks/pre-commit, which is earlier but
      # skippable; this is the copy that cannot be skipped.
      - name: Recorded phase-4 evidence names a commit main holds
        run: |
          git fetch --no-tags --quiet origin main
          node tooling/gates/scan-evidence-provenance.mjs .

      # The app-shell package fixtures stage two cross-repo tarballs that
      # tooling/resolve-appshell-feed.mjs rebuilds from harborline-api refs (this repo deliberately
      # never stores the bytes). harborline-api is public now, so this needs no token. It is cloned
      # OUTSIDE the workspace on purpose: a nested checkout inside the tree would be walked by
      # eng/verify-boundaries.sh's git-grep and by the gate's own tree hash.
      - name: Mirror harborline-api for the feed resolver
        run: |
          rm -rf "$RUNNER_TEMP/harborline-api"
          git clone --quiet https://github.com/Harborline-Software/harborline-api.git "$RUNNER_TEMP/harborline-api"

      - name: Mirror harborline-control for the dependency ledger
        # Private; the pins token is the same one the api hosted job clones with.
        run: git clone --quiet "https://x-access-token:${{ secrets.HARBORLINE_PINS_TOKEN }}@github.com/Harborline-Software/harborline-control.git" "$RUNNER_TEMP/harborline-control"

      # The gate drives the gallery but does not install its dependencies. The browser download is a
      # no-op on a host that already has the pinned revision cached; `--with-deps` is omitted because
      # it is an apt-get path that does not exist on macOS.
      - name: Install gallery browser dependencies
        working-directory: gallery/tests
        run: |
          pnpm install --frozen-lockfile --ignore-scripts
          npx playwright install chromium

      # run-phase-4-gate.mjs writes its report to stdout only (the receipt runner is what writes it
      # to disk, and CI does not run the receipt runner). Capture it so the upload step has a file;
      # pipefail keeps the gate's exit code (ticket 330 s4c).
      #
      # HARBORLINE_CI_GALLERY is deliberately NOT set. That variable is the ubuntu gate's only
      # leniency and it exists because a 2-core shared runner could not hold the gallery's budgets.
      # This is the binding gate on an 8-core host we own: it runs strict, exactly as the Mac
      # landings ran it.
      - name: Phase-4 gate
        # HARBORLINE_GATE_HEADLESS: the MVP is headless. The browser parity suite stays in the
        # scheduled cross-platform job, where a slow run costs nobody a landing; it is not the thing
        # that decides whether a headless change may merge. Every non-browser step still runs here
        # and still blocks.
        run: |
          set -o pipefail
          node tooling/run-phase-4-gate.mjs | tee harborline-phase4-gate-report.json
        env:
          HARBORLINE_API_REPO: ${{ runner.temp }}/harborline-api
          HARBORLINE_CONTROL_REPO: ${{ runner.temp }}/harborline-control
          HARBORLINE_GATE_HEADLESS: "1"

      - name: Evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: verify-evidence-${{ github.run_id }}
          if-no-files-found: ignore
          retention-days: 14
          path: |
            harborline-phase4-gate-report.json
            docs/evidence/phase-4/gate.json
            .claude/gate-evidence/
            gallery/tests/playwright-report/

  verify:
    # T-660: the required context. Deliberately unconditional (`always()`), so neither the kill
    # switch nor a fork head nor a failed dependency can leave it skipped-and-therefore-green. It
    # passes only when every job in `needs` reports success; a skipped lane fails it.
    needs: [verify-shared]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Every lane this context stands for ran and passed
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          echo "$NEEDS"
          jq -e 'all(.[]; .result == "success")' <<< "$NEEDS" >/dev/null || { echo "::error::a lane the verify context stands for did not succeed"; exit 1; }
