name: validate
# Public repository: publication on the push to main. The phase-4 gate is verify.yml's, once per event.
on:
  # T-579 (owner ruling 2026-09-18): the push to main is publication only. The ruleset admits a push
  # to main through the merge queue alone, so the tree was gated in the merge group already (verify,
  # required); nothing here reruns that gate, and the run is green whenever publish-libraries is.
  # 2026-09-29 ruling: the ubuntu gallery-shard/phase-4-gate pair that ran here in the merge group
  # moved into verify.yml, beside the headless gate, so the gate runs once per event.
  push:
    branches: [main]
jobs:
  publish-libraries:
    # A push to main is a landing the merge group already gated (verify, required; the phase-4
    # receipt bound to the tested tree), so publication follows that, not a rerun of the gate, which
    # does not run on this path (T-579). The job packs and consumes through the gate's producer and pushes
    # with --skip-duplicate, so a same-tree push publishes nothing.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    env:
      PACKAGE_IDS: >-
        Harborline.Blocks.ActivityTimeline
        Harborline.Blocks.Aggregates
        Harborline.Blocks.BuilderDefinitions
        Harborline.Blocks.Calendar
        Harborline.Blocks.EntityViews
        Harborline.Blocks.InspectionReview
        Harborline.Blocks.MeasureCatalogue
        Harborline.Blocks.RelativeChains
        Harborline.Blocks.Reports
        Harborline.Blocks.Scheduling
        Harborline.Blocks.Workflow
        Harborline.Blocks.Workflow.Interpreter
        Harborline.Contracts
        Harborline.Foundation
        Harborline.Foundation.Authorization
        Harborline.Foundation.DataExchange
        Harborline.Foundation.Definitions
        Harborline.Foundation.Documents
        Harborline.Foundation.FieldRuntime
        Harborline.Foundation.Forms
        Harborline.Foundation.Forms.Engine
        Harborline.Foundation.MultiTenancy
        Harborline.Foundation.RuleAuthoring
        Harborline.Foundation.RuleEngine
        Harborline.Foundation.Scheduling
        Harborline.Foundation.Session
        Harborline.Foundation.Taxonomy
        Harborline.Kernel.Core
        Harborline.Kernel.SchemaValidation
        Harborline.Kernel.WorkItems
        Harborline.UIAdapters.Blazor
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          global-json-file: global.json
      - name: Test exact-byte promotion guards
        run: node --test tooling/tests/library-promotion-proof.test.mjs
      - name: Pack and consume the gate's libraries at the content-derived version
        run: node tooling/verify-package-fixtures.mjs --pack-libraries
      - name: Verify publication inventory and packed versions
        run: node --test tooling/tests/publish-libraries.test.mjs tooling/tests/publish-libraries.packed.mjs
      - name: Upload package manifest
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: platform-libraries-${{ github.sha }}
          path: |
            artifacts/packages/nuget/manifest.json
            artifacts/packages/nuget/consumer-proof.json
          if-no-files-found: error
      - name: Verify exact consumed bytes before attestation and publication
        run: node tooling/library-promotion-proof.mjs
      - name: Attest every packed library before push (T-705 ruling 107)
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-path: artifacts/packages/nuget/*.nupkg
      - name: Publish to GitHub Packages
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          dotnet nuget add source \
            --username "${GITHUB_ACTOR}" \
            --password "${GH_TOKEN}" \
            --store-password-in-clear-text \
            --configfile NuGet.Config \
            --name github \
            "https://nuget.pkg.github.com/${GITHUB_REPOSITORY_OWNER}/index.json"
          version=$(node --input-type=module -e "import {computePackageVersion} from './tooling/package-version.mjs'; console.log(computePackageVersion())")
          for id in $PACKAGE_IDS; do
            if output=$(dotnet nuget push "artifacts/packages/nuget/${id}.${version}.nupkg" \
              --source github --api-key "${GH_TOKEN}" --skip-duplicate --force-english-output 2>&1); then
              if grep -Eiq 'already exists|already been pushed|Conflict' <<< "$output"; then
                echo "SKIPPED $id $version"
              else
                echo "PUSHED $id $version"
              fi
            else
              printf '%s\n' "$output" >&2
              exit 1
            fi
          done
