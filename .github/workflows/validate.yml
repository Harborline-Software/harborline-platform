name: validate
# Public repository: the ubuntu phase-4 gate in the merge group, and publication on the push to main.
on:
  # T-577: phase-4-gate is not a required context, so it runs where its result is used: the merge
  # group (the landing's proof). A PR push runs verify (required) and the cheap checks only.
  # T-579 (owner ruling 2026-09-18): the push to main is publication only. The ruleset admits a push
  # to main through the merge queue alone, so the tree was gated in the merge group already; nothing
  # here reruns that gate, and the run is green whenever publish-libraries is.
  merge_group:
  push:
    branches: [main]
jobs:
  # T-349. The browser suite, split across a MATRIX of ubuntu jobs -- one shard per job, each on its
  # own hosted runner.
  #
  # Why a matrix and not GALLERY_SHARDS. In-process sharding (tooling/run-gallery-gate.mjs's
  # runShardedGallery) DIVIDES one host's worker budget: `workersPerShard = totalWorkers /
  # shardCount`, so the `GALLERY_SHARDS: "2"` this job used to set turned PW_WORKERS=2 into two
  # one-worker Playwright runs on the same two cores and bought nothing. Measured: six consecutive
  # merge-group runs killed the step at 942-954s against its 900s budget, and the gate has never
  # been green here. A matrix job is genuinely separate capacity, so each shard gets the whole
  # two-core budget -- which is why this option works where local sharding could not.
  #
  # The shard count is NOT repeated anywhere: `--shard=<i>/${{ strategy.job-total }}` derives the
  # total from the matrix itself, so the two cannot drift.
  #
  # SIX, from measurement (run 35618436213, the first run in this repository's history in which the
  # gallery suite ran to completion on ubuntu). Per-shard suite time at six: 320, 337, 349, 391,
  # 477, 510s against the 900s step budget -- the worst shard uses 57% of it. The shards carry
  # 90-94 specs each, so Playwright's test-level sharding balances them; 561 specs ran in total.
  # Summed, the suite is ~2380s of work, which is why one runner could never finish it inside 900s.
  #
  # Not more than six: a shard job spends ~500s before the suite starts (runner setup, the
  # projection installs, the native build, then the gallery's own prepare and builds), so past six
  # the fixed cost already exceeds the suite and another job buys a shrinking slice of a smaller
  # half. Not fewer: four would put the slowest shard around 750s, inside the budget only until a
  # retry or a slow story eats the margin -- and the margin is the thing this ticket is buying.
  gallery-shard:
    if: github.event_name == 'merge_group'
    runs-on: ubuntu-latest
    strategy:
      # One slow or flaky shard must not cancel the others: the collector needs every shard's
      # report to reconcile, and a cancelled shard would be indistinguishable from a broken one.
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6]
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v6  # version comes from package.json packageManager (pnpm 11.1.3)
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: |
            package.json
            pnpm-lock.yaml
            projections/react/ui/hlp.ui.button/pnpm-lock.yaml
            projections/typescript/application/hlp.copilot.contracts/pnpm-lock.yaml
            projections/typescript/contracts/hlp.contracts.forms/pnpm-lock.yaml
            projections/typescript/foundation/hlp.foundation.rule-authoring/pnpm-lock.yaml
            projections/typescript/foundation/hlp.foundation.rule-runtime/pnpm-lock.yaml
            gallery/projections/react/pnpm-lock.yaml
            gallery/tests/pnpm-lock.yaml
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
      - name: Install gallery browser dependencies
        working-directory: gallery/tests
        run: |
          pnpm install --frozen-lockfile --ignore-scripts
          npx playwright install --with-deps chromium
      - name: Mirror harborline-api for the feed resolver
        # prepareGalleries resolves the app-shell feed from harborline-api refs (see the identical
        # step on phase-4-gate below). A shard job packs its own fixtures -- it has no phase-4 gate
        # ahead of it to do that -- so it needs the mirror for the same reason that job does.
        run: git clone --quiet "https://github.com/Harborline-Software/harborline-api.git" "$RUNNER_TEMP/harborline-api"
        env:
          HARBORLINE_API_READ_TOKEN: ${{ secrets.HARBORLINE_API_READ_TOKEN }}
      - name: Install the projection dependencies the fixtures build from
        # prepareGalleries packs the three npm tarballs and the NuGet feed the galleries consume,
        # and it builds them from these projections. In the phase-4 gate those installs are its own
        # first seven steps, so the gallery inherited them; a shard job has no gate ahead of it, and
        # without this it dies in verify-package-fixtures with "Cannot find package 'esbuild'".
        #
        # Six shards each packing for themselves is redundant CPU and NOT redundant wall clock --
        # they run concurrently, so the matrix pays this once in elapsed time. Sharing one pack
        # through an artifact was the alternative and it is worse: packageReadiness() decides an
        # artifact is usable by comparing its mtime against its sources', and download-artifact
        # does not preserve mtimes, so correctness would rest on the download landing after the
        # checkout. A tree that builds what it needs has no such ordering to get wrong.
        run: |
          pnpm install --frozen-lockfile --ignore-scripts
          for project in \
            projections/react/ui/hlp.ui.button \
            projections/typescript/contracts/hlp.contracts.forms \
            projections/typescript/foundation/hlp.foundation.rule-runtime \
            projections/typescript/foundation/hlp.foundation.rule-authoring \
            projections/typescript/application/hlp.copilot.contracts; do
            pnpm --dir "$project" install --frozen-lockfile --ignore-scripts
          done
          dotnet restore Harborline.Platform.slnx -v:minimal
          node tooling/run-native.mjs --build
      - name: Run gallery shard ${{ matrix.shard }} of ${{ strategy.job-total }}
        run: |
          set -o pipefail
          node tooling/run-gallery-gate.mjs --shard=${{ matrix.shard }}/${{ strategy.job-total }} \
            | tee gallery-shard-${{ matrix.shard }}.json
        env:
          HARBORLINE_API_REPO: ${{ runner.temp }}/harborline-api
          # Control ticket 083. The gallery's ONLY leniency, and it exists only in CI: on a 2-core
          # shared runner four visual-parity comparisons diverge for reasons not yet understood
          # (see the CORRECTED note in gallery.spec.ts — they are lane-versus-lane, so the
          # Windows-baseline story first recorded here cannot be the cause), two
          # wall-clock-budget scenarios measure the runner rather than the component, and the
          # Blazor circuit's cold start eats most of a 45s budget before a story renders. Each
          # exemption is named by scenario id in gallery/tests/tests/gallery.spec.ts, the a11y half
          # of every exempted scenario still runs, and a test asserts the named ids still exist —
          # so this cannot rot into a wider allowance than it was written for. The LOCAL gate,
          # which is the binding one per ADR-0004, is untouched.
          #
          # It must MATCH the collector's setting on phase-4-gate: expectedChecks() derives the
          # declared counts from this flag, so a shard that ran with the exemptions and a collector
          # that reconciled without them would diverge on every check family.
          HARBORLINE_CI_GALLERY: "1"
          # One worker per core, UNDIVIDED. This is the whole difference from the in-process
          # sharding this replaces: the shard has this runner to itself.
          PW_WORKERS: "2"
      - name: Keep the shard report whatever the outcome
        # Carries both the shard's step outcomes and its Playwright report inline; the collector
        # refuses unless all of them are present, so this upload is load-bearing, not diagnostic.
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: gallery-shard-${{ matrix.shard }}
          path: gallery-shard-${{ matrix.shard }}.json
          if-no-files-found: error
          retention-days: 14
      - name: Upload gallery failure evidence
        # Moved here from phase-4-gate with the suite. It never produced anything there after the
        # suite started being killed before the html reporter could write -- no run in the last
        # sixty had this artifact.
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: gallery-failure-evidence-${{ matrix.shard }}
          path: gallery/tests/playwright-report/
          if-no-files-found: warn
          retention-days: 14

  phase-4-gate:
    if: github.event_name == 'merge_group'
    # T-349: the gallery shards have already run the browser suite on their own runners. This job's
    # gallery-gate step collects their reports instead of running the suite (see the --merge call in
    # run-phase-4-gate.mjs); a failed shard skips this job, so the gate cannot go green without one.
    needs: gallery-shard
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Consumer-neutral boundary
        # This repo had no such fence, and that is why it was the one that regressed. The consumer
        # codename was declared absent everywhere on 2026-08-17 (migration registry entry 094), and
        # the app-shell module reintroduced it four days later through fixtures, a spec scenario
        # set, and a provenance note — because the only two copies of this check live in
        # harborline-api and harborline-app and neither one reads this repository.
        #
        # Placed first: it is a git-grep and costs a second, and there is no reason to spend
        # 40 minutes of gallery before reporting a name that should not be in the tree.
        #
        # This is CI-only for now. The binding check under ADR-0004 is the local phase-4 gate, and
        # adding a step there means changing requiredStepIds in THREE files, which invalidates every
        # existing receipt — a deliberate, coordinated change rather than a rider on this one.
        run: bash eng/verify-boundaries.sh
      - uses: pnpm/action-setup@v6  # version comes from package.json packageManager (pnpm 11.1.3)
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: |
            package.json
            pnpm-lock.yaml
            projections/react/ui/hlp.ui.button/pnpm-lock.yaml
            projections/typescript/application/hlp.copilot.contracts/pnpm-lock.yaml
            projections/typescript/contracts/hlp.contracts.forms/pnpm-lock.yaml
            projections/typescript/foundation/hlp.foundation.rule-authoring/pnpm-lock.yaml
            projections/typescript/foundation/hlp.foundation.rule-runtime/pnpm-lock.yaml
            gallery/projections/react/pnpm-lock.yaml
            gallery/tests/pnpm-lock.yaml
      - uses: actions/setup-dotnet@v6
        with:
          # The repo's pinned SDK lives in global.json; reading it here means an SDK bump
          # cannot silently strand CI on the old version (which is exactly what happened
          # when preview.7 landed in global.json while this file still said preview.6 -
          # every check run failed in under a minute at resolve-dotnet).
          global-json-file: global.json
      - name: Install gallery browser dependencies
        working-directory: gallery/tests
        run: |
          pnpm install --frozen-lockfile --ignore-scripts
          npx playwright install --with-deps chromium
      - name: Mirror harborline-api for the feed resolver
        # The app-shell package fixtures stage two cross-repo tarballs that
        # tooling/resolve-appshell-feed.mjs rebuilds from harborline-api refs (this repo
        # deliberately never stores the bytes). harborline-api is private, so the clone needs
        # HARBORLINE_API_READ_TOKEN: a fine-grained PAT with read-only Contents access to
        # Harborline-Software/harborline-api, added as an Actions secret on THIS repo. Until the
        # secret exists this step fails loudly here rather than deep inside the gate.
        run: git clone --quiet "https://github.com/Harborline-Software/harborline-api.git" "$RUNNER_TEMP/harborline-api"
        env:
          HARBORLINE_API_READ_TOKEN: ${{ secrets.HARBORLINE_API_READ_TOKEN }}
      - name: Mirror harborline-control for the dependency ledger
        # Private; the pins token is the same one the api hosted job clones with.
        run: git clone --quiet "https://x-access-token:${{ secrets.HARBORLINE_PINS_TOKEN }}@github.com/Harborline-Software/harborline-control.git" "$RUNNER_TEMP/harborline-control"
      # run-phase-4-gate.mjs writes its report to stdout only (the receipt runner is what writes it
      # to disk, and CI does not run the receipt runner). Capture it here so the upload step below
      # has a file; pipefail keeps the gate's exit code (ticket 330 s4c).
      - name: Collect the gallery shard reports
        uses: actions/download-artifact@v8
        with:
          pattern: gallery-shard-*
          path: ${{ runner.temp }}/gallery-shards
      - run: |
          set -o pipefail
          node tooling/run-phase-4-gate.mjs | tee harborline-phase4-gate-report.json
        env:
          HARBORLINE_API_REPO: ${{ runner.temp }}/harborline-api
          HARBORLINE_CONTROL_REPO: ${{ runner.temp }}/harborline-control
          # T-349. Present: gallery-gate MERGES the matrix's shard reports rather than running the
          # suite here. Absent (every local run): the gate is byte-for-byte what it was.
          HARBORLINE_GALLERY_SHARD_REPORTS: ${{ runner.temp }}/gallery-shards
          # Still required in the COLLECTOR, even though no browser runs here: expectedChecks()
          # reads this flag to derive the declared counts it reconciles the shards' measurements
          # against. The shards set it too; if these two ever disagree, every check family diverges.
          HARBORLINE_CI_GALLERY: "1"
          # PW_WORKERS and GALLERY_SHARDS are deliberately gone from this job. The suite no longer
          # runs here, so a worker count set beside a step that starts no browser is a knob that
          # reads as live and is not. Both now live on gallery-shard, where they act.
      - name: Keep the phase-4 gate report whatever the outcome
        # The report is the only complete record of every step's counts and failure text. The job log
        # truncates it inside the embedded step output (330 s3's acceptance could not be read from the
        # log on two runs), so it is uploaded on every run, green or red (ticket 330 s4).
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: phase4-gate-report-${{ github.run_id }}
          path: harborline-phase4-gate-report.json
          if-no-files-found: error
          retention-days: 14

  publish-libraries:
    # A push to main is a landing the merge group already gated (verify on a Mac, required; the
    # phase-4 receipt bound to the tested tree), so publication follows that receipt, not an ubuntu
    # rerun of the gate, which has never been green here (ADR 0084: required checks grow only from
    # green) and no longer runs on this path (T-579). The job still packs through the gate's producer
    # and pushes with --skip-duplicate, so a same-tree push publishes nothing.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      PACKAGE_IDS: >-
        Harborline.Blocks.ActivityTimeline
        Harborline.Blocks.Aggregates
        Harborline.Blocks.BuilderDefinitions
        Harborline.Blocks.Calendar
        Harborline.Blocks.EntityViews
        Harborline.Blocks.InspectionReview
        Harborline.Blocks.MeasureCatalogue
        Harborline.Blocks.RelativeChains
        Harborline.Blocks.Reports
        Harborline.Blocks.Scheduling
        Harborline.Blocks.Workflow
        Harborline.Blocks.Workflow.Interpreter
        Harborline.Contracts
        Harborline.Foundation
        Harborline.Foundation.Authorization
        Harborline.Foundation.DataExchange
        Harborline.Foundation.FieldRuntime
        Harborline.Foundation.Forms
        Harborline.Foundation.Forms.Engine
        Harborline.Foundation.MultiTenancy
        Harborline.Foundation.RuleAuthoring
        Harborline.Foundation.RuleEngine
        Harborline.Foundation.Scheduling
        Harborline.Foundation.Session
        Harborline.Kernel.Core
        Harborline.Kernel.SchemaValidation
        Harborline.Kernel.WorkItems
        Harborline.UIAdapters.Blazor
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
      - name: Pack the gate's libraries at the content-derived version
        run: node tooling/verify-package-fixtures.mjs --pack-libraries
      - name: Verify publication inventory and packed versions
        run: node --test tooling/tests/publish-libraries.test.mjs tooling/tests/publish-libraries.packed.mjs
      - name: Upload package manifest
        uses: actions/upload-artifact@v7
        with:
          name: platform-libraries-${{ github.sha }}
          path: artifacts/packages/nuget/manifest.json
          if-no-files-found: error
      - name: Publish to GitHub Packages
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          dotnet nuget add source \
            --username "${GITHUB_ACTOR}" \
            --password "${GH_TOKEN}" \
            --store-password-in-clear-text \
            --configfile NuGet.Config \
            --name github \
            "https://nuget.pkg.github.com/${GITHUB_REPOSITORY_OWNER}/index.json"
          version=$(node --input-type=module -e "import {computePackageVersion} from './tooling/package-version.mjs'; console.log(computePackageVersion())")
          for id in $PACKAGE_IDS; do
            if output=$(dotnet nuget push "artifacts/packages/nuget/${id}.${version}.nupkg" \
              --source github --api-key "${GH_TOKEN}" --skip-duplicate --force-english-output 2>&1); then
              if grep -Eiq 'already exists|already been pushed|Conflict' <<< "$output"; then
                echo "SKIPPED $id $version"
              else
                echo "PUSHED $id $version"
              fi
            else
              printf '%s\n' "$output" >&2
              exit 1
            fi
          done
