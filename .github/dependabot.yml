version: 2
updates:
  - package-ecosystem: "nuget"
    directory: "/"
    # The Microsoft .NET 11 preview package set moves by hand as one reviewed change (control ticket 243):
    # the preview.7 Blazor analyzers add BL0016 across the Blazor projections under warnings-as-errors.
    ignore:
      - dependency-name: "Microsoft.*"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    groups:
      minor-and-patch:
        update-types: ["minor", "patch"]
  - package-ecosystem: "npm"
    directory: "/"
    # TypeScript majors are a reviewed change, not a weekly bump.
    ignore:
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    groups:
      minor-and-patch:
        update-types: ["minor", "patch"]
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    groups:
      minor-and-patch:
        update-types: ["minor", "patch"]
